dealing honestly and fairly; \u003cstrong>loyalty\u003c/strong>; \u003cstrong>confidentiality\u003c/strong>; \u003cstrong>obedience\u003c/strong> (lawful instructions only); \u003cstrong>full disclosure\u003c/strong>; accounting for all funds; skill, care and diligence; presenting all offers and counteroffers timely; disclosing known material facts on residential property.\u003c/p>\n\u003ch2 id=\"7-legal-and-numerical-requirements\">7. Legal and numerical requirements\u003c/h2>\n\u003cp>3 · 7 · 9. Single-agent-only duties: loyalty, obedience, full confidentiality, full disclosure.\u003c/p>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>Listing \"loyalty\" or \"obedience\" among transaction-broker duties.\u003c/li>\n\u003cli>Thinking limited confidentiality lets a licensee hide defects. Material defect disclosure is owed in every relationship.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Relationship\u003c/th>\n\u003cth>Count\u003c/th>\n\u003cth>Signature duties\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>No brokerage\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>Honesty · material facts · accounting\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Transaction broker\u003c/td>\n\u003ctd>7\u003c/td>\n\u003ctd>+ skill/care · present offers · limited confidentiality · agreed duties\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Single agent\u003c/td>\n\u003ctd>9\u003c/td>\n\u003ctd>+ loyalty · obedience · full confidentiality · full disclosure\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n"},{"id":"L04-3","ch":"ch04","title":"Disclosure notices: timing, transitions, scope and exceptions","type":"legal","pri":"high","min":30,"manual":"M2 §Disclosures, transitions","pre":["L04-2"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Notices:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Single Agent Notice\u003c/strong> — before or at the time of entering into a listing or representation agreement, or before showing property, \u003cstrong>whichever comes first\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>No Brokerage Relationship Notice\u003c/strong> — \u003cstrong>before showing\u003c/strong> the property.\u003c/li>\n\u003cli>\u003cstrong>Transaction broker\u003c/strong> — \u003cstrong>no notice required\u003c/strong> (it is the default).\u003c/li>\n\u003cli>\u003cstrong>Consent to Transition to Transaction Broker\u003c/strong> — the principal signs it \u003cstrong>before\u003c/strong> the single agent changes to transaction broker (typically when the brokerage's own buyer wants its listing).\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Scope — \"residential sale\" (verified V-20):\u003c/strong> improved residential property of \u003cstrong>4 units or fewer\u003c/strong>; unimproved residential property intended for \u003cstrong>4 units or fewer\u003c/strong>; agricultural property of \u003cstrong>10 acres or fewer\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>Not required (s. 475.278, verified V-20):\u003c/strong> when the licensee knows the party is already represented by a single agent or transaction broker; bona fide open houses or model-home showings with no confidential information, offer, or representation agreement; unanticipated casual encounters; responses to general factual questions about advertised property; communications limited to general information about the licensee's qualifications or firm; auctions; appraisals; rentals and leases (unless they include an option to purchase property with four or fewer residential units); dispositions of business enterprises (except property with four or fewer residential units); nonresidential transactions. The study manual's list was incomplete; the full list is a verified addition.\u003c/p>\n\u003ch2 id=\"7-legal-and-numerical-requirements\">7. Legal and numerical requirements\u003c/h2>\n\u003cp>4 units · 10 acres. Single agent notice: earlier of agreement or showing. No-brokerage notice: before showing. Transition consent: before the change.\u003c/p>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>\"Leases always need disclosures.\" Only with an option to buy ≤4 units.\u003c/li>\n\u003cli>\"A 6-unit building is residential.\" Not for this rule.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Residential sale = ≤4 units · land for ≤4 · farm ≤10 acres. TB needs no notice.\u003c/p>\n"},{"id":"L04-4","ch":"ch04","title":"Material facts, designated sales associates, and ending relationships","type":"legal","pri":"high","min":30,"manual":"M2 §Duties that never go away; §Designated sales associates; §How relationships begin and end","pre":["L04-2"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Material facts.\u003c/strong> Regardless of relationship, licensees must disclose known facts that materially affect the value of residential property and are not readily observable (\u003cem>Johnson v. Davis\u003c/em>): hidden roof leaks, flooding, foundation cracks. An instruction to stay silent is unlawful; obedience never covers it.\u003c/p>\n\u003cp>\u003cstrong>Not material by Florida law\u003c/strong> (s. 689.25 per the manual; not independently verified): that a homicide, suicide or death occurred on the property, and that an occupant had HIV/AIDS. A licensee need not volunteer these; disclosing HIV status could also raise fair housing (handicap) issues.\u003c/p>\n\u003cp>\u003cstrong>Property tax disclosure.\u003c/strong> Buyers must be told not to rely on the seller's current taxes, because the property will be reassessed after purchase (Chapter 11).\u003c/p>\n\u003cp>\u003cstrong>Designated sales associates.\u003c/strong> In a \u003cstrong>nonresidential\u003c/strong> transaction where buyer and seller \u003cstrong>each have assets of $1 million or more\u003c/strong>, they may ask the broker to designate one associate as single agent for the buyer and another as single agent for the seller, with signed disclosures. Never in residential sales.\u003c/p>\n\u003cp>\u003cstrong>Beginning and ending.\u003c/strong> Relationships are created by agreement (express or implied). They end by performance (closing), expiration, mutual agreement, revocation/renunciation (possibly with liability for damages), death or incapacity of a party, destruction of the property, or bankruptcy of the principal. \u003cstrong>Confidentiality and accounting survive\u003c/strong> termination.\u003c/p>\n\u003ch2 id=\"7-legal-and-numerical-requirements\">7. Legal and numerical requirements\u003c/h2>\n\u003cp>Designated sales associates: nonresidential + $1M assets each side. Surviving duties: confidentiality, accounting.\u003c/p>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>\"AS IS means no disclosure.\" Known latent defects must still be disclosed.\u003c/li>\n\u003cli>\"Once the listing expires I can share the seller's bottom line.\" Confidentiality survives.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Defect = disclose; stigma = not material. Commercial + $1M each = designated associates. Confidentiality outlives the relationship.\u003c/p>\n"},{"id":"L05-1","ch":"ch05","title":"Escrow accounts and the deposit clock","type":"legal","pri":"high","min":35,"manual":"M3 §Escrow accounts","pre":["L03-2"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Escrow (trust) funds\u003c/strong> are money held for others: deposits, rents, advance fees. A broker may hold them in a bank, credit union or savings association doing business in Florida, or place them with a Florida title company or attorney. A broker is not required to maintain an escrow account, but must handle funds properly either way. An \u003cstrong>interest-bearing\u003c/strong> account requires the \u003cstrong>written consent of all parties\u003c/strong>, including who receives the interest.\u003c/p>\n\u003cp>\u003cstrong>The deposit clock (manual; not verified this session):\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>The \u003cstrong>sales associate\u003c/strong> delivers the deposit to the broker by the \u003cstrong>end of the next business day\u003c/strong>.\u003c/li>\n\u003cli>The \u003cstrong>broker\u003c/strong> deposits it by the \u003cstrong>end of the third business day\u003c/strong> after the brokerage receives it. The day of receipt is not counted; weekends and legal holidays never count. \"Immediately\" in FREC rules means this window.\u003c/li>\n\u003c/ul>\n\u003cp>Worked example: received Thursday → associate delivers by end of Friday → broker deposits by end of Tuesday (Fri 1, Mon 2, Tue 3).\u003c/p>\n\u003cp>\u003cstrong>Broker's own money:\u003c/strong> up to \u003cstrong>\u003cspan class=\"math inline\">1, 000 *  * \u003cem>i\u003c/em>\u003cem>n\u003c/em>\u003cem>a\u003c/em>\u003cem>s\u003c/em>\u003cem>a\u003c/em>\u003cem>l\u003c/em>\u003cem>e\u003c/em>\u003cem>s\u003c/em>\u003cem>e\u003c/em>\u003cem>s\u003c/em>\u003cem>c\u003c/em>\u003cem>r\u003c/em>\u003cem>o\u003c/em>\u003cem>w\u003c/em>\u003cem>a\u003c/em>\u003cem>c\u003c/em>\u003cem>c\u003c/em>\u003cem>o\u003c/em>\u003cem>u\u003c/em>\u003cem>n\u003c/em>\u003cem>t\u003c/em>\u003cem>a\u003c/em>\u003cem>n\u003c/em>\u003cem>d\u003c/em> * *\u003c/span>5,000\u003c/strong> in a property-management escrow account, to cover bank charges. More is \u003cstrong>commingling\u003c/strong>. Using escrow money for personal or business purposes is \u003cstrong>conversion\u003c/strong> (more serious).\u003c/p>\n\u003ch2 id=\"6-portugal-comparison\">6. Portugal comparison\u003c/h2>\n\u003cp>See PT-07: Florida deposits sit in escrow under strict business-day clocks; the Portuguese sinal \"return double\" rule does not apply.\u003c/p>\n\u003ch2 id=\"7-legal-and-numerical-requirements\">7. Legal and numerical requirements\u003c/h2>\n\u003cp>Next business day · 3rd business day · $1,000 / $5,000 · interest-bearing needs all parties' written consent.\u003c/p>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>Counting calendar days or the day of receipt.\u003c/li>\n\u003cli>Thinking a short \"borrowing\" of escrow funds is acceptable if repaid.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Associate 1 business day, broker 3. Sales 1K, rentals 5K. Mixing = commingling; spending = conversion.\u003c/p>\n"},{"id":"L05-2","ch":"ch05","title":"Conflicting demands and settlement procedures","type":"legal","pri":"high","min":30,"manual":"M3 §Conflicting demands","pre":["L05-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>When a broker holding escrow funds receives \u003cstrong>conflicting demands\u003c/strong> (or has a good-faith doubt about who is entitled), Rule 61J2-10.032 (verified V-15) requires:\u003c/p>\n\u003col type=\"1\">\n\u003cli>Written notice to the FREC within \u003cstrong>15 business days\u003c/strong> of the last demand.\u003c/li>\n\u003cli>Instituting a settlement procedure within \u003cstrong>30 business days\u003c/strong> of the last demand.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Settlement procedures (M.A.L.E.):\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Mediation\u003c/strong> — all parties consent in writing; must be completed within \u003cstrong>90 days\u003c/strong> after the last demand, otherwise the broker promptly uses another procedure.\u003c/li>\n\u003cli>\u003cstrong>Arbitration\u003c/strong> — all parties consent; binding.\u003c/li>\n\u003cli>\u003cstrong>Litigation\u003c/strong> — interpleader: the broker deposits the funds with the court.\u003c/li>\n\u003cli>\u003cstrong>Escrow Disbursement Order (EDO)\u003c/strong> — the FREC decides; available only when the broker holds the funds.\u003c/li>\n\u003c/ul>\n\u003cp>If the matter settles or goes to court before an EDO issues, notify the FREC within \u003cstrong>10 business days\u003c/strong>. A broker who follows the procedure and the resulting order cannot be disciplined for failure to account. (Manual: if a broker obeys an EDO and is sued, the Recovery Fund may pay the broker's costs.)\u003c/p>\n\u003cp>\u003cstrong>No FREC notice needed (s. 475.25(1)(d)1, verified V-16):\u003c/strong> a residential \u003cstrong>condominium buyer cancels\u003c/strong> under s. 718.503, or a \u003cstrong>buyer in good faith fails to satisfy the financing clause\u003c/strong> — the broker may return the deposit to the buyer. When a \u003cstrong>title company or attorney\u003c/strong> holds the deposit, the broker is not the escrow holder and the FREC procedure does not apply. The manual's \"HUD sale\" exception was not found in the statute and is not taught.\u003c/p>\n\u003ch2 id=\"7-legal-and-numerical-requirements\">7. Legal and numerical requirements\u003c/h2>\n\u003cp>15 business days notify · 30 business days institute · mediation 90 days · 10 business days if settled.\u003c/p>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>Treating 15/30 as calendar days.\u003c/li>\n\u003cli>Requesting an EDO when a title company holds the money.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>15 to tell, 30 to choose. M.A.L.E. EDO only for broker-held funds. Condo cancellation and good-faith loan denial = return to buyer, no notice.\u003c/p>\n"},{"id":"L05-3","ch":"ch05","title":"Advertising rules","type":"legal","pri":"high","min":20,"manual":"M3 §Advertising","pre":["L05-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>Every advertisement by a licensee must include the \u003cstrong>registered name of the brokerage firm\u003c/strong>. An ad without it is a \u003cstrong>blind ad\u003c/strong>, in any medium: yard sign, newspaper, website, Instagram, WhatsApp status. If a sales associate's name appears, it must be the name registered with DBPR. Prices advertised must be those agreed with the seller. On the internet, the firm name must appear on the ad itself, not only on a page one click away. Team names may not suggest the team is an independent brokerage (manual; team-advertising rule details not verified).\u003c/p>\n\u003cp>An \u003cstrong>owner advertising his own property\u003c/strong> without a brokerage has no brokerage name to include.\u003c/p>\n\u003ch2 id=\"7-legal-and-numerical-requirements\">7. Legal and numerical requirements\u003c/h2>\n\u003cp>Registered brokerage name in every licensee ad. No blind ads.\u003c/p>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>\"My personal account is exempt.\" It is not.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>No firm name = blind ad. Owners selling their own property are not licensee ads.\u003c/p>\n"},{"id":"L05-4","ch":"ch05","title":"Offices, signs, compensation, kickbacks and rental lists","type":"legal","pri":"medium","min":30,"manual":"M3 §Offices, signs; §Rental lists, kickbacks","pre":["L05-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Offices and signs.\u003c/strong> An active broker must maintain a registered office (a stationary location where records are kept) with an entrance sign showing the broker's name, any trade name, and \u003cstrong>\"Licensed Real Estate Broker\"\u003c/strong> (or \"Lic. Real Estate Broker\"). Additional business locations are \u003cstrong>branch offices\u003c/strong>, each registered.\u003c/p>\n\u003cp>\u003cstrong>Who may be paid.\u003c/strong> A sales associate may be paid \u003cstrong>only by the employing broker\u003c/strong> — never directly by a seller, buyer, another associate or another brokerage. Paying \u003cstrong>unlicensed persons\u003c/strong> for real estate services is prohibited (a per-closing bonus to an unlicensed assistant is unlawful; a salary for clerical work is fine). A broker may \u003cstrong>rebate\u003c/strong> part of the commission to a party to the transaction with full disclosure. Commissions are \u003cstrong>negotiable\u003c/strong>; agreements among competitors on rates are \u003cstrong>price fixing\u003c/strong> (antitrust).\u003c/p>\n\u003cp>\u003cstrong>Kickbacks.\u003c/strong> Between licensees, sharing compensation through brokers is lawful. A kickback from a settlement-service provider is permitted under Chapter 475 only with full disclosure to all parties and if no other law prohibits it — and RESPA usually prohibits it in residential financed transactions.\u003c/p>\n\u003cp>\u003cstrong>Rental lists (s. 475.453, verified V-21).\u003c/strong> A licensee who sells rental information for a fee must give a contract or receipt: \u003cstrong>75% refund\u003c/strong> if the tenant does not obtain a rental (demand within \u003cstrong>30 days\u003c/strong> of the contract), \u003cstrong>full refund\u003c/strong> if the information was not current or accurate.\u003c/p>\n\u003cp>\u003cstrong>Associate compensation disputes\u003c/strong> are contract matters between associate and broker (not FREC matters, not Recovery Fund claims).\u003c/p>\n\u003ch2 id=\"7-legal-and-numerical-requirements\">7. Legal and numerical requirements\u003c/h2>\n\u003cp>\"Licensed Real Estate Broker\" on the sign · paid only by employing broker · rebates to parties with disclosure · rental list 75% / 100% / 30 days.\u003c/p>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>\"A gift from a happy seller isn't compensation.\"\u003c/li>\n\u003cli>\"A standard commission rate exists.\"\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Money flows through the broker. Unlicensed: salary for clerical OK, per-deal pay never. Rental lists: keep 25%.\u003c/p>\n"},{"id":"L06-1","ch":"ch06","title":"The complaint process","type":"legal","pri":"high","min":25,"manual":"M4 §The complaint pipeline","pre":["L03-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>The complaint pipeline (manual; partially verified):\u003c/strong>\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cstrong>Complaint\u003c/strong> filed with the DBPR. It must be \u003cstrong>legally sufficient\u003c/strong> (alleging facts that would violate a statute or rule). It need not come from a harmed party; anonymous complaints can be investigated if legally sufficient and substantial.\u003c/li>\n\u003cli>\u003cstrong>DBPR investigates\u003c/strong>; the licensee is generally notified and may respond.\u003c/li>\n\u003cli>\u003cstrong>Probable cause panel\u003c/strong> (manual: two members, at least one a current FREC member) decides whether probable cause exists.\u003c/li>\n\u003cli>If yes, a \u003cstrong>formal (administrative) complaint\u003c/strong> is filed.\u003c/li>\n\u003cli>The licensee chooses: \u003cstrong>informal hearing\u003c/strong> before the FREC (facts not disputed) or \u003cstrong>formal hearing\u003c/strong> before an \u003cstrong>administrative law judge\u003c/strong> (facts disputed), who issues a recommended order.\u003c/li>\n\u003cli>The FREC issues the \u003cstrong>final order\u003c/strong>.\u003c/li>\n\u003cli>The licensee may \u003cstrong>appeal within 30 days\u003c/strong> to the District Court of Appeal.\u003c/li>\n\u003c/ol>\n\u003cp>Withdrawing the complaint does not stop the process.\u003c/p>\n\u003ch2 id=\"7-legal-and-numerical-requirements\">7. Legal and numerical requirements\u003c/h2>\n\u003cp>Order of steps; 30-day appeal.\u003c/p>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>Putting probable cause before investigation.\u003c/li>\n\u003cli>Thinking the complainant can end the case.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Complaint → investigate → probable cause → formal complaint → hearing → final order → appeal (30 days).\u003c/p>\n"},{"id":"L06-2","ch":"ch06","title":"Penalties and the violation vocabulary","type":"legal","pri":"high","min":30,"manual":"M4 §The penalty menu; §Violation vocabulary","pre":["L06-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Administrative penalties (FREC):\u003c/strong> notice of noncompliance (first minor violation); citation (set fine for listed minor violations); administrative fine \u003cstrong>up to $5,000 per violation\u003c/strong>; probation; \u003cstrong>suspension up to 10 years\u003c/strong>; \u003cstrong>revocation\u003c/strong> (permanent, with narrow exceptions); denial of an application or renewal; required education.\u003c/p>\n\u003cp>\u003cstrong>Criminal penalties (courts):\u003c/strong> operating without a license = \u003cstrong>third-degree felony\u003c/strong> (verified V-12), up to 5 years and $5,000 under the general sentencing statutes. Most other s. 475.42 violations are second-degree misdemeanors (partially verified). Rental-list fraud has been a first-degree misdemeanor.\u003c/p>\n\u003cp>\u003cstrong>Violation vocabulary (s. 475.25):\u003c/strong> fraud (intentional deception), misrepresentation (false statement of material fact), concealment, false promises, false pretenses, dishonest dealing by trick or scheme, \u003cstrong>culpable negligence\u003c/strong> (reckless indifference, more than carelessness), breach of trust. These apply in \u003cstrong>any business transaction\u003c/strong>, not only real estate. Other grounds: commingling, conversion, failure to account and deliver, failure to keep records (\u003cstrong>5 years\u003c/strong>; at least 2 years after related litigation), operating as a broker while licensed as a sales associate, crimes involving moral turpitude, adjudication of mental incompetence (manual wording: confinement in a mental institution), failure to report a plea or conviction within 30 days.\u003c/p>\n\u003cp>The FREC never imprisons and never awards damages; fines go to the state.\u003c/p>\n\u003ch2 id=\"7-legal-and-numerical-requirements\">7. Legal and numerical requirements\u003c/h2>\n\u003cp>$5,000 per violation · 10 years suspension · unlicensed = 3rd-degree felony · records 5 years.\u003c/p>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>\"FREC can order restitution like a court.\" Consumer damages require a civil judgment.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Fine 5K · suspend 10 · records 5 · no license = felony.\u003c/p>\n"},{"id":"L06-3","ch":"ch06","title":"The Real Estate Recovery Fund","type":"legal","pri":"high","min":20,"manual":"M4 §The Real Estate Recovery Fund","pre":["L06-2"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>The Real Estate Recovery Fund (s. 475.484, verified V-17)\u003c/strong> pays members of the public who obtain a final civil judgment against a licensee for a violation in a real estate brokerage transaction and cannot collect it.\u003c/p>\n\u003cul>\n\u003cli>Pays actual or compensatory damages only — \u003cstrong>not\u003c/strong> treble damages, court costs, attorney's fees or interest.\u003c/li>\n\u003cli>\u003cstrong>$50,000 per transaction\u003c/strong> (all claimants combined).\u003c/li>\n\u003cli>\u003cstrong>$150,000 aggregate\u003c/strong> against any one licensee (prorated if exceeded).\u003c/li>\n\u003cli>When the Fund pays, the licensee's license is \u003cstrong>automatically suspended\u003c/strong> until repaid in full plus interest.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Who cannot recover:\u003c/strong> a licensee who acted as a licensee in the transaction (e.g., a commission dispute); the manual also excludes a licensee's spouse in certain claims. A licensee harmed while acting solely as a buyer or seller may recover like any consumer.\u003c/p>\n\u003ch2 id=\"7-legal-and-numerical-requirements\">7. Legal and numerical requirements\u003c/h2>\n\u003cp>$50,000 / $150,000 · automatic suspension until repaid with interest.\u003c/p>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>\"Associates can claim for unpaid commissions.\"\u003c/li>\n\u003cli>\"The Fund pays legal fees.\"\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>50 per deal, 150 per licensee. Public only. Payment = suspension.\u003c/p>\n"},{"id":"L07-1","ch":"ch07","title":"Fair housing","type":"legal","pri":"high","min":35,"manual":"M5 §Fair housing","pre":["L01-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Civil Rights Act of 1866:\u003c/strong> prohibits \u003cstrong>racial\u003c/strong> discrimination in the sale or rental of \u003cstrong>all\u003c/strong> property, real or personal, with \u003cstrong>no exceptions\u003c/strong>; enforced by suit in federal court.\u003c/p>\n\u003cp>\u003cstrong>Fair Housing Act (1968, Title VIII):\u003c/strong> race, color, religion, national origin. \u003cstrong>1974\u003c/strong> added \u003cstrong>sex\u003c/strong>. \u003cstrong>1988\u003c/strong> added \u003cstrong>familial status\u003c/strong> (children under 18, pregnant women, people obtaining custody) and \u003cstrong>handicap\u003c/strong> (disability). Bona fide \u003cstrong>housing for older persons\u003c/strong> may exclude children: 55+ communities with at least 80% of units occupied by at least one person 55+, or communities where all occupants are 62+.\u003c/p>\n\u003cp>\u003cstrong>Prohibited practices:\u003c/strong> refusing to sell or rent; different terms; discriminatory advertising; false statements about availability; \u003cstrong>blockbusting\u003c/strong> (panic peddling: inducing owners to sell by suggesting a protected class is moving in); \u003cstrong>steering\u003c/strong> (directing buyers toward or away from areas by protected class); \u003cstrong>redlining\u003c/strong> (lenders refusing or varying loans by area).\u003c/p>\n\u003cp>\u003cstrong>Disability:\u003c/strong> landlords must allow \u003cstrong>reasonable modifications\u003c/strong> (physical changes, generally at the tenant's expense) and make \u003cstrong>reasonable accommodations\u003c/strong> in rules (e.g., assistance animals despite a no-pets rule).\u003c/p>\n\u003cp>\u003cstrong>Exemptions (never for race):\u003c/strong> an owner of no more than 3 single-family homes selling or renting without a broker and without discriminatory ads; the \u003cstrong>\"Mrs. Murphy\"\u003c/strong> owner-occupied building of no more than 4 units; religious organizations and private clubs limiting non-commercial housing to members. Using a \u003cstrong>broker\u003c/strong> or a \u003cstrong>discriminatory ad\u003c/strong> ends the exemption.\u003c/p>\n\u003cp>\u003cstrong>Enforcement:\u003c/strong> complaints to \u003cstrong>HUD within 1 year\u003c/strong> (manual) or a court action. Brokerage offices display the equal housing opportunity poster. Florida also has its own Fair Housing Act (Ch. 760, details not verified this session).\u003c/p>\n\u003ch2 id=\"7-legal-and-numerical-requirements\">7. Legal and numerical requirements\u003c/h2>\n\u003cp>1866 race (no exceptions) · 1968 · 1974 sex · 1988 familial status + handicap · 55+/80% or 62+ · ≤3 homes · ≤4 units owner-occupied.\u003c/p>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>Mixing 1978 (lead paint) with 1988 (fair housing amendments).\u003c/li>\n\u003cli>Believing an exemption survives if a broker is used.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Race = no exemptions. Steer buyers · block(bust) sellers · red(line) loans. Modification = physical; accommodation = rules.\u003c/p>\n"},{"id":"L07-2","ch":"ch07","title":"ADA, ECOA, HMDA and marketing rules (Do Not Call, CAN-SPAM, fax)","type":"legal","pri":"medium","min":25,"manual":"M5 §Telemarketing; §ECOA, ADA","pre":["L07-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>ADA\u003c/strong> (Americans with Disabilities Act): accessibility of \u003cstrong>public accommodations\u003c/strong> and commercial facilities (including brokerage offices); barriers removed where readily achievable. Governs business premises, not private homes.\u003c/li>\n\u003cli>\u003cstrong>ECOA\u003c/strong> (Equal Credit Opportunity Act): no credit discrimination by race, color, religion, national origin, sex, \u003cstrong>marital status, age, or receipt of public assistance income\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>HMDA\u003c/strong> (Home Mortgage Disclosure Act): lenders report lending data, which exposes redlining.\u003c/li>\n\u003cli>\u003cstrong>CFPB\u003c/strong> administers the TRID disclosure rules.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Marketing rules:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Do Not Call:\u003c/strong> numbers on the national (and Florida) registry may not be cold-called, unless there is \u003cstrong>written permission\u003c/strong> or an \u003cstrong>established business relationship\u003c/strong> — up to \u003cstrong>18 months\u003c/strong> after a purchase/transaction, up to \u003cstrong>3 months\u003c/strong> after an inquiry. A request to stop calling overrides these.\u003c/li>\n\u003cli>\u003cstrong>CAN-SPAM\u003c/strong> (commercial email): truthful headers and subject lines, identification as an ad where required, a working opt-out honored within \u003cstrong>10 business days\u003c/strong>, a physical postal address.\u003c/li>\n\u003cli>\u003cstrong>Junk Fax Prevention Act:\u003c/strong> no unsolicited fax ads without an established business relationship.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"7-legal-and-numerical-requirements\">7. Legal and numerical requirements\u003c/h2>\n\u003cp>DNC 18 months / 3 months · CAN-SPAM 10 business days · ECOA classes.\u003c/p>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>\"A wheelchair ramp at the office is a fair housing issue.\" It is ADA.\u003c/li>\n\u003cli>\"Another brokerage's expired listing is fair game for cold calls.\" No relationship exists.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Housing = FHA · credit = ECOA · public accommodation = ADA · data = HMDA. DNC: 18 after a deal, 3 after a question.\u003c/p>\n"},{"id":"L07-3","ch":"ch07","title":"RESPA and TILA (TRID)","type":"legal","pri":"high","min":30,"manual":"M5 §RESPA and TILA","pre":["L07-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>RESPA\u003c/strong> applies to \u003cstrong>federally related loans on 1–4 unit residential property\u003c/strong>. It prohibits \u003cstrong>kickbacks and unearned fees\u003c/strong> for referrals of settlement services (title, inspection, lending), and prohibits sellers from requiring a particular title company. \u003cstrong>TRID\u003c/strong> (TILA-RESPA Integrated Disclosures): the \u003cstrong>Loan Estimate\u003c/strong> within \u003cstrong>3 business days\u003c/strong> of application; the \u003cstrong>Closing Disclosure\u003c/strong> at least \u003cstrong>3 business days before closing\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>TILA / Regulation Z\u003c/strong> requires disclosure of the cost of credit, headlined by the \u003cstrong>APR\u003c/strong> (rate plus certain costs — compare loans by APR). \u003cstrong>Trigger terms\u003c/strong> in ads (a down-payment amount, a payment amount, the number of payments, the finance charge) require full disclosure of credit terms; \"low monthly payments\" alone is not a trigger term. \u003cstrong>Right of rescission:\u003c/strong> \u003cstrong>3 business days\u003c/strong> for refinances and home-equity loans on a \u003cstrong>principal residence\u003c/strong> — not purchase-money loans, not investment property.\u003c/p>\n\u003ch2 id=\"7-legal-and-numerical-requirements\">7. Legal and numerical requirements\u003c/h2>\n\u003cp>1–4 units · LE 3 business days after application · CD 3 business days before closing · rescission 3 business days (refi/home equity, primary home).\u003c/p>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>\"A buyer can rescind her purchase mortgage within 3 days.\" Not for purchase loans.\u003c/li>\n\u003cli>\"Disclosure makes a settlement-service kickback legal under RESPA.\" RESPA prohibits it.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>3 after applying · 3 before closing · 3 to rescind a refi. Specific numbers in ads trigger disclosure.\u003c/p>\n"},{"id":"L07-4","ch":"ch07","title":"Florida Residential Landlord and Tenant Act","type":"legal","pri":"high","min":25,"manual":"M5 §Florida Residential Landlord and Tenant Act","pre":["L07-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Florida Residential Landlord and Tenant Act (Chapter 83).\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Security deposits:\u003c/strong> held in a separate Florida account (interest-bearing or not) or secured by a surety bond; the tenant is told in writing how the deposit is held within \u003cstrong>30 days\u003c/strong> of receipt.\u003c/p>\n\u003cp>\u003cstrong>After move-out:\u003c/strong> return within \u003cstrong>15 days\u003c/strong> if no claim; otherwise send a \u003cstrong>certified-mail notice of intent to impose a claim within 30 days\u003c/strong>; the tenant has \u003cstrong>15 days to object\u003c/strong>. A landlord who misses the 30-day notice \u003cstrong>forfeits\u003c/strong> the right to impose a claim. In a dispute, the prevailing party recovers attorney's fees.\u003c/p>\n\u003cp>\u003cstrong>Ending tenancies without a specific term (s. 83.57, verified V-04):\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Tenancy\u003c/th>\n\u003cth>Written notice before end of period\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Year to year\u003c/td>\n\u003ctd>at least 60 days\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Quarter to quarter\u003c/td>\n\u003ctd>at least 30 days\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Month to month\u003c/td>\n\u003ctd>at least 30 days\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Week to week\u003c/td>\n\u003ctd>at least 7 days\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>Correction:\u003c/strong> the study manual lists 15 days (month) and 45 days (quarter). The current statute says 30 and 30. Older books show 15 days for month-to-month because the law changed; no version with 45 days was found.\u003c/p>\n\u003ch2 id=\"7-legal-and-numerical-requirements\">7. Legal and numerical requirements\u003c/h2>\n\u003cp>30-day notice of how held · 15 / 30 / 15 · 60 / 30 / 30 / 7.\u003c/p>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>Using the outdated 15-day month-to-month notice.\u003c/li>\n\u003cli>Thinking a late notice of claim still lets the landlord deduct.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Deposit: 30 to say how held; 15 return · 30 claim · 15 object. Notices: 60 / 30 / 30 / 7.\u003c/p>\n"},{"id":"L08-1","ch":"ch08","title":"Freehold estates and the bundle of rights","type":"conceptual","pri":"high","min":30,"manual":"M6 §Freehold estates; M7 §bundle of rights","pre":["L01-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Bundle of rights:\u003c/strong> possession, control, enjoyment, exclusion, disposition (manual mnemonic D.E.E.P. C).\u003c/p>\n\u003cp>\u003cstrong>Freehold estates\u003c/strong> (ownership of indefinite duration):\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Fee simple absolute\u003c/strong> — the maximum bundle; inheritable; no conditions.\u003c/li>\n\u003cli>\u003cstrong>Fee simple defeasible\u003c/strong> — ownership that can be lost if a condition is broken (\"so long as the land is used as a school\").\u003c/li>\n\u003cli>\u003cstrong>Life estate\u003c/strong> — ownership measured by a life (the life tenant's, or another person's: \u003cem>pur autre vie\u003c/em>). The \u003cstrong>life tenant\u003c/strong> has full use, collects rents, pays taxes and upkeep, may sell or lease her interest (which ends at the measuring death), and must not commit \u003cstrong>waste\u003c/strong>. The future interest is a \u003cstrong>remainder\u003c/strong> if it passes to a third party (remainderman) or a \u003cstrong>reversion\u003c/strong> if it returns to the grantor or heirs.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"6-portugal-comparison\">6. Portugal comparison\u003c/h2>\n\u003cp>See PT-15: a life estate resembles \u003cem>usufruto\u003c/em> in purpose but uses US vocabulary (remainder, reversion, waste).\u003c/p>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>\"A life tenant's lease survives her death.\" It ends with the life estate.\u003c/li>\n\u003cli>Swapping remainder and reversion.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Fee simple = everything. Life estate: remainder goes forward to a third person; reversion comes back.\u003c/p>\n"},{"id":"L08-2","ch":"ch08","title":"Leasehold estates, lease types, assignment and sublease","type":"conceptual","pri":"medium","min":30,"manual":"M6 §Freehold estates (leasehold); §Leases as instruments","pre":["L08-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Leasehold (nonfreehold) estates\u003c/strong> give possession without ownership:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Estate for years\u003c/strong> — any fixed term, even one week; ends automatically without notice.\u003c/li>\n\u003cli>\u003cstrong>Periodic tenancy\u003c/strong> — renews week to week, month to month, etc., until notice (Florida notice periods: 60/30/30/7, Lesson L07-4).\u003c/li>\n\u003cli>\u003cstrong>Tenancy at will\u003c/strong> — indefinite; ends with proper notice.\u003c/li>\n\u003cli>\u003cstrong>Tenancy at sufferance\u003c/strong> — a holdover tenant without the landlord's consent.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>A lease\u003c/strong> is both a contract and a conveyance of a leasehold. Elements: parties, description, term, rent, signatures. A lease longer than one year must be in writing (statute of frauds). \u003cstrong>Correction (V-05):\u003c/strong> the manual says Florida requires two witnesses on leases over one year; s. 689.01 now states that \u003cstrong>no subscribing witnesses are required for leases\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>Lease types:\u003c/strong> \u003cstrong>gross\u003c/strong> (fixed rent; landlord pays expenses), \u003cstrong>net\u003c/strong> (tenant also pays some or all taxes, insurance, maintenance; triple net = all three), \u003cstrong>percentage\u003c/strong> (base rent plus a percentage of gross sales over a breakpoint — retail), \u003cstrong>ground\u003c/strong> (long-term land lease; tenant builds), \u003cstrong>graduated/step-up\u003c/strong> (scheduled increases), \u003cstrong>index\u003c/strong> (tied to CPI).\u003c/p>\n\u003cp>\u003cstrong>Assignment vs sublease:\u003c/strong> assignment transfers the \u003cstrong>entire remaining term\u003c/strong> (assignee pays the landlord; the original tenant stays secondarily liable unless released). A sublease transfers part of the term or space (subtenant pays the tenant, who stays primarily liable). A lease survives the sale of the property: the buyer takes subject to existing leases.\u003c/p>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>\"An estate for years must last a year.\"\u003c/li>\n\u003cli>\"Transferring the last 14 months of a 3-year lease is a sublease.\" It is an assignment — measure against what remains.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Fixed term = estate for years (no notice). All remaining term = assignment. Leases: writing if &gt;1 year, no witnesses now.\u003c/p>\n"},{"id":"L08-3","ch":"ch08","title":"Co-ownership: tenancy in common, joint tenancy, tenancy by the entireties","type":"legal","pri":"high","min":30,"manual":"M6 §Co-ownership","pre":["L08-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Tenancy in common\u003c/strong> — Florida's default when a deed to two or more unmarried people is silent. Shares may be unequal; each owner may sell or mortgage his share; at death the share passes to heirs or devisees.\u003c/li>\n\u003cli>\u003cstrong>Joint tenancy with right of survivorship\u003c/strong> — requires the four unities (\u003cstrong>PITT\u003c/strong>: Possession, Interest, Time, Title) and, in Florida, \u003cstrong>express survivorship language\u003c/strong>; at death the share passes to the surviving joint tenants outside probate.\u003c/li>\n\u003cli>\u003cstrong>Tenancy by the entireties\u003c/strong> — married couples only (unities plus marriage); automatic survivorship; neither spouse can convey alone; protected from creditors of only one spouse. A deed to a married couple is presumed to create an entireties estate.\u003c/li>\n\u003c/ul>\n\u003cp>Florida is \u003cstrong>not\u003c/strong> a community-property state. Any co-tenant may sue for \u003cstrong>partition\u003c/strong>.\u003c/p>\n\u003ch2 id=\"6-portugal-comparison\">6. Portugal comparison\u003c/h2>\n\u003cp>See PT-13: Florida's outcome depends on the deed form and marital status, not on a marital property regime.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Married + silent = entireties. Unmarried + silent = in common. Survivorship needs words (or marriage).\u003c/p>\n"},{"id":"L08-4","ch":"ch08","title":"Florida homestead: creditor protection and transfer restrictions","type":"legal","pri":"high","min":25,"manual":"M6 §Florida homestead","pre":["L08-3"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>Florida \"homestead\" has three separate meanings. This lesson covers the first two; the tax exemption is in Chapter 18.\u003c/p>\n\u003cp>\u003cstrong>1. Protection from forced sale (Art. X):\u003c/strong> the owner's primary residence, up to \u003cstrong>1/2 acre of contiguous land within a municipality\u003c/strong> or \u003cstrong>160 contiguous acres outside\u003c/strong>, is protected from forced sale by most creditors. It does \u003cstrong>not\u003c/strong> stop: property taxes and assessments; the mortgage on the home; liens for labor or materials used to improve the home (construction liens). Federal (IRS) liens can also reach it.\u003c/p>\n\u003cp>\u003cstrong>2. Family protection:\u003c/strong> if the owner has a \u003cstrong>spouse or minor child\u003c/strong>, the homestead cannot be freely devised away from them, and the \u003cstrong>spouse must join\u003c/strong> in any deed or mortgage of the homestead, even if title is in one name.\u003c/p>\n\u003ch2 id=\"6-portugal-comparison\">6. Portugal comparison\u003c/h2>\n\u003cp>See PT-16.\u003c/p>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>Mixing creditor protection facts with the $25,000 tax exemption.\u003c/li>\n\u003cli>\"Homestead blocks the lender who financed the home.\" It does not.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Half acre in town · 160 acres outside. Taxes, the home's mortgage, and repair liens get through. Spouse joins.\u003c/p>\n"},{"id":"L08-5","ch":"ch08","title":"Condominiums, cooperatives, timeshares, HOAs and CDDs","type":"legal","pri":"high","min":30,"manual":"M6 §Condominiums, cooperatives, timeshares, HOAs","pre":["L08-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Condominium:\u003c/strong> created by \u003cstrong>recording a declaration of condominium\u003c/strong>. The buyer owns the \u003cstrong>unit in fee simple\u003c/strong> plus an \u003cstrong>undivided share of the common elements\u003c/strong>, which cannot be separated from the unit. Buyers receive the declaration, bylaws, rules, FAQ and financial information.\u003c/p>\n\u003cp>\u003cstrong>Cancellation rights (s. 718.503):\u003c/strong> purchase of a \u003cstrong>new unit from the developer\u003c/strong> — \u003cstrong>15 days\u003c/strong>. \u003cstrong>Resale\u003c/strong> — the manual says \u003cstrong>3 business days\u003c/strong> after receiving the documents; fragmentary 2025 statute excerpts show \u003cstrong>7 days\u003c/strong> (excluding weekends and legal holidays) — \u003cstrong>unresolved (V-08)\u003c/strong>; check the current statute before relying on either.\u003c/p>\n\u003cp>\u003cstrong>Cooperative:\u003c/strong> a corporation owns the whole building; the buyer receives \u003cstrong>shares\u003c/strong> plus a \u003cstrong>proprietary lease\u003c/strong> — \u003cstrong>personal property\u003c/strong>; the board usually approves buyers.\u003c/p>\n\u003cp>\u003cstrong>Timeshare:\u003c/strong> the right to use a unit for periods; \u003cstrong>10-day\u003c/strong> cancellation right that cannot be waived.\u003c/p>\n\u003cp>\u003cstrong>HOA:\u003c/strong> mandatory-membership community with recorded covenants; a \u003cstrong>disclosure summary\u003c/strong> must be given before the contract (if not, the buyer can void the contract, per manual).\u003c/p>\n\u003cp>\u003cstrong>CDD (Community Development District):\u003c/strong> a special-purpose local government that finances community infrastructure and charges assessments (named in the FREC section title; not covered in the manual).\u003c/p>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>\"Co-op buyers own real estate.\"\u003c/li>\n\u003cli>Mixing 15 (developer condo) / resale (flagged) / 10 (timeshare).\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Condo = deed + common elements. Co-op = shares + lease. 15 developer · resale flagged · 10 timeshare.\u003c/p>\n"},{"id":"L09-1","ch":"ch09","title":"Acquiring and losing title","type":"legal","pri":"medium","min":25,"manual":"M7 §Acquiring and conveying title; §Wills","pre":["L08-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>Title transfers \u003cstrong>voluntarily\u003c/strong> by deed (sale or gift) or will, and \u003cstrong>involuntarily\u003c/strong> by descent (intestate succession), \u003cstrong>escheat\u003c/strong> (no will and no heirs → state), \u003cstrong>eminent domain\u003c/strong> (government taking with just compensation), foreclosure, and \u003cstrong>adverse possession\u003c/strong> — in Florida, \u003cstrong>7 years\u003c/strong> of open, notorious, hostile, continuous possession \u003cstrong>plus\u003c/strong> color of title or payment of taxes (manual; not verified).\u003c/p>\n\u003cp>Title passes by \u003cstrong>delivery and acceptance of a deed during the grantor's lifetime\u003c/strong> — not by signing, not by recording.\u003c/p>\n\u003cp>\u003cstrong>Wills:\u003c/strong> dying \u003cstrong>testate\u003c/strong> (real property passes by \u003cstrong>devise\u003c/strong> to devisees) or \u003cstrong>intestate\u003c/strong> (Florida's statute of descent distributes to heirs). Probate proves the will and clears title. Homestead devise restrictions override the will. A will takes effect only at death and can be revoked any time before.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>7 years + color of title or taxes. Devise = will; descent = no will; escheat = no heirs.\u003c/p>\n"},{"id":"L09-2","ch":"ch09","title":"Deeds: types and requirements","type":"legal","pri":"high","min":30,"manual":"M7 §Deeds","pre":["L09-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Deeds from most to least protection:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>General warranty\u003c/strong> — warrants title against defects arising at any time. Covenants: seisin, quiet enjoyment, against encumbrances, further assurance, warranty forever.\u003c/li>\n\u003cli>\u003cstrong>Special warranty\u003c/strong> — only against defects arising during the grantor's ownership.\u003c/li>\n\u003cli>\u003cstrong>Bargain and sale\u003c/strong> — implies ownership; no warranties.\u003c/li>\n\u003cli>\u003cstrong>Quitclaim\u003c/strong> — conveys whatever interest the grantor has; no warranties; cures a \u003cstrong>cloud on title\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>A valid Florida deed requires:\u003c/strong> a written instrument; a \u003cstrong>competent grantor\u003c/strong> (grantee need only be identifiable and may be a minor); consideration (nominal is enough); words of conveyance (granting clause); a legal description; the \u003cstrong>grantor's signature before two witnesses\u003c/strong> (s. 689.01, V-05); \u003cstrong>delivery and acceptance\u003c/strong>. The grantee does not sign. A notary \u003cstrong>acknowledgment\u003c/strong> is required for \u003cstrong>recording\u003c/strong>, not validity.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>General &gt; special &gt; bargain &amp; sale &gt; quitclaim. Two witnesses. Delivery makes it valid; recording warns the world.\u003c/p>\n"},{"id":"L09-3","ch":"ch09","title":"Notice, recording and title evidence","type":"legal","pri":"medium","min":20,"manual":"M7 §Notice, recording, and title evidence","pre":["L09-2"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Constructive notice:\u003c/strong> what the public records (and visible possession) impart to everyone. \u003cstrong>Actual notice:\u003c/strong> what a person actually knows. Florida protects a good-faith purchaser who records without notice of prior claims.\u003c/p>\n\u003cp>\u003cstrong>Title evidence:\u003c/strong> an \u003cstrong>abstract of title with an attorney's opinion\u003c/strong>, or \u003cstrong>title insurance\u003c/strong> (the modern standard). \u003cstrong>Owner's policy:\u003c/strong> issued for the purchase price, protects the owner while she owns, not transferable. \u003cstrong>Lender's policy:\u003c/strong> for the loan amount, declines with the balance, follows the loan. Title insurance covers defects existing \u003cstrong>before\u003c/strong> the policy date — never defects the owner creates later.\u003c/p>\n\u003ch2 id=\"6-portugal-comparison\">6. Portugal comparison\u003c/h2>\n\u003cp>See PT-11.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Recording = constructive notice. Title insurance looks backward.\u003c/p>\n"},{"id":"L09-4","ch":"ch09","title":"Encumbrances: liens, easements, encroachments and restrictions","type":"legal","pri":"high","min":30,"manual":"M7 §Encumbrances","pre":["L09-3"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Liens\u003c/strong> are money claims against property. \u003cem>Specific\u003c/em> liens attach to one property: property tax and special assessment liens (priority over all others regardless of date), mortgages, vendor's liens, construction liens (relate back to the notice of commencement). \u003cem>General\u003c/em> liens attach to all the debtor's property: judgment liens, IRS liens, estate liens. Otherwise priority follows recording date (first in time, first in right), unless a lienholder agrees to \u003cstrong>subordination\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>Easements\u003c/strong> — rights to use another's land: \u003cem>appurtenant\u003c/em> (benefits an adjoining parcel: dominant estate benefited, servient estate burdened; runs with the land); \u003cem>in gross\u003c/em> (benefits a person or company, e.g., utilities); \u003cem>by necessity\u003c/em> (landlocked parcel); \u003cem>by prescription\u003c/em> (\u003cstrong>20 years\u003c/strong> of open, continuous, adverse use in Florida — manual). A \u003cstrong>license\u003c/strong> is revocable permission, not an interest in land. An \u003cstrong>encroachment\u003c/strong> is a physical intrusion (a fence over the line), revealed by a \u003cstrong>survey\u003c/strong>. A \u003cstrong>deed restriction\u003c/strong> (restrictive covenant) is a private limitation binding future owners.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Taxes first, then recording order. Appurtenant = parcel to parcel; in gross = to a person/company. Prescription 20 years.\u003c/p>\n"},{"id":"L09-5","ch":"ch09","title":"Fixtures and water rights","type":"conceptual","pri":"medium","min":20,"manual":"M7 §Wills, water, and what is part of the land","pre":["L08-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Fixtures:\u003c/strong> personal property that becomes real property when attached. Tests: \u003cstrong>intent\u003c/strong> (dominant), method of annexation, adaptation to the realty, relationship of the parties. \u003cstrong>Trade fixtures\u003c/strong> installed by a business tenant remain the tenant's personal property and must be removed by lease end (if left, they become the landlord's by accession). \u003cstrong>Emblements\u003c/strong> (annual crops) are personal property; a tenant farmer may harvest crops planted before the tenancy ended.\u003c/p>\n\u003cp>\u003cstrong>Water rights:\u003c/strong> \u003cstrong>riparian\u003c/strong> (rivers and streams); \u003cstrong>littoral\u003c/strong> (oceans, seas, large lakes). Florida owns the land seaward of the mean high-water line. \u003cstrong>Accretion\u003c/strong> (gradual deposit, owner gains), \u003cstrong>erosion\u003c/strong> (gradual loss), \u003cstrong>avulsion\u003c/strong> (sudden change — boundaries do not move).\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Intent wins. Trade fixtures stay with the tenant. Gradual moves boundaries; sudden does not.\u003c/p>\n"},{"id":"L10-1","ch":"ch10","title":"The three legal description systems","type":"conceptual","pri":"high","min":25,"manual":"M7 §Legal descriptions","pre":["L09-2"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>Three legal description systems:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Metes and bounds\u003c/strong> — courses (directions) and distances from a \u003cstrong>point of beginning (POB)\u003c/strong>, returning to the POB. Used for irregular parcels.\u003c/li>\n\u003cli>\u003cstrong>Lot and block\u003c/strong> — a lot number in a block on a recorded \u003cstrong>plat\u003c/strong>. The usual description in platted urban subdivisions.\u003c/li>\n\u003cli>\u003cstrong>Government (rectangular) survey\u003c/strong> — townships and sections measured from a principal meridian and base line. Florida's intersect in \u003cstrong>Tallahassee\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003cp>A \u003cstrong>street address is never a legal description\u003c/strong>.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Metes &amp; bounds returns to the POB. Lot &amp; block needs a recorded plat. Florida's survey origin is Tallahassee.\u003c/p>\n"},{"id":"L10-2","ch":"ch10","title":"Townships, sections and land measurement","type":"calculation","pri":"high","min":35,"manual":"M7 §Legal descriptions and section arithmetic","pre":["L10-1","L14-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Townships\u003c/strong> are \u003cstrong>6 × 6 miles\u003c/strong> = 36 square miles, divided into \u003cstrong>36 sections\u003c/strong> of \u003cstrong>1 square mile = 640 acres\u003c/strong> each. Sections are numbered in a serpentine pattern starting in the \u003cstrong>northeast\u003c/strong> corner (section 1), running west to section 6, then back east, ending with section 36 in the southeast. Section 16 was traditionally reserved for schools.\u003c/p>\n\u003cp>\u003cstrong>Acreage shortcut:\u003c/strong> divide 640 by each denominator. NW¼ of the SE¼ = 640 ÷ 4 ÷ 4 = \u003cstrong>40 acres\u003c/strong>. S½ of the NE¼ = 640 ÷ 2 ÷ 4 = \u003cstrong>80 acres\u003c/strong>. \u003cstrong>AND\u003c/strong> joins separate parcels: compute each and add. \"N½ of the NW¼ AND the SW¼\" = 80 + 160 = \u003cstrong>240 acres\u003c/strong>. To locate a parcel, read the fractions right to left.\u003c/p>\n\u003cp>\u003cstrong>Conversions:\u003c/strong> 1 acre = \u003cstrong>43,560 sq ft\u003c/strong> · 1 mile = \u003cstrong>5,280 ft\u003c/strong> · 1 square yard = 9 sq ft · 1 square mile = 640 acres.\u003c/p>\n\u003cp>\u003cstrong>Metric intuition (for understanding only):\u003c/strong> 1 acre ≈ 4,047 m² ≈ 0.405 ha; 640 acres ≈ 259 ha.\u003c/p>\n\u003ch2 id=\"8-visual-explanation\">8. Visual explanation\u003c/h2>\n\u003cdiv class=\"township\">\n  \u003cdiv>6\u003c/div>\u003cdiv>5\u003c/div>\u003cdiv>4\u003c/div>\u003cdiv>3\u003c/div>\u003cdiv>2\u003c/div>\u003cdiv>1\u003c/div>\n  \u003cdiv>7\u003c/div>\u003cdiv>8\u003c/div>\u003cdiv>9\u003c/div>\u003cdiv>10\u003c/div>\u003cdiv>11\u003c/div>\u003cdiv>12\u003c/div>\n  \u003cdiv>18\u003c/div>\u003cdiv>17\u003c/div>\u003cdiv>16\u003c/div>\u003cdiv>15\u003c/div>\u003cdiv>14\u003c/div>\u003cdiv>13\u003c/div>\n  \u003cdiv>19\u003c/div>\u003cdiv>20\u003c/div>\u003cdiv>21\u003c/div>\u003cdiv>22\u003c/div>\u003cdiv>23\u003c/div>\u003cdiv>24\u003c/div>\n  \u003cdiv>30\u003c/div>\u003cdiv>29\u003c/div>\u003cdiv>28\u003c/div>\u003cdiv>27\u003c/div>\u003cdiv>26\u003c/div>\u003cdiv>25\u003c/div>\n  \u003cdiv>31\u003c/div>\u003cdiv>32\u003c/div>\u003cdiv>33\u003c/div>\u003cdiv>34\u003c/div>\u003cdiv>35\u003c/div>\u003cdiv>36\u003c/div>\n\u003c/div>\n\u003cp class=\"caption\">North is up. Section 1 is in the northeast corner, section 36 in the southeast.\u003c/p>\n\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>Dividing 43,560 by 3 instead of 9 when converting to square yards.\u003c/li>\n\u003cli>Multiplying acreages when the description says AND.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>640 per section · 36 per township · 43,560 per acre · 5,280 per mile. AND = add.\u003c/p>\n"},{"id":"L11-1","ch":"ch11","title":"Contract essentials, classifications and enforceability","type":"legal","pri":"high","min":30,"manual":"M8 §Formation and enforceability","pre":["L01-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Valid contract essentials:\u003c/strong> competent parties; offer and acceptance (mutual assent); legal purpose; consideration (the mutual promises suffice — earnest money is customary but not legally required). Manual mnemonic: C.O.L.C.\u003c/p>\n\u003cp>\u003cstrong>Classifications:\u003c/strong> bilateral (promise for a promise — a sale contract) vs unilateral (promise for an act — an option, a reward); executory (obligations remain) vs executed (fully performed); express vs implied.\u003c/p>\n\u003cp>\u003cstrong>Statute of frauds:\u003c/strong> contracts for the \u003cstrong>sale of real estate\u003c/strong>, and contracts that cannot be performed within \u003cstrong>one year\u003c/strong>, must be in writing and signed by the party to be charged. A lease of one year or less may be oral.\u003c/p>\n\u003cp>\u003cstrong>Statute of limitations (Florida):\u003c/strong> written contract \u003cstrong>5 years\u003c/strong>; oral contract \u003cstrong>4 years\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>Defects:\u003c/strong> \u003cstrong>void\u003c/strong> (no contract: illegal purpose, no genuine assent); \u003cstrong>voidable\u003c/strong> (one party may cancel: minor, fraud, duress, misrepresentation); \u003cstrong>unenforceable\u003c/strong> (valid but courts won't enforce: missing writing, time-barred).\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>C.O.L.C. Sale of land = writing. 5 written / 4 oral. Void ≠ voidable ≠ unenforceable.\u003c/p>\n"},{"id":"L11-2","ch":"ch11","title":"Offers, counteroffers, options, equitable title and remedies","type":"legal","pri":"high","min":30,"manual":"M8 §Offers, counteroffers, options","pre":["L11-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>An \u003cstrong>offer\u003c/strong> may be revoked any time before acceptance is communicated, even if the offeror promised to keep it open (unless an option was paid for). Acceptance must mirror the offer; any change is a \u003cstrong>counteroffer\u003c/strong>, which \u003cstrong>terminates the original offer\u003c/strong>. Offers also end by rejection, lapse of time, death or insanity of a party before acceptance, or destruction of the property.\u003c/p>\n\u003cp>\u003cstrong>Option contract:\u003c/strong> for consideration, the \u003cstrong>optionor\u003c/strong> (owner) is bound to sell on fixed terms during the option period; the \u003cstrong>optionee\u003c/strong> may exercise or walk away, losing only the option money. On exercise it becomes a bilateral sale contract.\u003c/p>\n\u003cp>\u003cstrong>Equitable title:\u003c/strong> the buyer's interest under a signed sale contract until legal title passes by deed at closing.\u003c/p>\n\u003cp>\u003cstrong>Remedies:\u003c/strong> specific performance (land is unique); liquidated damages (often the deposit); rescission; compensatory damages. Contracts are generally assignable unless prohibited; personal-service contracts (including listings) are not.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Counteroffer kills the offer. Optionor bound, optionee chooses. Contract → equitable title.\u003c/p>\n"},{"id":"L11-3","ch":"ch11","title":"Listing agreements","type":"legal","pri":"high","min":25,"manual":"M8 §Listings","pre":["L11-1","L04-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>A listing is an employment (personal-service) contract between the seller and the \u003cstrong>brokerage\u003c/strong>.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Open listing\u003c/strong> — any number of brokers; only the \u003cstrong>procuring cause\u003c/strong> earns the commission; the seller may sell personally free of commission.\u003c/li>\n\u003cli>\u003cstrong>Exclusive agency\u003c/strong> — one brokerage, but the seller keeps the right to sell personally without commission.\u003c/li>\n\u003cli>\u003cstrong>Exclusive right of sale\u003c/strong> — one brokerage earns the commission \u003cstrong>no matter who sells\u003c/strong>, including the seller.\u003c/li>\n\u003cli>\u003cstrong>Net listing\u003c/strong> — the broker keeps the excess over a set net price; the manual says it is legal in Florida but conflict-laden (not verified).\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Florida rules for written listings:\u003c/strong> a \u003cstrong>definite expiration date\u003c/strong>; \u003cstrong>no automatic renewal\u003c/strong>; a \u003cstrong>copy to the person signing within 24 hours\u003c/strong>. The manual states listings need not be written unless the term exceeds one year.\u003c/p>\n\u003cp>\u003cstrong>Termination:\u003c/strong> performance, expiration, mutual agreement, abandonment, destruction of the property, death or incapacity of either party. Not assignable to another brokerage without consent.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>RIGHT of sale = always paid. AGENCY = seller can sell free. Written listing: end date, no auto-renew, copy in 24 hours.\u003c/p>\n"},{"id":"L11-4","ch":"ch11","title":"Florida contract forms and required disclosures","type":"legal","pri":"high","min":30,"manual":"M8 §Inside the Florida contract forms","pre":["L11-2"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>FR/BAR contract\u003c/strong> (Florida Realtors / Florida Bar): standard residential form, with an \u003cstrong>AS IS\u003c/strong> version — the buyer takes the property in its current condition but keeps a due-diligence right to inspect and cancel; the seller's duty to disclose known latent defects survives (\u003cem>Johnson v. Davis\u003c/em>). The \u003cstrong>effective date\u003c/strong> is when the last party signs or initials the final offer/counteroffer (and it is delivered); every deadline counts from it. \u003cstrong>\"Time is of the essence\"\u003c/strong> makes deadlines strict. Common contingencies: financing, appraisal, inspection, sale of buyer's home.\u003c/p>\n\u003cp>\u003cstrong>Required disclosures around the contract:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Radon\u003c/strong> notice — every sale and rental of a building.\u003c/li>\n\u003cli>\u003cstrong>Lead-based paint\u003c/strong> — housing built before 1978 (Chapter 19).\u003c/li>\n\u003cli>\u003cstrong>Property tax disclosure\u003c/strong> — buyer should not rely on the seller's current taxes.\u003c/li>\n\u003cli>\u003cstrong>Energy-efficiency information brochure.\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>Flood disclosure (s. 689.302, V-06)\u003c/strong> — the seller of residential property gives the statutory flood disclosure form at or before contract execution (flood insurance, past claims, federal assistance, known flooding). Added by a 2024 law; the manual only mentions \"flood-zone awareness\".\u003c/li>\n\u003cli>\u003cstrong>Condominium / HOA documents and disclosure summaries.\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>Seller's property disclosure\u003c/strong> — customary; honesty is required regardless.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>AS IS shifts repairs, not disclosure. Effective date starts the clocks. Radon · lead (pre-1978) · tax · energy · flood · condo/HOA.\u003c/p>\n"},{"id":"L12-1","ch":"ch12","title":"The note, the mortgage and mortgage clauses","type":"conceptual","pri":"high","min":30,"manual":"M9 §The documents and Florida's theory","pre":["L11-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>The \u003cstrong>promissory note\u003c/strong> is the debt — the borrower's personal promise to repay (amount, rate, terms). The \u003cstrong>mortgage\u003c/strong> is the security instrument pledging the property. In US usage, \"mortgage\" means the document, not the loan.\u003c/p>\n\u003cp>Florida is a \u003cstrong>lien-theory\u003c/strong> state: the borrower (\u003cstrong>mortgagor\u003c/strong>) keeps legal title and the lender (\u003cstrong>mortgagee\u003c/strong>) holds a lien. In title-theory states the lender (or a trustee under a deed of trust) holds title. After full payment the lender must record a \u003cstrong>satisfaction of mortgage within 60 days\u003c/strong> (manual).\u003c/p>\n\u003cp>\u003cstrong>Clauses:\u003c/strong> acceleration (entire balance due on default); due-on-sale/alienation (balance due on transfer — blocks assumption without consent); prepayment (right or penalty); defeasance (lien defeated on full payment); subordination (lien accepts junior position); release (frees parcels from a blanket mortgage); receivership (receiver collects rents during foreclosure); exculpatory (no personal liability — no deficiency).\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>-or gives, -ee receives: mortgagor = borrower. Lien theory. Satisfaction in 60 days.\u003c/p>\n"},{"id":"L12-2","ch":"ch12","title":"Assumption, default and foreclosure","type":"legal","pri":"high","min":30,"manual":"M9 §Transfers, default & foreclosure","pre":["L12-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Assumption:\u003c/strong> the buyer becomes personally liable; the seller remains secondarily liable unless the lender grants a \u003cstrong>novation\u003c/strong>. \u003cstrong>Subject to:\u003c/strong> the buyer takes title and pays, but has \u003cstrong>no personal liability\u003c/strong>; on default only the original borrower faces a deficiency.\u003c/p>\n\u003cp>\u003cstrong>Florida foreclosure is judicial\u003c/strong> — a court action ending in a public sale. Until the sale, the borrower may redeem by paying in full (\u003cstrong>equity of redemption\u003c/strong>). Florida has \u003cstrong>no statutory (post-sale) redemption\u003c/strong>. If proceeds fall short, the lender may seek a \u003cstrong>deficiency judgment\u003c/strong> against personally liable parties; a surplus goes to junior lienors, then the borrower.\u003c/p>\n\u003cp>\u003cstrong>Alternatives:\u003c/strong> \u003cstrong>short sale\u003c/strong> (lender accepts less than owed); \u003cstrong>deed in lieu of foreclosure\u003c/strong> (faster, but the lender takes title \u003cstrong>subject to junior liens\u003c/strong>, which foreclosure would have eliminated).\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Assume = liable; subject to = not liable. Redeem before the sale. Deed in lieu keeps junior liens.\u003c/p>\n"},{"id":"L12-3","ch":"ch12","title":"Qualifying the borrower, usury and predatory lending","type":"calculation","pri":"high","min":30,"manual":"M9 §Qualifying the borrower","pre":["L12-1","L14-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Qualifying ratios\u003c/strong> (course conventions, not statutes):\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Housing expense ratio\u003c/strong> = monthly \u003cstrong>PITI\u003c/strong> ÷ \u003cstrong>gross\u003c/strong> monthly income — conventional benchmark \u003cstrong>28%\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Total obligations ratio\u003c/strong> = (PITI + recurring debts) ÷ gross monthly income — conventional \u003cstrong>36%\u003c/strong>; FHA \u003cstrong>31% / 43%\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003cp>Worked example (manual): income $7,500; PITI $2,025; car and cards $675. Housing 2,025 ÷ 7,500 = 27% ✓. Total 2,700 ÷ 7,500 = 36% ✓. A $750 car payment would push the total to 37%.\u003c/p>\n\u003cp>\u003cstrong>Usury (Florida):\u003c/strong> \u003cstrong>18%\u003c/strong> per year simple interest on loans of \u003cstrong>$500,000 or less\u003c/strong>; \u003cstrong>25%\u003c/strong> above that; beyond 25% is criminal usury (manual; not verified).\u003c/p>\n\u003cp>\u003cstrong>Predatory practices:\u003c/strong> equity stripping, loan flipping (repeated refinancing to collect fees), packing (hidden add-ons), balloon abuse. The \u003cstrong>SAFE Act\u003c/strong> requires mortgage loan originators to be licensed/registered (NMLS).\u003c/p>\n\u003ch2 id=\"6-portugal-comparison\">6. Portugal comparison\u003c/h2>\n\u003cp>See PT-18: Florida ratios divide by \u003cstrong>gross\u003c/strong> income.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>28/36 conventional · 31/43 FHA · gross income · PITI includes taxes and insurance. Usury 18% / 25%.\u003c/p>\n"},{"id":"L13-1","ch":"ch13","title":"FHA, VA and conventional loans","type":"conceptual","pri":"high","min":25,"manual":"M9 §Government programs","pre":["L12-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>FHA\u003c/strong> (Federal Housing Administration, part of HUD) \u003cstrong>insures\u003c/strong> loans made by approved lenders; it never lends. Borrower pays \u003cstrong>MIP\u003c/strong> (up-front and annual); minimum down payment \u003cstrong>3.5%\u003c/strong> with qualifying credit.\u003c/li>\n\u003cli>\u003cstrong>VA\u003c/strong> \u003cstrong>guarantees\u003c/strong> loans to eligible veterans; private lenders lend. The guarantee can replace a down payment (0 down possible); the borrower pays a \u003cstrong>funding fee\u003c/strong>; value is set by a \u003cstrong>Certificate of Reasonable Value (CRV)\u003c/strong> (the VA now calls it a Notice of Value; the course uses CRV).\u003c/li>\n\u003cli>\u003cstrong>Conventional\u003c/strong> loans have no government backing; above \u003cstrong>80% LTV\u003c/strong> the lender requires \u003cstrong>PMI\u003c/strong>, which can be cancelled as equity grows.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>FHA insures (MIP) · VA guarantees (funding fee) · conventional &gt;80% LTV → PMI. Government agencies never hand money to buyers.\u003c/p>\n"},{"id":"L13-2","ch":"ch13","title":"Loan types by repayment and purpose","type":"conceptual","pri":"medium","min":25,"manual":"M9 §Government programs and loan types","pre":["L13-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>By repayment:\u003c/strong> \u003cstrong>amortized\u003c/strong> (level payments; interest falls, principal rises); \u003cstrong>partially amortized\u003c/strong> with a \u003cstrong>balloon\u003c/strong> final payment; \u003cstrong>interest-only\u003c/strong> (term) loans; \u003cstrong>ARM\u003c/strong> — rate = \u003cstrong>index (moves) + margin (fixed)\u003c/strong>, limited by periodic and lifetime \u003cstrong>caps\u003c/strong>, sometimes with a teaser rate.\u003c/p>\n\u003cp>\u003cstrong>By purpose:\u003c/strong> \u003cstrong>package\u003c/strong> (real + personal property, e.g., furnished condo); \u003cstrong>blanket\u003c/strong> (several parcels, with partial \u003cstrong>release clauses\u003c/strong>); \u003cstrong>wraparound\u003c/strong> (new junior loan that includes an existing loan; the existing loan must have no due-on-sale clause); \u003cstrong>purchase-money\u003c/strong> (seller financing); \u003cstrong>home equity / HELOC\u003c/strong>; \u003cstrong>reverse mortgage\u003c/strong> (owners \u003cstrong>62+\u003c/strong>; lender pays the owner; repaid on sale, move-out or death); \u003cstrong>construction loan\u003c/strong> (draws; replaced by permanent \"take-out\" financing).\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>ARM = index + margin. Package = real + personal. Blanket = many parcels + release. Reverse = 62+.\u003c/p>\n"},{"id":"L13-3","ch":"ch13","title":"Primary and secondary markets, the Fed, and discount points","type":"conceptual","pri":"medium","min":25,"manual":"M9 §Markets, the Fed","pre":["L13-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Primary market\u003c/strong> originates loans: commercial banks, credit unions, savings associations, \u003cstrong>mortgage bankers\u003c/strong> (lend and often service) and \u003cstrong>mortgage brokers\u003c/strong> (arrange loans; lend nothing). \u003cstrong>Secondary market\u003c/strong> buys existing loans so lenders can lend again: \u003cstrong>Fannie Mae\u003c/strong> and \u003cstrong>Freddie Mac\u003c/strong> buy loans and issue mortgage-backed securities; \u003cstrong>Ginnie Mae\u003c/strong> guarantees securities backed by FHA/VA loans. \u003cstrong>Intermediation\u003c/strong>: pooling deposits for lending. \u003cstrong>Disintermediation\u003c/strong>: depositors withdraw for better returns elsewhere, starving mortgage lending.\u003c/p>\n\u003cp>\u003cstrong>The Federal Reserve\u003c/strong> influences credit with \u003cstrong>open-market operations\u003c/strong> (buying/selling government securities — the day-to-day tool), the \u003cstrong>discount rate\u003c/strong>, and \u003cstrong>reserve requirements\u003c/strong> (bluntest tool). Tight money → higher rates → slower real estate.\u003c/p>\n\u003cp>\u003cstrong>Discount points:\u003c/strong> prepaid interest paid to the lender at closing. \u003cstrong>1 point = 1% of the loan amount.\u003c/strong> Course rule of thumb: each point raises the lender's yield by about \u003cstrong>1/8%\u003c/strong>.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Consumers borrow in the primary market only. Open-market operations = everyday tool. 1 point = 1% of LOAN ≈ +1/8% yield.\u003c/p>\n"},{"id":"L14-1","ch":"ch14","title":"Math foundations: decimals, fractions, percentages and the percent triangle","type":"calculation","pri":"high","min":40,"manual":"M10 §The twelve patterns (pattern 1)","pre":[],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Step 1 — Concept.\u003c/strong> Most exam math is one idea: a \u003cstrong>part\u003c/strong> is a \u003cstrong>rate\u003c/strong> (percentage) of a \u003cstrong>total\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>Step 2 — Units.\u003c/strong> Percent means \"per hundred\": 6% = 6/100 = 0.06. To turn a percent into a decimal, move the decimal point two places left; to turn a decimal into a percent, move it two places right. Fraction → decimal: divide top by bottom (3/8 = 0.375 = 37.5%).\u003c/p>\n\u003cp>\u003cstrong>Step 3 — Formula (the percent triangle).\u003c/strong> \u003cstrong>Part = Total × Rate.\u003c/strong> Rearranged: \u003cstrong>Total = Part ÷ Rate\u003c/strong>; \u003cstrong>Rate = Part ÷ Total\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>Step 4 — Conditions.\u003c/strong> Identify which number is the \u003cem>total the percent is taken of\u003c/em>. If the percent is applied to the unknown, divide.\u003c/p>\n\u003cp>\u003cstrong>Step 5 — Worked example.\u003c/strong> A 6% commission was $9,450. Price = $9,450 ÷ 0.06 = $157,500.\u003c/p>\n\u003cp>\u003cstrong>Step 6 — Reasonableness check.\u003c/strong> A commission is a small fraction of the price: if your \"price\" is smaller than the commission, you multiplied instead of divided.\u003c/p>\n\u003cp>\u003cstrong>Step 7 — Common errors.\u003c/strong> Decimal placement (0.6 vs 0.06); using the wrong base; rounding too early.\u003c/p>\n\u003cp>\u003cstrong>Percentage change\u003c/strong> = (new − old) ÷ \u003cstrong>old\u003c/strong>. $80,000 → $92,000 is +15%; $92,000 → $80,000 is about −13%. The base changes, so the percentages differ.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Part = Total × Rate. Percent of the unknown → divide. Change ÷ original.\u003c/p>\n"},{"id":"L14-2","ch":"ch14","title":"Area, perimeter and unit conversions","type":"calculation","pri":"high","min":35,"manual":"M10 §pattern 11","pre":["L14-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Units:\
