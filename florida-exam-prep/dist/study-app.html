disclosure (40 CFR 745 Subpart F)","manual":"Housing built before 1978: disclose known lead-based paint hazards, provide the EPA pamphlet, give buyers a 10-day opportunity to inspect (may be waived); applies to sales and leases [40 CFR 745 Subpart F; 24 CFR 35]","finding":"The rule covers target housing, defined in 40 CFR 745.103 as housing built before 1978. Excluded are housing for the elderly or persons with disabilities and 0-bedroom dwellings, unless a child under 6 lives or is expected to live there. Sellers and lessors must, under 745.107: give an EPA-approved pamphlet such as 'Protect Your Family From Lead in Your Home'; disclose known lead-based paint and hazards; provide available records and reports; and disclose the same to each agent. If disclosure comes after an offer, it must be made before the seller or lessor accepts it. Under 745.113, contracts and leases must include the Lead Warning Statement and signed acknowledgments. 10-day rule (745.110): before a purchaser is bound by the contract, the seller must allow 10 days for a risk assessment or inspection, unless the parties agree in writing on a different period. The purchaser may waive the opportunity in writing. The 10-day opportunity applies to sales only; EPA says lessees get disclosure but not this period. Exemptions in 745.101 include foreclosure sales, leases of 100 days or less with no renewal, leases of housing certified lead-free, and renewals where disclosure was already made. HUD's identical rule is 24 CFR Part 35, Subpart A. Agents must ensure compliance under 745.115.","citation":"40 CFR 745.101, 745.103, 745.107, 745.110, 745.113 (Subpart F; CFR 2025 edition / eCFR current); 24 CFR Part 35 Subpart A","url":"https://www.ecfr.gov/current/title-40/chapter-I/subchapter-R/part-745/subpart-F","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"Housing built before 1978: EPA pamphlet, disclosure of known lead paint and hazards and of available reports, Lead Warning Statement. Buyers get a 10-day inspection opportunity (may be waived or changed in writing). Tenants get the disclosure but not the 10-day period."},{"id":"V-61","topic":"ECOA protected bases (15 USC 1691)","manual":"ECOA prohibits credit discrimination based on race, color, religion, national origin, sex, marital status, age (if able to contract), or receipt of public assistance income [15 USC 1691]","finding":"15 USC 1691(a) makes it unlawful for a creditor to discriminate against any applicant in any aspect of a credit transaction on three grounds: (1) race, color, religion, national origin, sex, marital status, or age, provided the applicant can contract; (2) because all or part of the applicant's income comes from a public assistance program; (3) because the applicant has in good faith exercised a right under the Consumer Credit Protection Act. The manual's list leaves out ground (3). Under 1691(b), creditors may ask about age or public assistance income to judge the amount and likely continuance of income, among other permitted uses. Regulation B (12 CFR 1002.2(z)) defines 'prohibited basis' the same way. A CFPB final rule published April 22, 2026 and effective July 21, 2026 removed the disparate-impact 'effects test' from 1002.6(a) and narrowed discouragement under 1002.4(b) to statements of intent to discriminate. It did not change the protected bases.","citation":"15 USC 1691(a)-(b) (U.S. Code, 2020 edition, govinfo); 12 CFR 1002.2(z), Regulation B (as amended eff. July 21, 2026)","url":"https://www.govinfo.gov/content/pkg/USCODE-2020-title15/pdf/USCODE-2020-title15-chap41-subchapIV-sec1691.pdf","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"Race, color, religion, national origin, sex, marital status, age (if able to contract), receipt of public assistance income, and good-faith exercise of consumer credit rights."},{"id":"V-62","topic":"Security deposit: disclosure of how it is held (s. 83.49(2))","manual":"Landlord must give the tenant written notice of how the security deposit is held within 30 days of receipt [s. 83.49(2), F.S.]","finding":"Confirmed, with qualifications. The landlord must give the tenant written notice disclosing the advance rent or security deposit either IN THE LEASE AGREEMENT or within 30 days after receiving it. The notice must: (a) be given in person or by mail, or by e-mail under s. 83.505 (e-mail added effective 7/1/2025, ch. 2025-16, and only allowed if both parties signed an e-mail addendum); (b) give the name and address of the depository holding the funds, or state that a surety bond was posted; (c) say whether the tenant is entitled to interest; and (d) contain the statutory disclosure. If the landlord later changes how or where the deposit is held, the tenant must be told within 30 days after the change. EXCEPTION: this subsection does not apply to a landlord who rents fewer than five individual dwelling units. Failure to give this notice is not a defense to paying rent when due. The older wording 'manner in which the landlord is holding' (2011 text) was replaced by the 'in the lease or within 30 days' disclosure.","citation":"s. 83.49(2), Fla. Stat. (2025; same structure in 2026 edition); s. 83.505, Fla. Stat. (2025), created by ch. 2025-16, Laws of Fla. (CS/CS/CS/HB 615)","url":"https://www.flsenate.gov/Laws/Statutes/2026/0083.49","method":"official-excerpt","checks":"double-checked","status":"confirmed","teach":"In the lease or within 30 days of receipt: where the deposit is held (or that a surety bond was posted) and whether interest is paid. Not required for landlords who rent fewer than 5 units."},{"id":"V-63","topic":"Security deposit after the tenancy ends (s. 83.49(3))","manual":"After move-out: return deposit within 15 days if no claim; otherwise certified-mail notice of intent to impose a claim within 30 days; tenant has 15 days to object; failing the 30-day notice forfeits the claim [s. 83.49(3), F.S.]","finding":"The deadlines are unchanged, but the notice method has been widened. (a) If the landlord does not intend to claim against the deposit, it must be returned, with interest if required, within 15 days after the rental agreement ends. (b) If the landlord intends to impose a claim, written notice must be given within 30 days after the agreement ends, stating the reason. It goes by certified mail to the tenant's last known mailing address OR, since 7/1/2025, by e-mail under s. 83.505 (only if both parties signed the statutory e-mail addendum and gave e-mail addresses). (c) Unless the tenant objects within 15 days after receiving the notice, the landlord may deduct the claim and must send the balance within 30 days after the date of the notice. (d) If the landlord misses the 30-day notice, the landlord forfeits the right to claim against the deposit and may not seek a setoff against it, but may sue for damages after returning the deposit. What changed: HB 615 (ch. 2025-16, effective 7/1/2025) added the e-mail option. Certified mail is no longer the only valid method.","citation":"s. 83.49(3)(a)-(c), Fla. Stat. (2025); s. 83.505, Fla. Stat. (2025); ch. 2025-16, Laws of Fla. (CS/CS/CS/HB 615, approved 5/1/2025, eff. 7/1/2025)","url":"https://www.flsenate.gov/Laws/Statutes/2025/0083.49","method":"official-excerpt","checks":"double-checked","status":"corrected","teach":"15 days to return it if there is no claim; 30 days to send notice of a claim by certified mail, or by e-mail if both parties signed the e-mail addendum (s. 83.505, since July 1, 2025); the tenant has 15 days to object; missing the 30-day notice forfeits the claim."},{"id":"V-64","topic":"Timeshare cancellation (s. 721.10)","manual":"Timeshare purchaser may cancel within 10 days; the right cannot be waived [s. 721.10, F.S.]","finding":"The purchaser may cancel the contract until midnight of the 10th CALENDAR day after the later of (a) the date the contract is signed or (b) the date the purchaser receives the last of the documents the developer must provide. No purchaser, and no one acting for the purchaser, may waive this right. Trying to obtain a waiver, or holding a closing before the cancellation period ends, is unlawful, and such a closing is voidable at the purchaser's option. The excerpts disagree on how long it stays voidable (1 year versus 5 years); this does not affect the 10-day rule.","citation":"s. 721.10(1), Fla. Stat. (2025)","url":"https://www.flsenate.gov/Laws/Statutes/2025/721.10","method":"official-excerpt","checks":"double-checked","status":"confirmed","teach":"Until midnight of the 10th calendar day after the later of signing the contract or receiving the last required document. Cannot be waived."},{"id":"V-65","topic":"HOA disclosure summary (s. 720.401)","manual":"HOA disclosure summary must be provided before contract execution; if not, the buyer may void the contract within 3 days after receipt or before closing [s. 720.401, F.S.]","finding":"Confirmed, with an added qualifier. A prospective buyer of a parcel in a community subject to a mandatory homeowners' association must receive the disclosure summary before signing the contract. If it was not provided first, the buyer may void the contract by written notice to the seller or the seller's agent within 3 days after receiving the disclosure summary or before closing, WHICHEVER OCCURS FIRST. The buyer may not waive this right, but it ends at closing. Each covered sale contract must contain a conspicuous clause describing this right. The section does not apply to associations regulated under chapters 718, 719, 721 or 723.","citation":"s. 720.401(1), Fla. Stat. (2025/2026)","url":"https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0700-0799%2F0720%2FSections%2F0720.401.html","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"Given before the contract is signed. If not, the buyer may void the contract within 3 days after receiving it or before closing, whichever occurs first. Not waivable; ends at closing."},{"id":"V-66","topic":"Homestead protection from creditors (Art. X, s. 4, Fla. Const.)","manual":"Homestead creditor protection: 1/2 acre contiguous within a municipality, 160 contiguous acres outside; exceptions for taxes and assessments, obligations for purchase, improvement or repair, and labor on the realty [Art. X, s. 4, Fla. Const.]","finding":"Homestead owned by a natural person is exempt from forced sale under court process, and no judgment, decree or execution is a lien on it. The limits: outside a municipality, up to 160 acres of contiguous land plus improvements, which cannot be reduced without the owner's consent if the land is later brought into a municipality; inside a municipality, up to one-half acre of contiguous land, with the exemption limited to the residence of the owner or the owner's family. Exceptions: taxes and assessments on the property; obligations contracted for its purchase, improvement or repair; and obligations for house, field or other labor performed on the realty. Section 222.01(5), F.S. restates the same exceptions, citing Art. X, s. 4. The section also exempts $1,000 of personal property, and the exemptions pass to the surviving spouse or heirs (s. 4(b)).","citation":"Art. X, s. 4(a)-(b), Fla. Const. (current, as published by the Florida Senate); s. 222.01(5), Fla. Stat. (2025)","url":"https://www.flsenate.gov/laws/constitution","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"Inside a municipality: 1/2 acre of contiguous land (residence only). Outside: 160 contiguous acres. No protection against property taxes and assessments, debts for purchase, improvement or repair, or labor performed on the property."},{"id":"V-67","topic":"Save Our Homes cap and portability (Art. VII, s. 4(d); s. 193.155)","manual":"Save Our Homes: homestead assessment increases capped at the lesser of 3% or CPI change; benefit portable to a new Florida homestead (limits, e.g. up to $500,000, within a set number of years) [Art. VII, s. 4, Fla. Const.; s. 193.155, F.S.]","finding":"Current law as of 2026-10-20. After the January 1 reassessment, the annual change in a homestead's assessed value may not exceed the lower of 3% of the prior year's assessed value or the percentage change in the CPI for All Urban Consumers (U.S. City Average) for the preceding calendar year. Portability: an owner who sets up a new Florida homestead may transfer the accrued SOH benefit (just value minus assessed value), up to $500,000. The new homestead must be established within 3 years after January 1 of the year the prior homestead was abandoned, and the owner must have had a homestead exemption as of January 1 of any of the 3 preceding years. The 3-year window replaced 2 years from 2021. The transfer is claimed on Form DR-501T with the homestead application. PENDING CHANGE: CS/HJR 1-F (2026 Special Session F) is on the November 3, 2026 ballot. If at least 60% of voters approve, it takes effect January 1, 2027 and would, among other things, let the full accrued SOH benefit transfer for non-school levies (no $500,000 cap for those levies). Until then, the $500,000 cap and the 3%/CPI cap remain current. A 2026 House analysis of HB 7031 also mentions possible changes to which prior homestead can be ported from; its enactment status was not verified.","citation":"Art. VII, s. 4(d), Fla. Const.; s. 193.155(1) and (8), Fla. Stat. (2026); Fla. Dept. of Revenue brochure PT-112; CS/HJR 1-F (2026F) staff analysis","url":"https://www.flsenate.gov/Laws/Statutes/2026/193.155","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"Homestead assessed value rises no more than 3% or the CPI change, whichever is lower. Portability: up to $500,000 of the benefit moves to a new Florida homestead established within 3 years after January 1 of the year the old one was abandoned. A November 2026 ballot measure (V-23) could change this from 2027."},{"id":"V-68","topic":"Adverse possession (ss. 95.16, 95.18)","manual":"Adverse possession in Florida: 7 years of continuous possession under color of title, or without color of title with payment of taxes and a return filed with the property appraiser [ss. 95.16, 95.18, F.S.]","finding":"WITH COLOR OF TITLE (s. 95.16): the possessor entered under a claim of title founded on a written instrument (a conveyance), decree or judgment, and has been in continued possession for 7 years of the property included in it. For possession beginning after December 31, 1945, the instrument must be recorded with the clerk of the circuit court in the county where the land lies. Land counts as possessed if it is usually cultivated or improved, or protected by a substantial enclosure. WITHOUT COLOR OF TITLE (s. 95.18): 7 years of actual continued possession under a claim of title exclusive of any other right, not founded on a written instrument. The possessor must: (a) pay all outstanding taxes and matured installments of special improvement liens within 1 year after entering possession; (b) file a return with the county property appraiser within 30 days after making that payment, on the DOR form with a legal description and a notarized attestation; and (c) keep paying all taxes and liens for the rest of the 7-year period. Only the land actually possessed (enclosed, cultivated, maintained or improved) is held adversely.","citation":"ss. 95.16 and 95.18, Fla. Stat. (2025; 95.18 also shown in 2026 edition)","url":"https://www.flsenate.gov/Laws/Statutes/2025/95.18","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"7 years of continuous possession. With color of title: under a recorded written instrument. Without color of title: pay the taxes within 1 year of entering, file a return with the property appraiser within 30 days after paying, and keep paying the taxes."},{"id":"V-69","topic":"Prescriptive easement (Florida case law)","manual":"A prescriptive easement in Florida requires 20 years of continuous, open, adverse use [Florida case law / s. 95.14?]","finding":"Confirmed as case law; no statute sets this period, and s. 95.14 is not the source. Official Florida legislative staff analyses state that a prescriptive easement requires: actual, continuous and uninterrupted use of a limited and defined area of land for 20 years; use under a claim of right that conflicts with the owner's use, without the owner's consent; and the owner's actual knowledge, or use so open, notorious and visible that knowledge is imputed. A 2013 House analysis notes that when the adverse possession period was cut to 7 years, the prescriptive easement period stayed at 20 years. Florida courts disfavor acquiring rights by prescription and resolve doubts in the owner's favor. The leading case usually cited is Downing v. Bird, 100 So. 2d 57 (Fla. 1958), but its holding was not read directly.","citation":"Florida common law, as summarized in the Fla. House staff analysis of HB 799 (2024); Fla. Senate analysis of SB 1142 (2011); House final analysis of HB 903 (2013)","url":"https://www.flsenate.gov/Session/Bill/2024/799/Analyses/h0799e.JDC.PDF","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"20 years of continuous, open, adverse use without the owner's consent. This comes from case law, not a statute."},{"id":"V-70","topic":"Statute of limitations on contracts (s. 95.11)","manual":"Statute of limitations: action on a written contract 5 years; oral contract 4 years [s. 95.11(2)(b), (3), F.S.]","finding":"WITHIN 5 YEARS (s. 95.11(2)(b)): a legal or equitable action on a contract, obligation or liability founded on a written instrument. Exceptions: claims on payment bonds follow their own provisions, and deficiency judgments are governed by a separate paragraph. WITHIN 4 YEARS (s. 95.11(3)): a legal or equitable action on a contract, obligation or liability NOT founded on a written instrument, including actions for the sale and delivery of goods, wares and merchandise, and on store accounts. This is paragraph (3)(j) in the 2025 compilation according to the search excerpt; the lettering changed after 2023 amendments, so cite only subsection (3) unless verified.","citation":"s. 95.11(2)(b) and (3), Fla. Stat. (2025/2026)","url":"https://www.flsenate.gov/Laws/Statutes/2025/0095.11","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"Written contract: 5 years. Oral contract: 4 years."},{"id":"V-71","topic":"Satisfaction of mortgage (s. 701.04)","manual":"Mortgagee must record a satisfaction within 60 days after full payment [s. 701.04, F.S.]","finding":"Within 60 days after receiving full payment of the mortgage (current text also covers payment of the payoff amount in an estoppel letter), the mortgagee, holder or servicer must: sign a written satisfaction or release; have it acknowledged; record it in the county official records; and send the recorded satisfaction to the mortgagor or record owner. The prevailing party in a suit to enforce this recovers attorney fees and costs. Subsection (3) sets a parallel 60-day duty to record satisfactions of liens and judgments after full payment.","citation":"s. 701.04(2)-(3), Fla. Stat. (2025/2026)","url":"https://www.leg.state.fl.us/Statutes/index.cfm?App_mode=Display_Statute&URL=0700-0799%2F0701%2FSections%2F0701.04.html","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"The lender records the satisfaction within 60 days after full payment and sends it to the borrower."},{"id":"V-72","topic":"Usury (ss. 687.02, 687.03, 687.071)","manual":"Usury: 18% per annum simple interest on loans of $500,000 or less; 25% on larger loans; criminal usury above 25% (45% felony) [ss. 687.02, 687.03, 687.071, F.S.]","finding":"Interest above the equivalent of 18% per annum simple interest is usurious and unlawful (ss. 687.02(1), 687.03(1)). For a loan, advance, line of credit or forbearance over $500,000, interest is not usurious unless it exceeds the rate in s. 687.071, which in effect makes the ceiling 25%. A loan counts as over $500,000 if the principal initially exceeds that amount or may reasonably be expected to exceed it during the term (s. 687.03(3)). CRIMINAL USURY (s. 687.071), unless otherwise allowed by law: willfully and knowingly charging more than 25% but not more than 45% per annum is a second-degree misdemeanor (subs. (2)); more than 45% per annum is a third-degree felony (subs. (3)); knowingly making an extortionate extension of credit is a second-degree felony (subs. (4)). Credit extended in violation of s. 687.071 is not an enforceable debt in Florida. The 2026 edition shows the same subsection (2) wording.","citation":"ss. 687.02(1), 687.03(1) and (3), 687.071(2)-(4), Fla. Stat. (2025; 2026 unchanged per excerpt)","url":"https://www.flsenate.gov/Laws/Statutes/2025/687.071","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"18% simple interest for loans of $500,000 or less; 25% for larger loans. Criminal usury: more than 25% up to 45% = misdemeanor; more than 45% = felony."},{"id":"V-73","topic":"Radon gas notification (s. 404.056(5))","manual":"Radon gas notification must be provided at or before contract for sale or rental of any building [s. 404.056(5), F.S.]","finding":"Under the heading 'Notification on real estate documents,' the notice must appear on at least one document, form, or application signed at or before the contract for sale and purchase of any building, or at or before signing a rental agreement for any building. The statute sets the exact notice wording: radon is a naturally occurring radioactive gas that can present health risks when it builds up in a building in sufficient quantities over time; radon levels above federal and state guidelines have been found in Florida buildings; more information on radon and radon testing is available from the county health department. Use the statutory text word for word, not a paraphrase. The leg.state.fl.us page labeled 2026 carries this subsection (5) text. The 2025 flsenate.gov excerpt was cut off before subsection (5), but the 2010, 2014, and 2026 texts are the same.","citation":"s. 404.056(5), Florida Statutes (2026 edition on Online Sunshine; 2025 edition on flsenate.gov)","url":"https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499%2F0404%2FSections%2F0404.056.html","method":"official-excerpt","checks":"double-checked","status":"confirmed","teach":"The statutory radon notice appears on at least one document signed at or before a sale contract or rental agreement for any building."},{"id":"V-74","topic":"Energy-efficiency rating information (s. 553.996)","manual":"Prospective purchaser of real property with a building for occupancy must receive the energy-efficiency rating information brochure at or before contract [s. 553.996, F.S.]","finding":"The current s. 553.996 is titled 'Energy-efficiency information provided by building energy-efficiency rating systems providers.' It requires that a prospective purchaser of real property with a building for occupancy on it be given energy-efficiency information at or before signing the contract for sale and purchase. The information tells the buyer of the option to have the building's energy-efficiency rated. Its content covers how to analyze the rating, comparisons to statewide averages for new and existing construction of that class, and ways to improve the rating. For residential buyers it adds a notice that a rating may qualify them for an energy-efficient mortgage from lending institutions. Qualification on wording: the timing rule ('at or before' the contract) and the trigger are the same as before. The current statute says 'information' prepared and distributed by building energy-efficiency rating system providers, not a free 'information brochure' prepared by the department as in older editions (e.g., 2012). The 2021 and 2025 texts already use the provider wording. Calling it a 'brochure' is outdated terminology, but the operative rule is unchanged.","citation":"s. 553.996, Florida Statutes (2025; also 2021 edition)","url":"https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0500-0599%2F0553%2FSections%2F0553.996.html","method":"official-excerpt","checks":"double-checked","status":"confirmed","teach":"The buyer of a building receives information on the option of an energy-efficiency rating at or before signing the contract. Older books call it a 'brochure'."},{"id":"V-75","topic":"Property tax disclosure summary (s. 689.261)","manual":"Property tax disclosure summary required in residential sale contracts: buyer should not rely on seller's current taxes [s. 689.261, F.S.]","finding":"s. 689.261(1): a prospective purchaser of residential property must be given a disclosure summary at or before signing the contract for sale. The summary may be separate or included in the contract, and either way must be substantially similar to the statutory 'PROPERTY TAX DISCLOSURE SUMMARY.' That form warns the buyer not to rely on the seller's current property taxes as the amount the buyer will owe in the year after purchase, and states that a change of ownership or property improvements triggers reassessments that could result in higher property taxes. Unless the summary is included in the contract, the seller must provide it. If it is not in the contract, the contract must refer to it and incorporate it by reference, and must say in prominent language that the buyer should not sign the contract until reading the summary. 2026 update (does not change this rule): the 2026 Florida Statutes text of s. 689.261, from 2026 CS/SB 856, adds listing-platform rules. Beginning February 1, 2027, any residential property shown on an online listing platform must include estimated ad valorem taxes, calculated by DOR formula or the countywide average millage rate, with a disclaimer. Such platforms may not show the current owner's taxes unless they use a qualifying estimator, and must link to the property appraiser's estimator. The current owner's taxes may not appear in printed listing materials.","citation":"s. 689.261, Florida Statutes (2025; 2026 edition adds new listing-platform subsection effective Feb. 1, 2027)","url":"https://www.flsenate.gov/Laws/Statutes/2025/689.261","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"Buyer of residential property receives the summary at or before contract: do not rely on the seller's current taxes; a sale or improvements can raise the assessment."},{"id":"V-76","topic":"Property tax calendar (ss. 192.042, 200.065, 197.162, 197.333)","manual":"Assessment date January 1; TRIM notice in August; tax bills from November 1 with 4/3/2/1% discounts Nov-Feb; delinquent April 1 [ss. 192.042, 200.069, 197.162, 197.333, F.S.]","finding":"Assessment: real property is assessed as of January 1 each year. Improvements not substantially completed on January 1 get no value (s. 192.042(1), 2025; same in the 2026 text). TRIM: the property appraiser must mail the Notice of Proposed Property Taxes (TRIM notice, form under s. 200.069) within 55 days after certification of value (s. 200.065(2)(b)). With the usual July 1 certification, DOR's calendars set the deadline at August 24. A state of emergency allows a 30-day extension. Note that the timing rule is in s. 200.065(2)(b); s. 200.069 sets the notice's content. Due date: taxes are due and payable November 1, or as soon after as the tax collector receives the certified roll (s. 197.333). Discounts (s. 197.162): 4% in November or within 30 days after the original tax notice is sent; 3% in December; 2% in January; 1% in February; 0% in March. A period ending on a weekend or holiday extends to the next working day. Delinquency: taxes become delinquent April 1 of the year after assessment, or 60 days after the original tax notice was mailed, whichever is later (s. 197.333).","citation":"ss. 192.042(1), 200.065(2)(b), 200.069, 197.162(1), 197.333, Florida Statutes (2025; 2026 text same for 192.042, 197.162 and 197.333); Fla. DOR Property Appraiser and TRIM calendars","url":"https://www.flsenate.gov/Laws/Statutes/2025/0197.333","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"Assessed as of January 1; TRIM notice mailed within 55 days after certification (usually August); due November 1; discounts 4% / 3% / 2% / 1% in November–February; delinquent April 1 (or 60 days after the bill was mailed, if later)."},{"id":"V-77","topic":"Depreciation periods (26 USC 168; IRS Pub. 946)","manual":"Straight-line recovery periods: residential rental property 27.5 years, nonresidential real property 39 years; land not depreciable [IRS Publication 946; 26 USC 168]","finding":"Under GDS (MACRS), the recovery period is 27.5 years for residential rental property and 39 years for nonresidential real property. Both use the straight-line method and the mid-month convention (26 U.S.C. 168(b)(3), (c), (d)(2); IRS Pub. 946 (2025)). Residential rental property means a building where 80% or more of gross rental income comes from dwelling units. Nonresidential real property is section 1250 property that is neither residential rental property nor property with a class life under 27.5 years. The 39-year period replaced 31.5 years in 1993 (Pub. L. 103-66). Under ADS the periods are 30 years (residential rental) and 40 years (nonresidential). Pub. 946 says land is not depreciable because it does not wear out, become obsolete, or get used up, so only the building's cost goes into the depreciable basis.","citation":"26 U.S.C. 168(c) (U.S. Code 2024 ed., govinfo); IRS Publication 946 (2025), How To Depreciate Property; Instructions for Form 4562 (2025)","url":"https://www.irs.gov/publications/p946","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"Residential rental: 27.5 years. Nonresidential: 39 years. Straight-line. Land is never depreciated."},{"id":"V-78","topic":"Home sale gain exclusion (26 USC 121; IRS Pub. 523)","manual":"Exclusion of gain on sale of principal residence: $250,000 single, $500,000 married filing jointly, if owned and used as main home 2 of the last 5 years [IRS Publication 523; 26 USC 121]","finding":"IRS Pub. 523 (2025) and Topic No. 701: a seller can exclude up to $250,000 of gain, or up to $500,000 for married filing jointly, if they owned and used the home as their principal residence for at least 2 of the 5 years before the sale (24 full months or 730 days; the periods need not be continuous). Qualifications: (1) the exclusion is generally not available if the seller excluded gain on another home sold within the 2 years before this sale; (2) for the $500,000 joint amount, at least one spouse must meet the ownership test and both must meet the use test and the look-back rule; otherwise each spouse is tested separately; (3) a partial exclusion may apply if the tests are failed for qualifying reasons (work, health, unforeseen circumstances); (4) gain equal to depreciation claimed or allowable after May 6, 1997 cannot be excluded; (5) a surviving spouse may use $500,000 if the sale is within 2 years of the spouse's death and other conditions are met. The search budget ran out before I could pull the 26 U.S.C. 121 statutory text directly. This confirmation rests on the official IRS publication excerpts, and I could not check for any 2026 statutory change.","citation":"IRS Publication 523 (2025), Selling Your Home; IRS Tax Topic No. 701; 26 U.S.C. 121(a)-(b)","url":"https://www.irs.gov/publications/p523","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"$250,000 single, $500,000 married filing jointly; owned and used as the main home 2 of the 5 years before the sale; generally not if used on another home within the last 2 years."},{"id":"V-79","topic":"Proration conventions (365-day year; who owns the closing day)","manual":"Florida prelicense convention: 365-day year and buyer responsible for the day of closing (the FR/BAR contract prorates through the day prior to closing) [FR/BAR contract; not a statute (report as unresolved if no official source)]","finding":"No official government source was found or checked. This is a private-contract and course convention: the Florida Realtors/Florida Bar (FR/BAR) contract is a privately published form, not a statute or FAC rule, so no official domain would state it as law. The 365-day-year method and buyer-owns-closing-day convention can only be verified against the current FR/BAR contract text, which is not on an allowed official domain. The shared web-search budget also ran out before any search for this item could run. Keep it labeled as a course and contract convention, not a legal rule.","citation":"None (FR/BAR 'AS IS' Residential Contract for Sale and Purchase is a private form; no Florida Statute or FAC rule identified)","url":"","method":"searched: no official source exists","checks":"double-checked","status":"unresolved","teach":"No statute or rule sets these; they come from the contract and the course. Follow the method the question gives; otherwise use the course convention (365-day year, buyer owns the day of closing). The FREC syllabus expects both the 360- and 365-day methods."},{"id":"V-80","topic":"Exam retakes, reviews and pilot questions","manual":"Retake and scheduling rules for the sales associate exam (waiting period, fees), and whether the exam includes unscored pretest items","finding":"PARTLY CONFIRMED. (1) Pretest items: the January 2025 Sales Associate booklet says pilot (experimental) questions may be included. If they are, they are NOT counted toward the score, and candidates get extra time to answer them. They are used to build the question bank for future exams. (2) Passing: graded on 100 points; 75 or higher passes. (3) Scheduling: to cancel, candidates must contact Pearson VUE at least 2 days before the appointment. Cancelling later or not showing up can forfeit exam fees. (4) Review: a failed candidate may review the questions they missed at a Pearson VUE center, usually with half the exam time. The request must come within 21 days of the grade release, and only the most recent failed exam qualifies. A candidate who files a challenge must wait until the challenge results are official before taking another exam. (5) Time limits: the s. 475.175, F.S. excerpts seen (2024 and 2026 compilations; 2025 wording not retrieved separately) say the application expires 2 years after receipt if the applicant has not passed the exam. They also say the course completion becomes invalid for licensure if the exam is not passed within 2 years of completing the course. UNRESOLVED: (a) Waiting period: no official source states a mandatory waiting period between state-exam attempts or a cap on attempts. The only 30-day wait found applies to the prelicense end-of-course exam (Rule 61J2-3.008, from 2017 FREC meeting material), not the state exam. (b) Fees: the 2016 DBPR CBT fee table lists Real Estate Sales Associate at 3.5 hours, with a $36.75 Pearson VUE administration fee and a $35.00 review fee. The booklet says CBT exam fees went up effective January 3, 2023, and links to an updated fee table that could not be retrieved, so the current retake fee is unverified. The statute caps the initial application-plus-exam fee at $100 (s. 475.125). No Pearson VUE page was checked because pearsonvue.com is not on the allowed official-domain list.","citation":"Florida DBPR, Candidate Information Booklet: Real Estate Sales Associate Examination (eff. Jan 2025); DBPR CBT Examination Administration and Review Fees (2016); s. 475.175, Fla. Stat. (2024/2026 compilations); DBPR Examination Reviews and Hearings page","url":"https://www2.myfloridalicense.com/servop/testing/documents/RE_sales_cibs.pdf","method":"official-excerpt","checks":"double-checked","status":"unresolved","teach":"Pilot questions may appear; they are not scored and come with extra time. Cancel at least 2 days before the appointment. Review of a failed exam: request within 21 days. No official waiting period or attempt limit was found; the current retake fee was not verified."}],"manualCoverage":[["M0 How to use this manual","Not taught (study instructions). Exam format statements verified in V-01."],["M1 Who needs a license","L02-1, L02-2"],["M1 Qualifying and applying","L02-3"],["M1 Keeping the license alive","L03-3, L03-4"],["M1 FREC and DBPR","L03-1"],["M1 License categories, registration, broker path","L03-2, L02-3 (mutual recognition)"],["M1 Status map","L03-3, L03-4"],["M2 The three relationships","L04-1"],["M2 The duty lists","L04-2"],["M2 Disclosures, transitions, scope","L04-3"],["M2 Duties that never go away","L04-4"],["M2 Designated sales associates","L04-4"],["M2 How relationships begin and end","L04-4"],["M3 Escrow accounts and the deposit clock","L05-1"],["M3 Conflicting demands and M.A.L.E.","L05-2"],["M3 Advertising","L05-3"],["M3 Offices, signs, and who may be paid","L05-4"],["M3 Rental lists, kickbacks, paycheck","L05-4"],["M4 The complaint pipeline","L06-1"],["M4 The penalty menu","L06-2"],["M4 The Real Estate Recovery Fund","L06-3"],["M4 Violation vocabulary","L06-2"],["M5 Fair housing","L07-1"],["M5 RESPA and TILA","L07-3"],["M5 Landlord and Tenant Act","L07-4"],["M5 Telemarketing","L07-2"],["M5 ECOA, ADA","L07-2"],["M6 Freehold estates","L08-1, L08-2"],["M6 Co-ownership","L08-3"],["M6 Florida homestead","L08-4 (protection), L18-2 (tax exemption)"],["M6 Condominiums, cooperatives, timeshares, HOAs","L08-5"],["M6 Leases as instruments","L08-2"],["M7 Acquiring and conveying title","L09-1, L08-1 (bundle of rights)"],["M7 Deeds","L09-2"],["M7 Notice, recording, title evidence","L09-3"],["M7 Encumbrances","L09-4"],["M7 Legal descriptions and section arithmetic","L10-1, L10-2"],["M7 Wills, water, fixtures","L09-1 (wills), L09-5"],["M8 Formation and enforceability","L11-1"],["M8 Offers, counteroffers, options","L11-2"],["M8 Listings","L11-3"],["M8 Inside the Florida contract forms","L11-4"],["M9 Documents and Florida's theory","L12-1"],["M9 Transfers, default & foreclosure","L12-2"],["M9 Government programs and loan types","L13-1, L13-2"],["M9 Markets, the Fed, cost of money","L13-3"],["M9 Qualifying the borrower","L12-3"],["M10 Transfer taxes","L14-6"],["M10 Prorations","L14-7"],["M10 Closing statement","L14-8"],["M10 The twelve patterns","L14-1 … L14-5, L16-4, L18-2, L10-2"],["M10 Two more patterns","L14-4, L14-7"],["M11 Market characteristics and value","L15-1, L16-1"],["M11 The three approaches","L16-2, L16-3, L16-4"],["M11 Who may appraise","L16-4"],["M11 CMA vs BPO vs appraisal","L15-1, L16-2"],["M12 Investment analysis and business brokerage","L17-1, L17-2, L18-3"],["M12 Property taxation in Florida","L18-1, L18-2"],["M12 Planning, zoning, and building","L19-1"],["M12 Environmental law","L19-2"],["M12 Installment sales, boot","L18-3"],["M13 The 100% Protocol","Not taught as content; its error-log and mock-exam ideas are built into the app (mistake log, Mode H)."],["Appendix: Every number","Numbers database (all entries cross-checked against V-log)"]]}</script>
<script>
(() => {
"use strict";

// ═════════════════════════════════════════════════════════════════════
// Data & indexes
// ═════════════════════════════════════════════════════════════════════
const DATA = JSON.parse(document.getElementById("app-data").textContent);
const CH = new Map(DATA.chapters.map((c) => [c.id, c]));
const LS_ = new Map(DATA.lessons.map((l) => [l.id, l]));
const Q = new Map(DATA.questions.map((q) => [q.id, q]));
const FC = new Map(DATA.flashcards.map((f) => [f.id, f]));
const NUM = new Map(DATA.numbers.map((n) => [n.id, n]));
const VER = new Map(DATA.verification.map((v) => [v.id, v]));
const OBJ = new Map(DATA.objectives.map((o) => [o.id, o]));
const objOf = (q) => `O-${q.l}-${q.o + 1}`;
const qByLesson = group(DATA.questions, (q) => q.l);
const qByObj = group(DATA.questions, objOf);
const fcByLesson = group(DATA.flashcards, (f) => f.l);
const lessonsByCh = group(DATA.lessons, (l) => l.ch);
const objByLesson = group(DATA.objectives, (o) => o.l);
const chOfLesson = (lid) => LS_.get(lid)?.ch;
const CALC_LESSONS = DATA.lessons.filter((l) => l.type === "calculation").map((l) => l.id);

const STATUS = ["NOT_STARTED", "INTRODUCED", "DEVELOPING", "NEEDS_REVIEW", "PROFICIENT", "EXAM_READY"];

// Utilities

// ═════════════════════════════════════════════════════════════════════
// State & persistence
// ═════════════════════════════════════════════════════════════════════
const LS_KEY = "flexam.v1";
const blank = () => ({ v: 1, settings: { examDate: "", dailyMinutes: "", newCardsPerDay: 15 }, lessons: {}, items: {}, mistakes: {}, sessions: [], attempts: [], days: {}, updated: 0 });
let S = blank();
let live = null; // active quiz / card / exam session (in memory, mirrored to localStorage)

function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }

function mergeState(a, b) {

  const out = blank();

  out.lessons = { ...a.lessons, ...b.lessons };

  for (const src of [a.mistakes, b.mistakes]) for (const [k, v] of Object.entries(src || {})) if (!out.mistakes[k] || (v.last || 0) > (out.mistakes[k].last || 0)) out.mistakes[k] = v;
  const att = new Map(); for (const x of [...(a.attempts || []), ...(b.attempts || [])]) att.set(x.id, x);
  out.attempts = [...att.values()].sort((x, y) => x.t - y.t).slice(-8000);
  const ses = new Map(); for (const x of [...(a.sessions || []), ...(b.sessions || [])]) ses.set(x.id, x);
  out.sessions = [...ses.values()].sort((x, y) => x.started - y.started).slice(-300);
  out.days = { ...a.days }; for (const [k, v] of Object.entries(b.days || {})) out.days[k] = Math.max(out.days[k] || 0, v);
  out.updated = Math.max(a.updated || 0, b.updated || 0);
  return out;
}

const Store = {
  mode: "starting", db: null, dirty: new Set(), busy: new Set(), timer: null, dl: null,
  async init() {
    const raw = lsGet(LS_KEY);
    if (raw) { try { S = mergeState(blank(), JSON.parse(raw)); } catch { /* ignore corrupt local copy */ } }
    try { const l = lsGet(LS_KEY + ".live"); if (l) live = JSON.parse(l); } catch { live = null; }
    this.mode = raw !== null || lsSet(LS_KEY + ".probe", "1") ? "local" : "memory";
    paintStore(); route();
    let db = null;
    try { db = window.claude?.use ? await window.claude.use("db") : null; } catch { db = null; }
    if (db) {
      try { await this.loadRemote(db); this.db = db; this.mode = "cloud"; }
      catch (e) { console.warn("db load failed", e); }
    }
    try { this.dl = window.claude?.use ? await window.claude.use("downloads") : null; } catch { this.dl = null; }
    paintStore(); route();
  },
  async loadRemote(db) {
    const [core, iq, ifc, mk] = await Promise.all(["progress/core", "progress/itemsQ", "progress/itemsF", "progress/mistakes"].map((p) => db.doc(p).get()));
    const [att, ses] = await Promise.all([db.collection("attempts").get(), db.collection("sessions").get()]);
    const remote = blank();
    if (core.exists) Object.assign(remote, core.data(), { items: {}, mistakes: {}, attempts: [], sessions: [] });
    if (iq.exists) Object.assign(remote.items, iq.data().items || {});
    if (ifc.exists) Object.assign(remote.items, ifc.data().items || {});
    if (mk.exists) remote.mistakes = { ...(mk.data().mistakes || {}) };
    for (const d of att.docs) remote.attempts.push(...((d.data().list) || []));
    for (const d of ses.docs) remote.sessions.push(d.data());
    const hadLocal = S.attempts.length || Object.keys(S.lessons).length;
    S = mergeState(remote, S);
    if (hadLocal || !core.exists) {
      // push anything that exists only locally
      ["core", "itemsQ", "itemsF", "mistakes"].forEach((k) => this.dirty.add(k));
      for (const k of uniq(S.attempts.map((a) => dayKey(a.t)))) this.dirty.add("att:" + k);
      for (const s of S.sessions) this.dirty.add("ses:" + s.id);
      this.flushSoon();
    }
  },
  touch(...keys) {

    keys.forEach((k) => this.dirty.add(k));

    if (!lsSet(LS_KEY, JSON.stringify(S)) && this.mode === "local") { this.mode = "memory"; paintStore(); }
    this.flushSoon();
  },
  flushSoon() { if (!this.db) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 1200); },
  payload(k) {

    if (k === "mistakes") return { mistakes: S.mistakes };
    if (k.startsWith("att:")) { const d = k.slice(4); return { day: d, list: S.attempts.filter((a) => dayKey(a.t) === d) }; }
    if (k.startsWith("ses:")) return S.sessions.find((s) => s.id === k.slice(4)) || null;
    return null;
  },
  path(k) { if (k.startsWith("att:")) return "attempts/" + k.slice(4); if (k.startsWith("ses:")) return "sessions/" + k.slice(4); return "progress/" + k; },
  async flush() {

    for (const k of [...this.dirty]) {
      if (this.busy.has(k)) continue; // one write at a time per document
      this.dirty.delete(k); this.busy.add(k);
      const body = this.payload(k);
      try { if (body) await this.db.doc(this.path(k)).set(body); }
      catch (e) {
        console.warn("save failed", k, e);
        if (e?.code === "unavailable") this.dirty.add(k);
        else if (e?.code === "invalid_argument" || e?.code === "revoked" || e?.code === "not_granted") {

          this.db = null; this.mode = "local"; paintStore(); toast("Progress is being saved in this browser only."); return;
        }

      } finally { this.busy.delete(k); }
    }
    if (this.dirty.size) this.flushSoon();
  },
  saveLive() { lsSet(LS_KEY + ".live", live ? JSON.stringify(live) : ""); },
};

// push pending cloud writes immediately when the page is hidden or closed
const flushNow = () => { if (Store.db && Store.dirty.size) { clearTimeout(Store.timer); Store.flush(); } };
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushNow(); });
window.addEventListener("pagehide", flushNow);

function paintStore() {
  const el = $("#store");
  const m = { cloud: ["Saved to your account", "ok"], local: ["Saved in this browser", "local"], memory: ["Not saved — export a backup", "local"], starting: ["Loading…", ""] }[Store.mode];
  el.textContent = m[0]; el.className = "store-pill " + m[1];

// ═════════════════════════════════════════════════════════════════════
// Scheduling (spaced repetition) & mastery
// ═════════════════════════════════════════════════════════════════════
const STEPS = [10 / 1440, 1, 3, 7, 14, 30, 60]; // days: same session, 1, 3, 7, 14, 30, 60
function daysToExam() { const d = S.settings.examDate; if (!d) return null; return Math.ceil((new Date(d + "T09:00:00").getTime() - now()) / DAY); }

  let step = Math.max(it.step, 0), ivl;

  else if (result === "guess") { step = Math.min(step, 1); ivl = 1; }
  else if (result === "hard") { step = Math.min(step + 1, STEPS.length - 1); ivl = Math.max(1, STEPS[step] * 0.5); }
  else { step = Math.min(step + (lastGood ? 2 : 1), STEPS.length - 1); ivl = STEPS[step]; }
  if (result !== "wrong") ivl = capInterval(ivl);
  it.step = step; it.reps++; it.last = now(); it.due = now() + ivl * DAY; it.hist = [...it.hist, [now(), result]].slice(-6);
  if (!it.first) it.first = now();
  S.items[id] = it;
}
const isDue = (id) => { const it = S.items[id]; return it && it.due <= now(); };
function dueQuestions() { return DATA.questions.filter((q) => isDue(q.id)).sort((a, b) => S.items[a.id].due - S.items[b.id].due); }
function studiedLessons() { return DATA.lessons.filter((l) => S.lessons[l.id]?.read).map((l) => l.id); }
function newCardsToday() { const k = dayKey(); return Object.entries(S.items).filter(([id, it]) => id[0] === "F" && dayKey(it.first) === k).length; }
function dueCards() {
  const due = DATA.flashcards.filter((f) => isDue(f.id)).sort((a, b) => S.items[a.id].due - S.items[b.id].due);
  const studied = new Set(studiedLessons());
  const room = Math.max(0, (Number(S.settings.newCardsPerDay) || 15) - newCardsToday());
  const fresh = DATA.flashcards.filter((f) => studied.has(f.l) && !S.items[f.id]).slice(0, room);
  return { due, fresh };
}

let _memo = null;
function memo() {
  if (_memo) return _memo;
  const byObj = new Map();
  for (const a of S.attempts) { const q = Q.get(a.q); if (!q) continue; const k = objOf(q); if (!byObj.has(k)) byObj.set(k, []); byObj.get(k).push(a); }
  const status = new Map();
  for (const o of DATA.objectives) status.set(o.id, objStatusFrom(o, byObj.get(o.id) || []));
  _memo = { byObj, status };
  return _memo;
}
const invalidate = () => { _memo = null; };
function objStatusFrom(o, list) {
  const studied = !!S.lessons[o.l]?.read;
  if (!list.length) return studied ? "INTRODUCED" : "NOT_STARTED";
  const indep = list.filter((a) => a.ok && a.c !== "g");
  const last = list[list.length - 1];
  const recent = list.slice(-4);
  const last3 = list.slice(-3);
  if (!last.ok || last3.some((a) => !a.ok && a.c === "s") || recent.filter((a) => !a.ok).length >= 2) return list.length < 2 ? "DEVELOPING" : "NEEDS_REVIEW";
  const recentIndep = recent.filter((a) => a.ok && a.c !== "g");
  const distinctQ = uniq(recentIndep.map((a) => a.q)).length;
  const proficient = recentIndep.length >= 3 && distinctQ >= 2 && last.ok;
  if (proficient) {
    const days = uniq(indep.map((a) => dayKey(a.t))).sort();
    const spread = days.length >= 2 && (new Date(days[days.length - 1]) - new Date(days[0])) / DAY >= 2;
    const mixed = indep.some((a) => MIXED_MODES.has(a.m));
    if (spread && mixed && indep.length >= 4 && !last3.some((a) => !a.ok)) return "EXAM_READY";

}
const objStatus = (oid) => memo().status.get(oid);
function statusCounts(objs) { const c = Object.fromEntries(STATUS.map((s) => [s, 0])); for (const o of objs) c[objStatus(o.id)]++; return c; }
function lessonStatus(lid) {
  const objs = objByLesson.get(lid) || [];
  const c = statusCounts(objs);
  if (c.NEEDS_REVIEW) return "NEEDS_REVIEW";
  if (c.EXAM_READY === objs.length) return "EXAM_READY";
  if (c.PROFICIENT + c.EXAM_READY === objs.length) return "PROFICIENT";
  if (c.NOT_STARTED === objs.length) return "NOT_STARTED";
  if (c.DEVELOPING || c.PROFICIENT || c.EXAM_READY) return "DEVELOPING";
  return "INTRODUCED";
}
function statusBar(counts) {
  const total = Object.values(counts).reduce((a, b) => a + b, 0) || 1;
  return `<div class="bar" role="img" aria-label="${STATUS.map((s) => `${STATUS_LABEL[s]} ${counts[s]}`).join(", ")}">${STATUS.map((s) => counts[s] ? `<i class="b-${s}" style="width:${(100 * counts[s]) / total}%"></i>` : "").join("")}</div>`;
}
const legend = () => `<div class="legend">${STATUS.map((s) => `<span><i class="b-${s}" style="background:var(${{ NOT_STARTED: "--line", INTRODUCED: "--accent", DEVELOPING: "--warn", NEEDS_REVIEW: "--bad", PROFICIENT: "--good", EXAM_READY: "--good" }[s]});${s === "INTRODUCED" || s === "PROFICIENT" ? "opacity:.55" : ""}"></i>${STATUS_LABEL[s]}</span>`).join("")}</div>`;

// ═════════════════════════════════════════════════════════════════════
// Recording answers
// ═════════════════════════════════════════════════════════════════════
function correctText(q) { return q.t === "num" ? `${q.ans} ${q.unit}` : q.c[q.a]; }
function numCategory(q, given) {

  if (r < 0.03) return "ARITH";
  for (const f of [10, 100, 1000]) if (Math.abs(given * f - q.ans) < 1e-6 * Math.max(1, q.ans) || Math.abs(given / f - q.ans) < 1e-6 * Math.max(1, q.ans)) return "UNITS";

}
function recordAttempt(q, { ok, conf, answerText, choice, given, mode, ms }) {
  const a = { id: uid(), t: now(), q: q.id, ok: ok ? 1 : 0, c: conf, m: mode, a: String(answerText ?? "").slice(0, 160), ms: ms || 0 };
  S.attempts.push(a); if (S.attempts.length > 8000) S.attempts.shift();
  S.days[dayKey()] = (S.days[dayKey()] || 0) + 1;
  schedule(q.id, !ok ? "wrong" : conf === "g" ? "guess" : conf === "u" ? "hard" : "good");
  // mistake log
  const oid = objOf(q);
  if (!ok || conf === "g") {
    const prev = S.mistakes[q.id];
    const cat = ok ? "GUESS" : q.t === "num" ? numCategory(q, given) : (q.w?.[choice]?.[0] || "RULE");
    S.mistakes[q.id] = {
      qid: q.id, lesson: q.l, ch: chOfLesson(q.l), obj: oid,
      first: prev?.first || a.t, last: a.t, my: a.a, correct: correctText(q),
      cat: prev?.userCat ? prev.cat : cat, userCat: prev?.userCat || false,
      mis: ok ? "Answered correctly by guessing — not yet reliable knowledge." : (q.t === "num" ? "" : (q.w?.[choice]?.[1] || "")),
      conf, confident: !ok && conf === "s", errors: (prev?.errors || 0) + (ok ? 0 : 1), wins: 0, winDays: [], status: "open", note: prev?.note || "",
    };
  } else if (conf !== "g") {
    for (const m of Object.values(S.mistakes)) {

        m.wins = (m.wins || 0) + 1; m.winDays = uniq([...(m.winDays || []), dayKey(a.t)]);

  invalidate();

// ═════════════════════════════════════════════════════════════════════
// Question selection per practice mode
// ═════════════════════════════════════════════════════════════════════
function lastSeen(qid) { const it = S.items[qid]; return it?.last || 0; }

  return out;
}

  const studied = new Set(studiedLessons());

  const pool = studiedPool.length >= 10 ? studiedPool : DATA.questions;

    case "A": { const qs = qByLesson.get(arg) || []; return [1, 2, 3].flatMap((d) => shuffle(qs.filter((q) => q.d === d))); }

        const variant = alts.filter((q) => q.id !== m.qid && now() - lastSeen(q.id) > 6 * 3600000);

VIEWS.numbers = () => `
  <div><div class="eyebrow">Precise recall</div><h1>Law &amp; numbers</h1></div>
  <p class="muted prose">Every deadline, threshold and percentage in the curriculum, with its verification status. "Not yet verified" means the rule comes from your study manual and has not been checked against an official source yet.</p>
  <div class="row"><input type="search" id="nq" placeholder="Search rules, e.g. escrow, 30 days, homestead" style="flex:1;min-width:200px"><select id="nch" style="width:auto"><option value="">All chapters</option>${DATA.chapters.map((c) => `<option value="${c.id}">${c.n}. ${esc(c.title)}</option>`).join("")}</select></div>
  <div class="panel" id="nlist"></div>`;
bind.numbers = () => {
  const paint = () => {
    const t = $("#nq").value.toLowerCase().trim(); const ch = $("#nch").value;
    const rows = DATA.numbers.filter((n) => (!ch || chOfLesson(n.l) === ch) && (!t || `${n.s} ${n.val} ${n.ctx} ${n.cond} ${n.exc}`.toLowerCase().includes(t)));
    $("#nlist").innerHTML = rows.length ? `<div class="list">${rows.map((n) => {
      const qs = DATA.questions.filter((q) => q.num?.includes(n.id));
      return `<details><summary class="row"><span class="mono small muted">${n.id}</span><b style="flex:1;min-width:0">${esc(n.s)}</b>${vChip(n.v)}</summary>
        <div style="display:grid;gap:6px;padding:8px 0" class="small"><div class="mono">${esc(n.val)}</div>${n.ctx ? `<div>${esc(n.ctx)}</div>` : ""}${n.cond ? `<div><b>Conditions:</b> ${esc(n.cond)}</div>` : ""}${n.exc ? `<div><b>Qualifications:</b> ${esc(n.exc)}</div>` : ""}${n.aid ? `<div><b>Memory aid:</b> ${esc(n.aid)}</div>` : ""}${n.conf.length ? `<div><b>Easily confused with:</b> ${n.conf.map((c) => esc(NUM.get(c)?.s)).join("; ")}</div>` : ""}
        <div class="row"><a href="#lesson~${n.l}">Lesson ${n.l}</a>${qs.length ? `<span class="muted">${qs.length} practice question(s): ${qs.map((q) => q.id).join(", ")}</span>` : ""}</div></div></details>`;
    }).join("")}</div>` : `<div class="empty">No matching rules.</div>`;
  };
  $("#nq").addEventListener("input", paint); $("#nch").addEventListener("change", paint); paint();
};

VIEWS.compare = (open) => `
  <div><div class="eyebrow">Jurisdiction differences</div><h1>Portugal vs Florida</h1></div>
  <p class="muted prose">Use your Portuguese experience as a starting point, then switch to the Florida rule. Portuguese law never answers a Florida exam question. Each entry says whether its Portuguese side has been verified.</p>
  <input type="search" id="cq" placeholder="Search, e.g. deposit, license, tax">
  <div id="clist" style="display:grid;gap:14px"></div>`;
bind.compare = (open) => {
  const paint = () => {
    const t = $("#cq").value.toLowerCase().trim();
    const rows = DATA.comparisons.filter((c) => !t || Object.values(c).join(" ").toLowerCase().includes(t));
    $("#clist").innerHTML = rows.map((c) => `<div class="panel" id="${c.id}"><div class="panel-head"><h3>${esc(c.concept)}</h3><span class="mono small muted">${c.id}</span></div>
      <div class="compare two"><div class="side"><b>Portuguese context</b>${esc(c.pt)}</div><div class="side"><b>Florida context</b>${esc(c.fl)}</div></div>
      <dl class="kv"><dt>The important difference</dt><dd>${esc(c.diff)}</dd><dt>Practical example</dt><dd>${esc(c.ex)}</dd><dt>Exam implication</dt><dd>${esc(c.exam)}</dd><dt>Memory aid</dt><dd>${esc(c.aid)}</dd></dl>
      <div class="note info"><b>Practice:</b> ${esc(c.pq)}<div class="row" style="margin-top:6px"><textarea data-pq="${c.id}" placeholder="Your answer…" style="min-height:48px"></textarea></div><button class="btn sm" data-show="${c.id}">Show answer</button><div data-pa="${c.id}" hidden style="margin-top:6px"><b>Answer:</b> ${esc(c.pa)}</div></div>
      <p class="small muted">Portuguese side: ${esc(c.ptv)} · Lessons: ${c.l.map((l) => `<a href="#lesson~${l}">${l}</a>`).join(", ")}</p></div>`).join("") || `<div class="empty">No matches.</div>`;
    $$("[data-show]").forEach((b) => b.addEventListener("click", () => { $(`[data-pa="${b.dataset.show}"]`).hidden = false; }));
  };
  $("#cq").addEventListener("input", paint); paint();
  if (open) setTimeout(() => document.getElementById(open)?.scrollIntoView({ block: "start" }), 50);
};

VIEWS.sources = () => `

  <div class="panel prose"><h3>Source inventory</h3>
    <p><b>Principal curriculum source:</b> "FL-Study-Manual-Expanded" (Google Doc in your Drive, Aug 2026), a 12-chapter companion that maps to Gold Coast course book chapters 2–19. The Gold Coast textbook itself was <b>not</b> among the supplied files.</p>
    <p><b>Earlier version:</b> "FL Sales Associate — Study Manual (Pedro).docx" — the file is damaged in Drive; only its first section (identical to the Google Doc) could be recovered.</p>
    <p><b>Structure authority:</b> the official FREC Course I syllabus (19 sections, eff. 1/1/2023) and the DBPR Candidate Information Booklet (Jan 2025).</p>
    <p><b>Legal verification:</b> official Florida statute and rule pages located on official domains; full pages could not be downloaded from this environment, so entries are marked with how they were checked.</p></div>
  <div class="panel"><h3>Verification log (${DATA.verification.length} entries, checked ${esc(DATA.meta.checkedOn)})</h3><div class="list">${DATA.verification.map((v) => `<details id="${v.id}"><summary class="row"><span class="mono small muted">${v.id}</span><b style="flex:1;min-width:0">${esc(v.topic)}</b>${chip(V_LABEL[v.status], "v-" + v.status)}</summary>
    <dl class="kv small" style="padding:8px 0"><dt>Manual says</dt><dd>${esc(v.manual)}</dd><dt>Finding</dt><dd>${esc(v.finding)}</dd><dt>Citation</dt><dd>${esc(v.citation)}</dd>${v.url ? `<dt>Source</dt><dd><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.url)}</a></dd>` : ""}<dt>Method</dt><dd>${esc(v.method)}${v.checks ? ` · ${esc(v.checks)}` : ""}</dd><dt>We teach</dt><dd>${esc(v.teach)}</dd></dl></details>`).join("")}</div></div>
  <div class="panel"><h3>Manual coverage</h3><div class="tablewrap"><table><tbody>${DATA.manualCoverage.map(([a, b]) => `<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="panel"><h3>Known limitations</h3><ul class="small" style="margin:0;padding-left:20px;display:grid;gap:4px">
    <li>The Gold Coast textbook is missing; topics that appear only in the book (and not in the manual) may be absent. Uploading the book would allow a full coverage check.</li>
    <li>Per-section FREC learning objectives could not be read in full. Exam weights come from search excerpts of the Candidate Information Booklet (section 1 is derived from the 100% total).</li>
    <li>${DATA.lessons.some((l) => l.status === "core") ? `${DATA.lessons.filter((l) => l.status === "core").length} of ${DATA.lessons.length} lessons are core notes; full lessons are written as tutoring reaches them.` : `All ${DATA.lessons.length} lessons are full lessons. Each was checked by an independent AI reviewer against the manual, the numbers database and the verification log; none has been reviewed by a licensed Florida instructor.`}</li>
    <li>Rules marked "Not yet verified" come from the study manual and are on the next verification list.</li>
    <li>Practice questions are original and not official exam questions.</li></ul></div>`;
VIEWS.source = (id) => { setTimeout(() => { const d = document.getElementById(id); if (d) { d.open = true; d.scrollIntoView({ block: "start" }); } }, 30); return VIEWS.sources(); };

// ═════════════════════════════════════════════════════════════════════
// Mistake log & analytics
// ═════════════════════════════════════════════════════════════════════
VIEWS.mistakes = () => `
  <div><div class="eyebrow">Every error is information</div><h1>Mistake log</h1></div>
  <div class="row"><select id="mfilter" style="width:auto"><option value="active">Open and improving</option><option value="open">Open</option><option value="improving">Improving</option><option value="resolved">Resolved</option><option value="all">All</option></select><a class="btn primary" href="#quiz~D">Practise open mistakes</a></div>
  <p class="small muted">An entry resolves after 3 later correct, not-guessed answers on the same objective, on at least 2 different days. Errors made while "sure" are marked as confident errors and reviewed first.</p>
  <div id="mlist"></div>`;
bind.mistakes = () => {
  const paint = () => {
    const f = $("#mfilter").value;
    const rows = Object.values(S.mistakes).filter((m) => f === "all" || (f === "active" ? m.status !== "resolved" : m.status === f)).sort((a, b) => (b.confident - a.confident) || b.last - a.last);
    $("#mlist").innerHTML = rows.length ? `<div class="panel"><div class="list">${rows.map((m) => {
      const q = Q.get(m.qid); if (!q) return "";
      return `<details><summary class="row small"><span class="mono muted">${m.qid}</span>${chip(m.status, m.status === "resolved" ? "st-PROFICIENT" : m.status === "improving" ? "st-DEVELOPING" : "st-NEEDS_REVIEW")}${m.confident ? chip("Confident error", "st-NEEDS_REVIEW") : ""}${chip(CAT_LABEL[m.cat] || m.cat)}<span style="flex:1;min-width:0">${esc(q.q.slice(0, 80))}…</span></summary>
        <dl class="kv small" style="padding:8px 0"><dt>Date</dt><dd>${fmtDate(m.first)}${m.last !== m.first ? " · last " + fmtDate(m.last) : ""}</dd><dt>Chapter / lesson</dt><dd>${CH.get(m.ch)?.n}. ${esc(CH.get(m.ch)?.title)} · <a href="#lesson~${m.lesson}">${m.lesson}</a></dd>
        <dt>Objective</dt><dd>${esc(OBJ.get(m.obj)?.text)} ${statusChip(objStatus(m.obj))}</dd><dt>Question</dt><dd>${esc(q.q)}</dd><dt>Your answer</dt><dd>${esc(m.my)}</dd><dt>Correct answer</dt><dd>${esc(m.correct)}</dd><dt>Explanation</dt><dd>${esc(q.ex || q.steps?.join(" "))}</dd>
        ${m.mis ? `<dt>Likely misconception</dt><dd>${esc(m.mis)}</dd>` : ""}<dt>Confidence</dt><dd>${{ s: "Sure", u: "Unsure", g: "Guessing" }[m.conf] || "—"}</dd><dt>Later correct answers</dt><dd>${m.wins || 0} on ${(m.winDays || []).length} day(s)</dd><dt>Next review</dt><dd>${fmtDue(S.items[m.qid]?.due)}</dd>${m.note ? `<dt>Your explanation</dt><dd>${esc(m.note)}</dd>` : ""}</dl></details>`;
    }).join("")}</div></div>` : `<div class="empty">Nothing here.</div>`;
  };
  $("#mfilter").addEventListener("change", paint); paint();
};

VIEWS.stats = () => {
  const A = S.attempts;
  if (!A.length) return `<h1>Analytics</h1><div class="empty">Answer some questions and your performance by chapter, question type and confidence will appear here.</div>`;
  const by = (fn) => { const m = new Map(); for (const a of A) { const q = Q.get(a.q); if (!q) continue; const k = fn(q, a); const v = m.get(k) || [0, 0]; v[1]++; if (a.ok) v[0]++; m.set(k, v); } return m; };
  const byCh = by((q) => chOfLesson(q.l)); const byType = by((q) => ({ mcq: "Multiple choice", scn: "Scenario", num: "Calculation" }[q.t])); const byD = by((q) => ["", "Basic", "Intermediate", "Hard"][q.d]);
  const cal = { s: [0, 0], u: [0, 0], g: [0, 0] }; for (const a of A) { cal[a.c][a.ok ? 0 : 1]++; }
  const cats = {}; for (const m of Object.values(S.mistakes)) cats[m.cat] = (cats[m.cat] || 0) + 1;
  const days = [...Array(30)].map((_, i) => S.days[dayKey(now() - (29 - i) * DAY)] || 0); const maxD = Math.max(1, ...days);
  const tbl = (m, label) => `<table><thead><tr><th>${label}</th><th class="num">Answered</th><th class="num">Accuracy</th></tr></thead><tbody>${[...m.entries()].map(([k, [ok, n]]) => `<tr><td>${esc(CH.get(k) ? CH.get(k).n + ". " + CH.get(k).title : k)}</td><td class="num mono">${n}</td><td class="num mono">${pct(ok, n)}%</td></tr>`).join("")}</tbody></table>`;
  return `
  <div><div class="eyebrow">${A.length} answers recorded</div><h1>Analytics</h1></div>
  <div class="panel"><h3>Activity, last 30 days</h3><div class="spark">${days.map((d) => `<i style="height:${(100 * d) / maxD}%" title="${d}"></i>`).join("")}</div></div>
  <div class="grid2"><div class="panel"><h3>By question type</h3>${tbl(byType, "Type")}</div><div class="panel"><h3>By difficulty</h3>${tbl(byD, "Difficulty")}</div></div>
  <div class="panel"><h3>Confidence calibration</h3><div class="cal"><div class="h"></div><div class="h">Correct</div><div class="h">Wrong</div>${["s", "u", "g"].map((k) => `<div class="h">${{ s: "Sure", u: "Unsure", g: "Guessing" }[k]}</div><div>${cal[k][0]}</div><div>${cal[k][1]}</div>`).join("")}</div>
  <p class="small muted">Watch the "Sure / Wrong" cell: confident errors reveal misconceptions that feel like knowledge. "Guessing / Correct" answers do not count toward mastery.</p></div>
  <div class="panel"><h3>By chapter</h3><div class="tablewrap">${tbl(byCh, "Chapter")}</div></div>
  <div class="panel"><h3>Error types in the mistake log</h3>${Object.keys(cats).length ? `<div class="list">${Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<div class="row"><span>${esc(CAT_LABEL[k] || k)}</span><span class="spacer"></span><b class="mono">${n}</b></div>`).join("")}</div>` : `<div class="empty">No errors logged.</div>`}</div>`;
};

// ═════════════════════════════════════════════════════════════════════
// Search
// ═════════════════════════════════════════════════════════════════════
VIEWS.search = () => `<div><div class="eyebrow">Lessons, terms, rules, formulas</div><h1>Search</h1></div><input type="search" id="sq" placeholder="Type at least 3 letters, e.g. 'riparian', 'blind ad', 'proration'"><div id="sres" style="display:grid;gap:14px"></div>`;
const lessonText = new Map(DATA.lessons.map((l) => [l.id, plain(l.html || "")]));
bind.search = () => {
  const box = $("#sq"); box.focus();
  box.addEventListener("input", () => {
    const t = box.value.toLowerCase().trim(); const out = $("#sres");
    if (t.length < 3) { out.innerHTML = ""; return; }
    const hl = (s) => esc(s).replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), (m) => `<mark>${m}</mark>`);
    const snip = (txt) => { const i = txt.toLowerCase().indexOf(t); return i < 0 ? "" : "…" + txt.slice(Math.max(0, i - 60), i + 90) + "…"; };
    const L = DATA.lessons.filter((l) => (l.title + " " + lessonText.get(l.id)).toLowerCase().includes(t)).slice(0, 12);
    const G = DATA.glossary.filter((g) => (g.term + " " + g.def).toLowerCase().includes(t)).slice(0, 15);
    const N = DATA.numbers.filter((n) => (n.s + " " + n.val).toLowerCase().includes(t)).slice(0, 10);
    const C = DATA.comparisons.filter((c) => (c.concept + c.fl + c.pt).toLowerCase().includes(t)).slice(0, 6);
    const F = DATA.flashcards.filter((f) => f.t === "formula" && (f.f + f.b).toLowerCase().includes(t));
    const Qs = DATA.questions.filter((q) => q.q.toLowerCase().includes(t)).slice(0, 8);
    out.innerHTML = [
      L.length && `<div class="panel"><h3>Lessons</h3><div class="list">${L.map((l) => `<div><a href="#lesson~${l.id}"><b>${l.id} · ${esc(l.title)}</b></a><div class="small muted">${hl(snip(lessonText.get(l.id)))}</div></div>`).join("")}</div></div>`,
      G.length && `<div class="panel"><h3>Glossary</h3><div class="list">${G.map((g) => `<div><b>${hl(g.term)}</b> — ${hl(g.def)} <a class="small" href="#lesson~${g.l}">${g.l}</a>${g.note ? `<div class="small muted">${esc(g.note)}</div>` : ""}</div>`).join("")}</div></div>`,
      N.length && `<div class="panel"><h3>Rules &amp; numbers</h3><div class="list">${N.map((n) => `<div><b>${hl(n.s)}</b><div class="small mono">${hl(n.val)}</div>${vChip(n.v)}</div>`).join("")}</div></div>`,
      F.length && `<div class="panel"><h3>Formulas</h3><div class="list">${F.map((f) => `<div><b>${hl(f.f)}</b><div class="small mono">${hl(f.b)}</div></div>`).join("")}</div></div>`,
      C.length && `<div class="panel"><h3>Portugal vs Florida</h3><div class="list">${C.map((c) => `<div><a href="#compare~${c.id}">${esc(c.concept)}</a></div>`).join("")}</div></div>`,
      Qs.length && `<div class="panel"><h3>Practice questions (answers hidden)</h3><div class="list">${Qs.map((q) => `<div class="small"><span class="mono muted">${q.id}</span> ${hl(q.q)} <a href="#quiz~A~${q.l}">Lesson quiz</a></div>`).join("")}</div></div>`,
    ].filter(Boolean).join("") || `<div class="empty">No results.</div>`;
  });
};

// Settings: exam date, export / import, reset

VIEWS.settings = () => `
  <div><div class="eyebrow">Your plan and your data</div><h1>Settings</h1></div>
  <div class="panel"><h3>Study plan</h3>
    <div class="grid2"><label class="field">Exam date<input type="date" id="set-date" value="${esc(S.settings.examDate)}"></label>
    <label class="field">Realistic study time per day (minutes)<input type="number" id="set-min" min="10" max="600" step="5" value="${esc(S.settings.dailyMinutes)}" placeholder="e.g. 60"></label>
    <label class="field">New flashcards per day<input type="number" id="set-new" min="0" max="100" value="${esc(S.settings.newCardsPerDay)}"></label></div>
    <button class="btn primary" id="save-set">Save plan</button>${studyPlanHtml()}</div>
  <div class="panel"><h3>Where your progress is saved</h3>
    <p class="small">${Store.mode === "cloud" ? "Your progress is saved to your account through this page, so it follows you across devices. A copy is also kept in this browser." : Store.mode === "local" ? "Your progress is saved in this browser only. Export a backup regularly, especially before clearing browser data or switching devices." : "This browser is not allowing storage. Export a backup before closing the page."}</p></div>
  <div class="panel"><h3>Backup</h3><p class="small muted">Export everything (progress, mistakes, flashcard schedule, history) as a JSON file. Import merges a backup into your current progress.</p>
    <div class="row"><button class="btn" id="export">Export backup</button><label class="btn">Import from file<input type="file" id="importfile" accept="application/json,.json" hidden></label></div>
    <textarea id="backup-text" placeholder="Or paste a backup here, then press Import pasted backup" style="min-height:90px"></textarea>
    <div class="row"><button class="btn sm" id="importtext">Import pasted backup</button><button class="btn sm ghost" id="copybk">Copy backup to clipboard</button></div></div>
  <div class="panel"><h3>Reset</h3><p class="small muted">Deletes all progress on this page. Export a backup first.</p><button class="btn danger" id="reset">Reset all progress…</button>
    <div id="resetconfirm" hidden class="row"><span class="small">This cannot be undone.</span><button class="btn danger" id="resetyes">Yes, delete my progress</button><button class="btn" id="resetno">Cancel</button></div></div>`;
bind.settings = () => {
  $("#save-set").addEventListener("click", () => {
    S.settings.examDate = $("#set-date").value; S.settings.dailyMinutes = $("#set-min").value; S.settings.newCardsPerDay = Number($("#set-new").value) || 15;
    Store.touch("core"); toast("Plan saved"); route();
  });
  const backup = () => JSON.stringify({ app: "fl-exam-coach", exported: new Date().toISOString(), state: S }, null, 1);
  $("#export").addEventListener("click", async () => {
    const name = `fl-exam-backup-${dayKey()}.json`;
    if (Store.dl) { try { await Store.dl.save({ filename: name, data: backup() }); toast("Backup saved"); return; } catch (e) { if (e?.code === "declined") return; } }
    try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([backup()], { type: "application/json" })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); } catch { /* fall through */ }
    $("#backup-text").value = backup(); toast("Backup also placed in the box below — copy it somewhere safe.");
  });
  $("#copybk").addEventListener("click", async () => { const t = backup(); try { await navigator.clipboard.writeText(t); toast("Copied"); } catch { $("#backup-text").value = t; $("#backup-text").select(); toast("Select-all and copy the text in the box."); } });
  const doImport = (txt) => {
    try { const j = JSON.parse(txt); const st = j.state || j; if (!st.attempts || !st.items) throw new Error("not a backup"); S = mergeState(S, st); invalidate(); Store.touch("core", "itemsQ", "itemsF", "mistakes", ...uniq(S.attempts.map((a) => "att:" + dayKey(a.t))), ...S.sessions.map((s) => "ses:" + s.id)); toast("Backup merged"); route(); }
    catch { toast("That file is not a valid backup."); }
  };
  $("#importfile").addEventListener("change", (e) => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => doImport(r.result); r.readAsText(f); });
  $("#importtext").addEventListener("click", () => doImport($("#backup-text").value));
  $("#reset").addEventListener("click", () => { $("#resetconfirm").hidden = false; });
  $("#resetno").addEventListener("click", () => { $("#resetconfirm").hidden = true; });
  $("#resetyes").addEventListener("click", () => {
    const days = uniq(S.attempts.map((a) => dayKey(a.t))); const ses = S.sessions.map((s) => s.id);
    S = blank(); live = null; Store.saveLive(); invalidate();
    if (Store.db) { for (const d of days) Store.db.doc("attempts/" + d).delete().catch(() => {}); for (const s of ses) Store.db.doc("sessions/" + s).delete().catch(() => {}); }
    Store.touch("core", "itemsQ", "itemsF", "mistakes"); toast("Progress reset"); go("home");
  });
};

// ═════════════════════════════════════════════════════════════════════
Store.init();
})();
