u003c/strong> 1 ft = 12 in · 1 yd = 3 ft · 1 sq yd = \u003cstrong>9 sq ft\u003c/strong> · 1 acre = \u003cstrong>43,560 sq ft\u003c/strong> · 1 mile = \u003cstrong>5,280 ft\u003c/strong> · 1 sq mile = 640 acres. (Metric intuition: 1 sq ft ≈ 0.0929 m²; 1 acre ≈ 4,047 m².)\u003c/p>\n\u003cp>\u003cstrong>Formulas:\u003c/strong> rectangle = length × width; triangle = ½ × base × height; composite shapes = split into rectangles/triangles and add. Volume (if asked) = length × width × height (cubic yards = cubic feet ÷ 27).\u003c/p>\n\u003cp>\u003cstrong>Front feet:\u003c/strong> the frontage dimension along the street or water — usually the first number given (75' × 150' lot has 75 front feet). Price per front foot = price ÷ front feet.\u003c/p>\n\u003cp>\u003cstrong>Common errors:\u003c/strong> dividing square feet by 3 (instead of 9) to get square yards; mixing feet and yards; forgetting the ½ for triangles.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>sq yd = sq ft ÷ 9 · acres = sq ft ÷ 43,560 · front foot = first dimension.\u003c/p>\n"},{"id":"L14-3","ch":"ch14","title":"Commissions and net to seller","type":"calculation","pri":"high","min":35,"manual":"M10 §patterns 2–3","pre":["L14-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Commission chain:\u003c/strong> total commission = price × rate → split between brokerages → split between brokerage and associate. Multiply through each step. Working backwards, divide by each split.\u003c/p>\n\u003cp>\u003cstrong>Net to seller:\u003c/strong> the seller wants a fixed amount after the commission. Because the commission is a percentage \u003cstrong>of the price\u003c/strong>, \u003cstrong>Price = (Net + fixed costs) ÷ (1 − rate)\u003c/strong>.\u003c/p>\n\u003cp>Worked example: net $188,000, 6% commission → $188,000 ÷ 0.94 = $200,000. Check: $200,000 × 6% = $12,000; $200,000 − $12,000 = $188,000 ✓.\u003c/p>\n\u003cp>\u003cstrong>Common error:\u003c/strong> $188,000 × 1.06 = $199,280 — that takes 6% of the net, not of the price, and leaves the seller short.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Net ÷ (1 − rate). Always check by taking the commission from your answer.\u003c/p>\n"},{"id":"L14-4","ch":"ch14","title":"Profit, loss and appreciation","type":"calculation","pri":"high","min":30,"manual":"M10 §pattern 4; §Percentage of change","pre":["L14-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Profit or loss percentage\u003c/strong> is measured \u003cstrong>on cost\u003c/strong> (what was paid): (sale − cost) ÷ cost.\u003c/p>\n\u003cp>\u003cstrong>Recovering the cost:\u003c/strong> Sale = Cost × (1 + profit%), so \u003cstrong>Cost = Sale ÷ (1 + profit%)\u003c/strong>. For a loss, Cost = Sale ÷ (1 − loss%).\u003c/p>\n\u003cp>Worked example: sold for $276,000 at a 15% profit → cost = $276,000 ÷ 1.15 = $240,000. \u003cstrong>Never\u003c/strong> $276,000 × 0.85 = $234,600 (that takes 15% of the sale price).\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>When a percent is \"of\" the unknown, divide. Profit is on cost.\u003c/p>\n"},{"id":"L14-5","ch":"ch14","title":"Interest, amortization, LTV and points","type":"calculation","pri":"high","min":35,"manual":"M10 §patterns 5–7, 12","pre":["L14-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Simple interest:\u003c/strong> I = P × R × T, with T in \u003cstrong>years\u003c/strong> (18 months = 1.5).\u003c/p>\n\u003cp>\u003cstrong>Amortization, first payment:\u003c/strong> month's interest = balance × annual rate ÷ 12; principal = payment − interest; new balance = old balance − principal.\u003c/p>\n\u003cp>\u003cstrong>LTV:\u003c/strong> loan ÷ \u003cstrong>lesser of price or appraised value\u003c/strong>. Down payment = price − loan.\u003c/p>\n\u003cp>\u003cstrong>Points:\u003c/strong> cost = points% × \u003cstrong>loan amount\u003c/strong> (not the price). Course rule: each point ≈ +1/8% yield.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>T in years · interest ÷ 12 for a month · LTV uses the lower value · points on the loan.\u003c/p>\n"},{"id":"L14-6","ch":"ch14","title":"Florida transfer taxes: documentary stamps and intangible tax","type":"calculation","pri":"high","min":35,"manual":"M10 §Florida's three transfer taxes","pre":["L14-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Florida's three transfer taxes (verified V-18, V-19):\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Tax\u003c/th>\n\u003cth>Rate\u003c/th>\n\u003cth>Base\u003c/th>\n\u003cth>Rounding\u003c/th>\n\u003cth>Customarily paid by\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Doc stamps on the \u003cstrong>deed\u003c/strong>\u003c/td>\n\u003ctd>$0.70 per $100 (Miami-Dade single-family $0.60; other Miami-Dade property $0.60 + $0.45 surtax per manual)\u003c/td>\n\u003ctd>Full purchase price, including any mortgage assumed\u003c/td>\n\u003ctd>Round \u003cstrong>up\u003c/strong> to next $100\u003c/td>\n\u003ctd>Seller\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Doc stamps on the \u003cstrong>note\u003c/strong>\u003c/td>\n\u003ctd>$0.35 per $100\u003c/td>\n\u003ctd>Amount financed — new \u003cstrong>and assumed\u003c/strong> (course convention, V-25)\u003c/td>\n\u003ctd>Round \u003cstrong>up\u003c/strong> to next $100\u003c/td>\n\u003ctd>Buyer\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>\u003cstrong>Intangible tax\u003c/strong>\u003c/td>\n\u003ctd>2 mills (0.002)\u003c/td>\n\u003ctd>\u003cstrong>New\u003c/strong> mortgage only\u003c/td>\n\u003ctd>None\u003c/td>\n\u003ctd>Buyer\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Worked example (manual): $412,480 sale in Broward with a new $330,000 loan. Deed: round to $412,500 → 4,125 × \u003cspan class=\"math inline\">0.70 =  * *\u003c/span>2,887.50**. Note: 3,300 × \u003cspan class=\"math inline\">0.35 =  * *\u003c/span>1,155**. Intangible: 330,000 × 0.002 = \u003cstrong>$660\u003c/strong>. If the buyer \u003cem>assumed\u003c/em> $330,000 instead: note stamps yes, intangible no.\u003c/p>\n\u003ch2 id=\"6-portugal-comparison\">6. Portugal comparison\u003c/h2>\n\u003cp>See PT-09: Florida's main deed tax is customarily the seller's; Portugal's IMT and Imposto do Selo are the buyer's.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Deed 70 (seller) · note 35 (buyer) · intangible 2 mills on new money (buyer). Round stamps up.\u003c/p>\n"},{"id":"L14-7","ch":"ch14","title":"Prorations","type":"calculation","pri":"high","min":40,"manual":"M10 §Prorations; §Interest proration","pre":["L14-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Prorating\u003c/strong> divides an expense or income between seller and buyer as of closing. Florida course conventions: the \u003cstrong>365-day method\u003c/strong> (actual days in each month) and \u003cstrong>the buyer owns the day of closing\u003c/strong> — unless the question says otherwise.\u003c/p>\n\u003cp>\u003cstrong>Paid in arrears\u003c/strong> (property taxes, mortgage interest): the bill comes later, so the seller owes the buyer for the seller's days (Jan 1 through the day before closing): \u003cstrong>debit seller, credit buyer\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>Paid in advance\u003c/strong> (rent the seller collected, prepaid insurance or association dues): the buyer gets credit for unused rent (credit buyer, debit seller); the seller gets credit for prepaid expenses beyond closing (debit buyer, credit seller).\u003c/p>\n\u003cp>Worked example (manual): closing May 20; annual taxes $5,475 unpaid; daily \u003cspan class=\"math inline\">15.\u003cem>S\u003c/em>\u003cem>e\u003c/em>\u003cem>l\u003c/em>\u003cem>l\u003c/em>\u003cem>e\u003c/em>\u003cem>r\u003c/em>′\u003cem>s\u003c/em>\u003cem>d\u003c/em>\u003cem>a\u003c/em>\u003cem>y\u003c/em>\u003cem>s\u003c/em> : \u003cem>J\u003c/em>\u003cem>a\u003c/em>\u003cem>n\u003c/em>31 + \u003cem>F\u003c/em>\u003cem>e\u003c/em>\u003cem>b\u003c/em>28 + \u003cem>M\u003c/em>\u003cem>a\u003c/em>\u003cem>r\u003c/em>31 + \u003cem>A\u003c/em>\u003cem>p\u003c/em>\u003cem>r\u003c/em>30 + \u003cem>M\u003c/em>\u003cem>a\u003c/em>\u003cem>y\u003c/em>19 = 139 →  * *\u003c/span>2,085**, debit seller / credit buyer.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>365 days · buyer owns closing day · arrears → debit seller · advance rent → credit buyer.\u003c/p>\n"},{"id":"L14-8","ch":"ch14","title":"The closing statement: debits and credits","type":"calculation","pri":"high","min":35,"manual":"M10 §The closing statement","pre":["L14-6","L14-7"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>A \u003cstrong>debit\u003c/strong> is what a party owes; a \u003cstrong>credit\u003c/strong> is what a party receives.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Item\u003c/th>\n\u003cth>Buyer\u003c/th>\n\u003cth>Seller\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Purchase price\u003c/td>\n\u003ctd>Debit\u003c/td>\n\u003ctd>Credit\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Binder deposit\u003c/td>\n\u003ctd>Credit (single entry)\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>New mortgage\u003c/td>\n\u003ctd>Credit\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>\u003cstrong>Assumed mortgage\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Credit\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Debit\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Existing mortgage payoff\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>Debit\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Deed doc stamps\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>Debit\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Note stamps + intangible\u003c/td>\n\u003ctd>Debit\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Unpaid taxes (proration)\u003c/td>\n\u003ctd>Credit\u003c/td>\n\u003ctd>Debit\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Commission\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>Debit (customarily)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>Correction (V-24):\u003c/strong> the study manual's table shows the assumed mortgage as a buyer credit only. An assumed mortgage is a \u003cstrong>double entry\u003c/strong>: the buyer is credited because it pays part of the price, and the seller is debited because the seller hands over the debt instead of receiving that cash.\u003c/p>\n\u003cp>\u003cstrong>Cash due:\u003c/strong> buyer brings total debits − total credits; seller receives total credits − total debits.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Deposit: buyer credit only. New loan: buyer credit only. Assumed loan: debit seller + credit buyer. Prorations between parties: double entries.\u003c/p>\n"},{"id":"L15-1","ch":"ch15","title":"Real estate markets, supply and demand, and pricing tools","type":"conceptual","pri":"medium","min":25,"manual":"M11 §Market characteristics; §CMA vs BPO","pre":["L01-2"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>Real estate markets are \u003cstrong>local\u003c/strong> and \u003cstrong>slow\u003c/strong>: the product is immobile and unique, supply responds slowly to demand (construction takes years), and government (zoning, rates, taxes) keeps changing the field. \u003cstrong>Demand\u003c/strong> drivers: population, income, employment, credit availability. \u003cstrong>Supply\u003c/strong> drivers: labor, land, materials, construction financing. Rising \u003cstrong>vacancy\u003c/strong> signals oversupply and softening prices.\u003c/p>\n\u003cp>\u003cstrong>Pricing tools:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>CMA\u003c/strong> (comparative market analysis) — a licensee's pricing tool using recently sold, currently listed and expired comparables.\u003c/li>\n\u003cli>\u003cstrong>BPO\u003c/strong> (broker price opinion) — ordered by a lender or investor (short sales, portfolio checks).\u003c/li>\n\u003cli>\u003cstrong>Appraisal\u003c/strong> — a licensed or certified appraiser's USPAP-compliant opinion of value.\u003c/li>\n\u003c/ul>\n\u003cp>A licensee may prepare and \u003cstrong>charge\u003c/strong> for CMAs and BPOs but must \u003cstrong>never call them appraisals\u003c/strong>.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Local, immobile, slow supply. CMA and BPO yes, \"appraisal\" no.\u003c/p>\n"},{"id":"L16-1","ch":"ch16","title":"Value: characteristics and principles","type":"conceptual","pri":"medium","min":25,"manual":"M11 §Market characteristics and value","pre":["L15-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Elements of value — DUST:\u003c/strong> Demand, Utility, Scarcity, Transferability.\u003c/p>\n\u003cp>\u003cstrong>Market value\u003c/strong> is the most probable price in an arm's-length sale between informed parties under no unusual pressure. It differs from \u003cstrong>price\u003c/strong> (what was paid) and \u003cstrong>cost\u003c/strong> (what it took to build). Others: assessed value (taxes), insurable value.\u003c/p>\n\u003cp>\u003cstrong>Principles:\u003c/strong> \u003cstrong>substitution\u003c/strong> (no one pays more than an equal substitute costs — the foundation of appraisal); \u003cstrong>highest and best use\u003c/strong> (legally permissible, physically possible, financially feasible, maximally productive); \u003cstrong>anticipation\u003c/strong> (value of expected future benefits — basis of the income approach); \u003cstrong>contribution\u003c/strong> (a feature is worth what it adds, not what it cost); \u003cstrong>conformity\u003c/strong> with \u003cstrong>progression\u003c/strong> (modest house lifted by better neighbours) and \u003cstrong>regression\u003c/strong> (mansion dragged down by lesser ones); \u003cstrong>plottage\u003c/strong> (value gain from combining parcels; the act is \u003cstrong>assemblage\u003c/strong>); increasing and decreasing returns.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>DUST. Substitution underlies everything. Progression lifts, regression drags.\u003c/p>\n"},{"id":"L16-2","ch":"ch16","title":"Sales comparison approach","type":"calculation","pri":"high","min":30,"manual":"M11 §The three approaches; §adjustment grid","pre":["L16-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>The \u003cstrong>sales comparison approach\u003c/strong> is best for homes and vacant land. Choose recent comparable sales and \u003cstrong>adjust the comparables, never the subject\u003c/strong>: comparable better → \u003cstrong>subtract\u003c/strong>; comparable inferior → \u003cstrong>add\u003c/strong> (CBS / CIA). The comparable with the fewest and smallest adjustments carries the most weight.\u003c/p>\n\u003cp>Worked example (manual): comp sold $410,000; it has a pool worth \u003cspan class=\"math inline\">25, 000\u003cem>t\u003c/em>\u003cem>h\u003c/em>\u003cem>e\u003c/em>\u003cem>s\u003c/em>\u003cem>u\u003c/em>\u003cem>b\u003c/em>\u003cem>j\u003c/em>\u003cem>e\u003c/em>\u003cem>c\u003c/em>\u003cem>t\u003c/em>\u003cem>l\u003c/em>\u003cem>a\u003c/em>\u003cem>c\u003c/em>\u003cem>k\u003c/em>\u003cem>s\u003c/em>(−\u003c/span>25,000); the subject has a renovated kitchen worth \u003cspan class=\"math inline\">15, 000\u003cem>t\u003c/em>\u003cem>h\u003c/em>\u003cem>e\u003c/em>\u003cem>c\u003c/em>\u003cem>o\u003c/em>\u003cem>m\u003c/em>\u003cem>p\u003c/em>\u003cem>l\u003c/em>\u003cem>a\u003c/em>\u003cem>c\u003c/em>\u003cem>k\u003c/em>\u003cem>s\u003c/em>(+\u003c/span>15,000) → indicated value \u003cstrong>$400,000\u003c/strong>.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Adjust the comp. Better → subtract. Inferior → add.\u003c/p>\n"},{"id":"L16-3","ch":"ch16","title":"Cost approach and depreciation","type":"calculation","pri":"high","min":30,"manual":"M11 §The three approaches (cost)","pre":["L16-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>The \u003cstrong>cost approach\u003c/strong> is best for new construction and special-purpose properties (schools, churches, fire stations): \u003cstrong>Value = land (by sales comparison) + cost new − accrued depreciation\u003c/strong>. \u003cstrong>Reproduction\u003c/strong> cost = exact replica; \u003cstrong>replacement\u003c/strong> cost = equal utility with current materials and standards. Land never depreciates.\u003c/p>\n\u003cp>\u003cstrong>Depreciation:\u003c/strong> \u003cstrong>physical deterioration\u003c/strong> (wear; curable or incurable), \u003cstrong>functional obsolescence\u003c/strong> (outdated design — one bathroom, no closets; curable or incurable), \u003cstrong>external (economic) obsolescence\u003c/strong> (outside the property line — an airport, the economy; \u003cstrong>always incurable\u003c/strong>).\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Land + cost new − depreciation. External = outside = incurable.\u003c/p>\n"},{"id":"L16-4","ch":"ch16","title":"Income approach, reconciliation and who may appraise","type":"calculation","pri":"high","min":35,"manual":"M11 §The three approaches (income); §Who may appraise","pre":["L16-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>The \u003cstrong>income capitalization approach\u003c/strong> is for income property: \u003cstrong>IRV — Value = NOI ÷ cap rate\u003c/strong>.\u003c/p>\n\u003cp>Build NOI: potential gross income − vacancy and collection loss = effective gross income; − operating expenses (fixed, variable, reserves) = \u003cstrong>NOI\u003c/strong>. \u003cstrong>Debt service and depreciation are not operating expenses.\u003c/strong>\u003c/p>\n\u003cp>Shortcuts: \u003cstrong>GRM\u003c/strong> = price ÷ \u003cstrong>monthly\u003c/strong> gross rent (houses, duplexes); \u003cstrong>GIM\u003c/strong> = price ÷ \u003cstrong>annual\u003c/strong> gross income.\u003c/p>\n\u003cp>\u003cstrong>Reconciliation:\u003c/strong> the appraiser weighs the approaches by their reliability for the property — never a simple average. \u003cstrong>USPAP\u003c/strong> governs appraisal practice.\u003c/p>\n\u003cp>\u003cstrong>Who may appraise:\u003c/strong> federally related transactions require a state-licensed or certified appraiser. A real estate licensee may prepare CMAs/BPOs and charge for them, but may never label them appraisals; per the manual, a licensee doing appraisal work outside federally related transactions must still follow USPAP.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>IRV. NOI excludes debt service and depreciation. GRM monthly, GIM annual. Reconcile, don't average.\u003c/p>\n"},{"id":"L17-1","ch":"ch17","title":"Investment analysis","type":"conceptual","pri":"medium","min":25,"manual":"M12 §Investment analysis","pre":["L16-4"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Advantages of real estate investment:\u003c/strong> income, appreciation, \u003cstrong>leverage\u003c/strong> (borrowed money magnifying returns on equity), tax shelter. \u003cstrong>Disadvantages:\u003c/strong> \u003cstrong>illiquidity\u003c/strong>, management burden, risk.\u003c/p>\n\u003cp>\u003cstrong>Measures:\u003c/strong> \u003cstrong>cash flow = NOI − debt service\u003c/strong>; \u003cstrong>cap rate = NOI ÷ price\u003c/strong>; equity buildup; appreciation.\u003c/p>\n\u003cp>\u003cstrong>Risks:\u003c/strong> business, financial (debt), market, interest-rate, liquidity.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Cash flow = NOI − debt service. Cap rate = NOI ÷ price. Leverage cuts both ways.\u003c/p>\n"},{"id":"L17-2","ch":"ch17","title":"Business opportunity brokerage","type":"conceptual","pri":"low","min":15,"manual":"M12 §Investment analysis and business brokerage","pre":["L17-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Business opportunity brokerage\u003c/strong> is selling a going concern: real estate (if any) plus \u003cstrong>goodwill\u003c/strong>, fixtures, equipment and inventory. Under Chapter 475, brokering business opportunities for compensation requires a real estate license, particularly when real property is included (the manual's wording). Business sales are outside the brokerage-relationship disclosure rules except property with four or fewer residential units (V-20).\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Business = goodwill + assets (+ real estate). Brokering it for pay needs a license.\u003c/p>\n"},{"id":"L18-1","ch":"ch18","title":"Florida property taxation: process and calendar","type":"legal","pri":"medium","min":25,"manual":"M12 §Property taxation in Florida","pre":["L08-4"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>Florida property taxes are \u003cstrong>ad valorem\u003c/strong> (by value) and fund local government; there is no state property tax. The county \u003cstrong>property appraiser\u003c/strong> assesses each parcel at \u003cstrong>just value\u003c/strong> as of \u003cstrong>January 1\u003c/strong>. In \u003cstrong>August\u003c/strong> the \u003cstrong>TRIM\u003c/strong> (Truth in Millage) notice shows proposed values and rates. An owner who disagrees can talk informally with the appraiser and petition the \u003cstrong>Value Adjustment Board (VAB)\u003c/strong>. Bills are mailed from \u003cstrong>November 1\u003c/strong> with early-payment discounts of \u003cstrong>4% (Nov), 3% (Dec), 2% (Jan), 1% (Feb)\u003c/strong>; taxes become \u003cstrong>delinquent April 1\u003c/strong> and are enforced through \u003cstrong>tax certificates\u003c/strong> and, eventually, a tax deed sale.\u003c/p>\n\u003cp>\u003cstrong>Special assessments\u003c/strong> are not ad valorem: charges on properties specially benefited by an improvement (sewer, paving), often per front foot, with lien priority like property taxes.\u003c/p>\n\u003cp>\u003cstrong>Watch item (V-23):\u003c/strong> a homestead property-tax amendment (CS/HJR 1-F) is on the November 2026 ballot. It is not law unless approved, and exam questions usually lag law changes.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Jan 1 assess · Aug TRIM · Nov bills (4-3-2-1%) · Apr 1 delinquent. Special assessments ≠ ad valorem.\u003c/p>\n"},{"id":"L18-2","ch":"ch18","title":"Exemptions, Save Our Homes and tax computation","type":"calculation","pri":"high","min":35,"manual":"M12 §Property taxation in Florida (exemptions, millage)","pre":["L18-1","L14-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Taxable value = assessed value − exemptions.\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Homestead:\u003c/strong> first \u003cstrong>\u003cspan class=\"math inline\">25, 000 *  * \u003cem>o\u003c/em>\u003cem>f\u003c/em>\u003cem>a\u003c/em>\u003cem>s\u003c/em>\u003cem>s\u003c/em>\u003cem>e\u003c/em>\u003cem>s\u003c/em>\u003cem>s\u003c/em>\u003cem>e\u003c/em>\u003cem>d\u003c/em>\u003cem>v\u003c/em>\u003cem>a\u003c/em>\u003cem>l\u003c/em>\u003cem>u\u003c/em>\u003cem>e\u003c/em>\u003cem>e\u003c/em>\u003cem>x\u003c/em>\u003cem>e\u003c/em>\u003cem>m\u003c/em>\u003cem>p\u003c/em>\u003cem>t\u003c/em>\u003cem>f\u003c/em>\u003cem>r\u003c/em>\u003cem>o\u003c/em>\u003cem>m\u003c/em> *  * \u003cem>a\u003c/em>\u003cem>l\u003c/em>\u003cem>l\u003c/em> *  * \u003cem>t\u003c/em>\u003cem>a\u003c/em>\u003cem>x\u003c/em>\u003cem>e\u003c/em>\u003cem>s\u003c/em>; \u003cem>a\u003c/em>\u003cem>n\u003c/em> *  * \u003cem>a\u003c/em>\u003cem>d\u003c/em>\u003cem>d\u003c/em>\u003cem>i\u003c/em>\u003cem>t\u003c/em>\u003cem>i\u003c/em>\u003cem>o\u003c/em>\u003cem>n\u003c/em>\u003cem>a\u003c/em>\u003cem>l\u003c/em>\u003cem>e\u003c/em>\u003cem>x\u003c/em>\u003cem>e\u003c/em>\u003cem>m\u003c/em>\u003cem>p\u003c/em>\u003cem>t\u003c/em>\u003cem>i\u003c/em>\u003cem>o\u003c/em>\u003cem>n\u003c/em> *  * \u003cem>o\u003c/em>\u003cem>f\u003c/em>\u003cem>u\u003c/em>\u003cem>p\u003c/em>\u003cem>t\u003c/em>\u003cem>o\u003c/em> * *\u003c/span>25,000\u003c/strong> on assessed value above **\u003cspan class=\"math inline\">50, 000 * *,\u003cem>f\u003c/em>\u003cem>o\u003c/em>\u003cem>r\u003c/em> *  * \u003cem>n\u003c/em>\u003cem>o\u003c/em>\u003cem>n\u003c/em> − \u003cem>s\u003c/em>\u003cem>c\u003c/em>\u003cem>h\u003c/em>\u003cem>o\u003c/em>\u003cem>o\u003c/em>\u003cem>l\u003c/em> *  * \u003cem>t\u003c/em>\u003cem>a\u003c/em>\u003cem>x\u003c/em>\u003cem>e\u003c/em>\u003cem>s\u003c/em>\u003cem>o\u003c/em>\u003cem>n\u003c/em>\u003cem>l\u003c/em>\u003cem>y\u003c/em>.\u003cem>S\u003c/em>\u003cem>i\u003c/em>\u003cem>n\u003c/em>\u003cem>c\u003c/em>\u003cem>e\u003c/em>2025\u003cem>t\u003c/em>\u003cem>h\u003c/em>\u003cem>e\u003c/em>\u003cem>a\u003c/em>\u003cem>d\u003c/em>\u003cem>d\u003c/em>\u003cem>i\u003c/em>\u003cem>t\u003c/em>\u003cem>i\u003c/em>\u003cem>o\u003c/em>\u003cem>n\u003c/em>\u003cem>a\u003c/em>\u003cem>l\u003c/em>\u003cem>e\u003c/em>\u003cem>x\u003c/em>\u003cem>e\u003c/em>\u003cem>m\u003c/em>\u003cem>p\u003c/em>\u003cem>t\u003c/em>\u003cem>i\u003c/em>\u003cem>o\u003c/em>\u003cem>n\u003c/em>\u003cem>i\u003c/em>\u003cem>s\u003c/em> *  * \u003cem>i\u003c/em>\u003cem>n\u003c/em>\u003cem>d\u003c/em>\u003cem>e\u003c/em>\u003cem>x\u003c/em>\u003cem>e\u003c/em>\u003cem>d\u003c/em>\u003cem>t\u003c/em>\u003cem>o\u003c/em>\u003cem>C\u003c/em>\u003cem>P\u003c/em>\u003cem>I\u003c/em> *  * (\u003c/span>25,722 for 2025, V-09). Exam math usually uses $25,000.\u003c/li>\n\u003cli>\u003cstrong>$5,000\u003c/strong> each for a widow/widower, blind person, or totally and permanently disabled person (V-10; older books say $500).\u003c/li>\n\u003cli>Disabled veterans: larger or total exemptions (details not covered).\u003c/li>\n\u003cli>\u003cstrong>Green Belt:\u003c/strong> agricultural land assessed on use value.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Save Our Homes:\u003c/strong> a homestead's assessed value can rise no more than \u003cstrong>3% per year or the CPI change, whichever is less\u003c/strong>; the accumulated benefit is \u003cstrong>portable\u003c/strong> to a new Florida homestead (limits apply). A sale resets assessed value to just value.\u003c/p>\n\u003cp>\u003cstrong>Computing tax:\u003c/strong> tax = taxable value × mills ÷ 1,000 (1 mill = $1 per $1,000 = 0.001). Run school and non-school taxable values separately.\u003c/p>\n\u003cp>Worked example (manual): assessed \u003cspan class=\"math inline\">310, 000, \u003cem>h\u003c/em>\u003cem>o\u003c/em>\u003cem>m\u003c/em>\u003cem>e\u003c/em>\u003cem>s\u003c/em>\u003cem>t\u003c/em>\u003cem>e\u003c/em>\u003cem>a\u003c/em>\u003cem>d\u003c/em>.\u003cem>S\u003c/em>\u003cem>c\u003c/em>\u003cem>h\u003c/em>\u003cem>o\u003c/em>\u003cem>o\u003c/em>\u003cem>l\u003c/em> : 310, 000 − 25, 000 = 285, 000 × 6\u003cem>m\u003c/em>\u003cem>i\u003c/em>\u003cem>l\u003c/em>\u003cem>l\u003c/em>\u003cem>s\u003c/em> =  * *\u003c/span>1,710**. Non-school: 310,000 − 50,000 = 260,000 × 9 mills = \u003cstrong>\u003cspan class=\"math inline\">2, 340 *  * .\u003cem>T\u003c/em>\u003cem>o\u003c/em>\u003cem>t\u003c/em>\u003cem>a\u003c/em>\u003cem>l\u003c/em> * *\u003c/span>4,050\u003c/strong>.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>25k all taxes + 25k (CPI-indexed) non-school above 50k. 5k widow/blind/disabled. SOH 3% or CPI. Mills ÷ 1,000.\u003c/p>\n"},{"id":"L18-3","ch":"ch18","title":"Income taxes and real estate","type":"conceptual","pri":"medium","min":25,"manual":"M12 §Installment sales, boot; §Investment analysis (tax shelter)","pre":["L17-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Depreciation (cost recovery):\u003c/strong> straight-line over \u003cstrong>27.5 years\u003c/strong> (residential rental) or \u003cstrong>39 years\u003c/strong> (nonresidential); buildings only, never land.\u003c/p>\n\u003cp>\u003cstrong>Basis:\u003c/strong> cost; \u003cstrong>adjusted basis\u003c/strong> = cost + improvements − depreciation. \u003cstrong>Capital gain\u003c/strong> = amount realized − adjusted basis. Depreciation lowers basis, so gain grows; depreciation taken is \u003cstrong>recaptured\u003c/strong> at sale.\u003c/p>\n\u003cp>\u003cstrong>1031 like-kind exchange:\u003c/strong> defers tax on investment or business real property exchanged for like-kind property. \u003cstrong>Boot\u003c/strong> (cash, debt relief, personal property) is taxable to the extent of gain, but does not disqualify the exchange.\u003c/p>\n\u003cp>\u003cstrong>Principal residence exclusion:\u003c/strong> \u003cstrong>\u003cspan class=\"math inline\">250, 000 *  * \u003cem>s\u003c/em>\u003cem>i\u003c/em>\u003cem>n\u003c/em>\u003cem>g\u003c/em>\u003cem>l\u003c/em>\u003cem>e\u003c/em>/ * *\u003c/span>500,000\u003c/strong> married filing jointly, if owned and used as the main home \u003cstrong>2 of the last 5 years\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>Installment sale:\u003c/strong> the seller recognizes gain as payments are received, spreading the tax.\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>27.5 / 39 · land never. 1031 = investment, boot taxed. Home = 250/500, 2 of 5.\u003c/p>\n"},{"id":"L19-1","ch":"ch19","title":"Planning, zoning and land-use controls","type":"legal","pri":"medium","min":25,"manual":"M12 §Planning, zoning, and building","pre":["L09-4"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>Land-use control is \u003cstrong>police power\u003c/strong> — regulation for health, safety and welfare, with \u003cstrong>no compensation\u003c/strong> owed. \u003cstrong>Eminent domain\u003c/strong> is the government \u003cstrong>taking\u003c/strong> property for public use through condemnation, requiring \u003cstrong>just compensation\u003c/strong>. When regulation destroys all value, the owner may sue for \u003cstrong>inverse condemnation\u003c/strong>.\u003c/p>\n\u003cp>Every Florida local government has a \u003cstrong>comprehensive plan\u003c/strong>; \u003cstrong>zoning\u003c/strong> implements it (residential, commercial, industrial, agricultural, special districts; \u003cstrong>buffer zones\u003c/strong> ease transitions).\u003c/p>\n\u003cp>\u003cstrong>Relief and special cases:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Variance\u003c/strong> — permission to deviate from a dimensional rule (setback, height) because of hardship unique to the parcel.\u003c/li>\n\u003cli>\u003cstrong>Special exception / conditional use\u003c/strong> — a use the code permits with case-by-case approval (school, church, daycare).\u003c/li>\n\u003cli>\u003cstrong>Nonconforming use\u003c/strong> — lawful before the code changed (\"grandfathered\"); may continue but usually not expand; if destroyed or abandoned, may not resume.\u003c/li>\n\u003cli>\u003cstrong>Rezoning\u003c/strong> — changing the district itself.\u003c/li>\n\u003cli>\u003cstrong>PUD\u003c/strong> (planned unit development) — mixed uses with clustered density traded for open space.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Construction control:\u003c/strong> building permits, inspections, and a \u003cstrong>certificate of occupancy\u003c/strong> before use. Florida contractors are licensed by the CILB (manual).\u003c/p>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Regulate (police power) = no pay. Take (eminent domain) = just compensation. Hardship + dimensions = variance; permitted-with-approval use = special exception.\u003c/p>\n"},{"id":"L19-2","ch":"ch19","title":"Environmental hazards and regulation","type":"legal","pri":"medium","min":20,"manual":"M12 §Environmental law","pre":["L19-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Lead-based paint\u003c/strong> (federal): housing built \u003cstrong>before 1978\u003c/strong> — sellers and landlords disclose known hazards, give the EPA pamphlet, and buyers get a \u003cstrong>10-day\u003c/strong> inspection opportunity (may be waived). Licensees share responsibility for compliance.\u003c/li>\n\u003cli>\u003cstrong>Radon\u003c/strong> (Florida): a statutory radon notice appears in every \u003cstrong>sale and lease\u003c/strong> contract.\u003c/li>\n\u003cli>\u003cstrong>Asbestos\u003c/strong> (insulation, pre-1980s): dangerous when \u003cstrong>friable\u003c/strong>; encapsulation is often safer than removal.\u003c/li>\n\u003cli>\u003cstrong>CERCLA/Superfund:\u003c/strong> strict, joint and several liability for cleanup — an owner can be liable without causing the contamination; the innocent-landowner defense requires due diligence (Phase I environmental audit).\u003c/li>\n\u003cli>Other terms: \u003cstrong>brownfields\u003c/strong> (redeveloped contaminated sites), \u003cstrong>wetlands\u003c/strong> permitting, \u003cstrong>EIS\u003c/strong> (environmental impact statement for major federal actions), \u003cstrong>underground storage tanks\u003c/strong> (e.g., near gas stations).\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>1978 = lead paint (not 1988, the fair housing year). Radon notice in every sale and lease. CERCLA = owner liable without fault.\u003c/p>\n"}],"order":["L01-1","L01-2","L02-1","L02-2","L02-3","L03-1","L03-2","L03-3","L03-4","L04-1","L04-2","L04-3","L04-4","L05-1","L05-2","L05-3","L05-4","L06-1","L06-2","L06-3","L07-1","L07-2","L07-3","L07-4","L08-1","L08-2","L08-3","L08-4","L08-5","L09-1","L09-2","L09-3","L09-4","L09-5","L10-1","L14-1","L10-2","L11-1","L11-2","L11-3","L11-4","L12-1","L12-2","L12-3","L13-1","L13-2","L13-3","L14-2","L14-3","L14-4","L14-5","L14-6","L14-7","L14-8","L15-1","L16-1","L16-2","L16-3","L16-4","L17-1","L17-2","L18-1","L18-2","L18-3","L19-1","L19-2"],"objectives":[{"id":"O-L01-1-1","l":"L01-1","kind":"understand","text":"Explain the difference between federal law, Florida statutes, Florida administrative rules, and court decisions, and give one real estate example of each."},{"id":"O-L01-1-2","l":"L01-1","kind":"recall","text":"Name Chapter 475 F.S., Chapter 455 F.S., and Rule Chapter 61J2 F.A.C. and say what each governs."},{"id":"O-L01-1-3","l":"L01-1","kind":"understand","text":"Describe in one sentence each what the FREC, the DBPR and the courts do in real estate regulation."},{"id":"O-L01-1-4","l":"L01-1","kind":"apply","text":"Identify which source of law answers a given exam question (federal, Florida statute, FREC rule, case law)."},{"id":"O-L01-2-1","l":"L01-2","kind":"recall","text":"List the five categories of real property use (residential, commercial, industrial, agricultural, special-purpose) and classify examples."},{"id":"O-L01-2-2","l":"L01-2","kind":"understand","text":"Describe the main real estate specializations (brokerage, appraisal, property management, financing, development/construction, counseling)."},{"id":"O-L01-2-3","l":"L01-2","kind":"recall","text":"Explain that REALTOR® is a trademark of NAR membership, not a license, and distinguish it from the state license."},{"id":"O-L02-1-1","l":"L02-1","kind":"recall","text":"State the three elements that require a license: a real estate service, for another, for compensation."},{"id":"O-L02-1-2","l":"L02-1","kind":"recall","text":"List the real estate services named in Chapter 475 (A BAR SALE and related acts)."},{"id":"O-L02-1-3","l":"L02-1","kind":"apply","text":"Decide whether a person in a scenario needs a license, paying attention to how they are paid."},{"id":"O-L02-2-1","l":"L02-2","kind":"recall","text":"List the statutory exemptions in s. 475.011."},{"id":"O-L02-2-2","l":"L02-2","kind":"apply","text":"Recognize when a change in compensation or role removes an exemption (salary vs per-transaction pay; attorney earning a commission)."},{"id":"O-L02-3-1","l":"L02-3","kind":"recall","text":"State the applicant requirements (age 18, high school diploma or equivalent, SSN) and what is NOT required (citizenship, Florida residency)."},{"id":"O-L02-3-2","l":"L02-3","kind":"recall","text":"State the 63-hour course, its 2-year validity for taking the exam, and the 75/100 passing score."},{"id":"O-L02-3-3","l":"L02-3","kind":"understand","text":"Explain how criminal history and false applications are treated, and what happens after a denial."},{"id":"O-L02-3-4","l":"L02-3","kind":"apply","text":"Apply the mutual recognition rules (nonresident at application, 40-question law exam, 30 to pass)."},{"id":"O-L03-1-1","l":"L03-1","kind":"recall","text":"State FREC composition: 7 members, Governor + Senate, 4 brokers (5 yrs), 1 broker or sales associate (2 yrs), 2 consumer members, one member 60+, 4-year terms."},{"id":"O-L03-1-2","l":"L03-1","kind":"understand","text":"Distinguish quasi-legislative, quasi-judicial and executive/administrative powers, and which body exercises each."},{"id":"O-L03-1-3","l":"L03-1","kind":"apply","text":"Answer 'which body does X' questions: DBPR investigates; FREC disciplines; courts imprison and award damages."},{"id":"O-L03-2-1","l":"L03-2","kind":"understand","text":"Distinguish sales associate, broker and broker associate, and what only a broker may do."},{"id":"O-L03-2-2","l":"L03-2","kind":"understand","text":"Distinguish licensure from registration, and group licenses from multiple licenses."},{"id":"O-L03-2-3","l":"L03-2","kind":"recall","text":"State the broker path: 24 months active in the preceding 5 years, 72-hour course, broker exam, 60 hours post-license."},{"id":"O-L03-3-1","l":"L03-3","kind":"recall","text":"State the 45-hour post-license requirement and the consequence of missing it (license null and void)."},{"id":"O-L03-3-2","l":"L03-3","kind":"recall","text":"State the 14-hour CE requirement per 2-year renewal (3 Core Law + 3 Ethics + 8 specialty) and the consequence of missing renewal (involuntary inactive)."},{"id":"O-L03-3-3","l":"L03-3","kind":"recall","text":"State the reactivation rules: ≤12 months 14 hours; 12–24 months 28-hour course; >24 months void."},{"id":"O-L03-3-4","l":"L03-3","kind":"understand","text":"Distinguish active, voluntary inactive, involuntary inactive, suspended, revoked, null and void, and ineffective."},{"id":"O-L03-4-1","l":"L03-4","kind":"recall","text":"State the 10-day address-change notice and the 30-day duty to report a conviction or plea (including nolo contendere)."},{"id":"O-L03-4-2","l":"L03-4","kind":"apply","text":"Recognize that a sales associate cannot perform services between brokers until the change is registered."},{"id":"O-L03-4-3","l":"L03-4","kind":"recall","text":"State that a sales associate may hold only one license and work for one employer at a time."},{"id":"O-L04-1-1","l":"L04-1","kind":"recall","text":"Name the three authorized relationships and state that transaction broker is presumed unless another is established in writing."},{"id":"O-L04-1-2","l":"L04-1","kind":"understand","text":"Explain why dual agency is illegal in Florida and the lawful alternative for working both sides."},{"id":"O-L04-1-3","l":"L04-1","kind":"understand","text":"Distinguish a principal (single agent) from a customer (transaction broker / no relationship)."},{"id":"O-L04-2-1","l":"L04-2","kind":"recall","text":"List the 3 duties owed with no brokerage relationship."},{"id":"O-L04-2-2","l":"L04-2","kind":"recall","text":"List the 7 transaction-broker duties, including what limited confidentiality protects."},{"id":"O-L04-2-3","l":"L04-2","kind":"recall","text":"List the 9 single-agent duties and the four that belong only to the single agent (loyalty, obedience, full confidentiality, full disclosure)."},{"id":"O-L04-2-4","l":"L04-2","kind":"apply","text":"Match a described duty to the relationship that owes it."},{"id":"O-L04-3-1","l":"L04-3","kind":"recall","text":"State when the Single Agent Notice and the No Brokerage Relationship Notice must be given; transaction broker needs no notice."},{"id":"O-L04-3-2","l":"L04-3","kind":"understand","text":"Explain the Consent to Transition to Transaction Broker and when it is used."},{"id":"O-L04-3-3","l":"L04-3","kind":"recall","text":"Define 'residential sale' (≤4 units; unimproved for ≤4 units; agricultural ≤10 acres)."},{"id":"O-L04-3-4","l":"L04-3","kind":"apply","text":"Identify situations where disclosure is not required (represented party, open house, casual encounter, general questions, auctions, appraisals, leases without option, business sales)."},{"id":"O-L04-4-1","l":"L04-4","kind":"apply","text":"Decide whether a fact must be disclosed (latent material defect vs stigma such as death or HIV status)."},{"id":"O-L04-4-2","l":"L04-4","kind":"recall","text":"State the designated sales associate conditions: nonresidential, buyer and seller each with assets of $1 million or more, written request/disclosures."},{"id":"O-L04-4-3","l":"L04-4","kind":"understand","text":"List how brokerage relationships end and which duties survive termination."},{"id":"O-L05-1-1","l":"L05-1","kind":"recall","text":"State where escrow may be held and the interest-bearing account consent rule."},{"id":"O-L05-1-2","l":"L05-1","kind":"calculate","text":"Compute the sales associate's and broker's deposit deadlines (next business day; end of third business day) from a receipt date."},{"id":"O-L05-1-3","l":"L05-1","kind":"recall","text":"State the broker's personal-funds limits ($1,000 sales; $5,000 property management) and define commingling and conversion."},{"id":"O-L05-2-1","l":"L05-2","kind":"recall","text":"State the 15-business-day notice and 30-business-day procedure deadlines, and the 90-day mediation limit."},{"id":"O-L05-2-2","l":"L05-2","kind":"recall","text":"Name the four settlement procedures and when an EDO is available."},{"id":"O-L05-2-3","l":"L05-2","kind":"apply","text":"Recognize the statutory exceptions (condo buyer cancellation; good-faith financing failure)."},{"id":"O-L05-3-1","l":"L05-3","kind":"recall","text":"State that every advertisement must include the registered brokerage name; define a blind ad."},{"id":"O-L05-3-2","l":"L05-3","kind":"apply","text":"Decide whether an ad (sign, social media, website, team ad) complies."},{"id":"O-L05-4-1","l":"L05-4","kind":"recall","text":"State the office and entrance-sign requirements ('Licensed Real Estate Broker')."},{"id":"O-L05-4-2","l":"L05-4","kind":"apply","text":"Decide whether a payment is lawful (unlicensed assistant, gift from customer, rebate to a party, referral between licensees)."},{"id":"O-L05-4-3","l":"L05-4","kind":"recall","text":"State the rental-list refund rules (75% if no rental, full if inaccurate, demand within 30 days)."},{"id":"O-L05-4-4","l":"L05-4","kind":"understand","text":"Explain why commission rates must be negotiated individually (antitrust/price fixing)."},{"id":"O-L06-1-1","l":"L06-1","kind":"recall","text":"Put the steps in order: complaint → investigation → probable cause → formal complaint → hearing → final order → appeal."},{"id":"O-L06-1-2","l":"L06-1","kind":"understand","text":"Distinguish informal and formal hearings and who presides."},{"id":"O-L06-1-3","l":"L06-1","kind":"recall","text":"State the 30-day appeal window to the District Court of Appeal."},{"id":"O-L06-2-1","l":"L06-2","kind":"recall","text":"State the administrative penalties and limits ($5,000 per violation; suspension up to 10 years; revocation)."},{"id":"O-L06-2-2","l":"L06-2","kind":"recall","text":"State the criminal classifications (unlicensed practice: third-degree felony)."},{"id":"O-L06-2-3","l":"L06-2","kind":"understand","text":"Distinguish fraud, misrepresentation, concealment, false promises, culpable negligence and breach of trust."},{"id":"O-L06-2-4","l":"L06-2","kind":"recall","text":"State the 5-year record-keeping rule."},{"id":"O-L06-3-1","l":"L06-3","kind":"recall","text":"State the caps ($50,000 per transaction; $150,000 per licensee) and what is not paid."},{"id":"O-L06-3-2","l":"L06-3","kind":"apply","text":"Decide who may and may not recover from the Fund."},{"id":"O-L06-3-3","l":"L06-3","kind":"recall","text":"State the consequence for the licensee (automatic suspension until repaid with interest)."},{"id":"O-L07-1-1","l":"L07-1","kind":"recall","text":"State the protected classes and when each was added (1866 race; 1968; sex 1974; familial status and handicap 1988)."},{"id":"O-L07-1-2","l":"L07-1","kind":"understand","text":"Define blockbusting, steering and redlining and other prohibited practices."},{"id":"O-L07-1-3","l":"L07-1","kind":"apply","text":"Apply the exemptions and when they are lost (broker used, discriminatory ad; never for race)."},{"id":"O-L07-1-4","l":"L07-1","kind":"understand","text":"Distinguish reasonable modifications from reasonable accommodations."},{"id":"O-L07-2-1","l":"L07-2","kind":"understand","text":"Match ADA, ECOA, HMDA and fair housing to their subject (public accommodation, credit, lending data, housing)."},{"id":"O-L07-2-2","l":"L07-2","kind":"recall","text":"State the Do Not Call established-business-relationship windows (18 months after a transaction, 3 months after an inquiry; the FTC rule now says 540 / 90 days)."},{"id":"O-L07-2-3","l":"L07-2","kind":"recall","text":"State the CAN-SPAM opt-out rule (honored within 10 business days)."},{"id":"O-L07-3-1","l":"L07-3","kind":"recall","text":"State RESPA's scope (federally related loans, 1–4 residential units) and its kickback prohibition."},{"id":"O-L07-3-2","l":"L07-3","kind":"recall","text":"State TRID timing: Loan Estimate within 3 business days of application; Closing Disclosure at least 3 business days before closing."},{"id":"O-L07-3-3","l":"L07-3","kind":"apply","text":"Identify TILA advertising trigger terms and the 3-business-day right of rescission (refinance/home equity on principal residence, not purchase loans)."},{"id":"O-L07-4-1","l":"L07-4","kind":"recall","text":"State how security deposits may be held and the 30-day notice of how they are held."},{"id":"O-L07-4-2","l":"L07-4","kind":"recall","text":"State the move-out timeline: 15 days to return, 30 days to send a claim by certified mail (or e-mail with a signed addendum), 15 days for the tenant to object."},{"id":"O-L07-4-3","l":"L07-4","kind":"recall","text":"State the termination notices for tenancies without a specific term: 60 / 30 / 30 / 7 days (current law)."},{"id":"O-L07-4-4","l":"L07-4","kind":"recall","text":"State the landlord's flood disclosure duty for residential leases of 1 year or longer (s. 83.512, since October 2025)."},{"id":"O-L08-1-1","l":"L08-1","kind":"recall","text":"Name the rights in the bundle (possession, control, enjoyment, exclusion, disposition)."},{"id":"O-L08-1-2","l":"L08-1","kind":"understand","text":"Distinguish fee simple absolute, fee simple defeasible and life estates."},{"id":"O-L08-1-3","l":"L08-1","kind":"understand","text":"Explain the life tenant's rights and duties (waste) and distinguish remainder from reversion."},{"id":"O-L08-2-1","l":"L08-2","kind":"understand","text":"Distinguish estate for years, periodic tenancy, tenancy at will and tenancy at sufferance."},{"id":"O-L08-2-2","l":"L08-2","kind":"understand","text":"Distinguish gross, net, percentage, ground, graduated and index leases."},{"id":"O-L08-2-3","l":"L08-2","kind":"apply","text":"Decide whether a transfer is an assignment or a sublease and who remains liable."},{"id":"O-L08-3-1","l":"L08-3","kind":"recall","text":"State Florida's defaults: unmarried co-owners with a silent deed = tenancy in common; married couple = tenancy by the entireties."},{"id":"O-L08-3-2","l":"L08-3","kind":"recall","text":"State the four unities (PITT) and the express survivorship language Florida requires for joint tenancy."},{"id":"O-L08-3-3","l":"L08-3","kind":"apply","text":"Determine who owns a property after a co-owner dies."},{"id":"O-L08-4-1","l":"L08-4","kind":"recall","text":"State the size limits (1/2 acre within a municipality; 160 contiguous acres outside)."},{"id":"O-L08-4-2","l":"L08-4","kind":"recall","text":"List the claims that can still reach a homestead (taxes and assessments, purchase or improvement debt, construction liens; federal liens)."},{"id":"O-L08-4-3","l":"L08-4","kind":"understand","text":"Explain the spouse/minor-child protections (spouse joins in deeds and mortgages; devise restrictions)."},{"id":"O-L08-5-1","l":"L08-5","kind":"understand","text":"Distinguish condominium (real property, unit + undivided share) from cooperative (shares + proprietary lease = personal property)."},{"id":"O-L08-5-2","l":"L08-5","kind":"recall","text":"State the cancellation periods: developer condo 15 days; resale condo 7 days excluding weekends and holidays (since July 2025; older texts 3 business days); timeshare 10 days."},{"id":"O-L08-5-3","l":"L08-5","kind":"recall","text":"State that an HOA disclosure summary must be given before contract, and the buyer's 3-day voiding right if it was not."},{"id":"O-L09-1-1","l":"L09-1","kind":"understand","text":"Distinguish voluntary transfer (deed, will) from involuntary transfer (descent, escheat, eminent domain, foreclosure, adverse possession)."},{"id":"O-L09-1-2","l":"L09-1","kind":"recall","text":"State Florida adverse possession: 7 years, open, notorious, hostile, continuous, plus color of title or payment of taxes."},{"id":"O-L09-1-3","l":"L09-1","kind":"understand","text":"Distinguish testate and intestate, devise and descent."},{"id":"O-L09-2-1","l":"L09-2","kind":"understand","text":"Rank deeds by protection (general warranty, special warranty, bargain and sale, quitclaim) and state what each warrants."},{"id":"O-L09-2-2","l":"L09-2","kind":"recall","text":"List the requirements of a valid Florida deed, including two witnesses and delivery/acceptance."},{"id":"O-L09-2-3","l":"L09-2","kind":"apply","text":"Identify what is NOT required for validity (grantee signature, recording, acknowledgment)."},{"id":"O-L09-3-1","l":"L09-3","kind":"understand","text":"Distinguish constructive and actual notice and explain why recording matters."},{"id":"O-L09-3-2","l":"L09-3","kind":"understand","text":"Compare abstract with attorney's opinion vs title insurance; owner's vs lender's policy."},{"id":"O-L09-4-1","l":"L09-4","kind":"understand","text":"Distinguish specific and general liens, and state lien priority (taxes and special assessments first, then recording order)."},{"id":"O-L09-4-2","l":"L09-4","kind":"understand","text":"Distinguish easement appurtenant, in gross, by necessity and by prescription (20 years), and a license."},{"id":"O-L09-4-3","l":"L09-4","kind":"understand","text":"Define encroachment and deed restriction."},{"id":"O-L09-5-1","l":"L09-5","kind":"apply","text":"Apply the fixture tests (intent, method of annexation, adaptation, relationship) and the trade-fixture rule."},{"id":"O-L09-5-2","l":"L09-5","kind":"understand","text":"Distinguish riparian and littoral rights, and accretion, erosion and avulsion."},{"id":"O-L10-1-1","l":"L10-1","kind":"understand","text":"Describe metes and bounds (POB, courses and distances), lot and block (recorded plat) and the government survey."},{"id":"O-L10-1-2","l":"L10-1","kind":"recall","text":"State that Florida's principal meridian and base line intersect in Tallahassee; a street address is not a legal description."},{"id":"O-L10-2-1","l":"L10-2","kind":"recall","text":"State township and section facts: 6 × 6 miles, 36 sections, 640 acres per section, section 1 in the northeast corner, serpentine numbering."},{"id":"O-L10-2-2","l":"L10-2","kind":"calculate","text":"Compute the acreage of an aliquot-part description, including 'and' descriptions."},{"id":"O-L10-2-3","l":"L10-2","kind":"calculate","text":"Convert between square feet, acres, square miles, feet and miles (43,560 sq ft; 5,280 ft)."},{"id":"O-L11-1-1","l":"L11-1","kind":"recall","text":"List the essential elements of a valid contract (competent parties, offer and acceptance, legal purpose, consideration)."},{"id":"O-L11-1-2","l":"L11-1","kind":"understand","text":"Distinguish bilateral/unilateral, executory/executed, express/implied; and void/voidable/unenforceable."},{"id":"O-L11-1-3","l":"L11-1","kind":"recall","text":"State the statute of frauds and the statute of limitations (5 years written, 4 years oral)."},{"id":"O-L11-2-1","l":"L11-2","kind":"apply","text":"Trace whether a contract exists after offers, revocations, counteroffers and rejections."},{"id":"O-L11-2-2","l":"L11-2","kind":"understand","text":"Explain option contracts (optionor/optionee) and equitable title."},{"id":"O-L11-2-3","l":"L11-2","kind":"understand","text":"Distinguish the remedies for breach (specific performance, liquidated damages, rescission, compensatory damages)."},{"id":"O-L11-3-1","l":"L11-3","kind":"understand","text":"Distinguish open, exclusive agency, exclusive right of sale and net listings and when commission is earned."},{"id":"O-L11-3-2","l":"L11-3","kind":"recall","text":"State the Florida written-listing rules: definite expiration date, no automatic renewal, copy to the seller within 24 hours."},{"id":"O-L11-3-3","l":"L11-3","kind":"understand","text":"State how listings terminate."},{"id":"O-L11-4-1","l":"L11-4","kind":"understand","text":"Explain the 'AS IS' contract, the effective date and 'time is of the essence'."},{"id":"O-L11-4-2","l":"L11-4","kind":"recall","text":"List the required disclosures: radon, lead-based paint (pre-1978), property-tax disclosure, energy-efficiency brochure, flood disclosure (s. 689.302), condo/HOA documents."},{"id":"O-L11-4-3","l":"L11-4","kind":"apply","text":"Apply Johnson v. Davis: known latent defects must be disclosed even in an AS IS sale."},{"id":"O-L12-1-1","l":"L12-1","kind":"understand","text":"Distinguish the promissory note from the mortgage; mortgagor from mortgagee."},{"id":"O-L12-1-2","l":"L12-1","kind":"recall","text":"State that Florida is a lien-theory state and the 60-day satisfaction rule."},{"id":"O-L12-1-3","l":"L12-1","kind":"understand","text":"Define the common clauses (acceleration, due-on-sale, prepayment, defeasance, subordination, release, exculpatory)."},{"id":"O-L12-2-1","l":"L12-2","kind":"understand","text":"Distinguish assumption (with or without novation) from taking 'subject to' a mortgage."},{"id":"O-L12-2-2","l":"L12-2","kind":"recall","text":"State that Florida foreclosure is judicial, equity of redemption ends at the sale, and there is no statutory redemption."},{"id":"O-L12-2-3","l":"L12-2","kind":"understand","text":"Compare short sale and deed in lieu of foreclosure (junior liens survive a deed in lieu)."},{"id":"O-L12-3-1","l":"L12-3","kind":"calculate","text":"Compute housing-expense and total-obligation ratios using gross monthly income and PITI."},{"id":"O-L12-3-2","l":"L12-3","kind":"recall","text":"State the usual benchmarks (conventional 28/36; FHA 31/43) as course conventions."},{"id":"O-L12-3-3","l":"L12-3","kind":"recall","text":"State Florida usury limits (18% simple on loans of $500,000 or less; 25% above) and name predatory practices."},{"id":"O-L13-1-1","l":"L13-1","kind":"understand","text":"State that FHA insures, VA guarantees, and neither lends; private lenders lend."},{"id":"O-L13-1-2","l":"L13-1","kind":"recall","text":"State FHA's MIP and 3.5% minimum down payment, VA's funding fee and CRV, and PMI above 80% LTV."},{"id":"O-L13-2-1","l":"L13-2","kind":"understand","text":"Distinguish amortized, partially amortized (balloon), interest-only and adjustable-rate loans (index + margin, caps)."},{"id":"O-L13-2-2","l":"L13-2","kind":"understand","text":"Distinguish package, blanket, wraparound, purchase-money, home equity, reverse and construction loans."},{"id":"O-L13-3-1","l":"L13-3","kind":"understand","text":"Sort lenders and agencies into primary vs secondary market (Fannie Mae, Freddie Mac, Ginnie Mae)."},{"id":"O-L13-3-2","l":"L13-3","kind":"understand","text":"Name the Fed's tools and their effect on credit."},{"id":"O-L13-3-3","l":"L13-3","kind":"calculate","text":"Compute the cost of points (1 point = 1% of the loan) and the approximate yield effect (1/8% per point, course rule of thumb)."},{"id":"O-L14-1-1","l":"L14-1","kind":"calculate","text":"Convert between fractions, decimals and percentages without errors in decimal placement."},{"id":"O-L14-1-2","l":"L14-1","kind":"calculate","text":"Solve Part = Total × Rate for any one unknown."},{"id":"O-L14-1-3","l":"L14-1","kind":"calculate","text":"Compute percentage change using the original value as the base."},{"id":"O-L14-2-1","l":"L14-2","kind":"calculate","text":"Compute area of rectangles, triangles and composite shapes in square feet."},{"id":"O-L14-2-2","l":"L14-2","kind":"calculate","text":"Convert square feet ↔ square yards ↔ acres and feet ↔ yards ↔ miles; compute price per front foot."},{"id":"O-L14-3-1","l":"L14-3","kind":"calculate","text":"Compute total commission and each party's share through a chain of splits."},{"id":"O-L14-3-2","l":"L14-3","kind":"calculate","text":"Compute the sale price needed to net the seller a target amount: Price = Net ÷ (1 − rate)."},{"id":"O-L14-4-1","l":"L14-4","kind":"calculate","text":"Compute profit or loss percentage on cost."},{"id":"O-L14-4-2","l":"L14-4","kind":"calculate","text":"Recover the original cost from a sale price and a profit or loss percentage (divide, do not multiply)."},{"id":"O-L14-5-1","l":"L14-5","kind":"calculate","text":"Compute simple interest (I = P × R × T) and the interest/principal split of a monthly payment."},{"id":"O-L14-5-2","l":"L14-5","kind":"calculate","text":"Compute LTV using the lesser of price or appraised value, and the down payment."},{"id":"O-L14-5-3","l":"L14-5","kind":"calculate","text":"Compute the cost of discount points."},{"id":"O-L14-6-1","l":"L14-6","kind":"calculate","text":"Compute deed stamps ($0.70 per $100 or portion, on the full price; Miami-Dade single-family $0.60)."},{"id":"O-L14-6-2","l":"L14-6","kind":"calculate","text":"Compute note stamps ($0.35 per $100 or portion) on new and assumed mortgages (course convention)."},{"id":"O-L14-6-3","l":"L14-6","kind":"calculate","text":"Compute intangible tax (0.002 × new mortgage only)."},{"id":"O-L14-6-4","l":"L14-6","kind":"recall","text":"State who customarily pays each tax."},{"id":"O-L14-7-1","l":"L14-7","kind":"calculate","text":"Prorate an annual expense with the 365-day method, the buyer owning the day of closing."},{"id":"O-L14-7-2","l":"L14-7","kind":"understand","text":"Decide which party is debited and credited for items paid in arrears vs in advance."},{"id":"O-L14-7-3","l":"L14-7","kind":"calculate","text":"Prorate rent and mortgage interest."},{"id":"O-L14-8-1","l":"L14-8","kind":"apply","text":"Place each closing item as debit/credit for buyer and/or seller (single vs double entry)."},{"id":"O-L14-8-2","l":"L14-8","kind":"calculate","text":"Compute the cash due from the buyer and to the seller."},{"id":"O-L15-1-1","l":"L15-1","kind":"understand","text":"Explain why real estate markets are local and slow to adjust; name the supply and demand factors."},{"id":"O-L15-1-2","l":"L15-1","kind":"understand","text":"Distinguish a CMA, a BPO and an appraisal, and what a licensee may charge for."},{"id":"O-L16-1-1","l":"L16-1","kind":"recall","text":"State the four elements of value (DUST) and distinguish market value, price, cost, assessed and insurable value."},{"id":"O-L16-1-2","l":"L16-1","kind":"understand","text":"Explain substitution, highest and best use, anticipation, contribution, conformity, progression/regression and plottage/assemblage."},{"id":"O-L16-2-1","l":"L16-2","kind":"calculate","text":"Adjust comparables (never the subject): comparable better → subtract; inferior → add."},{"id":"O-L16-2-2","l":"L16-2","kind":"understand","text":"Explain which comparable deserves the most weight."},{"id":"O-L16-3-1","l":"L16-3","kind":"calculate","text":"Compute value = land + cost new − accrued depreciation."},{"id":"O-L16-3-2","l":"L16-3","kind":"understand","text":"Distinguish reproduction from replacement cost and the three types of depreciation (external obsolescence always incurable)."},{"id":"O-L16-4-1","l":"L16-4","kind":"calculate","text":"Build NOI (PGI − vacancy & collection loss − operating expenses) and apply IRV."},{"id":"O-L16-4-2","l":"L16-4","kind":"calculate","text":"Apply GRM (monthly) and GIM (annual)."},{"id":"O-L16-4-3","l":"L16-4","kind":"understand","text":"Explain reconciliation and the federally related transaction rule (licensed/certified appraiser)."},{"id":"O-L17-1-1","l":"L17-1","kind":"understand","text":"Explain leverage, liquidity and the types of risk."},{"id":"O-L17-1-2","l":"L17-1","kind":"calculate","text":"Compute cash flow (NOI − debt service) and cap rate."},{"id":"O-L17-2-1","l":"L17-2","kind":"understand","text":"Explain what a business brokerage transaction includes (going concern, goodwill, fixtures, inventory) and when a real estate license is needed."},{"id":"O-L18-1-1","l":"L18-1","kind":"recall","text":"State the January 1 assessment date, TRIM notice in August, VAB appeals, November bills with 4%→1% discounts, April 1 delinquency."},{"id":"O-L18-1-2","l":"L18-1","kind":"understand","text":"Explain ad valorem taxes vs special assessments and the role of tax certificates."},{"id":"O-L18-2-1","l":"L18-2","kind":"recall","text":"State the homestead exemptions ($25,000 all taxes + up to $25,000 CPI-indexed non-school above $50,000) and the $5,000 widow/blind/disabled exemption."},{"id":"O-L18-2-2","l":"L18-2","kind":"recall","text":"State the Save Our Homes cap (3% or CPI, whichever is less; portable)."},{"id":"O-L18-2-3","l":"L18-2","kind":"calculate","text":"Compute a tax bill with separate school and non-school taxable values (1 mill = $1 per $1,000)."},{"id":"O-L18-3-1","l":"L18-3","kind":"recall","text":"State depreciation periods (27.5 residential rental; 39 nonresidential; land never)."},{"id":"O-L18-3-2","l":"L18-3","kind":"understand","text":"Distinguish a 1031 exchange (investment property, boot taxable) from the principal-residence exclusion ($250,000/$500,000; 2 of 5 years)."},{"id":"O-L18-3-3","l":"L18-3","kind":"understand","text":"Explain basis, adjusted basis, capital gain and installment sales."},{"id":"O-L19-1-1","l":"L19-1","kind":"understand","text":"Distinguish police power from eminent domain (just compensation; inverse condemnation)."},{"id":"O-L19-1-2","l":"L19-1","kind":"understand","text":"Distinguish variance, special exception, nonconforming use and rezoning; describe a PUD."},{"id":"O-L19-1-3","l":"L19-1","kind":"understand","text":"Explain comprehensive plans, building permits and certificates of occupancy."},{"id":"O-L19-2-1","l":"L19-2","kind":"recall","text":"State the lead-based paint rules (pre-1978, pamphlet, 10-day inspection right) and the Florida radon disclosure."},{"id":"O-L19-2-2","l":"L19-2","kind":"understand","text":"Explain CERCLA liability, asbestos, brownfields, wetlands and underground storage tanks."}],"questions":[{"id":"Q0101-01","l":"L01-1","o":1,"d":1,"t":"mcq","v":"V-03","q":"Which source contains Florida's real estate license law?","c":["Chapter 475, Florida Statutes","Chapter 455, Florida Statutes","Rule Chapter 61J2, Florida Administrative Code","The Fair Housing Act"],"a":0,"ex":"Chapter 475 F.S. is the real estate license law passed by the Legislature. Chapter 455 covers all DBPR professions generally; 61J2 contains FREC's rules made under Chapter 475.","w":{"1":["CONFUSED","Chapter 455 is the general law for all DBPR-regulated professions, not the real estate license law."],"2":["CONFUSED","61J2 is FREC's administrative rule chapter, adopted under the authority of Chapter 475."],"3":["RULE","The Fair Housing Act is federal anti-discrimination law."]}},{"id":"Q0101-02","l":"L01-1","o":0,"d":2,"t":"mcq","q":"The rule that a broker must deposit escrow funds by the end of the third business day is found in a rule adopted by the FREC. What kind of law is this?","c":["A federal statute","An administrative rule","A court decision","A constitutional provision"],"a":1,"ex":"Rules adopted by an agency (here the FREC, in Chapter 61J2 F.A.C.) are administrative rules. They carry the force of law but must stay within the statute that authorizes them.","w":{"0":["RULE","Escrow deadlines for Florida brokers are state rules, not federal statutes."],"2":["CONFUSED","Court decisions interpret law; they do not set escrow deadlines."],"3":["CONFUSED","The Florida Constitution does not contain escrow rules."]}},{"id":"Q0101-03","l":"L01-1","o":2,"d":1,"t":"mcq","q":"A licensee is accused of stealing escrow money. Which of the following can impose a prison sentence?","c":["The FREC","The DBPR","A criminal court","The probable cause panel"],"a":2,"ex":"Only a court can impose criminal penalties such as imprisonment. The FREC imposes administrative discipline (fines, suspension, revocation); the DBPR investigates.","w":{"0":["CONFUSED","The FREC disciplines the license but cannot imprison anyone."],"1":["CONFUSED","The DBPR investigates and administers; it cannot imprison."],"3":["CONFUSED","The probable cause panel only decides whether to file a formal complaint."]}},{"id":"Q0101-04","l":"L01-1","o":3,"d":2,"t":"mcq","q":"In Florida, a seller who knows of a hidden defect that materially affects the value of a home must disclose it to the buyer. The original source of this duty is:","c":["Rule Chapter 61J2 of the Florida Administrative Code","A Florida Supreme Court decision, Johnson v. Davis","The federal Real Estate Settlement Procedures Act","The Florida Realtors/Florida Bar contract form"],"a":1,"ex":"Johnson v. Davis (Fla. 1985) created the seller's duty to disclose known latent defects materially affecting value. It is case law. The contract forms reflect it but did not create it.","w":{"0":["CONFUSED","61J2 regulates licensees' conduct; the seller's disclosure duty comes from case law."],"2":["RULE","RESPA governs settlement procedures and kickbacks for federally related loans."],"3":["CONFUSED","Contract forms reflect the duty; a disclosure duty exists even without a form."]}},{"id":"Q0102-01","l":"L01-2","o":2,"d":1,"t":"mcq","q":"Which statement about the term REALTOR® is correct?","c":["It is the official title on a Florida sales associate license","It identifies a member of the National Association of REALTORS®","Every Florida broker must use it","It is issued by the FREC after the broker exam"],"a":1,"ex":"REALTOR® is a trademark identifying NAR members who subscribe to its Code of Ethics. Florida licenses are 'sales associate' and 'broker'.","w":{"0":["CONFUSED","The license title is 'sales associate'; REALTOR® is a trade-association membership mark."],"2":["RULE","Membership in NAR is voluntary."],"3":["CONFUSED","The FREC issues nothing related to the trademark."]}},{"id":"Q0102-02","l":"L01-2","o":0,"d":1,"t":"mcq","q":"A church, a school and a hospital are best classified as which category of property?","c":["Commercial","Industrial","Special-purpose","Mixed-use commercial"],"a":2,"ex":"Properties with a unique, limited use such as churches, schools and hospitals are special-purpose properties.","w":{"0":["CONFUSED","Commercial property produces income (offices, retail)."],"1":["CONFUSED","Industrial covers manufacturing and warehousing."],"3":["CONFUSED","Mixed-use combines residential and commercial uses."]}},{"id":"Q0102-03","l":"L01-2","o":1,"d":2,"t":"mcq","q":"A licensee who leases units, collects rents and arranges maintenance for an owner is working in which specialty?","c":["Appraisal and valuation","Property management","Land development","Real estate counseling"],"a":1,"ex":"Property management covers leasing, rent collection and maintenance on behalf of owners.","w":{"0":["CONFUSED","Appraisal is estimating value."],"2":["CONFUSED","Development is improving raw land."],"3":["CONFUSED","Counseling is giving real estate advice for a fee."]}},{"id":"Q0201-01","l":"L02-1","o":0,"d":1,"t":"mcq","q":"A Florida real estate license is required when a person performs a real estate service:","c":["for compensation, even on their own property","for another, for compensation","for another, even without any compensation","only if the person advertises to the public"],"a":1,"ex":"All three elements are needed: a real estate service, for another, for compensation (paid, promised or expected). Remove any one and no license is needed.","w":{"0":["QUALIFIER","Owners dealing with their own property are exempt."],"2":["QUALIFIER","Without compensation (or the expectation of it) no license is required."],"3":["RULE","Advertising is one service, but the test is service + for another + compensation."]}},{"id":"Q0201-02","l":"L02-1","o":2,"d":2,"t":"scn","q":"Marco, unlicensed, finds a buyer for his neighbour's house. The neighbour promises Marco a used car 'if the deal closes'. The deal closes and Marco receives the car. Which is correct?","c":["No license was needed, because compensation means a payment of money","No license was needed, because a single favour for a neighbour is exempt","Marco violated the law by performing a real estate service for compensation","Only the neighbour violated the law, by paying an unlicensed person"],"a":2,"ex":"Compensation means anything of value, including a car. Marco found a buyer (a real estate service) for another for compensation. One-time activity is not an exemption.","w":{"0":["QUALIFIER","Compensation includes anything of value, not just money."],"1":["RULE","There is no 'one-time favour' exemption when compensation is paid."],"3":["MISREAD","Marco is the one who performed services without a license."]}},{"id":"Q0201-03","l":"L02-1","o":1,"d":1,"t":"mcq","q":"Which activity is a real estate service under Chapter 475?","c":["Painting a house before it is listed","Leasing a property for another for a fee","Inspecting a roof for a buyer","Lending money secured by a mortgage"],"a":1,"ex":"Leasing for another for compensation is a listed service (A BAR SALE: Advertise, Buy, Appraise, Rent, Sell, Auction, Lease, Exchange).","w":{"0":["RULE","Painting is construction work, not a brokerage service."],"2":["RULE","Home inspection is a separate licensed profession."],"3":["RULE","Lending is regulated separately."]}},{"id":"Q0202-01","l":"L02-2","o":1,"d":2,"t":"scn","q":"A builder pays Sofia a fixed salary to sell homes in its subdivision. The builder then changes her pay to $1,000 for each home that closes. What is the effect?","c":["She remains exempt because she works for the owner","She now needs a real estate license","She needs a license only if she sells more than 10 homes a year","She may continue if the builder holds a broker license"],"a":1,"ex":"Salaried employees of an owner can be exempt, but commissions or per-transaction pay remove the exemption. Paid per closing, she is performing services for compensation tied to transactions and needs a license.","w":{"0":["QUALIFIER","The owner's-employee exemption depends on salary, not commission."],"2":["RULE","There is no volume threshold."],"3":["RULE","Even working for a broker, she would need her own license."]}},{"id":"Q0202-02","l":"L02-2","o":0,"d":2,"t":"mcq","v":"V-14","q":"Which person is exempt from real estate licensure under s. 475.011?","c":["A property manager paid 8% of collected rents to manage homes for several different owners","A salaried employee of the owner who leases units from the apartment community's onsite office","An unlicensed assistant whom the broker pays $200 for each showing she conducts for buyers","A friend of the broker who receives a referral fee each time she sends a buyer to the brokerage"],"a":1,"ex":"s. 475.011 exempts salaried employees of an owner (or of a broker for an owner) of an apartment community working in an onsite rental office in a leasing capacity.","w":{"0":["QUALIFIER","Managing property for several owners for a percentage of rents requires a license."],"2":["QUALIFIER","Per-showing pay for real estate services requires a license."],"3":["RULE","Paying an unlicensed person for referrals of real estate business is not allowed."]}},{"id":"Q0202-03","l":"L02-2","o":1,"d":3,"t":"scn","q":"An attorney at law handles a client's closing and also negotiates the sale of the client's property, charging a 3% commission on the price. Which is correct?","c":["Exempt, because attorneys at law are always exempt from Chapter 475","Exempt, because the commission was earned while handling the closing","Not exempt: earning a brokerage commission requires a real estate license","Exempt, as long as the attorney is a member in good standing of The Florida Bar"],"a":2,"ex":"Attorneys are exempt when acting within their legal duties. Charging a commission for brokerage services takes the attorney outside that exemption.","w":{"0":["QUALIFIER","The exemption covers legal services, not brokerage for a commission."],"1":["MISREAD","Handling the closing does not cover earning a sales commission."],"3":["QUALIFIER","Bar membership is what makes them a lawyer; it does not authorize brokerage commissions."]}},{"id":"Q0202-04","l":"L02-2","o":0,"d":2,"t":"mcq","v":"V-14","q":"Under s. 475.011, an attorney in fact (holding a power of attorney) is exempt when:","c":["acting only to execute contracts or conveyances for the owner","selling the owner's properties in exchange for a commission","advertising and negotiating the sale of the owner's property for a fee","managing the owner's rentals for a percentage of the rents collected"],"a":0,"ex":"The statute exempts attorneys in fact acting to execute contracts or conveyances only. Brokerage activity for compensation is not covered.","w":{"1":["QUALIFIER","Earning commissions is brokerage, not signing on the owner's behalf."],"2":["QUALIFIER","Advertising for several owners for pay is a real estate service."],"3":["QUALIFIER","Property management for a percentage requires a license."]}},{"id":"Q0203-01","l":"L02-3","o":0,"d":1,"t":"mcq","num":["N-002"],"q":"Which is NOT a requirement to apply for a Florida sales associate license?","c":["Being at least 18 years old","A high school diploma or its equivalent","A U.S. Social Security number","Florida residency"],"a":3,"ex":"Florida residency and U.S. citizenship are not required. Applicants must be 18+, have a high school diploma or equivalent, and a Social Security number.","w":{"0":["NUMBER","Age 18 is required."],"1":["RULE","A diploma or equivalent is required."],"2":["RULE","A Social Security number is required."]}},{"id":"Q0203-02","l":"L02-3","o":1,"d":1,"t":"mcq","num":["N-001"],"q":"A student completed the 63-hour pre-license course 26 months ago and has not taken the state exam. What is the status of the course for exam purposes?","c":["Still valid — course completion never expires for exam purposes","Expired — it is valid for 2 years for purposes of the state exam","Still valid — course completion is valid for 3 years for the exam","Still valid — it remains valid until the student takes the exam"],"a":1,"ex":"s. 475.181(2): the course completion becomes invalid if the state exam is not passed within 2 years after completing the course. At 26 months without a pass it has expired.","w":{"0":["NUMBER","Course completion is valid for 2 years."],"2":["NUMBER","2 years, not 3."],"3":["RULE","It expires after 2 years unless the exam has been passed; taking it is not enough."]}},{"id":"Q0203-03","l":"L02-3","o":2,"d":2,"t":"scn","q":"An applicant with a 7-year-old misdemeanor conviction answers 'No' to the criminal-history question. Which is the most accurate consequence?","c":["No consequence, because misdemeanors older than five years need not be disclosed","The false answer is itself grounds for denial or revocation and may be a crime","No consequence, because the FREC cannot consider any record older than 5 years","No consequence, because only felony convictions must be disclosed on applications"],"a":1,"ex":"Criminal history must be disclosed. An old record does not automatically disqualify, but a false answer on the application is grounds for denial or revocation and is itself a crime.","w":{"0":["RULE","Criminal history, including misdemeanors, must be disclosed."],"2":["RULE","There is no 5-year rule; the FREC weighs the record and the applicant's honesty."],"3":["RULE","Misdemeanors can also be considered; honesty is the issue."]}},{"id":"Q0203-04","l":"L02-3","o":3,"d":2,"t":"scn","num":["N-007"],"v":"V-22","q":"Lucas holds an active license in a state with a Florida mutual recognition agreement. He moved to Orlando last year and now wants a Florida license through mutual recognition. Which is correct?","c":["He may use mutual recognition and must pass a 40-question law exam","He cannot use mutual recognition because he is a Florida resident when applying","He must take only the 63-hour course","He may practice in Florida immediately under his home-state license"],"a":1,"ex":"Mutual recognition is only for applicants who are NOT Florida residents at the time of application. As a resident, Lucas must follow the normal path (63-hour course and state exam).","w":{"0":["QUALIFIER","The 40-question exam path is only for nonresidents."],"2":["RULE","Residents must complete the course AND pass the state exam."],"3":["RULE","No out-of-state license authorizes practice in Florida."]}},{"id":"Q0203-05","l":"L02-3","o":3,"d":1,"t":"mcq","num":["N-007"],"v":"V-22","q":"A nonresident licensee applying under mutual recognition must pass a Florida law exam of:","c":["100 questions, 75 correct","40 questions, 30 correct","50 questions, 35 correct","40 questions, 35 correct"],"a":1,"ex":"The mutual recognition exam is 40 questions on Florida law; 30 correct (75%) passes.","w":{"0":["CONFUSED","100/75 is the full sales associate exam."],"2":["NUMBER","It is 40 questions with 30 to pass."],"3":["NUMBER","30 correct passes, not 35."]}},{"id":"Q0301-01","l":"L03-1","o":0,"d":1,"t":"mcq","num":["N-020"],"v":"V-13","q":"How many members of the FREC must be licensed brokers who have held active licenses for the preceding 5 years?","c":["2","3","4","5"],"a":2,"ex":"Four members must be brokers active for the 5 preceding years; one is a broker or sales associate active for 2 years; two are consumer members who have never been licensed.","w":{"0":["CONFUSED","2 is the number of consumer members."],"1":["NUMBER","Four brokers, not three."],"3":["NUMBER","5 is the years of experience, not the number of members."]}},{"id":"Q0301-02","l":"L03-1","o":0,"d":2,"t":"mcq","num":["N-020"],"v":"V-13","q":"Which statement about FREC membership is correct?","c":["Members are elected by Florida licensees at the annual meeting, for 2-year terms","Members are appointed by the Governor, confirmed by the Senate, for 4-year terms","Members are appointed by the DBPR Secretary and serve until they choose to resign","Members are appointed by the Governor, and all seven must be licensed brokers"],"a":1,"ex":"The Governor appoints FRE
