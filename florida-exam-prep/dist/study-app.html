<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FL Exam Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: a survey-plat study desk — paper ground, ink type, a
   left rail of sections on wide screens that becomes a scrolling tab strip
   on phones. Accent is survey-blueprint blue; semantic colours carry state. */
:root {
  --paper: #f5f6f2;
  --surface: #ffffff;
  --sunk: #eceee8;
  --ink: #18222d;
  --muted: #5a6570;
  --line: #d8dcd4;
  --accent: #1d5b86;
  --accent-ink: #ffffff;
  --accent-soft: #e3edf5;
  --good: #2c6b4c;
  --good-soft: #e2f0e8;
  --bad: #ad3b26;
  --bad-soft: #f8e5e0;
  --warn: #9a6200;
  --warn-soft: #f7ecd6;
  --chip: #e9ece6;
  --font-display: "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 8px;
  --rail: 232px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1417; --surface: #161d21; --sunk: #1c252a; --ink: #e5eaee; --muted: #9ba7b1;
    --line: #2a353c; --accent: #73b2de; --accent-ink: #0b1a24; --accent-soft: #1b2e3b;
    --good: #72c79e; --good-soft: #17302a; --bad: #f08c74; --bad-soft: #3a211b;
    --warn: #e2b459; --warn-soft: #362c18; --chip: #222c32; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1417; --surface: #161d21; --sunk: #1c252a; --ink: #e5eaee; --muted: #9ba7b1;
  --line: #2a353c; --accent: #73b2de; --accent-ink: #0b1a24; --accent-soft: #1b2e3b;
  --good: #72c79e; --good-soft: #17302a; --bad: #f08c74; --bad-soft: #3a211b;
  --warn: #e2b459; --warn-soft: #362c18; --chip: #222c32; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.55 var(--font-body);
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }

/* Shell */
.shell { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100%; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 12px; justify-content: space-between;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--font-display); font-size: 18px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
.brand small { font-family: var(--font-body); font-weight: 500; color: var(--muted); font-size: 12px; margin-left: 6px; letter-spacing: .04em; text-transform: uppercase; }
.store-pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 480px) { .brand small { display: none; } }
.store-pill.ok { background: var(--good-soft); color: var(--good); }
.store-pill.local { background: var(--warn-soft); color: var(--warn); }

nav.rail {
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
nav.rail::-webkit-scrollbar { display: none; }
nav.rail a {
  flex: 0 0 auto; text-decoration: none; color: var(--muted); font-weight: 500; font-size: 14px;
  padding: 6px 10px; border-radius: 6px; white-space: nowrap; display: flex; gap: 6px; align-items: center;
}
nav.rail a:hover { background: var(--sunk); color: var(--ink); }
nav.rail a.on { background: var(--accent-soft); color: var(--accent); }
nav.rail .badge { font: 500 11px var(--font-mono); background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 6px; }
nav.rail .sep { flex: 0 0 auto; width: 1px; background: var(--line); margin: 4px 4px; }

main { min-width: 0; padding-block: 20px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.wrap > * { min-width: 0; }

@media (min-width: 900px) {
  .shell { grid-template-columns: var(--rail) minmax(0, 1fr); grid-template-rows: auto 1fr; }
  .topbar { grid-column: 1 / -1; }
  nav.rail {
    flex-direction: column; overflow: visible; border-bottom: 0; border-right: 1px solid var(--line);
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + 49px); align-self: start; height: calc(100vh - 49px);
    padding: 14px 10px; overflow-y: auto;
  }
  nav.rail .sep { width: auto; height: 1px; margin: 6px 4px; }
  main { padding-left: 32px; padding-right: max(32px, env(safe-area-inset-right, 0px)); }
}

/* Type */
h1, h2, h3 { font-family: var(--font-display); line-height: 1.25; text-wrap: balance; margin: 0; }
h1 { font-size: 28px; }
h2 { font-size: 21px; }
h3 { font-size: 17px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
p { margin: 0; }
.prose { max-width: 70ch; }
.prose p + p { margin-top: 10px; }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.panel.flat { background: transparent; border: 0; padding: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.grid2 { display: grid; gap: 18px; grid-template-columns: 1fr; }
.grid3 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
@media (min-width: 760px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

/* Stat */
.stat { display: grid; gap: 2px; padding: 12px 14px; background: var(--sunk); border-radius: var(--radius); }
.stat b { font: 600 24px var(--font-mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none;
}
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.sm { padding: 5px 10px; font-size: 13px; }

/* Chips & status */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.st-NOT_STARTED { background: var(--chip); color: var(--muted); }
.st-INTRODUCED { background: var(--accent-soft); color: var(--accent); }
.st-DEVELOPING { background: var(--warn-soft); color: var(--warn); }
.st-NEEDS_REVIEW { background: var(--bad-soft); color: var(--bad); }
.st-PROFICIENT { background: var(--good-soft); color: var(--good); }
.st-EXAM_READY { background: var(--good); color: var(--surface); }
.v-confirmed, .v-corrected, .v-gap-filled { background: var(--good-soft); color: var(--good); }
.v-unresolved, .v-pending-law { background: var(--warn-soft); color: var(--warn); }
.v-not-verified { background: var(--chip); color: var(--muted); }
.full { background: var(--accent-soft); color: var(--accent); }

/* Bars */
.bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--sunk); }
.bar > i { display: block; height: 100%; }
.bar .b-NOT_STARTED { background: var(--line); }
.bar .b-INTRODUCED { background: var(--accent); opacity: .45; }
.bar .b-DEVELOPING { background: var(--warn); }
.bar .b-NEEDS_REVIEW { background: var(--bad); }
.bar .b-PROFICIENT { background: var(--good); opacity: .6; }
.bar .b-EXAM_READY { background: var(--good); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

/* Tables */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; }

/* Lists */
.list { display: grid; gap: 0; }
.list > * { padding: 10px 0; border-bottom: 1px solid var(--line); }
.list > *:last-child { border-bottom: 0; }
.lesson-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; text-decoration: none; color: inherit; }
.lesson-row:hover .lr-title { color: var(--accent); }
.lr-id { font: 500 12px var(--font-mono); color: var(--muted); min-width: 52px; }
.lr-title { flex: 1 1 240px; min-width: 0; font-weight: 500; }
details.chapter { border-bottom: 1px solid var(--line); }
details.chapter > summary { cursor: pointer; padding: 12px 0; display: flex; gap: 10px; align-items: center; list-style: none; flex-wrap: wrap; }
details.chapter > summary::-webkit-details-marker { display: none; }
details.chapter > summary .ch-n { font: 600 13px var(--font-mono); color: var(--accent); min-width: 28px; }
details.chapter > summary h3 { flex: 1 1 260px; }
details.chapter .chapter-body { padding: 0 0 12px 38px; }

/* Lesson content */
.lesson { font-size: 16px; line-height: 1.65; }
.lesson h2 { font-size: 19px; margin-top: 28px; margin-bottom: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.lesson h3 { font-size: 16px; margin-top: 18px; margin-bottom: 6px; }
.lesson p, .lesson ul, .lesson ol { max-width: 70ch; }
.lesson p { margin: 8px 0; }
.lesson ul, .lesson ol { padding-left: 22px; margin: 8px 0; }
.lesson li { margin: 4px 0; }
.lesson table { margin: 10px 0; display: block; overflow-x: auto; max-width: 100%; }
.lesson strong { font-weight: 700; }
.lesson .stack { display: grid; gap: 4px; margin: 12px 0; max-width: 640px; }
.lesson .stack-row { display: grid; grid-template-columns: minmax(130px, 34%) 1fr; gap: 10px; padding: 9px 12px; border-radius: 6px; background: var(--sunk); border-left: 4px solid var(--accent); font-size: 14px; }
.lesson .stack-row.fed { border-left-color: var(--warn); }
.lesson .stack-row.court { border-left-color: var(--good); }
.lesson .decision { display: grid; gap: 6px; margin: 12px 0; max-width: 560px; font-size: 14px; }
.lesson .decision .q { padding: 8px 12px; background: var(--accent-soft); border-radius: 6px; font-weight: 600; }
.lesson .decision .no { padding: 0 12px 4px 28px; color: var(--muted); }
.lesson .decision .yes { padding: 8px 12px; background: var(--bad-soft); color: var(--bad); border-radius: 6px; font-weight: 700; }
.lesson .timeline { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 6px; margin: 12px 0; }
.lesson .timeline > div { display: grid; gap: 2px; padding: 10px; border-top: 3px solid var(--accent); background: var(--sunk); border-radius: 0 0 6px 6px; font-size: 13px; }
.lesson .township { display: grid; grid-template-columns: repeat(6, minmax(0, 44px)); gap: 2px; margin: 12px 0 4px; font: 500 13px var(--font-mono); }
.lesson .township > div { aspect-ratio: 1; display: grid; place-items: center; background: var(--sunk); border: 1px solid var(--line); max-width: 100%; }
.lesson .township > div:nth-child(6), .lesson .township > div:nth-child(31), .lesson .township > div:nth-child(36), .lesson .township > div:nth-child(1) { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.lesson .caption { font-size: 13px; color: var(--muted); }

.objectives { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.objectives li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }

/* Quiz */
.qcard { display: grid; gap: 14px; }
.qmeta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stem { font-size: 18px; line-height: 1.5; max-width: 70ch; }
.choices { display: grid; gap: 8px; }
.choice {
  display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; text-align: left;
  padding: 11px 13px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); cursor: pointer;
}
.choice:hover { border-color: var(--accent); }
.choice .key { font: 600 13px var(--font-mono); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); }
.choice.sel { border-color: var(--accent); background: var(--accent-soft); }
.choice.sel .key { background: var(--accent); color: var(--accent-ink); }
.choice.right { border-color: var(--good); background: var(--good-soft); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice[disabled] { cursor: default; }
.numin { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.numin input { width: 200px; max-width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-family: var(--font-mono); font-size: 18px; }
.confbar { display: flex; gap: 8px; flex-wrap: wrap; }
.feedback { display: grid; gap: 10px; padding: 14px 16px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--sunk); }
.feedback.ok { border-color: var(--good); }
.feedback.no { border-color: var(--bad); }
.feedback .verdict { font-weight: 700; font-size: 16px; }
.feedback.ok .verdict { color: var(--good); }
.feedback.no .verdict { color: var(--bad); }
.steps { margin: 0; padding-left: 20px; font-family: var(--font-mono); font-size: 14px; }
.progress { height: 4px; background: var(--sunk); border-radius: 999px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); }
textarea, input[type="text"], input[type="search"], input[type="date"], input[type="number"], select {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
}
textarea { min-height: 76px; resize: vertical; }
select { max-width: 100%; }
.row > * { min-width: 0; }
label.field { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }

/* Flashcard */
.flash { display: grid; gap: 14px; }
.flash .face { font-size: 18px; line-height: 1.5; padding: 22px; border-radius: var(--radius); background: var(--sunk); border: 1px dashed var(--line); white-space: pre-line; }
.flash .face.back { background: var(--surface); border-style: solid; }

/* Exam */
.navgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 4px; }
.navgrid button { font: 500 12px var(--font-mono); padding: 6px 0; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); cursor: pointer; }
.navgrid button.ans { background: var(--accent-soft); border-color: var(--accent); }
.navgrid button.flag { box-shadow: inset 0 -3px 0 var(--warn); }
.navgrid button.cur { outline: 2px solid var(--ink); }
.timer { font: 600 18px var(--font-mono); }

/* Notes */
.note { padding: 10px 14px; border-radius: 6px; background: var(--warn-soft); color: var(--ink); border-left: 4px solid var(--warn); font-size: 14px; }
.note.info { background: var(--accent-soft); border-left-color: var(--accent); }
.note.good { background: var(--good-soft); border-left-color: var(--good); }
.empty { padding: 18px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); text-align: center; }
.kv { display: grid; grid-template-columns: minmax(120px, 30%) 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--muted); font-weight: 600; }
.kv dd { margin: 0; min-width: 0; }
.compare { display: grid; gap: 10px; }
.compare .side { padding: 10px 12px; border-radius: 6px; background: var(--sunk); }
.compare .side b { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
@media (min-width: 760px) { .compare.two { grid-template-columns: 1fr 1fr; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 6px; font-size: 14px; z-index: 20; }
.cal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; font-size: 13px; }
.cal div { padding: 8px; background: var(--sunk); border-radius: 4px; text-align: center; }
.cal .h { background: transparent; font-weight: 600; color: var(--muted); }
.spark { display: flex; align-items: flex-end; gap: 2px; height: 48px; }
.spark i { flex: 1; background: var(--accent); opacity: .75; border-radius: 2px 2px 0 0; min-height: 1px; }
mark { background: var(--warn-soft); color: inherit; padding: 0 2px; border-radius: 2px; }

</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">FL Exam Coach<small>Sales Associate</small></div>
    <span id="store" class="store-pill">Loading…</span>
  </header>
  <nav class="rail" id="nav" aria-label="Sections">
    <a href="#home" data-v="home">Dashboard</a>
    <a href="#syllabus" data-v="syllabus">Syllabus</a>
    <a href="#practice" data-v="practice">Practice</a>
    <a href="#review" data-v="review">Review <span class="badge" id="due-badge" hidden></span></a>
    <a href="#cards" data-v="cards">Flashcards</a>
    <a href="#calc" data-v="calc">Calculations</a>
    <a href="#exam" data-v="exam">Mock exam</a>
    <span class="sep"></span>
    <a href="#numbers" data-v="numbers">Law &amp; numbers</a>
    <a href="#compare" data-v="compare">Portugal vs Florida</a>
    <a href="#mistakes" data-v="mistakes">Mistake log</a>
    <a href="#stats" data-v="stats">Analytics</a>
    <a href="#search" data-v="search">Search</a>
    <span class="sep"></span>
    <a href="#sources" data-v="sources">Sources</a>
    <a href="#settings" data-v="settings">Settings</a>
  </nav>

<script id="app-data" type="application/json">{"meta":{"title":"Florida Sales Associate Exam Prep","built":"2026-10-20T07:19:39.612Z","checkedOn":"2026-10-19 and 2026-10-20","summary":{"chapters":19,"lessons":66,"lessonsFull":5,"objectives":188,"objectivesWithoutQuestions":0,"questions":267,"numeric":44,"flashcards":440,"numbers":83,"glossary":264,"comparisons":23,"verification":80,"answerPositions":[21,132,66,4],"lengthLeakPct":0},"exam":{"questions":100,"minutes":210,"pass":75,"source":"V-01"}},"chapters":[{"id":"ch01","n":1,"title":"The Real Estate Business","frec":"Section 1: Course Overview — The Real Estate Business","manual":"Not covered by the manual (it maps book chapters 2–19 only)","examPct":1,"est":false},{"id":"ch02","n":2,"title":"License Law and Qualifications for Licensure","frec":"Section 2","manual":"M1 (book Ch. 2–3)","examPct":6,"est":false},{"id":"ch03","n":3,"title":"License Law and Commission Rules","frec":"Section 3","manual":"M1 (book Ch. 2–3)","examPct":2,"est":false},{"id":"ch04","n":4,"title":"Authorized Relationships, Duties and Disclosure","frec":"Section 4","manual":"M2 (book Ch. 4)","examPct":7,"est":false},{"id":"ch05","n":5,"title":"Brokerage Activities and Procedures","frec":"Section 5","manual":"M3 (book Ch. 5)","examPct":12,"est":false},{"id":"ch06","n":6,"title":"Violations, Penalties and Procedures","frec":"Section 6","manual":"M4 (book Ch. 6)","examPct":3,"est":false},{"id":"ch07","n":7,"title":"Federal and State Laws Pertaining to Real Estate","frec":"Section 7","manual":"M5 (book Ch. 7)","examPct":3,"est":false},{"id":"ch08","n":8,"title":"Property Rights: Estates, Tenancies, Condos, Co-ops, HOAs, Timeshares","frec":"Section 8","manual":"M6 (book Ch. 8)","examPct":8,"est":false},{"id":"ch09","n":9,"title":"Title, Deeds and Ownership Restrictions","frec":"Section 9","manual":"M7 (book Ch. 9)","examPct":7,"est":false},{"id":"ch10","n":10,"title":"Legal Descriptions","frec":"Section 10","manual":"M7 §Legal descriptions (book Ch. 10)","examPct":5,"est":false},{"id":"ch11","n":11,"title":"Real Estate Contracts","frec":"Section 11","manual":"M8 (book Ch. 11)","examPct":12,"est":false},{"id":"ch12","n":12,"title":"Residential Mortgages","frec":"Section 12","manual":"M9 (book Ch. 12)","examPct":9,"est":false},{"id":"ch13","n":13,"title":"Types of Mortgages and Sources of Financing","frec":"Section 13","manual":"M9 (book Ch. 13)","examPct":4,"est":false},{"id":"ch14","n":14,"title":"Real Estate Computations and Closing of Transactions","frec":"Section 14","manual":"M10 (book Ch. 14)","examPct":6,"est":false},{"id":"ch15","n":15,"title":"The Real Estate Market and Analysis","frec":"Section 15","manual":"M11 (book Ch. 15)","examPct":1,"est":false},{"id":"ch16","n":16,"title":"Real Estate Appraisal","frec":"Section 16","manual":"M11 (book Ch. 16)","examPct":8,"est":false},{"id":"ch17","n":17,"title":"Investments and Business Opportunity Brokerage","frec":"Section 17","manual":"M12 (book Ch. 17)","examPct":2,"est":false},{"id":"ch18","n":18,"title":"Taxes Affecting Real Estate","frec":"Section 18","manual":"M12 (book Ch. 18)","examPct":3,"est":false},{"id":"ch19","n":19,"title":"Planning and Zoning","frec":"Section 19","manual":"M12 (book Ch. 19)","examPct":1,"est":false}],"lessons":[{"id":"L01-1","ch":"ch01","title":"How US and Florida real estate law is organized","type":"bridge","pri":"high","min":35,"manual":"M1 intro (partial)","pre":[],"status":"full","html":"\u003ch2 id=\"2-why-it-matters\">2. Why it matters\u003c/h2>\n\u003cp>Every exam question is answered by one specific source of law, and many questions are worded straight from Florida's statutes. If you know \u003cem>which\u003c/em> source governs a situation and \u003cem>which body\u003c/em> acts, you can eliminate wrong answers even when you do not remember a detail. This is also the first place where the Portuguese and Florida systems differ in structure, not just in detail.\u003c/p>\n\u003cp>This is a bridge lesson: the textbook assumes you already know how American law is layered. Everything in Chapters 2–7 builds on it.\u003c/p>\n\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Two levels of government make law in the United States.\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Federal\u003c/strong> law applies in every state. In real estate it covers national issues: fair housing, lending disclosures (RESPA, TILA), lead-based paint, disability access (ADA), environmental cleanup (CERCLA) and income tax.\u003c/li>\n\u003cli>\u003cstrong>State\u003c/strong> law applies inside one state. \u003cstrong>Licensing real estate professionals is a state matter.\u003c/strong> There is no national real estate license; a Florida license is valid only in Florida.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Inside Florida there are four layers you will meet constantly:\u003c/strong>\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cstrong>The Florida Constitution\u003c/strong> — the top state law. Example: homestead protection from creditors (Article X).\u003c/li>\n\u003cli>\u003cstrong>Florida Statutes (F.S.)\u003c/strong> — laws passed by the Legislature, organized in chapters. The real estate license law is \u003cstrong>Chapter 475\u003c/strong>. \u003cstrong>Chapter 455\u003c/strong> sets general procedures for every profession the DBPR regulates. Others you will meet: Chapter 83 (landlord–tenant), 689 (deeds and conveyances), 718 (condominiums), 201 (documentary stamp tax).\u003c/li>\n\u003cli>\u003cstrong>Florida Administrative Code (F.A.C.)\u003c/strong> — rules adopted by state agencies using power a statute gives them. The Florida Real Estate Commission's rules are \u003cstrong>Chapter 61J2\u003c/strong> (escrow deadlines, advertising, offices, education). A rule has the force of law but cannot go beyond its statute.\u003c/li>\n\u003cli>\u003cstrong>Case law\u003c/strong> — decisions of the courts. Florida, like most of the US, is a \u003cstrong>common-law\u003c/strong> system: courts' decisions create binding precedent. For this exam the key case is \u003cstrong>\u003cem>Johnson v. Davis\u003c/em> (1985)\u003c/strong>: a seller must disclose known hidden defects that materially affect value.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Who does what.\u003c/strong> Two state bodies regulate real estate licensees, and the exam constantly asks which one acts:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>FREC (Florida Real Estate Commission)\u003c/strong> — 7 members appointed by the Governor. It \u003cstrong>makes rules\u003c/strong> (a \u003cem>quasi-legislative\u003c/em> power) and \u003cstrong>decides discipline\u003c/strong> — fines, suspension, revocation (a \u003cem>quasi-judicial\u003c/em> power).\u003c/li>\n\u003cli>\u003cstrong>DBPR (Department of Business and Professional Regulation)\u003c/strong>, through its Division of Real Estate — \u003cstrong>processes applications, issues licenses, keeps records and investigates complaints\u003c/strong>. It provides the FREC's administrative support.\u003c/li>\n\u003cli>\u003cstrong>Courts\u003c/strong> — only a court can impose \u003cstrong>criminal\u003c/strong> penalties (prison) or award \u003cstrong>civil damages\u003c/strong> to a consumer.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>How to read a citation.\u003c/strong> \"s. 475.25(1)(d)1., F.S.\" means Florida Statutes, chapter 475, section 25, subsection (1), paragraph (d), subparagraph 1. \"Rule 61J2-14.009, F.A.C.\" means rule chapter 61J2, part 14, rule .009. You do not need to memorize citations for the exam, but recognizing them lets you check sources yourself.\u003c/p>\n\u003ch2 id=\"4-key-terms\">4. Key terms\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Term\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Statute\u003c/td>\n\u003ctd>A law passed by the Legislature (e.g., Chapter 475 F.S.)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Administrative rule\u003c/td>\n\u003ctd>A rule adopted by an agency under a statute (e.g., 61J2 F.A.C.)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Case law\u003c/td>\n\u003ctd>Law created by court decisions\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Common law\u003c/td>\n\u003ctd>A legal system that relies on court precedent as well as written law\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>FREC\u003c/td>\n\u003ctd>Florida Real Estate Commission: rules and discipline\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>DBPR\u003c/td>\n\u003ctd>Department of Business and Professional Regulation: licensing, records, investigations\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Quasi-legislative\u003c/td>\n\u003ctd>An agency's power to make rules\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Quasi-judicial\u003c/td>\n\u003ctd>An agency's power to decide cases and impose discipline\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Licensee\u003c/td>\n\u003ctd>A person holding a real estate license (sales associate or broker)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"5-practical-example\">5. Practical example\u003c/h2>\n\u003cp>A buyer signs a contract for a resale condo in Fort Lauderdale and gives a $25,000 deposit to the seller's broker. The deal falls apart and both parties demand the deposit.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Question\u003c/th>\n\u003cth>Source that answers it\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Must the broker account for the money?\u003c/td>\n\u003ctd>Chapter 475 F.S. (statute)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>How many business days to notify the FREC and choose a procedure?\u003c/td>\n\u003ctd>Rule 61J2-10.032 F.A.C. (15 / 30 business days)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Could the buyer cancel because the condo documents arrived late?\u003c/td>\n\u003ctd>Chapter 718 F.S. (condominium statute)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Did the seller have to disclose the roof leak she knew about?\u003c/td>\n\u003ctd>\u003cem>Johnson v. Davis\u003c/em> (case law)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Who investigates if the buyer files a complaint?\u003c/td>\n\u003ctd>DBPR\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Who can fine or suspend the broker?\u003c/td>\n\u003ctd>FREC\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Who can send the broker to prison if he stole the money?\u003c/td>\n\u003ctd>A criminal court\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"6-portugal-comparison\">6. Portugal comparison\u003c/h2>\n\u003cp>\u003cstrong>Familiar principle:\u003c/strong> both countries regulate brokerage through a statute and a regulator. In Portugal that is Lei n.º 15/2013 and IMPIC; in Florida it is Chapter 475 and FREC/DBPR.\u003c/p>\n\u003cp>\u003cstrong>What changes:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Level of government.\u003c/strong> Portuguese real estate law is national. In the US, licensing is decided state by state, while some topics (fair housing, lending, environment) are federal.\u003c/li>\n\u003cli>\u003cstrong>Who is licensed.\u003c/strong> In Portugal the IMPIC license belongs to the mediation business. In Florida \u003cstrong>each individual\u003c/strong> needs a license, and a sales associate can only work under a broker.\u003c/li>\n\u003cli>\u003cstrong>Entry test.\u003c/strong> IMPIC requires commercial good standing and liability insurance. Florida requires a 63-hour course and a state exam.\u003c/li>\n\u003cli>\u003cstrong>Legal method.\u003c/strong> Portugal is a civil-law system built on codes (Código Civil). Florida is a common-law system where court decisions such as \u003cem>Johnson v. Davis\u003c/em> create binding rules.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Exam implication:\u003c/strong> never reason from the Portuguese structure. If a question asks who issues licenses, the answer is the DBPR; who disciplines, the FREC; who imprisons, a court.\u003c/p>\n\u003ch2 id=\"7-legal-and-numerical-requirements\">7. Legal and numerical requirements\u003c/h2>\n\u003cp>\u003cstrong>Memorize exactly\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Chapter 475 F.S. = Florida real estate license law.\u003c/li>\n\u003cli>Chapter 455 F.S. = general law for all DBPR-regulated professions.\u003c/li>\n\u003cli>Chapter 61J2 F.A.C. = FREC's rules.\u003c/li>\n\u003cli>DBPR issues licenses and investigates; FREC makes rules and disciplines; only courts imprison or award damages.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Understand\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Federal law → Florida Constitution → Florida Statutes → administrative rules. A lower layer cannot contradict a higher one.\u003c/li>\n\u003cli>Agencies (FREC, DBPR) act administratively. Criminal and civil liability belongs to the courts.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"8-visual-explanation\">8. Visual explanation\u003c/h2>\n\u003cdiv class=\"stack\">\n  \u003cdiv class=\"stack-row fed\">\u003cb>Federal law\u003c/b>\u003cspan>Fair housing · RESPA · TILA · ADA · lead paint · CERCLA · income tax\u003c/span>\u003c/div>\n  \u003cdiv class=\"stack-row\">\u003cb>Florida Constitution\u003c/b>\u003cspan>Homestead (Art. X)\u003c/span>\u003c/div>\n  \u003cdiv class=\"stack-row\">\u003cb>Florida Statutes\u003c/b>\u003cspan>Ch. 475 license law · Ch. 455 DBPR procedures · Ch. 83 · 689 · 718 · 201\u003c/span>\u003c/div>\n  \u003cdiv class=\"stack-row\">\u003cb>Administrative rules\u003c/b>\u003cspan>61J2 F.A.C. — FREC rules (escrow, ads, offices, education)\u003c/span>\u003c/div>\n  \u003cdiv class=\"stack-row court\">\u003cb>Courts (case law)\u003c/b>\u003cspan>Interpret all layers · Johnson v. Davis\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Body\u003c/th>\n\u003cth>Makes rules\u003c/th>\n\u003cth>Issues licenses\u003c/th>\n\u003cth>Investigates\u003c/th>\n\u003cth>Disciplines\u003c/th>\n\u003cth>Imprisons / awards damages\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>FREC\u003c/td>\n\u003ctd>✔\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>✔\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>DBPR\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>✔\u003c/td>\n\u003ctd>✔\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Courts\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>✔\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>\"The FREC is a court.\"\u003c/strong> It is an administrative commission. It can revoke a license but cannot imprison anyone or order a licensee to pay a consumer's damages.\u003c/li>\n\u003cli>\u003cstrong>\"The DBPR punishes licensees.\"\u003c/strong> The DBPR investigates and prosecutes; the FREC decides discipline.\u003c/li>\n\u003cli>\u003cstrong>\"A rule is weaker than a statute, so it is optional.\"\u003c/strong> Rules are binding law. They simply cannot exceed the statute that authorizes them.\u003c/li>\n\u003cli>\u003cstrong>\"The REALTOR® association regulates agents.\"\u003c/strong> It is a private trade association. The state regulates licensees.\u003c/li>\n\u003cli>\u003cstrong>\"My Portuguese experience or AMI license counts.\"\u003c/strong> It does not; Florida licenses individuals under Chapter 475.\u003c/li>\n\u003cli>\u003cstrong>\"Federal law licenses agents.\"\u003c/strong> Licensing is state law.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>475\u003c/strong> = license law · \u003cstrong>455\u003c/strong> = all DBPR professions · \u003cstrong>61J2\u003c/strong> = FREC rules.\u003c/li>\n\u003cli>\u003cstrong>DBPR digs, FREC decides, courts jail.\u003c/strong>\u003c/li>\n\u003cli>Federal: fair housing, RESPA/TILA, ADA, lead paint, CERCLA, tax. State: licensing, escrow, disclosures, landlord–tenant.\u003c/li>\n\u003cli>\u003cem>Johnson v. Davis\u003c/em>: disclose known latent material defects.\u003c/li>\n\u003cli>Florida licenses each \u003cstrong>person\u003c/strong>; Portugal licenses the \u003cstrong>business\u003c/strong>.\u003c/li>\n\u003c/ul>\n"},{"id":"L01-2","ch":"ch01","title":"The real estate business: sectors, specialties and organizations","type":"conceptual","pri":"medium","min":25,"manual":"Not in manual","pre":["L01-1"],"status":"full","html":"\u003ch2 id=\"2-why-it-matters\">2. Why it matters\u003c/h2>\n\u003cp>This is one of the smallest exam areas (1% in the official content outline), and much of it is familiar from your work in Portugal. It still matters because it introduces the vocabulary the exam uses for property types and roles, and it contains one classic trap: confusing REALTOR® membership with a license.\u003c/p>\n\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Property types.\u003c/strong> The course groups real property by use:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Residential\u003c/strong> — homes, condos, apartments.\u003c/li>\n\u003cli>\u003cstrong>Commercial\u003c/strong> — income-producing business property: offices, retail, hotels.\u003c/li>\n\u003cli>\u003cstrong>Industrial\u003c/strong> — manufacturing, warehouses, distribution.\u003c/li>\n\u003cli>\u003cstrong>Agricultural\u003c/strong> — farms, groves, ranches, timberland.\u003c/li>\n\u003cli>\u003cstrong>Special-purpose\u003c/strong> — properties with a unique use: churches, schools, hospitals, cemeteries.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Specializations.\u003c/strong> Brokerage (residential or commercial sales and leasing); appraisal (estimating value — a separate license in Florida); property management (leasing, rent collection, maintenance for owners); financing (mortgage lending); development and construction (turning land into finished property); counseling (advice for a fee).\u003c/p>\n\u003cp>\u003cstrong>Organizations.\u003c/strong> The \u003cstrong>National Association of REALTORS® (NAR)\u003c/strong> is the largest trade association. \u003cstrong>REALTOR®\u003c/strong> is a registered trademark that only members may use; it is \u003cem>not\u003c/em> a license. In Florida the state association is \u003cstrong>Florida Realtors\u003c/strong>, and local boards and associations run the MLS in their areas. The \u003cstrong>National Association of Real Estate Brokers (NAREB)\u003c/strong> uses the term \u003cstrong>Realtist\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>Real estate vs real property vs personal property.\u003c/strong> \u003cem>Real estate\u003c/em> is land plus permanent improvements. \u003cem>Real property\u003c/em> is real estate plus the bundle of ownership rights. \u003cem>Personal property\u003c/em> is movable (furniture, cars — and, importantly, cooperative shares).\u003c/p>\n\u003ch2 id=\"4-key-terms\">4. Key terms\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Term\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Special-purpose property\u003c/td>\n\u003ctd>Property with a unique, limited use (church, school, hospital)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Property management\u003c/td>\n\u003ctd>Managing property for owners: leasing, rent collection, maintenance\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>REALTOR®\u003c/td>\n\u003ctd>Trademark for NAR members; not a license\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Realtist\u003c/td>\n\u003ctd>Member of NAREB\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Real property\u003c/td>\n\u003ctd>Land, improvements, and the rights of ownership\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Personal property\u003c/td>\n\u003ctd>Movable items not attached to land\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"5-practical-example\">5. Practical example\u003c/h2>\n\u003cp>You meet a new Miami colleague whose card says \"REALTOR®\". That tells you she belongs to NAR (through her local association). It tells you nothing about whether her license is active — you would check that on the DBPR license search. Another agent who is not an NAR member can be fully licensed and may not call herself a REALTOR®.\u003c/p>\n\u003ch2 id=\"6-portugal-comparison\">6. Portugal comparison\u003c/h2>\n\u003cp>\u003cstrong>Familiar:\u003c/strong> the sectors (residential, commercial, industrial) and specialties (sales, management, valuation) work the same way in practice.\u003c/p>\n\u003cp>\u003cstrong>Different:\u003c/strong> in Florida the \u003cem>trade association\u003c/em> (NAR/Florida Realtors, which runs much of the MLS infrastructure) is separate from the \u003cem>state regulator\u003c/em> (FREC/DBPR). Membership is voluntary; the license is mandatory. Appraisal is also separately licensed in Florida (Part II of Chapter 475), and a sales associate may not call a market analysis an \"appraisal\".\u003c/p>\n\u003ch2 id=\"7-legal-and-numerical-requirements\">7. Legal and numerical requirements\u003c/h2>\n\u003cp>\u003cstrong>Memorize exactly\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Five property categories: residential, commercial, industrial, agricultural, special-purpose.\u003c/li>\n\u003cli>REALTOR® = NAR membership trademark, not a license.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Understand\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Licenses are issued by the state; associations are private.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"8-visual-explanation\">8. Visual explanation\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Category\u003c/th>\n\u003cth>Florida examples\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Residential\u003c/td>\n\u003ctd>Single-family home in Kissimmee; Brickell condo; duplex in Tampa\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Commercial\u003c/td>\n\u003ctd>Strip mall in Orlando; office building in Fort Lauderdale\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Industrial\u003c/td>\n\u003ctd>Warehouse near Port Everglades\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Agricultural\u003c/td>\n\u003ctd>Citrus grove in Polk County\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Special-purpose\u003c/td>\n\u003ctd>Church, school, hospital\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>\"REALTOR® is a license level.\"\u003c/strong> It is a trade-association mark.\u003c/li>\n\u003cli>\u003cstrong>\"Every licensee must join NAR.\"\u003c/strong> Membership is voluntary.\u003c/li>\n\u003cli>\u003cstrong>\"A CMA is an appraisal.\"\u003c/strong> A licensee may prepare a CMA, but must not call it an appraisal (Chapter 16).\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cul>\n\u003cli>R-C-I-A-S: Residential, Commercial, Industrial, Agricultural, Special-purpose.\u003c/li>\n\u003cli>REALTOR® = membership, not license. Realtist = NAREB.\u003c/li>\n\u003cli>Real property = real estate + rights. Co-op shares = personal property.\u003c/li>\n\u003c/ul>\n"},{"id":"L02-1","ch":"ch02","title":"Who needs a license: the three-part test","type":"legal","pri":"high","min":30,"manual":"M1 §Who needs a license","pre":["L01-1"],"status":"full","html":"\u003ch2 id=\"2-why-it-matters\">2. Why it matters\u003c/h2>\n\u003cp>Unlicensed activity is a third-degree felony, and \"does this person need a license?\" is one of the most common question shapes on the exam. The questions hide the decisive fact — usually \u003cem>how the person is paid\u003c/em> — in the middle of a sentence.\u003c/p>\n\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>A Florida license is required when \u003cstrong>all three\u003c/strong> of these are present:\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cstrong>A real estate service\u003c/strong> — the activities listed in Chapter 475. The course mnemonic is \u003cstrong>A BAR SALE\u003c/strong>: \u003cstrong>A\u003c/strong>dvertise, \u003cstrong>B\u003c/strong>uy, \u003cstrong>A\u003c/strong>ppraise, \u003cstrong>R\u003c/strong>ent, \u003cstrong>S\u003c/strong>ell, \u003cstrong>A\u003c/strong>uction, \u003cstrong>L\u003c/strong>ease, \u003cstrong>E\u003c/strong>xchange. The statute's definition is broader and also covers acts such as negotiating, listing, and procuring buyers, sellers, tenants or landlords.\u003c/li>\n\u003cli>\u003cstrong>For another\u003c/strong> — for someone else, not for yourself.\u003c/li>\n\u003cli>\u003cstrong>For compensation\u003c/strong> — anything of value: money, a gift card, a car, a discount. Compensation that is only \u003cstrong>promised or expected\u003c/strong> still counts.\u003c/li>\n\u003c/ol>\n\u003cp>Remove any one element and no license is needed. A homeowner selling her own house (not for another) needs no license; a friend who shows a house with no expectation of pay (no compensation) needs no license.\u003c/p>\n\u003ch2 id=\"4-key-terms\">4. Key terms\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Term\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Real estate service\u003c/td>\n\u003ctd>An activity listed in Chapter 475 (A BAR SALE and related acts)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>For another\u003c/td>\n\u003ctd>On behalf of someone other than yourself\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Compensation\u003c/td>\n\u003ctd>Anything of value, paid, promised or expected\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Sales associate\u003c/td>\n\u003ctd>Licensee who performs services under a broker\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Broker\u003c/td>\n\u003ctd>Licensee who performs services for others in their own name\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"5-practical-example\">5. Practical example\u003c/h2>\n\u003cp>Carlos, unlicensed, tells his cousin he can find a tenant for her Orlando condo. She says, \"If you do, I'll take you to dinner at a steakhouse.\" He finds a tenant and enjoys the dinner.\u003c/p>\n\u003cul>\n\u003cli>Service? Yes — renting/leasing for another.\u003c/li>\n\u003cli>For another? Yes — his cousin's condo.\u003c/li>\n\u003cli>Compensation? Yes — a dinner is something of value, promised in exchange.\u003c/li>\n\u003c/ul>\n\u003cp>Carlos needed a license. The size or form of the payment does not matter.\u003c/p>\n\u003ch2 id=\"6-portugal-comparison\">6. Portugal comparison\u003c/h2>\n\u003cp>\u003cstrong>Familiar:\u003c/strong> in both systems, intermediating property deals as a business is regulated.\u003c/p>\n\u003cp>\u003cstrong>Different:\u003c/strong> Florida's test is applied \u003cstrong>to each individual\u003c/strong> and turns on compensation. In Portugal the IMPIC license attaches to the mediation business, and consultants commonly work under the agency's license. In Florida, an unlicensed assistant who is paid per showing or per closing is breaking the law even though the brokerage itself is licensed.\u003c/p>\n\u003cp>\u003cstrong>Exam implication:\u003c/strong> whenever a scenario mentions pay per transaction, per showing, per closing, or a bonus tied to a deal, treat it as compensation for a real estate service.\u003c/p>\n\u003ch2 id=\"7-legal-and-numerical-requirements\">7. Legal and numerical requirements\u003c/h2>\n\u003cp>\u003cstrong>Memorize exactly\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Three elements: service + for another + compensation.\u003c/li>\n\u003cli>A BAR SALE: Advertise, Buy, Appraise, Rent, Sell, Auction, Lease, Exchange.\u003c/li>\n\u003cli>Unlicensed practice = third-degree felony (Chapter 6 covers penalties).\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Understand\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\"Compensation\" includes promised or expected value, not only money received.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"8-visual-explanation\">8. Visual explanation\u003c/h2>\n\u003cdiv class=\"decision\">\n  \u003cdiv class=\"q\">Is it a real estate service (A BAR SALE…)?\u003c/div>\u003cdiv class=\"no\">No → no license needed\u003c/div>\n  \u003cdiv class=\"q\">Is it for another person?\u003c/div>\u003cdiv class=\"no\">No (own property) → no license needed\u003c/div>\n  \u003cdiv class=\"q\">Is there compensation — paid, promised or expected?\u003c/div>\u003cdiv class=\"no\">No → no license needed\u003c/div>\n  \u003cdiv class=\"q\">Does an exemption in s. 475.011 apply? (next lesson)\u003c/div>\u003cdiv class=\"no\">Yes → no license needed\u003c/div>\n  \u003cdiv class=\"yes\">Otherwise → a license is required\u003c/div>\n\u003c/div>\n\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>\"It's only illegal if you're paid in money.\"\u003c/strong> Any thing of value counts.\u003c/li>\n\u003cli>\u003cstrong>\"Doing it once is fine.\"\u003c/strong> There is no one-time exemption.\u003c/li>\n\u003cli>\u003cstrong>\"The brokerage is licensed, so its assistant can show homes for per-showing pay.\"\u003c/strong> Each person performing services for compensation needs a license.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cul>\n\u003cli>Service + for another + compensation = license.\u003c/li>\n\u003cli>A BAR SALE.\u003c/li>\n\u003cli>Promised or expected pay counts. Per-deal pay is the giveaway.\u003c/li>\n\u003c/ul>\n"},{"id":"L02-2","ch":"ch02","title":"Exemptions from licensure","type":"legal","pri":"high","min":25,"manual":"M1 §Who needs a license (exempt persons)","pre":["L02-1"],"status":"full","html":"\u003ch2 id=\"2-why-it-matters\">2. Why it matters\u003c/h2>\n\u003cp>Exemptions are where the exam tests reading precision. Each exemption has a condition — usually \u003cem>salary, not commission\u003c/em> or \u003cem>within the scope of another profession\u003c/em> — and the question changes one word to remove it.\u003c/p>\n\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>Section 475.011 lists persons who do not need a real estate license even though they may perform real estate activities. The main ones:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Owners\u003c/strong> selling or leasing their own property — unless they use commissioned agents to sell to the public in the ordinary course of business. Corporate officers selling the corporation's own property for a salary fall here.\u003c/li>\n\u003cli>\u003cstrong>Attorneys at law\u003c/strong> acting within their duties as attorneys. Earning a brokerage \u003cstrong>commission\u003c/strong> takes them outside the exemption.\u003c/li>\n\u003cli>\u003cstrong>Certified public accountants\u003c/strong> acting within their duties as CPAs.\u003c/li>\n\u003cli>\u003cstrong>Attorneys in fact\u003c/strong> acting under a power of attorney \u003cstrong>to execute contracts or conveyances only\u003c/strong> (signing for the owner — not marketing or negotiating for a fee).\u003c/li>\n\u003cli>\u003cstrong>Court-appointed or will-appointed fiduciaries\u003c/strong>: personal representatives, receivers, trustees, and others acting under a will or court order.\u003c/li>\n\u003cli>\u003cstrong>Salaried employees of public utilities, railroads and government agencies\u003c/strong> handling their employer's real property, with no compensation beyond salary.\u003c/li>\n\u003cli>\u003cstrong>Salaried employees of an owner (or of a broker for an owner) of an apartment community\u003c/strong> working in an \u003cstrong>onsite rental office\u003c/strong> in a leasing capacity.\u003c/li>\n\u003cli>\u003cstrong>Salaried condominium or cooperative managers\u003c/strong> renting units for terms of \u003cstrong>1 year or less\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003cp>Two exemptions in the study manual need correction: the manual mentions \"radon professionals\", which does not appear in the statute, and it describes the attorney-in-fact exemption as \"a single specific transaction\" — the statute says \"execution of contracts or conveyances only\" (verification V-14).\u003c/p>\n\u003ch2 id=\"4-key-terms\">4. Key terms\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Term\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Exemption\u003c/td>\n\u003ctd>A category of person who need not hold a license\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Attorney in fact\u003c/td>\n\u003ctd>Someone holding a power of attorney (not necessarily a lawyer)\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Attorney at law\u003c/td>\n\u003ctd>A lawyer\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Personal representative\u003c/td>\n\u003ctd>The court-appointed administrator of a deceased person's estate\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Onsite rental office\u003c/td>\n\u003ctd>Leasing office located at the apartment community\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"5-practical-example\">5. Practical example\u003c/h2>\n\u003cp>Three people rent apartments at a 300-unit complex in Jacksonville:\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cstrong>Maria\u003c/strong> works in the complex's leasing office for a salary paid by the owner — \u003cstrong>exempt\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>João\u003c/strong> is paid $250 for every lease he signs, by the owner — \u003cstrong>license required\u003c/strong> (compensation per transaction).\u003c/li>\n\u003cli>\u003cstrong>Lena\u003c/strong> manages rentals for twelve different owners across the city for 8% of rents — \u003cstrong>license required\u003c/strong> (managing for others for compensation; not an onsite salaried employee).\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"6-portugal-comparison\">6. Portugal comparison\u003c/h2>\n\u003cp>\u003cstrong>Requires care:\u003c/strong> In Portugal you may be used to seeing staff of a developer or an agency intermediate deals under the company's license. Florida asks a narrower question for each person: is there an exemption, and does its condition (salary only, onsite, scope of profession) still hold?\u003c/p>\n\u003ch2 id=\"7-legal-and-numerical-requirements\">7. Legal and numerical requirements\u003c/h2>\n\u003cp>\u003cstrong>Memorize exactly\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Salaried onsite apartment leasing employees are exempt; per-lease pay removes the exemption.\u003c/li>\n\u003cli>Condo/co-op salaried managers: rentals of \u003cstrong>1 year or less\u003c/strong>.\u003c/li>\n\u003cli>Attorneys and CPAs: only within their professional duties.\u003c/li>\n\u003cli>Attorneys in fact: executing contracts or conveyances only.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Understand\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Each exemption has a condition. The exam changes the condition.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"8-visual-explanation\">8. Visual explanation\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Person\u003c/th>\n\u003cth>Exempt when…\u003c/th>\n\u003cth>Not exempt when…\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Owner\u003c/td>\n\u003ctd>Selling/leasing own property\u003c/td>\n\u003ctd>Uses commissioned agents in the ordinary course of business\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Attorney at law\u003c/td>\n\u003ctd>Acting within legal duties\u003c/td>\n\u003ctd>Earns a brokerage commission\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Attorney in fact\u003c/td>\n\u003ctd>Executing contracts or conveyances only\u003c/td>\n\u003ctd>Markets or negotiates for a fee\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Owner's onsite leasing employee\u003c/td>\n\u003ctd>Salaried, onsite rental office\u003c/td>\n\u003ctd>Paid per lease\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Condo/co-op manager\u003c/td>\n\u003ctd>Salaried; rentals ≤ 1 year\u003c/td>\n\u003ctd>Paid by commission\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>\"Lawyers never need a real estate license.\"\u003c/strong> They do if they earn a brokerage commission.\u003c/li>\n\u003cli>\u003cstrong>\"Attorney in fact means lawyer.\"\u003c/strong> It means anyone holding a power of attorney.\u003c/li>\n\u003cli>\u003cstrong>\"Any employee of an owner is exempt.\"\u003c/strong> Only if salaried and, for apartment leasing, working onsite.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cul>\n\u003cli>Salary yes, commission no.\u003c/li>\n\u003cli>Lawyers and CPAs: only inside their own profession.\u003c/li>\n\u003cli>Power of attorney: sign the documents only.\u003c/li>\n\u003cli>Condo/co-op manager: rentals ≤ 1 year.\u003c/li>\n\u003c/ul>\n"},{"id":"L02-3","ch":"ch02","title":"Qualifying and applying for a sales associate license","type":"legal","pri":"high","min":30,"manual":"M1 §Qualifying and applying; §License categories (mutual recognition)","pre":["L02-1"],"status":"full","html":"\u003ch2 id=\"2-why-it-matters\">2. Why it matters\u003c/h2>\n\u003cp>These are exact-recall facts — ages, hours, scores and time limits — and the mutual recognition rule is a favourite trap because it depends on residency at the moment of application. It also affects you personally: you are a nonresident-born professional entering Florida licensing.\u003c/p>\n\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Applicant requirements (sales associate):\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>At least \u003cstrong>18\u003c/strong> years old.\u003c/li>\n\u003cli>\u003cstrong>High school diploma\u003c/strong> or equivalent.\u003c/li>\n\u003cli>A U.S. \u003cstrong>Social Security number\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Not required:\u003c/strong> U.S. citizenship, Florida residency, a college degree.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>The path:\u003c/strong> complete the \u003cstrong>63-hour pre-license course\u003c/strong> (63 hours of 50 minutes, including the course exam) → apply to the DBPR with fingerprints and fees → pass the state exam (\u003cstrong>100 questions, 3.5 hours, 75 correct to pass\u003c/strong>) → license issued. The course completion becomes invalid if you do not \u003cstrong>pass\u003c/strong> the state exam within \u003cstrong>2 years\u003c/strong> after completing the course, and the application expires \u003cstrong>2 years\u003c/strong> after the DBPR receives it if you have not passed (s. 475.181(2), verification V-31 and V-32). The license is \u003cstrong>inactive until the licensee is registered with an employing broker\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>Criminal history and honesty.\u003c/strong> Applicants must disclose criminal history. A record does not automatically disqualify; the FREC looks at the nature of the offence, time elapsed, rehabilitation and honesty (good moral character). A \u003cstrong>false answer\u003c/strong> on the application is itself grounds for denial or revocation and is a crime. A denied applicant receives written notice and may request a hearing.\u003c/p>\n\u003cp>\u003cstrong>Mutual recognition.\u003c/strong> Florida has agreements with certain states. A licensee from one of those states who is \u003cstrong>not a Florida resident when applying\u003c/strong> can obtain a Florida license without the 63-hour course by passing a \u003cstrong>40-question Florida law exam with at least 30 correct\u003c/strong>. Florida residents cannot use it, and the other state's license must have been earned through that state's own course and exam. In October 2026 the DBPR Division home page lists nine states (Alabama, Arkansas, Connecticut, Georgia, Kentucky, Mississippi, Nebraska, Rhode Island, West Virginia) and shows the Illinois agreement as dissolved on December 31, 2025. The list changes over time, so it is low priority for the exam (verification V-22).\u003c/p>\n\u003ch2 id=\"4-key-terms\">4. Key terms\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Term\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>Pre-license course\u003c/td>\n\u003ctd>63-hour FREC Course I\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Good moral character\u003c/td>\n\u003ctd>Honesty, trustworthiness and fair dealing required of applicants\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>Mutual recognition\u003c/td>\n\u003ctd>Agreement letting nonresident licensees of certain states qualify by passing a Florida law exam\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>Registration with a broker\u003c/td>\n\u003ctd>Required before a new license can be used\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"5-practical-example\">5. Practical example\u003c/h2>\n\u003cp>\u003cstrong>Two applicants:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Inês\u003c/strong>, a Portuguese citizen living in Miami with a green card and a Social Security number, finished high school in Portugal (with an equivalency evaluation). She qualifies to apply: citizenship is not required. She must take the 63-hour course and pass the state exam.\u003c/li>\n\u003cli>\u003cstrong>Mark\u003c/strong> holds an active Georgia license and lives in Savannah. If Georgia has an agreement with Florida when he applies, he can take the 40-question law exam. If he first moves to Jacksonville and then applies, he is a Florida resident and must take the full course and exam.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"6-portugal-comparison\">6. Portugal comparison\u003c/h2>\n\u003cp>\u003cstrong>Different:\u003c/strong> Portuguese mediation licensing has no state exam or course-hours requirement (IMPIC lists good standing and insurance). Florida's requirements are educational and exam-based, and your Portuguese experience does not reduce the 63 hours. Mutual recognition covers only certain US states — not foreign countries.\u003c/p>\n\u003ch2 id=\"7-legal-and-numerical-requirements\">7. Legal and numerical requirements\u003c/h2>\n\u003cp>\u003cstrong>Memorize exactly\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>18 · high school diploma or equivalent · SSN.\u003c/li>\n\u003cli>Not required: citizenship, Florida residency.\u003c/li>\n\u003cli>63 hours; must PASS the exam within 2 years of finishing the course. Application expires 2 years after receipt without a pass.\u003c/li>\n\u003cli>Exam: 100 questions, 3.5 hours, 75 to pass.\u003c/li>\n\u003cli>Mutual recognition: nonresident at application; 40 questions; 30 to pass.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Understand\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Honesty on the application matters more than the record itself.\u003c/li>\n\u003cli>A new license cannot be used until registered under a broker.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"8-visual-explanation\">8. Visual explanation\u003c/h2>\n\u003cdiv class=\"timeline\">\n  \u003cdiv>\u003cb>Course\u003c/b>\u003cspan>63 hrs · valid 2 yrs for exam\u003c/span>\u003c/div>\n  \u003cdiv>\u003cb>Application\u003c/b>\u003cspan>Fingerprints · fee · valid 2 yrs\u003c/span>\u003c/div>\n  \u003cdiv>\u003cb>State exam\u003c/b>\u003cspan>100 Q · 3.5 h · 75 to pass\u003c/span>\u003c/div>\n  \u003cdiv>\u003cb>License issued\u003c/b>\u003cspan>Inactive until a broker registers you\u003c/span>\u003c/div>\n  \u003cdiv>\u003cb>First renewal\u003c/b>\u003cspan>18–24 months · 45-hr post-license due\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>\"You must be a U.S. citizen.\"\u003c/strong> No.\u003c/li>\n\u003cli>\u003cstrong>\"You must live in Florida.\"\u003c/strong> No; nonresidents can be licensed.\u003c/li>\n\u003cli>\u003cstrong>\"Mutual recognition is reciprocity for anyone licensed elsewhere.\"\u003c/strong> Only nonresidents licensed in a state with an agreement.\u003c/li>\n\u003cli>\u003cstrong>\"Once licensed you can start working.\"\u003c/strong> Not until a broker registers you.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cul>\n\u003cli>18 · diploma · SSN — no citizenship, no Florida address.\u003c/li>\n\u003cli>63 hours → pass the exam within 2 years → 75/100 in 3.5 hours.\u003c/li>\n\u003cli>Mutual recognition: nonresident · 40 Q · 30 to pass.\u003c/li>\n\u003cli>Lie on the application = denial/revocation + crime.\u003c/li>\n\u003c/ul>\n"},{"id":"L03-1","ch":"ch03","title":"FREC and DBPR: structure and powers","type":"legal","pri":"high","min":25,"manual":"M1 §FREC and DBPR","pre":["L01-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>FREC composition (s. 475.02, verified V-13):\u003c/strong> 7 members, appointed by the \u003cstrong>Governor\u003c/strong> and confirmed by the \u003cstrong>Senate\u003c/strong>, for \u003cstrong>4-year terms\u003c/strong>:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>4 brokers\u003c/strong>, each with an active license for the \u003cstrong>5\u003c/strong> years before appointment;\u003c/li>\n\u003cli>\u003cstrong>1 broker or sales associate\u003c/strong> with an active license for the \u003cstrong>2\u003c/strong> years before appointment;\u003c/li>\n\u003cli>\u003cstrong>2 consumer members\u003c/strong> who are not and have never been brokers or sales associates;\u003c/li>\n\u003cli>at least \u003cstrong>one member aged 60 or older\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003cp>The manual adds a quorum of 4 and a limit of two consecutive terms (not verified this session).\u003c/p>\n\u003cp>\u003cstrong>Powers.\u003c/strong> \u003cem>Quasi-legislative\u003c/em>: adopting rules (61J2 F.A.C.). \u003cem>Quasi-judicial\u003c/em>: deciding discipline in final orders. \u003cem>Executive/administrative\u003c/em> functions — processing applications, issuing licenses, keeping records, investigating — are carried out by the \u003cstrong>DBPR\u003c/strong> (Division of Real Estate), which also serves the FREC.\u003c/p>\n\u003cp>\u003cstrong>Neither body can imprison anyone\u003c/strong> or award damages; those powers belong to the courts.\u003c/p>\n\u003ch2 id=\"7-legal-and-numerical-requirements\">7. Legal and numerical requirements\u003c/h2>\n\u003cul>\n\u003cli>7 members · Governor appoints, Senate confirms · 4-year terms.\u003c/li>\n\u003cli>4 brokers (5 yrs) · 1 broker or SA (2 yrs) · 2 consumers (never licensed) · one member 60+.\u003c/li>\n\u003cli>DBPR investigates; FREC disciplines; courts jail.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>\"Licensees elect the FREC.\" The Governor appoints.\u003c/li>\n\u003cli>\"All members are brokers.\" Two must never have been licensed.\u003c/li>\n\u003cli>\"FREC investigates complaints.\" DBPR does.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>\u003cstrong>4-1-2\u003c/strong>: four brokers, one broker-or-associate, two consumers. \u003cstrong>5 / 2\u003c/strong> years of experience. \u003cstrong>60+\u003c/strong> member. \u003cstrong>4-year\u003c/strong> terms.\u003c/p>\n"},{"id":"L03-2","ch":"ch03","title":"License types, registration, group and multiple licenses","type":"legal","pri":"medium","min":25,"manual":"M1 §License categories","pre":["L03-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>Chapter 475 issues \u003cstrong>two license types: sales associate and broker\u003c/strong>. A \u003cstrong>broker associate\u003c/strong> holds a broker license but works under another broker. Only a broker may open an office, hold escrow funds, and be paid directly by the public; a sales associate always acts for an employing broker (or owner-developer).\u003c/p>\n\u003cp>\u003cstrong>Licensure vs registration.\u003c/strong> \u003cem>Licensure\u003c/em> is DBPR's certification that you qualify. \u003cem>Registration\u003c/em> records your name, address, employer and status. Both must be current for you to operate.\u003c/p>\n\u003cp>\u003cstrong>Group license:\u003c/strong> a sales associate works for several \u003cstrong>connected\u003c/strong> entities of one owner-developer. \u003cstrong>Multiple licenses:\u003c/strong> a \u003cstrong>broker\u003c/strong> holds separate licenses for separate, unconnected brokerages. A sales associate can never hold multiple licenses.\u003c/p>\n\u003cp>\u003cstrong>Broker path:\u003c/strong> active sales associate license for \u003cstrong>24 months during the preceding 5 years\u003c/strong> → \u003cstrong>72-hour\u003c/strong> broker pre-license course → broker exam → \u003cstrong>60 hours\u003c/strong> of broker post-license education (two 30-hour courses) before the first broker renewal; missing it voids the broker license.\u003c/p>\n\u003cp>A sales associate may not be an officer or director of a brokerage corporation (that requires a broker license); the manual notes partners/officers who deal with the public must be brokers.\u003c/p>\n\u003ch2 id=\"7-legal-and-numerical-requirements\">7. Legal and numerical requirements\u003c/h2>\n\u003cul>\n\u003cli>Two license types; broker associate = broker license, works under another broker.\u003c/li>\n\u003cli>24 months in 5 years · 72 hours · 60 hours post-license.\u003c/li>\n\u003cli>Group license (connected entities) vs multiple licenses (broker only).\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>\"Broker associate is a third license type.\" It is a broker license used under another broker.\u003c/li>\n\u003cli>\"A sales associate can work for two unrelated brokers.\" Never.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>24 in 5, then 72, then 60. Group = connected entities. Multiple = brokers only.\u003c/p>\n"},{"id":"L03-3","ch":"ch03","title":"Keeping the license: post-license, renewal, CE and license status","type":"legal","pri":"high","min":35,"manual":"M1 §Keeping the license alive; §Status map","pre":["L03-2"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>First renewal\u003c/strong> comes \u003cstrong>18–24 months\u003c/strong> after licensure. Before it, a sales associate must complete the \u003cstrong>45-hour post-license course\u003c/strong>. Missing it makes the license \u003cstrong>null and void\u003c/strong>; to practice again, the person must requalify from the 63-hour course and exam.\u003c/p>\n\u003cp>After the first renewal, every \u003cstrong>2-year\u003c/strong> renewal period requires \u003cstrong>14 hours of continuing education\u003c/strong> (including core law). Failing to renew makes the license \u003cstrong>involuntarily inactive\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>Reactivation from involuntary inactive (s. 475.183, verified V-11):\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr class=\"header\">\n\u003cth>Time involuntarily inactive\u003c/th>\n\u003cth>Requirement\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr class=\"odd\">\n\u003ctd>12 months or less\u003c/td>\n\u003ctd>14 hours of commission-prescribed CE\u003c/td>\n\u003c/tr>\n\u003ctr class=\"even\">\n\u003ctd>More than 12 but less than 24 months\u003c/td>\n\u003ctd>28-hour commission-prescribed reactivation course\u003c/td>\n\u003c/tr>\n\u003ctr class=\"odd\">\n\u003ctd>More than 24 months\u003c/td>\n\u003ctd>License expires (null and void)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>The study manual mentions only \"late CE\" — the 28-hour course is a verified addition.\u003c/p>\n\u003cp>\u003cstrong>Status map:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Active\u003c/strong> — registered with an employing broker (or, for a broker, an office).\u003c/li>\n\u003cli>\u003cstrong>Voluntary inactive\u003c/strong> — the licensee chose it; may renew indefinitely with 14 hours CE per cycle.\u003c/li>\n\u003cli>\u003cstrong>Involuntary inactive\u003c/strong> — failure to renew; 2-year countdown.\u003c/li>\n\u003cli>\u003cstrong>Suspended\u003c/strong> — disciplinary time-out, up to 10 years.\u003c/li>\n\u003cli>\u003cstrong>Revoked\u003c/strong> — permanent cancellation (narrow exceptions).\u003c/li>\n\u003cli>\u003cstrong>Null and void\u003c/strong> — the license no longer exists.\u003c/li>\n\u003cli>\u003cstrong>Ineffective\u003c/strong> — exists but cannot be used (e.g., associate without an employer).\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"7-legal-and-numerical-requirements\">7. Legal and numerical requirements\u003c/h2>\n\u003cul>\n\u003cli>45 hours post-license before 1st renewal → miss = void.\u003c/li>\n\u003cli>14 hours CE per 2 years → miss = involuntary inactive.\u003c/li>\n\u003cli>Reactivation: ≤12 months 14 hrs · 12–24 months 28 hrs · &gt;24 months void.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>Confusing post-license (void) with CE (inactive) — the most-swapped pair.\u003c/li>\n\u003cli>\"Involuntary inactive can be fixed any time.\" Only for 2 years.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>POST missed → VOID. CE missed → INACTIVE. 1 year → 14; 2 years → 28; past 2 → dead.\u003c/p>\n"},{"id":"L03-4","ch":"ch03","title":"Licensee duties to the DBPR: address, convictions, changing brokers","type":"legal","pri":"high","min":20,"manual":"M1 §Keeping the license alive; §Status map","pre":["L03-3"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>Notify the DBPR:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Change of mailing address within 10 days\u003c/strong> (also when moving out of state — the license survives the move).\u003c/li>\n\u003cli>\u003cstrong>Any conviction, guilty plea or nolo contendere plea within 30 days\u003c/strong>, whether or not adjudication is withheld.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>One license, one employer.\u003c/strong> A sales associate may hold only one license and work for only one broker or owner-employer at a time.\u003c/p>\n\u003cp>\u003cstrong>Changing brokers.\u003c/strong> When employment ends, the associate's license cannot be used until the new employer's registration is filed. Showing listings or negotiating in the gap is operating without an effective license. Brokers must notify the DBPR when an associate leaves.\u003c/p>\n\u003ch2 id=\"7-legal-and-numerical-requirements\">7. Legal and numerical requirements\u003c/h2>\n\u003cul>\n\u003cli>Address change: 10 days. Conviction/plea: 30 days.\u003c/li>\n\u003cli>One employer at a time for sales associates.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>\"Nolo contendere is not a conviction, so no report.\" It must be reported.\u003c/li>\n\u003cli>\"My license is still current, so I can keep working between brokers.\" It is ineffective until re-registered.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Address = 10. Arrest outcome (conviction/plea) = 30. No employer = no work.\u003c/p>\n"},{"id":"L04-1","ch":"ch04","title":"The three brokerage relationships and the transaction-broker presumption","type":"legal","pri":"high","min":30,"manual":"M2 §The three relationships","pre":["L03-2"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>Florida (s. 475.278) authorizes three relationships between a licensee and a buyer or seller:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Transaction broker\u003c/strong> — the \u003cstrong>presumed\u003c/strong> relationship unless another is established in writing. \u003cem>Limited representation\u003c/em> of a buyer, a seller, or both; \u003cstrong>not a fiduciary\u003c/strong>; the party is a \u003cem>customer\u003c/em>.\u003c/li>\n\u003cli>\u003cstrong>Single agent\u003c/strong> — full \u003cstrong>fiduciary\u003c/strong> representation of one party (the \u003cem>principal\u003c/em>).\u003c/li>\n\u003cli>\u003cstrong>No brokerage relationship\u003c/strong> — the licensee deals with the party without representing them.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Dual agency is illegal:\u003c/strong> a brokerage may never be a single agent for both buyer and seller in the same transaction. The lawful way to work both sides is as a \u003cstrong>transaction broker for both\u003c/strong>.\u003c/p>\n\u003cp>Industry note (not Florida law): since August 2024 NAR policy requires MLS participants to sign written agreements with buyers before touring homes. This is a practice rule of the trade association, separate from Florida's statutory relationships.\u003c/p>\n\u003ch2 id=\"6-portugal-comparison\">6. Portugal comparison\u003c/h2>\n\u003cp>See PT-04 in the comparison base: Florida names and limits the relationship by statute and prohibits fiduciary representation of both sides.\u003c/p>\n\u003ch2 id=\"7-legal-and-numerical-requirements\">7. Legal and numerical requirements\u003c/h2>\n\u003cul>\n\u003cli>Presumption: transaction broker.\u003c/li>\n\u003cli>Dual agency prohibited; transaction broker for both is lawful.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"9-common-misconceptions\">9. Common misconceptions\u003c/h2>\n\u003cul>\n\u003cli>\"Dual agency is fine with written consent.\" Not in Florida.\u003c/li>\n\u003cli>\"Transaction brokers owe loyalty.\" Only single agents do.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10-memory-sheet\">10. Memory sheet\u003c/h2>\n\u003cp>Default = transaction broker. Two sides = transaction broker for both, never dual agent.\u003c/p>\n"},{"id":"L04-2","ch":"ch04","title":"The duty lists: 3, 7 and 9","type":"legal","pri":"high","min":35,"manual":"M2 §The duty lists","pre":["L04-1"],"status":"core","html":"\u003ch2 id=\"3-simple-explanation\">3. Simple explanation\u003c/h2>\n\u003cp>\u003cstrong>No brokerage relationship — 3 duties:\u003c/strong> (1) deal honestly and fairly; (2) disclose all known facts that materially affect the value of residential real property and are not readily observable to the buyer; (3) account for all funds entrusted.\u003c/p>\n\u003cp>\u003cstrong>Transaction broker — 7 duties:\u003c/strong> the 3 above, plus (4) use skill, care and diligence; (5) present all offers and counteroffers in a timely manner, unless a party has directed otherwise in writing; (6) \u003cstrong>limited confidentiality\u003c/strong>, unless waived in writing — not revealing that the seller will accept less than the asking price, that the buyer will pay more than offered, a party's motivation, or any information a party asks to keep confidential; (7) any additional duties mutually agreed.\u003c/p>\n\u003cp>\u003cstrong>Single agent — 9 duties:\u003c/strong>
