ance (homeowners' policies do not cover flood), past flood insurance claims, federal flood assistance received, and known flood damage.","citation":"s. 689.302, F.S.","url":"https://www.flsenate.gov/laws/statutes/2024/689.302","method":"official-excerpt","status":"gap-filled","teach":"Residential seller gives a statutory flood disclosure at or before contract. Effective date not confirmed in this session."},{"id":"V-07","topic":"Flood disclosure in residential leases","manual":"Not mentioned.","finding":"s. 83.512, F.S., created by ch. 2025-166, Laws of Fla. (CS/CS/SB 948, effective October 1, 2025), requires a landlord to give a prospective tenant a flood disclosure, as a separate document on the statutory form, at or before signing a residential rental agreement for a term of 1 year or longer. The form covers flood damage the landlord knows of during the landlord's ownership, flood insurance claims (including NFIP) and federal assistance (e.g., FEMA) received for flood damage, plus flood insurance notices. Remedy: if the landlord fails to comply and the tenant suffers a substantial loss of personal property from flooding (repair or replacement cost of 50% or more of its market value), the tenant may terminate the lease by written notice and surrender of possession within 30 days after the damage; prepaid rent for the period after termination is refunded. HB 1015 (2025) was laid on the table; its companion SB 948 was enacted and also amended the seller disclosure in s. 689.302.","citation":"s. 83.512, F.S. (2025; same core text 2026); ch. 2025-166, Laws of Fla. (CS/CS/SB 948)","url":"https://www.flsenate.gov/Laws/Statutes/2025/0083.512","method":"official-excerpt","checks":"double-checked","status":"gap-filled","teach":"Residential lease of 1 year or longer: landlord gives the flood disclosure at or before signing (since Oct 1, 2025). Shorter leases are not covered. Older books will not mention it."},{"id":"V-08","topic":"Condominium resale cancellation period (s. 718.503)","manual":"3 business days after receiving the documents on a resale.","finding":"Nondeveloper (resale) contracts for residential condominium units must say, in conspicuous type, either that the buyer received the declaration, articles, bylaws, rules and other documents more than 7 days (excluding Saturdays, Sundays and legal holidays) before signing, or that the agreement is voidable by the buyer by written notice within 7 days, excluding Saturdays, Sundays and legal holidays, after the buyer signs and receives the documents. A non-conforming contract is voidable by the buyer before closing; the right ends at closing. CS/CS/HB 913 (ch. 2025-175, effective July 1, 2025) extended this period from 3 days to 7 days; the 2024 text still read 3 days. Developer sales (unchanged): voidable within 15 days after the buyer signs and receives all required documents, and within 15 days after receiving an amendment that materially and adversely changes the offering; waivers are void; the right ends at closing.","citation":"s. 718.503(1)(a), (2), F.S. (2025; 7-day text also in 2026); ch. 2025-175, Laws of Fla. (CS/CS/HB 913); Senate 2025 Summary of Legislation Passed","url":"https://www.flsenate.gov/Laws/Statutes/2025/0718.503","method":"official-excerpt","checks":"double-checked","status":"corrected","teach":"Developer sale: 15 days. Resale: 7 days, excluding Saturdays, Sundays and legal holidays, after signing and receiving the documents (since July 1, 2025; older books say 3 business days). Both rights end at closing."},{"id":"V-09","topic":"Second homestead exemption indexed to inflation (s. 196.031)","manual":"Additional $25,000 on assessed value between $50,000 and $75,000, non-school.","finding":"Amendment 5 (approved Nov 5, 2024, effective Jan 1, 2025) indexes the additional exemption to CPI-U when the change is positive. Florida DOR: $25,722 for 2025 (2.9% CPI). Still applies only to non-school levies on assessed value over $50,000.","citation":"s. 196.031(1)(b), F.S.; Fla. DOR 2025 CPI adjustment notice","url":"https://floridarevenue.com/property/Documents/2025_cpi_homestead_exemption.pdf","method":"official-excerpt","status":"gap-filled","teach":"First $25,000: all taxes. Second exemption: up to $25,000 (CPI-indexed since 2025) on value above $50,000, non-school only. Exam math usually uses the round $25,000."},{"id":"V-10","topic":"Widow/widower, blind, totally and permanently disabled exemption (s. 196.202)","manual":"$5,000 (raised from $500 by 2023 law).","finding":"Current statute: $5,000. Increase enacted by the 2022 Legislature, first applying to the 2023 tax roll.","citation":"s. 196.202, F.S.; Fla. DOR PTO Bulletin 22-05","url":"https://www.flsenate.gov/Laws/Statutes/2026/196.202","method":"official-excerpt","status":"confirmed","teach":"$5,000. Older printings say $500."},{"id":"V-11","topic":"Reactivating an involuntarily inactive license (s. 475.183; Rule 61J2-3.010)","manual":"Reactivate within 2 years by completing late CE.","finding":"Involuntarily inactive 12 months or less: complete at least 14 hours of commission-prescribed CE. More than 12 but fewer than 24 months: complete 28 hours of a commission-prescribed reactivation course. Involuntarily inactive more than 2 years: license expires (null and void).","citation":"s. 475.183, F.S.; Rule 61J2-3.010, F.A.C.","url":"https://flsenate.gov/Laws/Statutes/2021/0475.183","method":"official-excerpt","status":"gap-filled","teach":"≤12 months → 14 hours. 12–24 months → 28-hour course. >24 months → void."},{"id":"V-12","topic":"Criminal penalties in s. 475.42","manual":"Unlicensed practice is a third-degree felony; most other criminal violations are misdemeanors.","finding":"s. 475.42(1)(a): operating as a broker or sales associate without a valid, current, active license is a third-degree felony. s. 475.42(2): any other violation of subsection (1) is a second-degree misdemeanor (s. 775.082 or 775.083), unless the chapter prescribes a different punishment.","citation":"s. 475.42(1)(a), (2), F.S. (2025; 2026 same structure)","url":"https://www.flsenate.gov/Laws/Statutes/2025/475.42","method":"official-excerpt","status":"confirmed","teach":"Unlicensed activity = third-degree felony (up to 5 years and $5,000 under the general sentencing statutes). Other s. 475.42(1) violations = second-degree misdemeanor."},{"id":"V-13","topic":"FREC composition (s. 475.02)","manual":"7 members, Governor appoints, Senate confirms, 4 brokers (5 yrs), 1 broker or sales associate (2 yrs), 2 consumers, one member 60+, 4-year terms, quorum 4, two-term limit.","finding":"Confirmed: 7 members appointed by the Governor subject to Senate confirmation; 4 licensed brokers with active licenses for the 5 preceding years; 1 broker or sales associate with an active license for the 2 preceding years; 2 members who are not and have never been brokers or sales associates; at least one member 60 or older; 4-year terms (s. 475.02). Quorum: 51% or more of the appointed members (s. 455.207) = 4 of 7; official action needs a majority of the quorum. Term limit (s. 20.165(5)): no member serves more than the remainder of a predecessor's term plus two consecutive 4-year terms; terms end October 31.","citation":"s. 475.02, F.S.; s. 455.207, F.S.; s. 20.165(5), F.S. (2025)","url":"https://www.flsenate.gov/Laws/Statutes/2023/0475.02","method":"official-excerpt","status":"confirmed","teach":"7 members (4 brokers, 1 broker or sales associate, 2 consumers; one 60+); 4-year terms; quorum 4; at most two consecutive full terms."},{"id":"V-14","topic":"Exemptions from licensure (s. 475.011)","manual":"Includes 'radon/appraiser/CPA professionals' and 'attorneys-in-fact under a power of attorney for a single specific transaction'.","finding":"Statute exempts, among others: attorneys in fact acting for the execution of contracts or conveyances only; attorneys at law within their duties; CPAs within their duties; personal representatives, receivers, trustees, and others appointed by will or court order; salaried employees of public utilities, railroads, government agencies acting for the employer's property; owners selling or leasing their own property (unless they use commissioned agents in the ordinary course of business); salaried employees of an owner (or of a broker for an owner) of an apartment community working in an onsite rental office in a leasing capacity; salaried condominium/cooperative managers renting units for terms of 1 year or less. No radon exemption found.","citation":"s. 475.011, F.S.","url":"https://www.flsenate.gov/laws/statutes/2023/475.011","method":"official-excerpt","status":"corrected","teach":"Teach the statutory list. Drop 'radon'."},{"id":"V-15","topic":"Conflicting demands / good-faith doubt (Rule 61J2-10.032; s. 475.25(1)(d)1)","manual":"Notify FREC within 15 business days; institute a procedure within 30 business days; mediation 90 days; notify within 10 business days if parties settle.","finding":"Rule 61J2-10.032 (eff. 5/21/2024): written notice to the Commission within 15 business days of the last demand (or of having good-faith doubt); institute a settlement procedure within 30 business days. Procedures: escrow disbursement order, arbitration (all parties consent), interpleader/litigation, mediation (all parties consent in writing; must be completed within 90 days after the last demand, otherwise promptly use another procedure). If the matter settles or goes to court before an EDO issues, notify the Commission within 10 business days. Following the resulting order protects the licensee from discipline for failure to account.","citation":"Rule 61J2-10.032, F.A.C.; s. 475.25(1)(d)1, F.S.","url":"https://flrules.org/gateway/RuleNo.asp?ID=61J2-10.032","method":"official-excerpt","status":"confirmed","teach":"15 / 30 business days; mediation 90 days; 10 business days if settled."},{"id":"V-16","topic":"When a broker may return a deposit without notifying FREC (s. 475.25(1)(d)1)","manual":"Exceptions: title company or attorney holds the deposit; HUD sale; condominium buyer rescission.","finding":"Statute: if a residential condominium buyer delivers written notice of intent to cancel under s. 718.503, or if a buyer in good faith fails to satisfy the terms of the financing clause, the licensee may return the escrowed property to the purchaser without notifying the commission or starting a settlement procedure. No HUD exception found in the excerpts.","citation":"s. 475.25(1)(d)1, F.S. (2025)","url":"https://www.flsenate.gov/Laws/statutes/2025/475.25","method":"official-excerpt","status":"corrected","teach":"Statutory exceptions: condo buyer cancels under 718.503; buyer's good-faith financing failure. When a title company or attorney holds the deposit, the broker is not the escrow holder and follows the verification procedure in V-39. 'HUD' removed (no official source found)."},{"id":"V-17","topic":"Real Estate Recovery Fund (s. 475.484)","manual":"$50,000 per transaction, $150,000 per licensee; no punitive damages or interest; license suspended until repaid with interest.","finding":"Payment is the lesser of the unsatisfied judgment (actual or compensatory damages) or $50,000; treble damages, court costs, attorney's fees and interest are not recoverable; $50,000 aggregate per transaction regardless of claimants; $150,000 aggregate per licensee (prorated when exceeded). Automatic suspension on payment until repaid in full plus interest (seen in 2010 text; not visible in the 2026 excerpt).","citation":"s. 475.484, F.S.","url":"https://www.leg.state.fl.us/Statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499/0475/Sections/0475.484.html","method":"official-excerpt","status":"confirmed","teach":"$50,000 per transaction · $150,000 per licensee · actual/compensatory damages only."},{"id":"V-18","topic":"Documentary stamp tax (ss. 201.02, 201.031, 201.08)","manual":"Deed $0.70 per $100 (Miami-Dade $0.60 single-family, other property $0.60 + $0.45 surtax); note $0.35 per $100; round up to next $100.","finding":"Deeds: 70 cents on each $100 or portion thereof of the total consideration in all counties except Miami-Dade, where the rate is 60 cents per $100. Miami-Dade also levies a discretionary surtax of 45 cents per $100 (s. 201.031; s. 125.0167 limits it to Miami-Dade) on documents other than those involving only a single-family residence, for a combined $1.05 per $100. Existing mortgage balance counts as consideration. Notes/written obligations: 35 cents per $100 or portion; capped at $2,450 only for unsecured documents; no cap for mortgage-secured obligations.","citation":"ss. 201.02, 201.031, 201.08, F.S. (2026); Fla. DOR documentary stamp tax page and Form DR-228 instructions","url":"https://floridarevenue.com/taxes/taxesfees/Pages/doc_stamp.aspx","method":"official-excerpt","status":"confirmed","teach":"Deed $0.70/$100 or portion (round UP), on the full price. Note $0.35/$100 or portion. Miami-Dade: $0.60 for a single-family residence; other property $0.60 + $0.45 surtax."},{"id":"V-19","topic":"Nonrecurring intangible tax (s. 199.133)","manual":"2 mills on new mortgages only, no rounding.","finding":"One-time tax of 2 mills on the just valuation of obligations secured by a mortgage or lien on Florida real property; paid when the mortgage is recorded.","citation":"s. 199.133, F.S. (2025)","url":"https://www.flsenate.gov/Laws/Statutes/2025/0199.133","method":"official-excerpt","status":"confirmed","teach":"0.002 × new mortgage amount."},{"id":"V-20","topic":"Brokerage disclosures: scope and exceptions (s. 475.278)","manual":"Apply to residential sales (≤4 units, unimproved for ≤4 units, agricultural ≤10 acres); not to commercial, leases, auctions, appraisals, business brokerage.","finding":"Definition confirmed. Disclosure not required: when the licensee knows the party is already represented by a single agent or transaction broker; bona fide open houses or model showings with no confidential information, offer, or representation agreement; unanticipated casual encounters; responses to general factual questions about advertised property; communications limited to general information about the licensee's qualifications or firm; auctions; appraisals; rentals and leases unless they include an option to purchase property with four or fewer residential units; dispositions of business enterprises except property with four or fewer residential units. Also a developer's onsite employees selling new units (manual-independent; not seen in excerpt).","citation":"s. 475.278, F.S. (2025, 2026)","url":"https://www.flsenate.gov/Laws/Statutes/2025/475.278","method":"official-excerpt","status":"gap-filled","teach":"Full exception list."},{"id":"V-21","topic":"Rental information for a fee (s. 475.453)","manual":"75% refund if no rental obtained, demand within 30 days; full refund if list inaccurate; first-degree misdemeanor.","finding":"s. 475.453(1) (2025): a broker or sales associate who furnishes a rental information list for a fee paid by the prospective tenant must give a contract or receipt providing for repayment of any amount over 25% of the fee if no rental is obtained, and repayment of the full fee on demand if the information was not current or accurate in any material respect. s. 475.453(3)(a): violation is a first-degree misdemeanor; (3)(b): the license is also subject to suspension or revocation. The 30-day window for demanding the refund appears in the 2002/2005 editions; the 2025 excerpts did not show it.","citation":"s. 475.453(1), (3), F.S. (2025)","url":"https://www.flsenate.gov/Laws/Statutes/2023/0475.453","method":"official-excerpt","status":"confirmed","teach":"75% refund if no rental is obtained; full refund if the list was inaccurate; violation = first-degree misdemeanor plus license discipline. The 30-day demand window is from older editions (not re-confirmed)."},{"id":"V-22","topic":"Mutual recognition","manual":"Agreements with several states; nonresidents only; 40-question Florida law exam, 30 correct.","finding":"DBPR's mutual recognition page and the Real Estate Laws and Rules candidate booklet: applicants from a state with a current agreement pass a 40-question Florida law exam, 30 or more correct. The applicant must not be a Florida resident when applying, and the other state's license must have been earned by education and exam there (not by reciprocity). Statutory basis s. 475.180. The Division home page lists 9 states (Alabama, Arkansas, Connecticut, Georgia, Kentucky, Mississippi, Nebraska, Rhode Island, West Virginia) and lists Illinois as 'Agreement Dissolved – December 31, 2025', along with Colorado (2009), Tennessee (2012), Indiana (2014) and Oklahoma (2016). A March 2025 FREC agenda item amended the West Virginia agreement. The Licensure Information page still listing Illinois appears out of date. Evidence: search excerpts only; the Illinois dissolution date appears on one page.","citation":"DBPR Division of Real Estate home page and mutual recognition page (2026 excerpts); RE_law_cibs.pdf; s. 475.180, F.S.","url":"https://www2.myfloridalicense.com/real-estate-commission/","method":"official-excerpt","checks":"double-checked","status":"gap-filled","teach":"Mechanism and the 40/30 exam: know them. Current list (9): AL, AR, CT, GA, KY, MS, NE, RI, WV; Illinois ended December 31, 2025. The list changes; low exam priority."},{"id":"V-23","topic":"Proposed homestead property-tax amendment (CS/HJR 1-F, 2026 Special Session)","manual":"Not mentioned.","finding":"Passed both chambers June 2, 2026; filed with the Secretary of State June 16, 2026; goes to the November 2026 ballot. Summaries describe a larger homestead exemption for non-school taxes and a lower cap on non-homestead assessment increases. Not law unless approved by voters.","citation":"CS/HJR 1-F (2026F)","url":"https://www.flsenate.gov/Session/Bill/2026F/1F/?Tab=BillHistory","method":"official-excerpt","status":"pending-law","teach":"Not exam content. Watch the November 2026 result; exam questions usually lag law changes."},{"id":"V-24","topic":"Closing statement: assumed mortgage","manual":"Table shows an assumed mortgage as a buyer credit only.","finding":"An assumed mortgage is a double entry: credit the buyer (it pays part of the price) and debit the seller (the seller hands over the debt instead of paying it off from proceeds). A new mortgage is a buyer credit only; the seller's payoff of an existing loan is a seller debit only.","citation":"Closing-statement accounting logic (standard textbook treatment); verify against Gold Coast Ch. 14","url":"","method":"logic","status":"corrected","teach":"Assumed mortgage: debit seller, credit buyer."},{"id":"V-25","topic":"Note stamps on assumed mortgages","manual":"Note stamps apply to new and assumed mortgages; intangible tax only to new money.","finding":"Florida DOR lists 'mortgages and assumptions of mortgages' among obligations taxable when recorded, at 35 cents per $100 or portion (s. 201.08; no cap for recorded mortgages). DOR TAA 22B4-002: assuming a note and mortgage is a taxable renewal under s. 201.08(1), measured on the outstanding balance. Intangible tax: s. 199.145(3) — no additional nonrecurring tax is due when an obligation is assumed if the tax was paid before and the debt is unchanged; refinancing with the same lender is taxed only on new principal (s. 199.145(4)).","citation":"s. 201.08(1), F.S.; ss. 199.133, 199.145(3)-(4), F.S. (2025); Fla. DOR documentary stamp tax page; DOR TAA 22B4-002","url":"https://www.flsenate.gov/Laws/Statutes/2025/0199.145","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"Note stamps ($0.35/$100) on new AND assumed mortgages. Intangible tax (2 mills) on new mortgages only — not again on an assumption when it was paid originally and the debt is unchanged."},{"id":"V-26","topic":"Statements still not independently verified","manual":"Minimum age, education and SSN for applicants; reapplying 2 years after a denial for dishonesty; the 3/7/9 brokerage duty lists (s. 475.278); statute of frauds; qualifying ratios 28/36 and 31/43; PMI above 80% LTV; FHA 3.5% down; points ≈ 1/8% yield; reverse mortgage age 62; Florida meridian intersection in Tallahassee; measurement constants (acre, mile, square yard, township, section).","finding":"The 2026-10-19/20 verification passes checked the other manual statements (V-27 to V-80). These remain from the study manual. Measurement constants are standard definitions; ratios, PMI, points and FHA figures are course conventions or program rules that change over time.","citation":"Study manual","url":"","method":"not-checked","status":"not-verified","teach":"Taught as stated, labelled 'not yet verified'. Next verification pass: s. 475.278 duty lists and s. 475.17(1) applicant requirements."},{"id":"V-27","topic":"Sales associate post-licensing education (s. 475.17(3))","manual":"Sales associates must complete 45 hours of post-licensing education before the first renewal; otherwise the license becomes null and void and the person must requalify [s. 475.17(3), F.S.; Rule 61J2-3.020, F.A.C.]","finding":"s. 475.17(3)(a) lets the Commission prescribe postlicensure education for a sales associate to keep a valid license. The cap is 45 classroom hours of 50 minutes each, including the exam, and it is due before the first renewal after initial licensure. It is delivered as one or more Commission-approved courses totaling at least 45 hours, by classroom or approved distance learning (distance courses need a passed timed exam). A completion notice is withheld if absences exceed 10% of classroom hours. If the requirement is not done before the first renewal, the license 'shall be considered null and void.' To operate again the person must requalify by completing the sales associate prelicensure course and passing the state exam. Exceptions: the Commission may allow an extra 6 months for an individual physical hardship defined by rule, and holders of a 4-year or higher degree in real estate are exempt. Attorneys are NOT exempt from post-licensing, per DBPR. DBPR's current 2026 renewal notices still list 45 hours for sales associates. Rule 61J2-3.020 says the same, but the only rule text seen was a 2017 FREC meeting copy, so the current rule text was not read directly.","citation":"s. 475.17(3)(a),(c), F.S. (2025 and 2026 editions); Rule 61J2-3.020, F.A.C.; DBPR Division of Real Estate 2026 renewal notice (SL AC Grp 1)","url":"https://www.flsenate.gov/Laws/Statutes/2026/475.17","method":"official-excerpt","checks":"double-checked","status":"confirmed","teach":"45 hours before the first renewal. Missed → license null and void → retake the 63-hour course and pass the state exam again. Exempt: holders of a 4-year (or higher) degree in real estate. Attorneys are NOT exempt. FREC may allow 6 more months for a physical hardship."},{"id":"V-28","topic":"Continuing education (s. 475.182; Rule 61J2-3.009)","manual":"After the first renewal, 14 hours of continuing education (including core law) each 2-year renewal period, for active and inactive licensees [s. 475.182, F.S.; Rule 61J2-3.009]","finding":"s. 475.182(1): the renewal application for an active broker, broker associate or sales associate license must include proof of at least 14 classroom hours (50-minute hours) of continuing education in each biennium of the license period. Approved distance learning is allowed. Sales associates and brokers do not have to meet the 14-hour requirement before the first renewal after initial licensure, because postlicensure education applies then. Rule 61J2-3.009 is titled 'Continuing Education for Active and Inactive Broker and Sales Associate Licensees.' It requires every active or inactive licensee to complete at least 14 hours (50-minute hours) per renewal period, excluding the first renewal period. As amended, the 14 hours are 3 hours Core Law, 3 hours Ethics and Business Practices, and 8 hours specialty education. This split is mandatory for licenses expiring on or after March 31, 2025. Core Law must be taken at least once per renewal period. Other points: Florida Bar members in good standing are exempt from CE under this rule. Once per renewal cycle, attending one FREC legal agenda session may substitute for 3 hours, with 7 days' notice, but not when attending as a party to a disciplinary action. Note that the manual's 'including core law' is now more specific: 3 Core Law + 3 Ethics + 8 specialty.","citation":"s. 475.182(1), F.S. (2025/2026 editions); Rule 61J2-3.009, F.A.C. (current); FREC education page; DBPR 2025/2026 renewal notices","url":"https://flrules.org/gateway/RuleNo.asp?ID=61J2-3.009","method":"official-excerpt","checks":"double-checked","status":"confirmed","teach":"14 hours in each 2-year renewal period after the first renewal, for active and inactive licensees: 3 hours Core Law + 3 hours Ethics and Business Practices + 8 hours specialty. Florida Bar members are exempt from CE. Once per cycle, attending a FREC legal agenda session can replace 3 hours."},{"id":"V-29","topic":"Broker licence: experience and pre-licence course (s. 475.17(1)-(2))","manual":"Broker applicant must have held an active sales associate license for 24 months during the preceding 5 years and complete a 72-hour broker course [s. 475.17(2), F.S.; Rule 61J2-3.008]","finding":"Experience: a person may not be licensed as a broker unless one of three things holds during the preceding 5 years, each for at least 24 months. (1) They held an active sales associate license in the office of one or more brokers licensed in Florida, another US state, territory or jurisdiction, or a foreign national jurisdiction. (2) They held a current, valid sales associate license while employed by a governmental agency for a salary, performing licensee duties. (3) They held a current, valid broker license in another US state, territory or jurisdiction, or a foreign jurisdiction. Anyone licensed as a Florida sales associate in the preceding 5 years must also have completed the sales associate postlicensure education. Course: the broker prelicensure course may not exceed 72 classroom hours (50-minute hours) including the exam (FREC Course II), versus 63 hours for sales associates. A completion notice is withheld if absences exceed 8 classroom hours. Citation note: the 72-hour course is in s. 475.17(2)(a)1. The 24-month experience rule is in subsection (1) of s. 475.17, which excerpts label (1)(b), with the postlicensure prerequisite at (1)(c); it is not in (2). The 2026 text matches 2025.","citation":"s. 475.17(1)(b)-(c) and (2)(a)1., F.S. (2025 and 2026 editions); Rule 61J2-3.008, F.A.C. (amended 7/8/2022)","url":"https://www.flsenate.gov/Laws/Statutes/2025/475.17","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"24 months of experience in the preceding 5 years: as an active sales associate under a broker (Florida, another state or a foreign jurisdiction), as a salaried government employee holding a sales associate licence, or as a broker licensed elsewhere. Sales associate post-licensing must be complete. Then the 72-hour broker course (FREC Course II) and the broker exam."},{"id":"V-30","topic":"Broker post-licensing education (s. 475.17(4))","manual":"Brokers must complete 60 hours of post-licensing education before the first broker renewal (two 30-hour courses); otherwise the broker license is void [s. 475.17(3), F.S.; Rule 61J2-3.020]","finding":"s. 475.17(4)(a): the Commission may prescribe postlicensure education for a broker to keep a valid license. The cap is 60 classroom hours of 50 minutes each, including the exam, due before the first renewal after initial licensure, as Commission-approved courses totaling at least 60 hours. s. 475.17(4)(c): the license of any broker who does not complete it before the first renewal 'shall be considered null and void.' DBPR guidance: the 60 hours may be taken as two 30-hour courses, Broker Investment and Broker Management, by classroom or distance education. The only exemption is a 4-year degree in real estate; attorneys are not exempt. Re-entry, from the statute and law book (not confirmed in the current subsection text): a former broker whose license became void may get a sales associate license by completing the 14-hour CE course within 6 months after the broker license expired. To be a broker again, they must retake the broker prelicensure course and pass the broker exam. Citation note: the broker provision is s. 475.17(4); (3) is the sales associate provision.","citation":"s. 475.17(4)(a),(c), F.S. (2025/2026 editions); Rule 61J2-3.020, F.A.C.; DBPR Division of Real Estate home page and broker guidance","url":"https://www.flsenate.gov/Laws/Statutes/2026/475.17","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"60 hours before the first broker renewal (usually two 30-hour courses). Missed → broker licence null and void."},{"id":"V-31","topic":"Validity of the pre-licence course completion (s. 475.181(2))","manual":"Completion of the 63-hour sales associate pre-license course is valid for 2 years for purposes of taking the state exam [s. 475.17, F.S.; Rule 61J2-3.008]","finding":"s. 475.181(2): if an applicant does not pass the licensing exam within 2 years after the successful course completion date, the course completion is invalid for licensure. DBPR's sales associate requirements sheet says the 63-hour prelicensing course is valid for licensure for 2 years after completion; the broker sheet says the same of the 72-hour course. The candidate booklet says an expired course completion is not accepted at the test site, and the course completion certificate must be shown at every exam attempt. Florida Bar members in good standing are exempt from the sales associate prelicense course. Citation correction: the 2-year rule is in s. 475.181(2), F.S., not s. 475.17 or Rule 61J2-3.008. Note also that the rule turns on PASSING the exam within 2 years, not merely taking it.","citation":"s. 475.181(2), F.S. (2026 edition; same in 2015-2025); DBPR 'Real Estate Associate Requirements for licensure' (RESLRequirements.pdf); DBPR Sales Associate Candidate Information Booklet","url":"https://www.leg.state.fl.us/Statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499%2F0475%2FSections%2F0475.181.html","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"The course completion is invalid if the state exam is not PASSED within 2 years after completing the course."},{"id":"V-32","topic":"Validity of the licence application (s. 475.181(2))","manual":"An application for licensure remains valid for 2 years [Rule 61J2-2 / 61J2-3, F.A.C.]","finding":"s. 475.181(2): 'The application shall expire 2 years after the date received if the applicant does not pass the appropriate examination.' The window was 1 year in the 2002 statute and has been 2 years since at least the 2005/2009 editions; the 2026 text keeps it. Clarifications: the 2 years run from the date DBPR receives the application, and the rule is that the application expires if the exam is not passed in that time. It is separate from the 2-year course-completion validity in the same subsection. Citation correction: the source is the statute, s. 475.181(2), F.S., not Rule 61J2-2 or 61J2-3.","citation":"s. 475.181(2), F.S. (2026 edition)","url":"https://www.leg.state.fl.us/Statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499%2F0475%2FSections%2F0475.181.html","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"The application expires 2 years after DBPR receives it if the applicant has not passed the exam."},{"id":"V-33","topic":"Length of the first renewal period","manual":"The first renewal falls 18-24 months after initial licensure [Rule 61J2-1.008 or 61J2-3.020, F.A.C.]","finding":"The DBPR Division of Real Estate educational requirements sheet (rev. 06/2018) says the first renewal period is 18-24 months and the 2nd and later renewal periods are 24 months. Postlicensure education must be finished before that first renewal: 45 hours for sales associates, 60 for brokers. DBPR renewal pages say all real estate licenses expire at midnight Eastern on March 31 or September 30; that is why the first period varies from 18 to 24 months. Caveats: no official source was found stating the 18-24 month rule in Rule 61J2-1.008 or 61J2-3.020, so the manual's rule citation is unverified. The confirming document is an official 2018 DBPR sheet; nothing current contradicts it, but no current-year restatement was found.","citation":"DBPR Division of Real Estate, 'Real Estate (FREC) Educational Requirements' (rev. 06/2018); DBPR renewal notices 2025/2026","url":"https://www2.myfloridalicense.com/re/documents/real_estate_ed_requirements.pdf","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"First renewal falls 18–24 months after licensure, because all real estate licences expire on March 31 or September 30; later periods are 24 months. (Source: DBPR education sheet; the rule number was not located.)"},{"id":"V-34","topic":"Change of mailing or e-mail address (Rule 61J2-10.038; s. 455.275)","manual":"Licensees must notify DBPR/FREC of a change of mailing address within 10 days [Rule 61J2-10.038, F.A.C.; s. 475.23 or s. 455.275, F.S.]","finding":"Statute: s. 455.275(1) makes each DBPR licensee solely responsible for notifying the department in writing of their current mailing address, e-mail address and place of practice. Failing to report a change is a violation and can lead to discipline. Rule: Rule 61J2-10.038, 'Mailing Address: Place of Practice: Requirement for Notification', implements s. 455.275(1) and s. 475.05. The 2020 FREC-approved text requires each licensee and permit holder to notify the Department in writing of the current mailing and e-mail address, and any change to either, within 10 days after the change. A first violation gets a citation; repeat violations lead to disciplinary proceedings. The rule was amended again effective 7/18/2024. Per the DBPR annual report, that amendment changed the definition of 'current mailing address' (striking 'residential' so the brokerage office's physical location can serve). The 2024 text itself was not read, so whether the 10-day period survived is inferred, not directly seen. Related: s. 475.23 separately requires notice within 10 days of a change of business address or employing broker, on a Commission form. A resident licensee who becomes a nonresident must notify the Commission within 60 days.","citation":"Rule 61J2-10.038, F.A.C. (amended 12/8/2020 and 7/18/2024); s. 455.275(1), F.S. (2025); s. 475.23, F.S.","url":"https://flrules.org/gateway/ruleno.asp?id=61J2-10.038&Section=0","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"Notify DBPR in writing within 10 days of a change of mailing or e-mail address. Change of employing broker or business address: within 10 days (s. 475.23). The 10-day period is confirmed in the 2020 rule text; the July 2024 amendment was not read directly."},{"id":"V-35","topic":"Reporting crimes: convictions and pleas (s. 455.227(1)(t); s. 475.25(1)(p))","manual":"Licensees must report a conviction, guilty plea or nolo contendere plea to a crime within 30 days, whether or not adjudication is withheld [s. 475.25(1)(p), F.S.; s. 455.227(1)(t), F.S.]","finding":"s. 455.227(1)(t), which applies to all DBPR licensees including real estate, makes it a ground for discipline to fail to report in writing to the board (here FREC), or to DBPR if there is no board, within 30 days after being convicted or found guilty of, or pleading nolo contendere or guilty to, a crime in any jurisdiction, regardless of adjudication. s. 475.25(1)(p) (2025) is narrower: discipline for failing to inform the Commission in writing within 30 days after pleading guilty or nolo contendere to, or being convicted or found guilty of, any FELONY. The manual's combined rule (any crime, regardless of adjudication) is correct through s. 455.227(1)(t); the chapter 475 provision alone covers only felonies.","citation":"s. 455.227(1)(t), F.S. (2026 edition); s. 475.25(1)(p), F.S. (2025 edition)","url":"https://www.leg.state.fl.us/Statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499%2F0455%2FSections%2F0455.227.html","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"Report in writing within 30 days any conviction or finding of guilt, or plea of guilty or nolo contendere, to ANY crime in any jurisdiction, regardless of adjudication (s. 455.227). Chapter 475 alone covers felonies."},{"id":"V-36","topic":"Sales associate delivers deposits to the broker (Rule 61J2-14.009)","manual":"A sales associate must deliver a deposit to the employing broker no later than the end of the next business day [Rule 61J2-14.009, F.A.C.]","finding":"Every sales associate who receives any deposit (as defined in Rule 61J2-14.008) must deliver it to the broker or employer no later than the end of the next business day following receipt of the item to be deposited. Saturdays, Sundays and legal holidays are not business days. Rulemaking authority is s. 475.05, F.S., and it implements s. 475.25(1)(k), F.S. The broker's own escrow deadline in 61J2-14.008 ('immediately', 3 business days) is a separate, longer rule.","citation":"Rule 61J2-14.009, F.A.C. (current text on flrules.org; last substantive amendment 2-5-04 per search excerpt); s. 475.25(1)(k), F.S. (2025)","url":"https://flrules.org/gateway/ruleNo.asp?id=61J2-14.009","method":"official-excerpt","checks":"double-checked","status":"confirmed","teach":"By the end of the next business day after receipt (weekends and legal holidays are not business days)."},{"id":"V-37","topic":"Broker deposits escrow funds 'immediately' (Rule 61J2-14.008)","manual":"'Immediately' means the broker places escrow funds in an escrow account no later than the end of the third business day following receipt [Rule 61J2-14.008, F.A.C.]","finding":"Rule 61J2-14.008 defines 'immediately' as placing a deposit in an escrow account no later than the end of the third business day following receipt of the item to be deposited. Saturdays, Sundays and legal holidays are not business days. The DBPR Bureau of Enforcement FAQ gives the same definition. The rule's history reads 'Amended 7-5-95, 7-4-06, 12-6-07, 6-21-10', and the excerpts show no later amendment.","citation":"Rule 61J2-14.008, F.A.C. (Definitions; effective 6-21-2010, current); implements s. 475.25(1)(k), F.S. (2025)","url":"https://flrules.org/gateway/ruleno.asp?id=61J2-14.008","method":"official-excerpt","checks":"double-checked","status":"confirmed","teach":"By the end of the third business day after receipt; weekends and legal holidays excluded. Received Monday → deposited by the end of Thursday."},{"id":"V-38","topic":"Broker's own money in escrow accounts (Rule 61J2-14.010; s. 475.25(1)(k))","manual":"A broker may keep up to $1,000 of personal or brokerage funds in a sales escrow account and up to $5,000 in a property management escrow account [Rule 61J2-14.010, F.A.C.]","finding":"Rule 61J2-14.010(2): a broker may place and maintain up to $1,000 of personal or brokerage funds per sales escrow account and up to $5,000 per property management escrow account. The 2025 text of s. 475.25(1)(k), F.S. says the same: up to $5,000 in the property management escrow account and up to $1,000 in the sales escrow account. The statute adds that a broker gets a reasonable time to correct escrow errors when there is no shortage of funds and no significant threat of economic harm to the public, and that the Legislature intends disbursement of escrowed funds not to be delayed by a dispute over the personal or brokerage funds. One scraped copy of the rule also contained a general '$5,000 per account' sentence. The account-specific $1,000 sales cap governs and matches the statute.","citation":"Rule 61J2-14.010(2), F.A.C. (current); s. 475.25(1)(k), F.S. (2025)","url":"https://www.flsenate.gov/Laws/statutes/2025/475.25","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"Up to $1,000 in a sales escrow account; up to $5,000 in a property management escrow account."},{"id":"V-39","topic":"Deposits held by a title company or attorney (Rule 61J2-14.008(2)(b))","manual":"When a deposit is held by a title company or attorney, the broker is not the escrow holder; the broker must obtain written verification of the deposit (manual: request a written statement and give it to the seller within 10 business days) [Rule 61J2-14.008, F.A.C.; s. 475.25(1)(d), F.S.]","finding":"The current rule has two separate 10-business-day steps plus an exception. (1) The licensee who prepared or presented the sales contract must put the title company's or attorney's name, address and telephone number on the contract. (2) Within 10 business days after each deposit is due under the sales contract, the licensee's broker must make a written request to the title company or attorney for written verification that the deposit was received. This step is not required if the seller or seller's agent nominated the title company or attorney in writing. (3) Within 10 business days of the date of that request, the broker must give the seller's broker (or the seller, if unrepresented) either a copy of the verification or written notice that no verification was received. What changed: before the 6-21-2010 amendment, the request was due within 3 business days after the deposit was due. The 2009 F.A.W. notice and an older rule file show the 3-day text; the current Chapter 61J2-14 compilation and FREC citation documents show 10 days. The manual's single 'give it to the seller within 10 business days' merges the two windows, leaves out the seller-nominated exception and the contract-disclosure duty, and names the seller instead of the seller's broker. The verification duty comes from the rule, not s. 475.25(1)(d); s. 475.25(1)(k) is what allows deposits to be held by a title company.","citation":"Rule 61J2-14.008(2)(b), F.A.C. (as amended 6-21-2010, current); s. 475.25(1)(k), F.S. (2025)","url":"https://flrules.org/gateway/ruleno.asp?id=61J2-14.008","method":"official-excerpt","checks":"double-checked","status":"corrected","teach":"The contract names the title company or attorney (name, address, phone). Within 10 business days after each deposit is due, the broker asks the holder in writing to verify receipt (not required if the seller or seller's agent nominated the holder in writing). Within 10 business days of that request, the broker gives the seller's broker (or the seller, if unrepresented) the verification or a notice that none was received."},{"id":"V-40","topic":"Brokerage records (s. 475.5015)","manual":"Brokers must keep books, accounts and records (including escrow records and disclosures) for at least 5 years; if litigation is involved, at least 2 years after it concludes [Rule 61J2-14.012, F.A.C.; s. 475.5015, F.S.]","finding":"s. 475.5015, F.S.: each broker must keep at least one legible copy of all books, accounts and records of the brokerage business for at least 5 years. The 5 years run from receipt of any entrusted money, fund, deposit, check or draft or, if no funds were entrusted, from the date any party signs the listing agreement, offer to purchase, rental property management agreement, lease or other agreement engaging the broker. If a document is the subject of litigation or used as evidence in it, the relevant records must be kept at least 2 years after the civil action or any appellate proceeding concludes, whichever is later, and never less than 5 years in total. Rule 61J2-14.012 separately requires the broker to preserve deposit slips, depository statements and the parties' agreements and make them available to the Department. It also requires an accurate account of each deposit and each bank account, plus monthly reconciliations. The retention periods themselves come from the statute, not the rule excerpt.","citation":"s. 475.5015, F.S. (2025; same in 2024); Rule 61J2-14.012, F.A.C.","url":"https://www.flsenate.gov/Laws/Statutes/2025/0475.5015","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"Keep at least 5 years (from receipt of funds or, if none, from signing of the listing, offer, lease or other agreement). In litigation: at least 2 years after the case and any appeal end, and never less than 5 years in total."},{"id":"V-41","topic":"FREC penalties (s. 475.25(1))","manual":"FREC may impose an administrative fine of up to $5,000 per count and suspend a license for up to 10 years [s. 475.25(1), F.S.]","finding":"s. 475.25(1), F.S.: the Commission may deny an application or renewal, place a licensee on probation, suspend a license, registration or permit for up to 10 years, revoke it, impose an administrative fine of up to $5,000 for each count or separate offense, and issue a reprimand, on the listed grounds. Wording is identical in the 2024 and 2025 editions. The cap was $1,000 per count in the 2002 edition and was $5,000 by the 2010 edition. The 2026 edition is listed on the official site; the excerpts showed no change, but its subsection (1) penalty text was not retrieved.","citation":"s. 475.25(1), F.S. (2025)","url":"https://www.flsenate.gov/Laws/statutes/2025/475.25","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"Fine up to $5,000 per count; suspension up to 10 years; also denial, probation, revocation and reprimand."},{"id":"V-42","topic":"Probable cause panel (s. 455.225(4); Rule 61J2-20.009)","manual":"The probable cause panel for real estate is composed of two members, at least one a current FREC member (other may be a former member) [s. 455.225(4), F.S.; s. 475.021?]","finding":"s. 455.225(4), F.S.: probable cause is decided by majority vote of a board's probable cause panel. A board may set up by rule multiple panels of at least two members, and one or more panel members may be former board members. Every panel must include a present board member and a former or present professional member, and a former professional member must hold an active valid license. It must also include a former or present consumer member if one is available, willing to serve and authorized by the chair. FREC Rule 61J2-20.009 (effective 11-8-2012): per FREC 2016/2019 rule documents, the panel must include at least one present Commission member, and one member may be a former Commission member, as s. 455.225(4) allows. A 2012 FREC meeting copy of the rule read 'two current members of the Commission,' appointed by the chair. The exact panel size in the current rule text was not seen directly, but a two-member panel fits both the statute and the rule. The authority is s. 455.225(4) and Rule 61J2-20.009, not s. 475.021.","citation":"s. 455.225(4), F.S. (2025; same in 2024); Rule 61J2-20.009, F.A.C. (eff. 11-8-2012)","url":"https://www.flsenate.gov/Laws/Statutes/2025/0455.225","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"At least two members, including a present FREC member; a former member may serve. Probable cause is decided by majority vote. (Current rule wording on size seen only in fragments.)"},{"id":"V-43","topic":"Appeal of a final order (s. 120.68)","manual":"A licensee may appeal a final order to the District Court of Appeal within 30 days [s. 120.68, F.S.; Fla. R. App. P. 9.110]","finding":"s. 120.68, F.S.: a party adversely affected by final agency action may seek judicial review. All proceedings start by filing a notice of appeal or petition for review under the Florida Rules of Appellate Procedure within 30 days after rendition of the order appealed. Review is in the appellate district where the agency has its headquarters or where a party resides, or as otherwise provided by law. Fla. R. App. P. 9.110(c): for appeals of final orders of lower administrative tribunals, the notice is filed with the agency clerk within 30 days of rendition, and a copy with filing fees goes to the court clerk. Missing the 30-day notice is an irremediable jurisdictional defect.","citation":"s. 120.68(1)(a), (2)(a), F.S. (2025; 2026 edition excerpt identical); Fla. R. App. P. 9.110(c)","url":"https://flsenate.gov/Laws/Statutes/2025/120.68","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"Notice of appeal within 30 days after the final order is rendered, to the District Court of Appeal."},{"id":"V-44","topic":"Advertising and team names (Rules 61J2-10.025, 61J2-10.026)","manual":"All licensee advertising must include the licensed name of the brokerage firm (blind ad otherwise); rules for team names and internet ads (firm name placement) [Rule 61J2-10.025, F.A.C.]","finding":"Confirmed, but the team-name rules are in a different rule than the manual says. Rule 61J2-10.025(1) says all advertising must let reasonable people know they are dealing with a real estate licensee, and every real estate advertisement must include the licensed name of the brokerage firm. Ads may not be fraudulent, false, deceptive or misleading. (2): if the licensee's personal name appears, at least the last name must be used as registered with the Commission. (3)(a), internet ads: the brokerage firm name must be placed next to, or directly above or below, the 'point of contact information'. That term means any way to contact the brokerage or the licensee: mailing or street address, email, telephone or fax. The flrules chapter index still lists 2/5/2007 as the effective date. An amendment proposed in 2018-2019 (licensee name no larger than the brokerage name; individual licensees barred from words like 'Brokerage', 'Brokers', 'Company') was not confirmed as adopted, so treat it as unverified. TEAM NAMES are in Rule 61J2-10.026 (Team or Group Advertising, effective 11/1/2021), not 10.025: (a) the team must work under the same broker and file a designated licensee with the broker; (b) the broker keeps a written roster of team members, updated at least monthly; (c) team names may include 'team' or 'group' but not 'Brokerage', 'Realty', 'Real Estate', 'Properties', 'Company' or similar words suggesting a separate brokerage; (d) ads with the team name may not be in larger print than the registered brokerage's name or logo; (e) ads must make clear to reasonable people that they are dealing with a team or group. Failing to include the registered brokerage name can be cited under Rule 61J2-24.002.","citation":"Rule 61J2-10.025(1)-(3), F.A.C. (eff. 2/5/2007, current per flrules chapter index, 2026); Rule 61J2-10.026, F.A.C. (eff. 11/1/2021) for team or group advertising","url":"https://flrules.org/gateway/RuleNo.asp?ID=61J2-10.025","method":"official-excerpt","checks":"double-checked","status":"confirmed","teach":"Every ad includes the licensed brokerage name (otherwise it is a blind ad). A licensee's own name: at least the last name as registered. Internet ads: brokerage name next to, above or below the contact information. Team names may use 'team' or 'group' but not 'Brokerage', 'Realty', 'Real Estate', 'Properties', 'Company' or similar, and may not appear larger than the brokerage name."},{"id":"V-45","topic":"Office entrance sign (s. 475.22(1))","manual":"Broker's office entrance sign must show the broker's name, trade name if any, and 'Licensed Real Estate Broker' or 'Lic. Real Estate Broker' [Rule 61J2-10.024, F.A.C.]","finding":"Confirmed. The operative requirement is in statute s. 475.22(1), F.S. (2025). Each active broker must keep a sign on or about the entrance of the principal office and each branch office, where anyone about to enter can easily see and read it. The sign must contain the broker's name together with the trade name, if any. For a partnership or corporation, it must show the firm's name or trade name and the name of at least one active broker. At a minimum, the words 'licensed real estate broker' or 'lic. real estate broker' must appear on office entrance signs. Rule 61J2-10.024 (Office Entrance Signs) still appears on flrules. A repeal was proposed in January 2006 on the ground that it only duplicates Chapter 475, but flrules marks it 'Not Adopted by FAC Yet'. Whether or not the rule stands, the statute imposes the same requirement. Older versions (2002/2010) said the Commission set the sign's form and minimum dimensions; the 2025 excerpt does not show that language.","citation":"s. 475.22(1), F.S. (2025; the 2026 edition carries the same section heading); Rule 61J2-10.024, F.A.C. (2006 proposed repeal not adopted)","url":"https://www.leg.state.fl.us/Statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499%2F0475%2FSections%2F0475.22.html","method":"official-excerpt","checks":"double-checked","status":"confirmed","teach":"At the entrance of the main office and each branch: the broker's name and any trade name (a firm: its name plus at least one broker) and the words 'Licensed Real Estate Broker' or 'Lic. Real Estate Broker'."},{"id":"V-46","topic":"Designated sales associates (s. 475.2755)","manual":"Designated sales associates allowed only in nonresidential transactions where buyer and seller each have assets of $1 million or more and request it in writing [s. 475.2755, F.S.]","finding":"Confirmed. In a real estate transaction other than a 'residential sale' as defined in s. 475.278(5)(a), a broker may, at the customers' request, designate sales associates to act as single agents for different customers in the same transaction. This is allowed only where the buyer and seller have assets of $1 million or more. A 'residential sale' is improved residential property of four units or fewer, unimproved residential property intended for four units or fewer, or agricultural property of 10 acres or fewer. The buyer and seller must both sign disclosures stating that their assets meet the threshold and asking the broker to use the designated sales associate form of representation. Designated sales associates have a single agent's duties under s. 475.278(3), including the (3)(b)-(c) disclosure requirements. They may not disclose confidential customer information except to the broker or persons the broker specifies (or as the law permits or requires). The broker must keep that information confidential and may not use it to the detriment of the other party. The $1 million figure is unchanged from the 2000/2002 editions through the 2024 and 2026 editions.","citation":"s. 475.2755, F.S. (2026 ed.; same text in 2024); s. 475.278(5)(a), F.S. for 'residential sale'","url":"https://www.leg.state.fl.us/Statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499%2F0475%2FSections%2F0475.2755.html","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"Only in nonresidential transactions; buyer and seller each have assets of $1 million or more and sign disclosures requesting it. Each designated associate has a single agent's duties."},{"id":"V-47","topic":"Stigmatized property (s. 689.25)","manual":"The fact that a property was the site of a homicide, suicide or death, or that an occupant had HIV/AIDS, is not a material fact that must be disclosed [s. 689.25, F.S.]","finding":"Confirmed. s. 689.25(1)(a): the fact that an occupant of real property is or has been infected with HIV, or diagnosed with AIDS, is not a material fact that must be disclosed in a real estate transaction. (1)(b): the fact that a property was, or was at any time suspected to have been, the site of a homicide, suicide or death is not a material fact that must be disclosed in a real estate transaction. (2): no cause of action arises against an owner, the owner's agent, a transferee's agent, or a person licensed under chapter 475 for failing to disclose these facts. The 2001 version covered only HIV/AIDS; the homicide, suicide and death language was added later and is in the 2010 through 2025 text. The 2026 index still lists s. 689.25 under the same title ('Failure to disclose homicide, suicide, deaths, or diagnosis of HIV or AIDS infection in an occupant of real property').","citation":"s. 689.25(1)(a)-(b), (2), F.S. (2025; listed unchanged in the 2026 index)","url":"https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0600-0699%2F0689%2FSections%2F0689.25.html","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"That a homicide, suicide or death occurred on the property, or that an occupant had HIV/AIDS, is not a material fact that must be disclosed."},{"id":"V-48","topic":"Timing of brokerage relationship notices (s. 475.278(3)-(4))","manual":"Single agent notice: before or at the time of entering a listing/representation agreement or before showing property, whichever occurs first; No brokerage relationship notice: before showing; consent to transition before the change [s. 475.278(3)-(4), F.S.]","finding":"Confirmed. s. 475.278(3)(b): a single agent's duties must be fully described and disclosed in writing to the buyer or seller. This can be a separate document or part of another document such as a listing or representation agreement. The disclosure must be made before, or at the time of, entering into a listing agreement or an agreement for representation, or before the showing of property, whichever occurs first. If included in another document, the notice must be at least as large as the other provisions and conspicuously placed, with the first sentence in uppercase bold type, using the prescribed 'SINGLE AGENT NOTICE' form. s. 475.278(3)(c): a single agent may transition to transaction broker only if the principal gives written consent before the change in relationship, using the prescribed Consent to Transition to Transaction Broker notice. s. 475.278(4): a licensee with no brokerage relationship must disclose its duties in writing before the showing of property, using the prescribed notice. These disclosure requirements apply only to residential sales (s. 475.274, s. 475.278(5)). They do not apply to nonresidential transactions, most rentals or leases, bona fide open houses or model home showings that involve no eliciting of confidential information or negotiation, or when the licensee knows the party is already represented by a single agent or transaction broker.","citation":"s. 475.278(3)(b)-(c), (4), (5), F.S. (2026 ed.; same text in 2025)","url":"https://www.flsenate.gov/Laws/Statutes/2026/475.278","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"Single agent notice: before or at the time of a listing or representation agreement, or before showing property, whichever comes first. No brokerage relationship notice: before showing property. Single agent → transaction broker: the principal's written consent before the change."},{"id":"V-49","topic":"Written listing agreements (s. 475.25(1)(r))","manual":"Written listing agreements must have a definite expiration date, description, price and terms, fee, signatures; no automatic renewal; copy delivered to the person signing within 24 hours [s. 475.25(1)(r), F.S.]","finding":"Confirmed, with one note on wording. Under s. 475.25(1)(r), the Commission may discipline a licensee who fails to include required terms in a written listing agreement or to deliver a copy on time. Each written listing agreement must contain a definite expiration date, a description of the property, price and terms, the fee or commission, and the signature of the principal(s). A copy must be given to the person signing within 24 hours of obtaining the written listing agreement. The statute does not use the words 'automatic renewal'. Instead it says a written listing agreement may contain no provision requiring the person signing to notify the broker of an intention to cancel after the definite expiration date. In effect, that bars self-renewing listings that need a cancellation notice. The provision applies to written listing agreements; it does not require every listing to be in writing.","citation":"s. 475.25(1)(r), F.S. (2026 ed.; same core text in 2025, 2022, 2020, 2012, 2010)","url":"https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0400-0499%2F0475%2FSections%2F0475.25.html","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"Definite expiration date, property description, price and terms, fee, principal's signature; copy to the signer within 24 hours; no clause requiring the seller to give notice to cancel after the expiration date (no automatic renewal)."},{"id":"V-50","topic":"TRID disclosure timing (12 CFR 1026.19(e)-(f))","manual":"Loan Estimate delivered within 3 business days after receiving the application [12 CFR 1026.19(e)] / Closing Disclosure received at least 3 business days before consummation [12 CFR 1026.19(f)]","finding":"The creditor must deliver or mail the Loan Estimate no later than the third business day after it receives the consumer's application, as defined in 1026.2(a)(3). The clock starts once the six application items in 1026.2(a)(3)(ii) are received. For this deadline, 'business day' has the general meaning: a day the creditor's offices are open to the public for carrying on substantially all of its business functions. Separately, 1026.19(e)(1)(iii)(B) requires the Loan Estimate to be delivered or mailed no later than the seventh business day before consummation, and for that rule a business day is every calendar day except Sundays and federal legal public holidays. Mailed or emailed Loan Estimates are treated as received 3 business days after delivery or mailing. If the creditor denies the application, or the consumer withdraws it, within the 3-day window, no Loan Estimate is required. No 2025 or 2026 final rule changing this timing was found; a July 9, 2026 CFPB request for information only asks for comment. Under 1026.19(f)(1)(ii)(A), the creditor must ensure the consumer receives the Closing Disclosure no later than three business days before consummation. Exceptions are listed in (f)(1)(ii)(B) (timeshares: by consummation) and in (f)(2). Disclosures not handed over in person are treated as received 3 business days after delivery or mailing. For this rule, a business day is every calendar day except Sundays and federal legal public holidays, so Saturdays count. A consumer may waive the waiting period only for a bona fide personal financial emergency, and only after receiving the disclosures. Under (f)(2)(ii), a corrected Closing Disclosure starts a new 3-business-day waiting period if the APR becomes inaccurate, the loan product changes, or a prepayment penalty is added. No 2025 or 2026 timing amendment was found.","citation":"12 CFR 1026.19(e)(1)(iii)(A)-(B) and 1026.2(a)(6), Regulation Z (eCFR current text, 2026; official comment 19(e)(1)(iii)); 12 CFR 1026.19(f)(1)(ii)(A), (f)(1)(iii)-(iv), (f)(2)(ii), Regulation Z (eCFR current text, 2026)","url":"https://www.ecfr.gov/current/title-12/chapter-X/part-1026/subpart-C/section-1026.19","method":"official-excerpt","checks":"double-checked","status":"confirmed","teach":"Loan Estimate: delivered or mailed within 3 business days after the application. Closing Disclosure: received at least 3 business days before consummation; a new 3-day wait only if the APR becomes inaccurate, the loan product changes or a prepayment penalty is added."},{"id":"V-51","topic":"TILA right of rescission (12 CFR 1026.23)","manual":"TILA right of rescission: 3 business days for credit secured by the consumer's principal dwelling; not for residential mortgage transactions (purchase money) [12 CFR 1026.23]","finding":"Under 1026.23(a)(1), in a credit transaction where a security interest is or will be retained or acquired in a consumer's principal dwelling, each consumer whose ownership interest is or will be subject to it has the right to rescind. The right runs until midnight of the third business day after the latest of three events: consummation, delivery of the rescission notice, or delivery of all material disclosures. If the notice or material disclosures are never delivered, the right expires 3 years after consummation, or earlier on transfer of all the consumer's interest or on sale of the property. For rescission, business days include Saturdays but not Sundays or federal legal public holidays. Under 1026.23(f), the right does not apply to (1) a residential mortgage transaction, meaning credit to finance the purchase or initial construction of the principal dwelling, or (2) a refinancing by the same creditor, except to the extent the new amount financed exceeds the unpaid principal, earned unpaid finance charges and refinancing costs. If the consumer rescinds, the security interest becomes void and the consumer owes no finance charge.","citation":"12 CFR 1026.23(a)(1), (a)(3), (d)(1), (f) and 1026.2(a)(6), Regulation Z (eCFR current text; CFR 2025 edition, govinfo)","url":"https://www.ecfr.gov/current/title-12/chapter-X/part-1026/subpart-C/section-1026.23","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"3 business days (Saturdays count) for credit secured by the borrower's principal dwelling, such as a home equity loan or a refinance with a new lender. Not for loans to buy or build the home."},{"id":"V-52","topic":"Credit advertising trigger terms (12 CFR 1026.24(d))","manual":"Advertising trigger terms: amount or percentage of down payment, number of payments or period of repayment, amount of any payment, amount of any finance charge [12 CFR 1026.24(d)]","finding":"For closed-end credit, 1026.24(d)(1) lists four triggering terms: (i) the amount or percentage of any downpayment; (ii) the number of payments or period of repayment; (iii) the amount of any payment; (iv) the amount of any finance charge. An ad that states any one of them must also state the items in (d)(2): the downpayment amount or percentage, the terms of repayment (including any balloon payment), and the APR, with a note if the rate may increase after consummation. The official commentary adds four points. Implied terms count; for example, '80 percent financing' implies a 20% downpayment. 'No downpayment' is not a trigger. Vague phrases such as 'monthly payments to suit your needs' are not statements of a payment amount. Stating the APR, or that there is no particular charge (for example 'no closing costs'), is not a trigger.","citation":"12 CFR 1026.24(d)(1)-(2), Regulation Z (eCFR current text, 2026), and Supplement I comment 24(d)(1)","url":"https://www.ecfr.gov/current/title-12/chapter-X/part-1026/subpart-C/section-1026.24","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"Triggers: down payment amount or percentage, number of payments or repayment period, payment amount, finance charge amount. Using one requires the down payment, repayment terms and APR. The APR alone, 'no down payment' and 'no closing costs' are not triggers."},{"id":"V-53","topic":"RESPA scope, Section 8 and Section 9","manual":"RESPA applies to federally related mortgage loans on 1-4 family residential property; Section 8 prohibits kickbacks and unearned fees; Section 9 bars sellers from requiring a particular title insurer [12 USC 2602, 2607, 2608; 12 CFR 1024]","finding":"Scope: under 12 USC 2602(1), a 'federally related mortgage loan' is a loan, other than temporary financing such as a construction loan, that is secured by a first or subordinate lien on residential real property designed principally for one to four families, including condominium and cooperative units. The loan must also have a federal connection, for example a federally insured or regulated lender, a federally related program, or intended sale to Fannie Mae, Ginnie Mae or Freddie Mac. Regulation X (12 CFR 1024.2) adds that a loan secured by property outside a State is not covered. Section 8, 12 USC 2607: (a) no person may give or accept any fee, kickback or thing of value under an agreement to refer settlement-service business; (b) no person may give or accept any portion, split or percentage of a settlement-service charge other than for services actually performed. Under 12 CFR 1024.14, a charge for no or nominal services, or a duplicative fee, is an unearned fee. Freeman v. Quicken Loans (2012) limits 2607(b) to fees split between two or more persons. Section 9, 12 USC 2608(a): a seller of property bought with a federally related mortgage loan may not require, directly or indirectly as a condition of sale, that the buyer purchase title insurance from a particular title company. Under 2608(b), a violating seller owes the buyer 3 times all title insurance charges. 12 CFR 1024.16 restates this rule.","citation":"12 USC 2602(1), 2607(a)-(b), 2608(a)-(b) (U.S. Code, 2023 edition, govinfo); 12 CFR 1024.2, 1024.14, 1024.16 (Regulation X, current)","url":"https://www.law.cornell.edu/uscode/text/12/2608","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"Federally related mortgage loans on 1–4 family residential property. Section 8: no kickbacks or unearned fees for referrals. Section 9: a seller may not require the buyer to use a particular title insurer (liable for 3 times the title charges)."},{"id":"V-54","topic":"Fair Housing Act exemptions (42 USC 3603(b), 3607)","manual":"Fair Housing Act exemptions: owner of no more than 3 single-family houses selling/renting without a broker and without discriminatory ads (one sale per 24 months if not the occupant); owner-occupied dwellings of no more than 4 units; religious organizations; private clubs [42 USC 3603(b), 3607]","finding":"3603(b)(1): section 3604 does not apply to a single-family house sold or rented by a private owner, but only if four conditions are met. (1) The owner does not own more than three such houses at one time, and does not own an interest in or receive proceeds from more than three at once. (2) An owner who was not living in the house, or was not its most recent occupant, gets the exemption for only one such sale in any 24-month period. (3) No broker, agent or salesperson, and no person in the business of selling or renting dwellings, is used. (4) No advertising that violates 3604(c) is published. Under 3603(c), a person is 'in the business' if, in the preceding 12 months, they acted as principal in 3 or more dwelling transactions or as agent in 2 or more. 3603(b)(2): rooms or units in a dwelling with living quarters for no more than four families living independently are exempt if the owner actually lives in one of them. 3607(a): a religious organization, or a nonprofit it operates, supervises or controls, may limit sale, rental or occupancy of dwellings it owns or operates for a noncommercial purpose to members of the same religion, or give them preference, unless membership in the religion is restricted by race, color or national origin. A private club not in fact open to the public may limit lodgings it provides as an incidental, noncommercial part of its purpose to its members, or give them preference. 24 CFR Part 100 repeats both exemptions.","citation":"42 USC 3603(b)-(c) and 3607(a) (U.S. Code, 2023/2024 editions, govinfo)","url":"https://www.law.cornell.edu/uscode/text/42/3603","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"Private owner of no more than 3 single-family homes, no broker, no discriminatory ads (one sale per 24 months if not the occupant); owner-occupied building with no more than 4 units; religious organizations; private clubs (members, non-commercial lodging)."},{"id":"V-55","topic":"Housing for older persons (42 USC 3607(b))","manual":"Housing for older persons: 55+ with at least 80% of occupied units having at least one person 55+; or 62+ for all occupants [42 USC 3607(b); 24 CFR 100.304-305]","finding":"The familial status protections do not apply to 'housing for older persons'. 42 USC 3607(b)(2) defines that housing three ways: (A) housing provided under a qualifying state or federal elderly program; (B) housing intended for, and solely occupied by, persons 62 or older; (C) housing intended and operated for persons 55 or older. Under (C), at least 80% of occupied units must have at least one person 55 or older, and the facility must publish and follow policies showing that intent and comply with HUD's age-verification rules. The Housing for Older Persons Act of 1995 (Pub. L. 104-76) added the 80% test, which replaced the old 'one person 55+ per unit' wording. HUD rules are as follows. 24 CFR 100.303: 62+ housing must be solely occupied by persons 62 or older; exceptions cover residents who were under 62 on Sept. 13, 1988 (if all new occupants are 62+) and vacant units reserved for persons 62+. 24 CFR 100.304-305: the 80% is measured on occupied units only; a temporarily vacant unit counts as occupied if the primary occupant lived there in the past year and intends to return; fractions round up; new construction need not comply until 25% of units are occupied; HUD says the other 20% need not be occupied by people under 55. 24 CFR 100.306-307 require published policies and verification by reliable surveys and affidavits.","citation":"42 USC 3607(b)(1)-(2) (U.S. Code, 2023 edition); 24 CFR 100.303-100.307 (CFR 2025 edition / eCFR current)","url":"https://www.ecfr.gov/current/title-24/subtitle-B/chapter-I/part-100/subpart-E","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"62+: all occupants 62 or older. 55+: at least 80% of occupied units have at least one person 55 or older, with published policies and age verification."},{"id":"V-56","topic":"Fair housing protected classes by year (42 USC 3604)","manual":"Sex added to the Fair Housing Act in 1974; familial status and handicap added in 1988 [HUD / 42 USC 3604 history]","finding":"The U.S. Code amendment notes to 42 USC 3604 say Pub. L. 93-383, the Housing and Community Development Act of 1974 (section 808), inserted ', sex' after 'religion' throughout 3604(a)-(e). The Fair Housing Amendments Act of 1988 (Pub. L. 100-430, enacted Sept. 13, 1988, effective 180 days later) did three things. It added 'familial status' to 3604(a)-(b). It added 'handicap, familial status' to 3604(c)-(e). It added 3604(f), which bars discrimination because of handicap. The 1968 Act originally covered race, color, religion and national origin. Current protected classes: race, color, religion, sex, familial status, national origin and handicap (HUD rules now say 'disability').","citation":"42 USC 3604, Amendments notes (U.S. Code 2023 edition, govinfo); Pub. L. 93-383 sec. 808 (1974); Pub. L. 100-430, 102 Stat. 1619 (1988)","url":"https://www.govinfo.gov/content/pkg/USCODE-2023-title42/html/USCODE-2023-title42-chap45-subchapI-sec3604.htm","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"1968: race, color, religion, national origin. 1974: sex. 1988: familial status and handicap (disability)."},{"id":"V-57","topic":"Fair housing complaint deadlines (42 USC 3610, 3613)","manual":"Fair housing complaint to HUD within 1 year of the discriminatory act; civil action within 2 years [42 USC 3610(a), 3613(a)]","finding":"42 USC 3610(a)(1)(A)(i): an aggrieved person may file a complaint with the HUD Secretary no later than one year after an alleged discriminatory housing practice occurred or terminated. 42 USC 3613(a)(1)(A): a civil action in federal or state court must be filed no later than 2 years after the practice occurred or terminated, or after breach of a conciliation agreement, whichever is later. Under 3613(a)(1)(B), the 2-year period does not run while a HUD administrative proceeding on the same practice is pending; this tolling does not apply to suits for breach of a conciliation agreement. Under 3613(a)(2), a person may sue whether or not a HUD complaint was filed. For comparison, Attorney General suits on referred matters under 3614(b)(1)(B) have an 18-month limit.","citation":"42 USC 3610(a)(1)(A)(i) and 3613(a)(1)(A)-(B) (U.S. Code, 2020/2021 editions, govinfo)","url":"https://www.law.cornell.edu/uscode/text/42/3613","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"HUD complaint within 1 year; civil lawsuit within 2 years (the clock stops while a HUD proceeding is pending)."},{"id":"V-58","topic":"Do Not Call: established business relationship (16 CFR 310.2; 47 CFR 64.1200)","manual":"Do Not Call established business relationship: up to 18 months after the consumer's last purchase/transaction and up to 3 months after an inquiry [16 CFR 310.2; 47 CFR 64.1200]","finding":"The FTC rule's wording has changed, while the FCC rule's wording has not. FTC Telemarketing Sales Rule, 16 CFR 310.2(q), as amended by the final rule published April 16, 2024 (89 FR, doc. 2024-07180) and effective May 16, 2024, defines an established business relationship as either (1) a purchase, rental, lease or financial transaction with the seller within the 540 days before the telemarketing call, or (2) an inquiry or application about the seller's goods or services within the 90 days before the call. The 2024 rule replaced '18 months' with 540 days and 'three months' with 90 days. Sellers relying on the inquiry prong must keep records under 310.5. The FCC rule, 47 CFR 64.1200(f)(5) (current eCFR), still uses 18 months after a purchase or transaction and 3 months after an inquiry or application. Under the FCC rule, the relationship must come from a voluntary two-way communication and must not have been ended by either party; a company-specific do-not-call request ends it for telemarketing purposes. Exam answer: '18 months / 3 months' is still literally correct under the FCC rule. The TSR now says 540 days / 90 days, which is roughly but not exactly the same.","citation":"16 CFR 310.2(q) (as amended eff. May 16, 2024; eCFR current 2026); 47 CFR 64.1200(f)(5) (eCFR current)","url":"https://www.federalregister.gov/documents/2024/04/16/2024-07180/telemarketing-sales-rule","method":"official-excerpt","checks":"double-checked","status":"corrected","teach":"FCC rule: 18 months after a purchase or transaction, 3 months after an inquiry. FTC rule since May 16, 2024: 540 days and 90 days. Exam answer: 18 months / 3 months, unless the question uses days."},{"id":"V-59","topic":"CAN-SPAM (15 USC 7704; 16 CFR 316)","manual":"CAN-SPAM opt-out requests must be honored within 10 business days; email must include a valid physical postal address [15 USC 7704; 16 CFR 316]","finding":"15 USC 7704(a)(4)(A): once a recipient opts out, the sender, and anyone acting on its behalf, may not send that recipient commercial email more than 10 business days after receiving the request. The sender also may not sell or transfer the address. The FTC's 2008 rulemaking considered cutting this to 3 days and kept 10 business days; its 2019 review kept the Rule without changes. Under 7704(a)(3), the opt-out mechanism must keep working for at least 30 days after the message is sent. Under 16 CFR 316.5, the sender may not charge a fee or require more than an email address, a reply email, or a visit to a single web page to opt out. 15 USC 7704(a)(5)(A)(iii): every commercial email must include the sender's valid physical postal address. 16 CFR 316.2 defines this as a current street address, a registered USPS Post Office box, or a private mailbox registered with a commercial mail receiving agency.","citation":"15 USC 7704(a)(3)-(5) (U.S. Code 2020 edition, govinfo); 16 CFR 316.2, 316.5 (CAN-SPAM Rule, current)","url":"https://www.ftc.gov/business-guidance/resources/can-spam-act-compliance-guide-business","method":"official-excerpt","checks":"single-checked","status":"confirmed","teach":"Honor opt-outs within 10 business days; include a valid physical postal address; the opt-out must keep working for at least 30 days after sending."},{"id":"V-60","topic":"Lead-based paint
