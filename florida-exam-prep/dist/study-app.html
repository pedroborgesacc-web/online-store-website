C members, subject to Senate confirmation, for 4-year terms. Two members are consumers who have never held a license.","w":{"0":["RULE","Members are appointed, not elected, and terms are 4 years."],"2":["RULE","The Governor appoints; terms are 4 years."],"3":["RULE","Two members must never have been licensed."]}},{"id":"Q0301-03","l":"L03-1","o":1,"d":2,"t":"mcq","q":"When the FREC adopts a rule setting advertising requirements, it is exercising which power?","c":["Quasi-judicial","Quasi-legislative","Executive-administrative","Prosecutorial"],"a":1,"ex":"Rule-making is quasi-legislative. Deciding discipline cases is quasi-judicial.","w":{"0":["CONFUSED","Quasi-judicial is deciding cases and imposing discipline."],"2":["CONFUSED","Executive/administrative functions (licensing, records) are mostly DBPR's."],"3":["CONFUSED","Prosecution is done by DBPR attorneys (discipline) or state attorneys (crimes); adopting rules is not prosecution."]}},{"id":"Q0301-04","l":"L03-1","o":2,"d":1,"t":"mcq","q":"A buyer files a complaint against a sales associate. Which body investigates it?","c":["The FREC","The DBPR","The Florida Bar","The county clerk"],"a":1,"ex":"The DBPR receives and investigates complaints. The FREC (through a probable cause panel and final orders) decides discipline.","w":{"0":["CONFUSED","The FREC decides discipline; it does not investigate."],"2":["RULE","The Florida Bar regulates attorneys."],"3":["RULE","The clerk records documents."]}},{"id":"Q0302-01","l":"L03-2","o":0,"d":1,"t":"mcq","q":"A person holds a broker license but works under another broker's supervision. This person is a:","c":["sales associate","broker associate","transaction broker","designated sales associate"],"a":1,"ex":"A broker associate holds a broker license but operates as an associate under another broker.","w":{"0":["CONFUSED","A sales associate holds a sales associate license."],"2":["CONFUSED","Transaction broker is a brokerage relationship, not a license type."],"3":["CONFUSED","Designated sales associate is a role in certain nonresidential deals."]}},{"id":"Q0302-02","l":"L03-2","o":2,"d":2,"t":"mcq","num":["N-014"],"q":"To qualify for a broker license, a sales associate must have held an active license for at least:","c":["12 months in the preceding 3 years","24 months in the preceding 5 years","36 months in the preceding 5 years","24 months in the preceding 3 years"],"a":1,"ex":"24 months of active sales associate licensure during the preceding 5 years, then the 72-hour broker course and broker exam.","w":{"0":["NUMBER","It is 24 months within 5 years."],"2":["NUMBER","24 months, not 36."],"3":["NUMBER","The window is 5 years, not 3."]}},{"id":"Q0302-03","l":"L03-2","o":1,"d":2,"t":"mcq","q":"Which person may hold multiple licenses?","c":["A sales associate working for two unrelated brokers","A broker who is a broker for two unconnected brokerages","A broker associate working for two brokers","A sales associate under a group license"],"a":1,"ex":"Only a broker may hold multiple licenses (for separate, unconnected brokerages). A sales associate can work for one employer at a time; a group license covers connected entities of one owner-developer.","w":{"0":["RULE","A sales associate may work for only one employer at a time."],"2":["RULE","An associate works under one employer."],"3":["CONFUSED","A group license is one license covering connected entities."]}},{"id":"Q0303-01","l":"L03-3","o":0,"d":1,"t":"mcq","num":["N-008"],"q":"A sales associate fails to complete post-license education before the first renewal. The license:","c":["becomes involuntarily inactive","becomes null and void","is suspended for 2 years","remains active with a fine"],"a":1,"ex":"Missing the 45-hour post-license requirement makes the license null and void. Missing CE at a later renewal makes it involuntarily inactive.","w":{"0":["CONFUSED","Involuntary inactive is the result of missing a later renewal/CE."],"2":["RULE","There is no automatic suspension."],"3":["RULE","The license does not remain active."]}},{"id":"Q0303-02","l":"L03-3","o":1,"d":1,"t":"mcq","num":["N-009"],"q":"After the first renewal, a sales associate must complete how many hours of continuing education each renewal period?","c":["14","28","45","60"],"a":0,"ex":"14 hours of CE every 2-year renewal period after the first: 3 hours Core Law, 3 hours Ethics and Business Practices, 8 hours specialty.","w":{"1":["CONFUSED","28 hours is the reactivation course after more than 12 months of involuntary inactivity."],"2":["CONFUSED","45 hours is post-license education."],"3":["CONFUSED","60 hours is broker post-license education."]}},{"id":"Q0303-03","l":"L03-3","o":2,"d":2,"t":"scn","num":["N-011"],"v":"V-11","q":"Rita's license has been involuntarily inactive for 18 months. What must she do to reactivate it?","c":["Nothing yet; she may simply pay the renewal fee within 2 years","Complete the regular 14 hours of commission-prescribed CE","Complete a 28-hour commission-prescribed reactivation course","Retake the 63-hour pre-license course and pass the state exam"],"a":2,"ex":"More than 12 but fewer than 24 months involuntarily inactive: 28-hour reactivation course. 12 months or less: 14 hours. More than 24 months: the license expires.","w":{"0":["RULE","She must complete education to reactivate."],"1":["NUMBER","14 hours applies only if inactive 12 months or less."],"3":["NUMBER","Requalifying is required only after the license expires (more than 2 years)."]}},{"id":"Q0303-04","l":"L03-3","o":3,"d":2,"t":"mcq","q":"Which license status can be renewed indefinitely without the holder working for a broker?","c":["Involuntary inactive","Voluntary inactive","Suspended","Null and void"],"a":1,"ex":"A licensee may choose voluntary inactive status and keep renewing it (with CE) indefinitely. Involuntary inactive expires after 2 years.","w":{"0":["CONFUSED","Involuntary inactive expires after 2 years."],"2":["RULE","Suspension is discipline for a set time."],"3":["RULE","A void license no longer exists."]}},{"id":"Q0303-05","l":"L03-3","o":3,"d":3,"t":"scn","num":["N-011"],"q":"A sales associate let her license lapse (involuntary inactive) 26 months ago. What is her status?","c":["Involuntary inactive; 28-hour course reactivates it","Voluntary inactive","Null and void; she must requalify","Active once she pays the fee"],"a":2,"ex":"Involuntary inactive status lasts at most 2 years. After 26 months the license has expired (null and void).","w":{"0":["NUMBER","The 28-hour course applies only between 12 and 24 months."],"1":["CONFUSED","She did not choose voluntary status."],"3":["RULE","Paying a fee cannot revive an expired license."]}},{"id":"Q0304-01","l":"L03-4","o":0,"d":1,"t":"mcq","num":["N-012"],"q":"A licensee changes her mailing address. Within how many days must she notify the DBPR?","c":["5","10","15","30"],"a":1,"ex":"Address changes must be reported within 10 days. Convictions and pleas must be reported within 30 days.","w":{"0":["NUMBER","It is 10 days."],"2":["NUMBER","It is 10 days."],"3":["CONFUSED","30 days is the deadline for reporting a conviction or plea."]}},{"id":"Q0304-02","l":"L03-4","o":0,"d":2,"t":"scn","num":["N-013"],"q":"A sales associate pleads nolo contendere to a misdemeanor and adjudication is withheld. What must she do?","c":["Nothing, because she was not convicted","Report it within 30 days","Report it within 10 days","Report it at her next renewal"],"a":1,"ex":"Licensees must report a conviction, a guilty plea, or a plea of nolo contendere within 30 days, whether or not adjudication is withheld.","w":{"0":["QUALIFIER","A nolo plea must be reported even without a conviction."],"2":["CONFUSED","10 days is the address-change deadline."],"3":["NUMBER","The deadline is 30 days."]}},{"id":"Q0304-03","l":"L03-4","o":1,"d":2,"t":"scn","q":"Tom's employing broker closes the office. While looking for a new broker, Tom keeps showing his clients' listings. Which is correct?","c":["Lawful, because his license remains current and active until it expires","Lawful for up to 30 days while he registers with a new employing broker","Unlawful: his license is ineffective until registered with a new employer","Lawful, as long as each client consents in writing to his continued help"],"a":2,"ex":"A sales associate may act only under a registered employer. When employment ends, the license cannot be used until the new employer's registration is filed.","w":{"0":["QUALIFIER","A current license is not enough; it must be registered with an employer."],"1":["RULE","There is no grace period."],"3":["RULE","Client consent cannot authorize unlicensed activity."]}},{"id":"Q0401-01","l":"L04-1","o":0,"d":1,"t":"mcq","q":"Unless a different relationship is established in writing, a Florida real estate licensee is presumed to be operating as a:","c":["single agent","dual agent","transaction broker","cooperating subagent"],"a":2,"ex":"Florida presumes a transaction-broker relationship unless a single agent or no brokerage relationship is established in writing.","w":{"0":["RULE","Single agency must be established in writing."],"1":["PT","Dual agency is illegal in Florida."],"3":["RULE","Subagency is not one of Florida's authorized relationships."]}},{"id":"Q0401-02","l":"L04-1","o":1,"d":2,"t":"scn","q":"A brokerage is a single agent for a seller. The same brokerage's buyer customer wants to buy the property. How may the brokerage lawfully proceed?","c":["Continue as single agent for the seller and also become single agent for the buyer","Act as a dual agent for both parties after both sign a written dual-agency consent","Obtain the seller's written consent to transition, then act as transaction broker for both","Refer the buyer to another brokerage, because Florida forbids working both sides"],"a":2,"ex":"A brokerage may not be a single agent for both sides. With the principal's prior written consent to transition, it may act as a transaction broker for both.","w":{"0":["RULE","Single agency for both sides is dual agency, which Florida prohibits."],"1":["PT","Consent does not legalize dual agency in Florida."],"3":["RULE","Florida provides a lawful path (transition to transaction broker)."]}},{"id":"Q0401-03","l":"L04-1","o":2,"d":2,"t":"mcq","q":"In a transaction-broker relationship, the buyer is a:","c":["principal","customer","fiduciary","subagent"],"a":1,"ex":"A transaction broker provides limited representation and is not a fiduciary; the party is a customer. Only a single agent has a principal.","w":{"0":["CONFUSED","Principal is the term for a single agent's client."],"2":["CONFUSED","The licensee, not the buyer, would be the fiduciary in single agency."],"3":["RULE","Subagency is not an authorized Florida relationship."]}},{"id":"Q0402-01","l":"L04-2","o":2,"d":1,"t":"mcq","num":["N-032"],"q":"Which duty is owed by a single agent but NOT by a transaction broker?","c":["Dealing honestly and fairly","Accounting for all funds","Loyalty","Presenting all offers and counteroffers in a timely manner"],"a":2,"ex":"Loyalty, obedience, full confidentiality and full disclosure belong only to the single agent. The other three choices are owed by transaction brokers too.","w":{"0":["CONFUSED","Honesty is owed in every relationship."],"1":["CONFUSED","Accounting is owed in every relationship."],"3":["CONFUSED","Presenting offers is a transaction-broker duty too."]}},{"id":"Q0402-02","l":"L04-2","o":0,"d":1,"t":"mcq","num":["N-030"],"q":"How many duties does a licensee owe a party with whom there is NO brokerage relationship?","c":["3","5","7","9"],"a":0,"ex":"No brokerage relationship: 3 duties (honesty, disclosure of known material facts on residential property, accounting). Transaction broker 7; single agent 9.","w":{"1":["NUMBER","Remember 3 · 7 · 9."],"2":["CONFUSED","7 is the transaction-broker list."],"3":["CONFUSED","9 is the single-agent list."]}},{"id":"Q0402-03","l":"L04-2","o":1,"d":2,"t":"scn","q":"A seller tells her transaction broker she would accept $20,000 less than list price. The broker tells a buyer, hoping to close quickly. Which duty did the broker breach?","c":["Loyalty","Limited confidentiality","Obedience","No duty, because transaction brokers are neutral"],"a":1,"ex":"Limited confidentiality forbids revealing that the seller will accept less than the asking price (unless waived in writing).","w":{"0":["CONFUSED","Loyalty is owed only by a single agent."],"2":["CONFUSED","Obedience is owed only by a single agent."],"3":["RULE","Transaction brokers owe limited confidentiality."]}},{"id":"Q0402-04","l":"L04-2","o":3,"d":2,"t":"mcq","q":"Which is part of a transaction broker's duty of limited confidentiality?","c":["Not disclosing that a buyer is willing to pay more than the offered price","Not disclosing known latent defects the seller asked to keep confidential","Not presenting low offers the seller has said she would find insulting","Not accounting to either party for deposits until the day of closing"],"a":0,"ex":"Limited confidentiality protects price flexibility, motivation and information a party asks to keep confidential. It never permits hiding material defects or withholding offers or funds.","w":{"1":["RULE","Known material defects on residential property must be disclosed in every relationship."],"2":["RULE","All offers must be presented in a timely manner."],"3":["RULE","Funds must be accounted for at all times."]}},{"id":"Q0402-05","l":"L04-2","o":2,"d":3,"t":"scn","q":"A seller instructs his single agent: 'Don't mention the foundation crack you saw.' What must the agent do?","c":["Obey the instruction, because obedience is one of the single agent's duties","Disclose the known material defect; obedience covers lawful instructions only","Stay silent about the crack unless the buyer asks a direct question about it","Withdraw from the listing and keep the information confidential permanently"],"a":1,"ex":"Obedience is limited to lawful instructions. Disclosure of known facts materially affecting the value of residential property is owed in all relationships.","w":{"0":["QUALIFIER","Obedience never covers an unlawful instruction."],"2":["RULE","The duty does not depend on the buyer asking."],"3":["RULE","Confidentiality does not cover concealing known material defects."]}},{"id":"Q0403-01","l":"L04-3","o":0,"d":2,"t":"mcq","q":"When must a Single Agent Notice be given?","c":["At or before closing, together with the other closing documents the parties sign","Before or when a listing/representation agreement is signed, or before a showing, whichever is first","Within 24 hours after the first showing, or after a representation agreement is signed, if later","Only when the customer asks in writing which brokerage relationship applies"],"a":1,"ex":"The single agent notice must be given before or at the time of entering into a listing or representation agreement, or before showing property, whichever occurs first.","w":{"0":["NUMBER","Closing is far too late."],"2":["CONFUSED","24 hours is the listing-copy deadline."],"3":["RULE","It is mandatory in residential sales."]}},{"id":"Q0403-02","l":"L04-3","o":0,"d":1,"t":"mcq","q":"Which brokerage relationship requires NO written disclosure in Florida?","c":["Single agent","No brokerage relationship","Transaction broker","Designated sales associate"],"a":2,"ex":"Transaction broker is the presumed relationship and requires no disclosure.","w":{"0":["RULE","Single agency requires a notice."],"1":["RULE","A No Brokerage Relationship Notice is required before showing."],"3":["RULE","Designated sales associates require signed disclosures."]}},{"id":"Q0403-03","l":"L04-3","o":3,"d":2,"t":"mcq","num":["N-033"],"v":"V-20","q":"In which transaction are Florida's brokerage relationship disclosure requirements applicable?","c":["Leasing an apartment for 12 months","Selling a 6-unit apartment building","Selling a duplex","Auctioning a single-family home"],"a":2,"ex":"Disclosures apply to residential sales: ≤4 units, unimproved land for ≤4 units, or agricultural property ≤10 acres. Leases (without an option to buy), 5+ units and auctions are outside.","w":{"0":["QUALIFIER","Rentals and leases are excluded unless they include an option to purchase ≤4 units."],"1":["NUMBER","6 units exceeds the 4-unit limit."],"3":["RULE","Auctions are excluded."]}},{"id":"Q0403-04","l":"L04-3","o":3,"d":2,"t":"mcq","v":"V-20","q":"Which situation does NOT require a brokerage relationship disclosure?","c":["Showing a buyer a single-family home after she called the office about the listing","Answering general questions at a bona fide open house, with no confidential or price talk","Taking an exclusive-right-of-sale listing on a duplex owned by two investors","Showing a buyer an unimproved lot that is zoned for one single-family home"],"a":1,"ex":"Bona fide open houses with no confidential information, offer, or representation agreement are exempt. The other choices are residential sales activities.","w":{"0":["RULE","Showing residential property requires a disclosure (before showing)."],"2":["RULE","A duplex is residential (≤4 units)."],"3":["RULE","Unimproved land intended for ≤4 units is residential."]}},{"id":"Q0403-05","l":"L04-3","o":1,"d":2,"t":"mcq","q":"The Consent to Transition to Transaction Broker must be signed by the principal:","c":["at closing, along with all of the other transaction documents","before the licensee changes from single agent to transaction broker","only if the customer on the other side requests it in writing","within 10 days after the licensee begins acting as transaction broker"],"a":1,"ex":"The principal must consent in writing before the change from single agent to transaction broker.","w":{"0":["NUMBER","Closing is too late."],"2":["RULE","It is the principal's consent, and it is required."],"3":["RULE","Consent must come before the change."]}},{"id":"Q0404-01","l":"L04-4","o":0,"d":2,"t":"mcq","q":"Which fact does Florida law declare NOT material, so a licensee need not disclose it?","c":["The roof leaks during heavy rain","A homicide occurred in the house","The seawall is failing","The house floods during storms"],"a":1,"ex":"Florida law (s. 689.25) provides that a homicide, suicide or death on the property, and an occupant's HIV/AIDS status, are not material facts. Physical defects that affect value must be disclosed.","w":{"0":["RULE","A hidden roof leak is a latent material defect."],"2":["RULE","A failing seawall materially affects value."],"3":["RULE","Flooding materially affects value."]}},{"id":"Q0404-02","l":"L04-4","o":1,"d":2,"t":"mcq","num":["N-034"],"q":"A broker may appoint designated sales associates for the buyer and the seller when:","c":["the transaction is residential and both parties agree in writing to the arrangement","the deal is nonresidential and buyer and seller each have assets of $1 million or more","the sale price of the property, residential or commercial, exceeds $1 million","the broker or one of the sales associates owns an interest in the property"],"a":1,"ex":"Designated sales associates are available only in nonresidential transactions where both buyer and seller have assets of $1 million or more (and request it in writing).","w":{"0":["QUALIFIER","Never in residential transactions."],"2":["QUALIFIER","The test is each party's assets, not the price."],"3":["RULE","Ownership by the broker is unrelated."]}},{"id":"Q0404-03","l":"L04-4","o":2,"d":2,"t":"scn","q":"After a listing expires, a buyer asks the former listing broker what price the seller had said she would accept. The broker had been a single agent. Which is correct?","c":["The broker may answer, because all duties ended when the listing expired","The broker must not answer; confidentiality survives the end of the relationship","The broker may answer if the buyer signs a buyer-brokerage agreement first","The broker must answer, because the duty of honesty requires full answers"],"a":1,"ex":"Confidentiality (and the duty to account) survives the end of the brokerage relationship.","w":{"0":["RULE","Confidentiality survives termination."],"2":["RULE","Payment cannot override confidentiality."],"3":["CONFUSED","Honesty does not require revealing a former principal's confidential information."]}},{"id":"Q0404-04","l":"L04-4","o":0,"d":3,"t":"scn","q":"A seller in an 'AS IS' sale knows his Florida home's slab is cracked and the crack is hidden under carpet. Must he disclose it?","c":["No, because an AS IS contract means the buyer accepts every defect","No, unless the buyer's home inspector discovers the crack during inspection","Yes, known hidden defects that materially affect value must be disclosed, AS IS or not","Only if the buyer uses FHA financing, which requires a full disclosure form"],"a":2,"ex":"Under Johnson v. Davis the seller must disclose known latent defects that materially affect value. An AS IS contract shifts repair obligations, not the disclosure duty.","w":{"0":["QUALIFIER","AS IS does not cancel the duty to disclose known hidden defects."],"1":["RULE","The duty exists regardless of the inspection."],"3":["RULE","The financing type is irrelevant."]}},{"id":"Q0501-01","l":"L05-1","o":1,"d":2,"t":"scn","num":["N-040","N-041"],"q":"A sales associate receives an earnest money check on Thursday. There are no holidays. By when must the broker deposit it?","c":["End of Friday","End of Monday","End of Tuesday","End of Wednesday"],"a":2,"ex":"The associate delivers it to the broker by end of the next business day (Friday). The broker deposits by the end of the third business day after the brokerage received it — the day of receipt does not count: Friday (1), Monday (2), Tuesday (3).","w":{"0":["CONFUSED","End of Friday is the associate's deadline to deliver to the broker."],"1":["ARITH","Monday is only business day 2."],"3":["ARITH","Counting the weekend or the day of receipt gives the wrong day; Tuesday is business day 3."]}},{"id":"Q0501-02","l":"L05-1","o":2,"d":1,"t":"mcq","num":["N-042"],"q":"How much of the broker's own money may be kept in a sales escrow account to cover bank charges?","c":["$500","$1,000","$5,000","None"],"a":1,"ex":"Up to $1,000 in a sales escrow account; up to $5,000 in a property management escrow account. More is commingling.","w":{"0":["NUMBER","The limit is $1,000."],"2":["CONFUSED","$5,000 is the property-management account limit."],"3":["RULE","A limited amount is allowed for bank charges."]}},{"id":"Q0501-03","l":"L05-1","o":2,"d":2,"t":"mcq","q":"A broker uses $3,000 from the escrow account to pay the office rent, planning to put it back next week. This is:","c":["commingling","conversion","lawful if repaid within 10 days","a minor violation subject only to a notice of noncompliance"],"a":1,"ex":"Using escrow funds for personal or business purposes is conversion — more serious than commingling (merely mixing funds).","w":{"0":["CONFUSED","Commingling is mixing funds; spending them is conversion."],"2":["RULE","There is no repayment grace period."],"3":["RULE","Misuse of trust funds is serious misconduct."]}},{"id":"Q0501-04","l":"L05-1","o":0,"d":2,"t":"mcq","q":"A broker may place escrow funds in an interest-bearing account only if:","c":["the broker discloses that the brokerage will keep all of the interest","all parties consent in writing (including who receives the interest)","the deposit exceeds $10,000 and will be held for more than 30 days","the FREC approves the bank and the account in advance, in writing"],"a":1,"ex":"Interest-bearing escrow accounts require written consent of all parties, which also states who gets the interest.","w":{"0":["RULE","The broker may not unilaterally keep the interest."],"2":["RULE","There is no dollar threshold."],"3":["RULE","FREC approval is not the requirement."]}},{"id":"Q0502-01","l":"L05-2","o":0,"d":1,"t":"mcq","num":["N-043","N-044"],"v":"V-15","q":"After receiving conflicting demands for an escrow deposit, a broker must notify the FREC in writing within:","c":["10 business days","15 business days","30 business days","15 calendar days"],"a":1,"ex":"Notice within 15 business days of the last demand; a settlement procedure must be instituted within 30 business days.","w":{"0":["CONFUSED","10 business days is the notice if the dispute settles before an EDO issues."],"2":["CONFUSED","30 business days is the deadline to institute a settlement procedure."],"3":["QUALIFIER","Both deadlines are business days."]}},{"id":"Q0502-02","l":"L05-2","o":1,"d":2,"t":"mcq","q":"A title company holds the deposit in a failed sale and both buyer and seller demand it. Which statement is correct?","c":["The broker must notify the FREC and request an escrow disbursement order","No escrow disbursement order is available, because the broker does not hold the funds","The broker must have the title company move the deposit into the brokerage's account","The broker must instruct the title company to release the deposit to the seller"],"a":1,"ex":"An escrow disbursement order is available only when the broker holds the funds. When a title company or attorney holds the deposit, the FREC notice-and-procedure rule does not apply to the broker.","w":{"0":["QUALIFIER","An EDO requires the funds to be in the broker's escrow account."],"2":["RULE","The broker has no authority to take the funds from the title company."],"3":["RULE","The broker cannot decide the dispute."]}},{"id":"Q0502-03","l":"L05-2","o":2,"d":3,"t":"scn","v":"V-16","q":"A buyer under a contract with a financing contingency applies in good faith but is denied a loan. The broker holds the deposit. What may the broker do?","c":["Return the deposit to the buyer without notifying the FREC","Notify the FREC within 15 business days and request an EDO","Hold the deposit until the seller signs a release","Give the deposit to the seller as liquidated damages"],"a":0,"ex":"Under s. 475.25(1)(d)1, if the buyer in good faith fails to satisfy the financing clause, the licensee may return the deposit without notifying the commission or starting a settlement procedure. The same applies to a condo buyer cancelling under s. 718.503.","w":{"1":["RULE","This is one of the statutory exceptions; no FREC notice is required."],"2":["RULE","The statute allows return to the buyer in this case."],"3":["RULE","A good-faith financing failure is not a buyer default."]}},{"id":"Q0502-04","l":"L05-2","o":0,"d":2,"t":"mcq","num":["N-045"],"v":"V-15","q":"If the parties choose mediation for an escrow dispute, it must be completed within how many days after the last demand?","c":["30","60","90","120"],"a":2,"ex":"Mediation must be completed within 90 days after the last demand; otherwise the broker must promptly use another procedure.","w":{"0":["CONFUSED","30 business days is the deadline to institute a procedure."],"1":["NUMBER","It is 90 days."],"3":["NUMBER","It is 90 days."]}},{"id":"Q0503-01","l":"L05-3","o":0,"d":1,"t":"mcq","q":"An advertisement for a listed property that does not include the brokerage firm's registered name is a:","c":["net advertisement","blind advertisement","lawful ad if the associate's phone number appears","citation-free violation"],"a":1,"ex":"Omitting the registered brokerage name makes it a blind ad, in any medium.","w":{"0":["CONFUSED","'Net' refers to a listing type."],"2":["RULE","The brokerage name is required regardless of other contact information."],"3":["RULE","Blind ads are violations."]}},{"id":"Q0503-02","l":"L05-3","o":1,"d":2,"t":"scn","q":"A homeowner (not a licensee) posts her own house for sale on social media with her phone number. Must the ad include a brokerage name?","c":["Yes, every real estate advertisement must include a brokerage name","No, an owner advertising her own property has no brokerage to name","Yes, unless the asking price is under $500,000, when owners are exempt","Only if she plans to pay a commission to a buyer's broker at closing"],"a":1,"ex":"Advertising rules for brokerage names apply to licensees' ads. An owner selling her own property is exempt from licensure and there is no brokerage to name.","w":{"0":["QUALIFIER","The rule applies to licensee advertising."],"2":["RULE","There is no price threshold."],"3":["RULE","Paying a commission later does not change who placed this ad."]}},{"id":"Q0503-03","l":"L05-3","o":1,"d":2,"t":"scn","q":"A sales associate posts a listing video on her personal Instagram with her name and phone number, but not her brokerage's name. Which is correct?","c":["Lawful because it is her personal account","Lawful if the brokerage name is in her profile page one click away","A blind ad; the registered brokerage name must appear in the ad","Lawful if the seller approved it"],"a":2,"ex":"Licensee advertising on any medium must include the registered brokerage name. A personal account is not an exception.","w":{"0":["QUALIFIER","Personal social media is still advertising by a licensee."],"1":["QUALIFIER","The firm name must appear in the ad itself."],"3":["RULE","Seller approval does not cure a blind ad."]}},{"id":"Q0504-01","l":"L05-4","o":0,"d":1,"t":"mcq","q":"The entrance sign of a broker's office must include the broker's name, the trade name (if any), and the words:","c":["'Real Estate Office' (or 'Real Estate Brokerage Office')","'Licensed Real Estate Broker' (or 'Lic. Real Estate Broker')","'REALTOR®' (or 'Member, National Association of REALTORS®')","'Florida Registered Brokerage' (or 'FREC Registered Office')"],"a":1,"ex":"The sign must show the broker's name, any trade name, and 'Licensed Real Estate Broker' or 'Lic. Real Estate Broker'.","w":{"0":["RULE","The statutory wording is required."],"2":["CONFUSED","REALTOR® is a trade-association mark."],"3":["RULE","This is not the required wording."]}},{"id":"Q0504-02","l":"L05-4","o":1,"d":2,"t":"scn","q":"A seller is so happy with the sale that she hands the sales associate a $500 gift card at closing. Which is correct?","c":["Lawful, because a voluntary gift after closing is not a commission","Lawful, as long as the gift is worth less than $1,000 and is disclosed","A violation: she may be compensated only by her employing broker","Lawful, if the gift card is disclosed on the closing statement"],"a":2,"ex":"A sales associate may accept compensation for real estate services only from her employing broker.","w":{"0":["QUALIFIER","Anything of value for services is compensation."],"1":["RULE","There is no dollar threshold."],"3":["RULE","Disclosure does not fix the payment path."]}},{"id":"Q0504-03","l":"L05-4","o":1,"d":2,"t":"mcq","q":"Which payment is lawful?","c":["A broker pays an unlicensed assistant $100 for each closed transaction","A broker rebates part of the commission to the buyer, with full disclosure to all parties","A sales associate pays a referral fee directly to a licensee at another brokerage","A broker pays a past customer $300 for each new client referred"],"a":1,"ex":"A broker may rebate part of the commission to a party to the transaction with disclosure. Payments to unlicensed persons for real estate services are unlawful; an associate cannot pay or receive compensation except through the broker.","w":{"0":["QUALIFIER","Per-closing pay to an unlicensed person is compensation for real estate services."],"2":["RULE","Compensation must flow through the employing broker."],"3":["RULE","Paying unlicensed persons for referrals of business is not allowed."]}},{"id":"Q0504-04","l":"L05-4","o":2,"d":2,"t":"mcq","num":["N-047"],"v":"V-21","q":"A prospective tenant paid $200 for a rental list but did not obtain a rental. She demands a refund within 30 days. How much must be returned (the list was accurate)?","c":["$0","$50","$150","$200"],"a":2,"ex":"If no rental is obtained, the tenant gets back any amount over 25% of the fee: 75% × $200 = $150. If the list was inaccurate, the full fee is refundable.","w":{"0":["RULE","A refund is required when no rental is obtained."],"1":["CONFUSED","$50 is the 25% the broker may keep."],"3":["CONFUSED","The full fee is refundable only if the information was inaccurate."]}},{"id":"Q0504-05","l":"L05-4","o":3,"d":2,"t":"scn","q":"At a local association meeting, two brokers agree that neither will accept listings below 6%. This is:","c":["lawful if written","price fixing, a violation of antitrust law","lawful because commissions are customary","required by FREC rules"],"a":1,"ex":"Commission rates must be negotiated between each broker and client. Agreements between competitors to set rates are price fixing.","w":{"0":["RULE","A written agreement to fix prices is still illegal."],"2":["RULE","There is no lawful 'customary' or 'standard' rate."],"3":["RULE","FREC sets no commission rates."]}},{"id":"Q0601-01","l":"L06-1","o":0,"d":2,"t":"mcq","q":"Which step comes immediately after the DBPR completes its investigation of a complaint?","c":["The FREC issues a final order","A probable cause panel decides whether probable cause exists","The licensee appeals to the District Court of Appeal","A formal hearing before an administrative law judge"],"a":1,"ex":"Complaint → investigation → probable cause determination → formal complaint → hearing → final order → appeal.","w":{"0":["MISREAD","The final order comes after a hearing."],"2":["MISREAD","Appeals follow the final order."],"3":["MISREAD","A formal hearing follows the formal complaint."]}},{"id":"Q0601-02","l":"L06-1","o":1,"d":2,"t":"mcq","q":"A licensee disputes the facts in the formal complaint. Where is the case heard?","c":["Informal hearing before the members of the FREC","Formal hearing before an administrative law judge","Trial before the Florida Supreme Court","Jury trial in the county court where he lives"],"a":1,"ex":"Disputed facts go to a formal hearing before an administrative law judge, who issues a recommended order. Undisputed facts can be handled at an informal hearing before the FREC.","w":{"0":["CONFUSED","Informal hearings are for undisputed facts."],"2":["RULE","Appeals go to a District Court of Appeal."],"3":["RULE","County courts do not conduct license discipline hearings."]}},{"id":"Q0601-03","l":"L06-1","o":2,"d":1,"t":"mcq","num":["N-053"],"q":"A licensee may appeal an FREC final order to the District Court of Appeal within:","c":["10 days","15 days","30 days","60 days"],"a":2,"ex":"Appeal within 30 days of the final order.","w":{"0":["NUMBER","It is 30 days."],"1":["NUMBER","It is 30 days."],"3":["NUMBER","It is 30 days."]}},{"id":"Q0602-01","l":"L06-2","o":0,"d":1,"t":"mcq","num":["N-050"],"q":"The maximum administrative fine the FREC may impose per violation is:","c":["$1,000","$2,500","$5,000","$10,000"],"a":2,"ex":"Up to $5,000 per violation (count).","w":{"0":["CONFUSED","$1,000 is the sales-escrow personal-funds limit."],"1":["NUMBER","It is $5,000."],"3":["NUMBER","It is $5,000."]}},{"id":"Q0602-02","l":"L06-2","o":1,"d":1,"t":"mcq","num":["N-052"],"v":"V-12","q":"Performing real estate services for compensation without a license is a:","c":["second-degree misdemeanor","first-degree misdemeanor","third-degree felony","civil infraction only"],"a":2,"ex":"Operating without a valid, current, active license is a third-degree felony.","w":{"0":["CONFUSED","Most other s. 475.42 violations are second-degree misdemeanors."],"1":["CONFUSED","Rental-list fraud (s. 475.453) has been a first-degree misdemeanor."],"3":["RULE","It is a crime."]}},{"id":"Q0602-03","l":"L06-2","o":2,"d":2,"t":"mcq","q":"A licensee repeatedly ignores escrow rules because 'deals always close anyway'. This reckless indifference is best described as:","c":["simple negligence","culpable negligence","fraud","a false promise"],"a":1,"ex":"Culpable negligence is reckless indifference to others' rights, more than a careless mistake.","w":{"0":["QUALIFIER","Repeated, knowing disregard goes beyond simple negligence."],"2":["CONFUSED","Fraud requires intentional deception."],"3":["CONFUSED","A false promise is a promise to induce action that the licensee does not intend or cannot keep."]}},{"id":"Q0602-04","l":"L06-2","o":3,"d":1,"t":"mcq","num":["N-048"],"q":"How long must a broker keep transaction records and escrow records?","c":["2 years","3 years","5 years","7 years"],"a":2,"ex":"At least 5 years (and at least 2 years after any related litigation ends).","w":{"0":["CONFUSED","2 years relates to litigation, added after it ends."],"1":["NUMBER","It is 5 years."],"3":["NUMBER","It is 5 years."]}},{"id":"Q0602-05","l":"L06-2","o":2,"d":2,"t":"scn","q":"A licensee tells a buyer, 'The county will never allow anything to be built on that empty lot behind you,' knowing there is no such rule, to close the sale. This is best described as:","c":["puffing (exaggerated sales opinion)","misrepresentation (a false promise)","culpable negligence by the licensee","lawful sales talk to close the deal"],"a":1,"ex":"Stating a false fact to induce a sale is misrepresentation; framed as an assurance about the future, it is a false promise. Puffing is exaggerated opinion ('best view in town').","w":{"0":["CONFUSED","Puffing is opinion, not a false statement of fact."],"2":["CONFUSED","This is intentional, not negligent."],"3":["RULE","False statements of fact are violations."]}},{"id":"Q0603-01","l":"L06-3","o":0,"d":1,"t":"mcq","num":["N-054"],"v":"V-17","q":"The maximum the Real Estate Recovery Fund will pay for claims arising from one transaction is:","c":["$25,000","$50,000","$100,000","$150,000"],"a":1,"ex":"$50,000 per transaction (all claimants combined); $150,000 aggregate against one licensee.","w":{"0":["NUMBER","$25,000 was the older cap."],"2":["NUMBER","It is $50,000."],"3":["CONFUSED","$150,000 is the per-licensee cap."]}},{"id":"Q0603-02","l":"L06-3","o":1,"d":2,"t":"scn","q":"A sales associate wins a judgment against her former broker for unpaid commissions but cannot collect. May she recover from the Fund?","c":["Yes, up to $50,000, because the judgment arose from a real estate transaction","Yes, up to $150,000, the maximum the Fund pays against any one licensee","No; a licensee who acted as a licensee cannot recover for a commission dispute","Only if the broker has filed for bankruptcy and the judgment is discharged"],"a":2,"ex":"The Fund protects the public. A licensee who acted as a licensee in the transaction (e.g., over a commission) cannot recover.","w":{"0":["RULE","Commission disputes between licensees are excluded."],"1":["CONFUSED","$150,000 is the per-licensee aggregate cap; she is excluded anyway."],"3":["RULE","Bankruptcy does not change eligibility."]}},{"id":"Q0603-03","l":"L06-3","o":2,"d":2,"t":"mcq","q":"When the Fund pays a claim based on a judgment against a licensee, the licensee's license is:","c":["revoked permanently, with no possibility of reinstatement","automatically suspended until the Fund is repaid with interest","unaffected, because the Fund exists to pay such judgments","placed on probation for 1 year while the licensee repays the Fund"],"a":1,"ex":"Payment from the Fund automatically suspends the license until the licensee repays the full amount plus interest.","w":{"0":["CONFUSED","It is a suspension, not revocation."],"2":["RULE","There is an automatic consequence."],"3":["RULE","Probation is not the automatic result."]}},{"id":"Q0701-01","l":"L07-1","o":0,"d":1,"t":"mcq","num":["N-060"],"q":"Which protected classes were added to the federal Fair Housing Act in 1988?","c":["Sex and religious affiliation","Familial status and handicap","Age and marital status","Race, color and creed"],"a":1,"ex":"1988 added familial status and handicap (disability). Sex was added in 1974.","w":{"0":["NUMBER","Sex was added in 1974; religion was original (1968)."],"2":["CONFUSED","Age and marital status are ECOA classes."],"3":["NUMBER","Race and color were in the original 1968 act."]}},{"id":"Q0701-02","l":"L07-1","o":1,"d":1,"t":"mcq","q":"A licensee shows a Hispanic buyer only homes in neighbourhoods where many Hispanic families live, although she did not ask for that. This is:","c":["blockbusting","redlining","steering","lawful customer service"],"a":2,"ex":"Steering is directing buyers toward or away from areas based on a protected class.","w":{"0":["CONFUSED","Blockbusting is scaring owners into selling."],"1":["CONFUSED","Redlining is lender discrimination by area."],"3":["RULE","This is a prohibited practice."]}},{"id":"Q0701-03","l":"L07-1","o":2,"d":2,"t":"scn","q":"An owner of three single-family homes sells one without a broker but runs an ad saying 'No children'. Which is correct?","c":["Exempt, because he owns no more than three single-family homes","Not exempt: discriminatory advertising removes the exemption","Exempt because familial status is not protected","Exempt only if he lives in the house"],"a":1,"ex":"The single-family owner exemption is lost if a broker is used or a discriminatory advertisement is published.","w":{"0":["QUALIFIER","The exemption requires no broker AND no discriminatory advertising."],"2":["RULE","Familial status has been protected since 1988."],"3":["RULE","Owner occupancy is a condition of the Mrs. Murphy exemption, not this one."]}},{"id":"Q0701-04","l":"L07-1","o":2,"d":1,"t":"mcq","q":"Which basis of discrimination has NO exemptions under federal law?","c":["Religion","Familial status","Race","Handicap"],"a":2,"ex":"The Civil Rights Act of 1866 prohibits racial discrimination in all property transactions without exception.","w":{"0":["RULE","Religious organizations have a limited exemption."],"1":["RULE","Housing for older persons is an exemption."],"3":["RULE","FHA exemptions can apply."]}},{"id":"Q0701-05","l":"L07-1","o":3,"d":2,"t":"mcq","q":"A tenant who uses a wheelchair asks to install grab bars in the bathroom at her own expense. The landlord must generally allow this as a:","c":["reasonable accommodation","reasonable modification","nonconforming use","variance"],"a":1,"ex":"A physical change to the unit is a reasonable modification (generally at the tenant's expense). A change in rules or policies is an accommodation.","w":{"0":["CONFUSED","Accommodation is a change in rules or policies."],"2":["CONFUSED","Nonconforming use is a zoning term."],"3":["CONFUSED","A variance is a zoning term."]}},{"id":"Q0702-01","l":"L07-2","o":0,"d":1,"t":"mcq","q":"A wheelchair ramp is required at a brokerage's office entrance. Which law governs?","c":["Fair Housing Amendments Act","Equal Credit Opportunity Act","Americans with Disabilities Act","Real Estate Settlement Procedures Act"],"a":2,"ex":"The ADA governs accessibility of public accommodations and commercial facilities, such as a brokerage office.","w":{"0":["CONFUSED","The Fair Housing Act governs housing."],"1":["CONFUSED","ECOA governs credit."],"3":["CONFUSED","RESPA governs settlement procedures."]}},{"id":"Q0702-02","l":"L07-2","o":1,"d":2,"t":"scn","num":["N-064"],"q":"Which call to a number on the National Do Not Call Registry is permitted?","c":["Calling an expired listing of another brokerage","Calling a customer who closed a purchase with you 14 months ago","Calling someone who inquired about a listing 6 months ago","Calling a FSBO seller you have never met"],"a":1,"ex":"An established business relationship lasts 18 months after a transaction and 3 months after an inquiry (FCC rule; since May 2024 the FTC rule states the same windows as 540 days and 90 days).","w":{"0":["RULE","You have no business relationship with another brokerage's expired listing."],"2":["NUMBER","An inquiry creates a relationship for only 3 months."],"3":["RULE","No relationship or permission exists."]}},{"id":"Q0702-03","l":"L07-2","o":0,"d":2,"t":"mcq","q":"Under ECOA, a lender may NOT deny credit because the applicant:","c":["has insufficient income to repay the loan","receives public assistance income","has a poor history of paying debts on time","lacks funds for the required down payment"],"a":1,"ex":"ECOA prohibits discrimination based on race, color, religion, national origin, sex, marital status, age (if able to contract), receipt of public assistance income, or good-faith exercise of consumer credit rights.","w":{"0":["RULE","Insufficient income is a legitimate credit factor."],"2":["RULE","Payment history is a legitimate factor."],"3":["RULE","Lack of funds is a legitimate factor."]}},{"id":"Q0703-01","l":"L07-3","o":1,"d":1,"t":"mcq","num":["N-066"],"q":"The Closing Disclosure must be received by the borrower at least how long before closing?","c":["1 business day","3 business days","7 days","10 days"],"a":1,"ex":"At least 3 business days before closing (consummation). The Loan Estimate is due within 3 business days of application.","w":{"0":["NUMBER","It is 3 business days."],"2":["NUMBER","It is 3 business days."],"3":["CONFUSED","10 days is the lead-paint inspection window."]}},{"id":"Q0703-02","l":"L07-3","o":2,"d":2,"t":"scn","num":["N-067"],"q":"A buyer closes on a purchase-money mortgage for her new home and wants to cancel the loan 2 days later. Which is correct?","c":["She may rescind within 3 business days under TILA","She has no TILA right of rescission on a purchase loan","She may rescind within 30 days","She may rescind only if the APR was disclosed late"],"a":1,"ex":"TILA's 3-business-day right of rescission applies to refinances and home-equity loans on a principal residence, not to purchase loans.","w":{"0":["QUALIFIER","Rescission applies to refinance/home-equity loans, not purchase loans."],"2":["RULE","There is no 30-day rescission right."],"3":["RULE","Late disclosures do not create rescission for purchase loans."]}},{"id":"Q0703-03","l":"L07-3","o":2,"d":2,"t":"mcq","q":"Which phrase in an advertisement is a TILA trigger term requiring full credit disclosure?","c":["'Easy financing available'","'Low monthly payments'","'Only $15,000 down'","'Assumable loan'"],"a":2,"ex":"A specific down-payment amount is a trigger term. General phrases like 'easy financing' or 'low monthly payments' are not.","w":{"0":["RULE","General statements are not trigger terms."],"1":["RULE","No specific figure is stated."],"3":["RULE","This is not a specific credit term."]}},{"id":"Q0703-04","l":"L07-3","o":0,"d":2,"t":"mcq","q":"Under RESPA, a title company pays a sales associate $100 for every buyer she refers. This is:","c":["lawful, as long as it is disclosed to the buyer in writing","a prohibited kickback for referral of settlement services","lawful, as long as the total stays under $500 per year","lawful, because title insurance is not a mortgage loan"],"a":1,"ex":"RESPA prohibits kickbacks and unearned fees for referrals of settlement services in federally related residential transactions.","w":{"0":["CONFUSED","Chapter 475 talks about disclosure; RESPA prohibits the kickback outright."],"2":["RULE","There is no small-amount exception."],"3":["RULE","Title services are settlement services."]}},{"id":"Q0704-01","l":"L07-4","o":1,"d":1,"t":"mcq","num":["N-069"],"q":"A landlord intends to keep part of a tenant's security deposit. Within how many days after the tenant moves out must the landlord send notice by certified mail?","c":["7","15","30","60"],"a":2,"ex":"Return within 15 days if no claim; send notice of a claim within 30 days (by certified mail, or by e-mail if both parties signed the e-mail addendum, since July 1, 2025); the tenant has 15 days to object.","w":{"0":["NUMBER","It is 30 days."],"1":["CONFUSED","15 days is the return deadline when no claim is made, and the tenant's objection window."],"3":["NUMBER","It is 30 days."]}},{"id":"Q0704-02","l":"L07-4","o":2,"d":2,"t":"mcq","num":["N-070"],"v":"V-04","q":"Under current s. 83.57, how much written notice is required to end a month-to-month tenancy that has no specific term?","c":["7 days","15 days","30 days","60 days"],"a":2,"ex":"Current law: month-to-month and quarter-to-quarter 30 days; year-to-year 60 days; week-to-week 7 days. (Older texts said 15 days for month-to-month.)","w":{"0":["CONFUSED","7 days is week-to-week."],"1":["NUMBER","15 days is the pre-change rule found in older books."],"3":["CONFUSED","60 days is year-to-year."]}},{"id":"Q0704-03","l":"L07-4","o":1,"d":2,"t":"scn","num":["N-069"],"q":"A landlord forgets to send the notice of claim and sends it 35 days after the tenant left. What is the result?","c":["The claim is still valid, because the damage to the unit is real","The landlord forfeits the right to impose a claim on the deposit","The landlord may keep half of the deposit as a late-notice penalty","The tenant must still object within 15 days or lose the deposit"],"a":1,"ex":"A landlord who fails to give the 30-day notice forfeits the right to impose a claim on the deposit.","w":{"0":["RULE","Missing the deadline forfeits the claim against the deposit."],"2":["RULE","No partial keeping is allowed."],"3":["MISREAD","The objection window matters only if the notice was timely."]}},{"id":"Q0801-01","l":"L08-1","o":1,"d":1,"t":"mcq","q":"Which estate gives the greatest bundle of ownership rights?","c":["Life estate","Fee simple defeasible","Fee simple absolute","Estate for years"],"a":2,"ex":"Fee simple absolute is the most complete ownership: inheritable, unconditional, and of unlimited duration.","w":{"0":["RULE","A life estate ends at death."],"1":["QUALIFIER","A defeasible fee can be lost if a condition occurs."],"3":["CONFUSED","An estate for years is a leasehold, not ownership."]}},{"id":"Q0801-02","l":"L08-1","o":2,"d":2,"t":"scn","q":"Ana deeds her house 'to Bruno for life, then to Carla.' Bruno dies. Who owns the house?","c":["Ana, by reversion","Bruno's heirs","Carla, as remainderman","The state, by escheat"],"a":2,"ex":"When the future interest goes to a third party it is a remainder; Carla is the remainderman. If it returned to Ana it would be a reversion.","w":{"0":["CONFUSED","Reversion applies when no remainderman is named."],"1":["RULE","A life estate cannot be inherited; it ends at Bruno's death."],"3":["RULE","Escheat applies only when no heirs or will exist."]}},{"id":"Q0801-03","l":"L08-1","o":2,"d":2,"t":"mcq","q":"A life tenant cuts down all the valuable timber on the property and sells it. This is:","c":["lawful use of the estate","waste","adverse possession","an easement in gross"],"a":1,"ex":"A life tenant must not commit waste — actions that permanently damage the value of the future interest.","w":{"0":["RULE","The life tenant may use but not destroy the property's value."],"2":["CONFUSED","Adverse possession is acquiring another's land."],"3":["CONFUSED","An easement is a right of use."]}},{"id":"Q0801-04","l":"L08-1","o":0,"d":1,"t":"mcq","q":"Which is NOT one of the rights in the bundle of rights?","c":["Possession","Exclusion","Disposition","Escheat"],"a":3,"ex":"The bundle: possession, control, enjoyment, exclusion, disposition. Escheat is a government power over property of owners who die without will or heirs.","w":{"0":["MISREAD","Possession is in the bundle."],"1":["MISREAD","Exclusion is in the bundle."],"2":["MISREAD","Disposition is in the bundle."]}},{"id":"Q0802-01","l":"L08-2","o":0,"d":2,"t":"mcq","q":"A lease for 6 months with a definite end date is an:","c":["estate for years","estate at will","periodic tenancy","estate at sufferance"],"a":0,"ex":"Any lease with a definite beginning and end, even shorter than a year, is an estate for years. It ends automatically without notice.","w":{"1":["CONFUSED","A tenancy at will has no fixed term."],"2":["CONFUSED","A periodic tenancy renews period to period."],"3":["CONFUSED","Sufferance is a holdover without consent."]}},{"id":"Q0802-02","l":"L08-2","o":2,"d":2,"t":"scn","q":"With 14 months left on her 3-year lease, a tenant transfers all 14 remaining months to a friend, who pays the landlord directly. This is:","c":["a sublease","an assignment","a novation","a tenancy at sufferance"],"a":1,"ex":"Transferring the entire remaining term is an assignment, even if it is only part of the original term.","w":{"0":["QUALIFIER","A sublease transfers only part of what remains."],"2":["CONFUSED","A novation would release the original tenant by agreement with the landlord; nothing says that happened."],"3":["CONFUSED","Sufferance is a holdover."]}},{"id":"Q0802-03","l":"L08-2","o":1,"d":1,"t":"mcq","q":"A retail store pays base rent plus 4% of gross sales over $500,000. This is a:","c":["gross lease","triple-net lease","percentage lease","graduated lease"],"a":2,"ex":"Rent based on a percentage of the tenant's gross sales is a percentage lease, common in retail.","w":{"0":["CONFUSED","A gross lease has fixed rent with the landlord paying expenses."],"1":["CONFUSED","A net lease shifts property expenses to the tenant."],"3":["CONFUSED","A graduated lease has scheduled rent increases."]}},{"id":"Q0802-04","l":"L08-2","o":1,"d":2,"t":"mcq","q":"A commercial tenant pays rent plus property taxes, insurance and maintenance. This is a:","c":["gross lease","triple-net lease","graduated lease","index lease"],"a":1,"ex":"Triple net: the tenant pays taxes, insurance and maintenance in addition to rent.","w":{"0":["CONFUSED","In a gross lease the landlord pays those expenses."],"2":["CONFUSED","A graduated lease has scheduled rent increases."],"3":["CONFUSED","An index lease ties rent to an index such as CPI."]}},{"id":"Q0803-01","l":"L08-3","o":0,"d":1,"t":"mcq","q":"Two unmarried friends receive a deed that says nothing about how they hold title. In Florida they own as:","c":["joint tenants with right of survivorship","tenants by the entireties","tenants in common","community property"],"a":2,"ex":"Florida presumes tenancy in common for unmarried co-owners unless survivorship is expressly stated.","w":{"0":["QUALIFIER","Florida requires express survivorship language for joint tenancy."],"1":["RULE","Entireties requires marriage."],"3":["PT","Florida is not a community-property state."]}},{"id":"Q0803-02","l":"L08-3","o":2,"d":2,"t":"scn","q":"Ana and Rui own a duplex as tenants in common, 60%/40%. Rui dies with a will leaving everything to his sister. Who owns Rui's 40%?","c":["Ana","Rui's sister","The state","Ana and the sister equally"],"a":1,"ex":"A tenant in common's share passes by will or to heirs; there is no survivorship.","w":{"0":["CONFUSED","Survivorship belongs to joint tenancy and entireties, not tenancy in common."],"2":["RULE","Escheat applies only without a will or heirs."],"3":["RULE","The sister receives exactly Rui's 40%."]}},{"id":"Q0803-03","l":"L08-3","o":1,"d":1,"t":"mcq","q":"The four unities required for a joint tenancy are:","c":["possession, interest, time, title","possession, income, tax, title","purchase, interest, transfer, tenancy","possession, insurance, time, transfer"],"a":0,"ex":"PITT: Possession, Interest, Time, Title.","w":{"1":["RULE","Income and tax are not unities."],"2":["RULE","These are not the unities."],"3":["RULE","Insurance and transfer are not unities."]}},{"id":"Q0803-04","l":"L08-3","o":2,"d":2,"t":"scn","q":"A creditor obtains a judgment against the husband alone. The couple owns their condo as tenants by the entireties. Can the creditor force a sale of the condo to satisfy the husband's debt?","c":["Yes, by forcing a sale of the husband's half of the condo","Yes, by forcing a sale of the entire condo to pay the debt","No, entireties property is shielded from one spouse's individual creditors","Only after the wife dies and the husband becomes the sole owner of the condo"],"a":2,"ex":"Tenancy by the entireties property is protected from the creditors of only one spouse.","w":{"0":["RULE","Neither spouse holds a separate half."],"1":["RULE","Individual creditors cannot reach entireties property."],"3":["MISREAD","If the wife dies first, she owns it alone by survivorship and the husband's creditor still cannot reach it."]}},{"id":"Q0804-01","l":"L08-4","o":0,"d":1,"t":"mcq","num":["N-080"],"q":"Florida's constitutional homestead protection inside a municipality covers up to:","c":["1/4 acre","1/2 acre","1 acre","160 acres"],"a":1,"ex":"1/2 acre of contiguous land within a municipality; 160 contiguous acres outside a municipality.","w":{"0":["NUMBER","It is 1/2 acre."],"2":["NUMBER","It is 1/2 acre."],"3":["CONFUSED","160 acres applies outside a municipality."]}},{"id":"Q0804-02","l":"L08-4","o":1,"d":2,"t":"mcq","q":"Which claim can result in a forced sale of a Florida homestead?","c":["A credit-card judgment","A medical-bill judgment","Unpaid property taxes","A car-loan deficiency judgment"],"a":2,"ex":"Homestead protection does not stop property taxes and assessments, the mortgage on the home, or liens for work on the home.","w":{"0":["RULE","General creditors cannot force the sale of homestead."],"1":["RULE","General creditors cannot force the sale of homestead."],"3":["RULE","General creditors cannot force the sale of homestead."]}},{"id":"Q0804-03","l":"L08-4","o":2,"d":2,"t":"scn","q":"A married homeowner holds title to the homestead in his name only and wants to mortgage it. What is required?","c":["Only his signature, because title is in his name","His spouse must join in the mortgage","Court approval","Nothing, if the loan is under $100,000"],"a":1,"ex":"When the owner is married, the spouse must join in any conveyance or mortgage of the homestead.","w":{"0":["QUALIFIER","Homestead rules require spousal joinder regardless of title."],"2":["RULE","Court approval is not the requirement."],"3":["RULE","There is no dollar threshold."]}},{"id":"Q0805-01","l":"L08-5","o":0,"d":1,"t":"mcq","q":"The buyer of a cooperative apartment receives:","c":["a deed to the unit","shares in the corporation and a proprietary lease","a life estate","an undivided interest in common elements only"],"a":1,"ex":"In a cooperative, the corporation owns the building. The buyer receives shares and a proprietary lease, which is personal property.","w":{"0":["CONFUSED","A deed to a unit is a condominium purchase."],"2":["CONFUSED","No life estate is involved."],"3":["CONFUSED","Common elements belong to condominium ownership."]}},{"id":"Q0805-02","l":"L08-5","o":1,"d":1,"t":"mcq","num":["N-081"],"q":"A buyer signs a contract to buy a new condominium unit from the developer. The buyer may cancel within:","c":["7 days, excluding weekends and holidays","10 days","15 days","30 days"],"a":2,"ex":"Developer sales: 15 days after signing and receiving the required documents. Resales: 7 days excluding Saturdays, Sundays and legal holidays (since July 1, 2025; older books say 3 business days). Timeshares: 10 days.","w":{"0":["CONFUSED","7 days (excluding weekends and holidays) is the resale rule."],"1":["CONFUSED","10 days is the timeshare rule."],"3":["NUMBER","It is 15 days."]}},{"id":"Q0805-03","l":"L08-5","o":1,"d":1,"t":"mcq","num":["N-082"],"q":"A timeshare purchaser's statutory cancellation period is:","c":["3 days","7 days","10 days","15 days"],"a":2,"ex":"10 days, and the right cannot be waived.","w":{"0":["NUMBER","It is 10 days."],"1":["NUMBER","It is 10 days."],"3":["CONFUSED","15 days is the developer condo rule."]}},{"id":"Q0805-04","l":"L08-5","o":0,"d":2,"t":"mcq","q":"A condominium is legally created by:","c":["recording a declaration of condominium","filing articles of incorporation for the association","issuing a certificate of occupancy","the first sale of a unit"],"a":0,"ex":"Recording the declaration of condominium creates the condominium.","w":{"1":["CONFUSED","The association is created separately; the declaration creates the condominium."],"2":["CONFUSED","A CO allows occupancy of a building."],"3":["RULE","The condominium exists from recording."]}},{"id":"Q0901-01","l":"L09-1","o":1,"d":2,"t":"mcq","num":["N-090"],"q":"In Florida, adverse possession requires open, notorious, hostile and continuous possession for:","c":["5 years, plus a recorded claim of ownership","7 years, plus color of title or payment of taxes","20 years of possession, with no other condition","10 years, plus a survey filed with the county"],"a":1,"ex":"Florida: 7 years plus either color of title or payment of property taxes. 20 years is the prescriptive easement period.","w":{"0":["NUMBER","It is 7 years plus color of title or payment of taxes."],"2":["CONFUSED","20 years is for an easement by prescription."],"3":["NUMBER","It is 7 years and an additional condition applies."]}},{"id":"Q0901-02","l":"L09-1","o":0,"d":1,"t":"mcq","q":"A person dies without a will and without heirs. The property passes to the state by:","c":["eminent domain","escheat","adverse possession","devise"],"a":1,"ex":"Escheat transfers property to the state when there is no will and no heirs.","w":{"0":["CONFUSED","Eminent domain is a taking with compensation."],"2":["CONFUSED","Adverse possession requires possession by a claimant."],"3":["CONFUSED","Devise is a gift of real property by will."]}},{"id":"Q0901-03","l":"L09-1","o":2,"d":2,"t":"mcq","q":"Real property left to a person in a will is called a:","c":["bequest","devise","descent","legacy by intestacy"],"a":1,"ex":"A devise is a gift of real property by will; the recipient is the devisee.","w":{"0":["CONFUSED","A bequest is a gift of personal property."],"2":["CONFUSED","Descent is transfer without a will."],"3":["RULE","Intestacy means no will."]}},{"id":"Q0902-01","l":"L09-2","o":0,"d":1,"t":"mcq","q":"Which deed gives the buyer the most protection?","c":["Quitclaim deed","Special warranty deed","General warranty deed","Bargain and sale deed"],"a":2,"ex":"A general warranty deed warrants title against defects from any time, even before the grantor owned the property.","w":{"0":["CONFUSED","A quitclaim gives no warranties."],"1":["QUALIFIER","Special warranty covers only the grantor's period of ownership."],"3":["CONFUSED","Bargain and sale implies ownership but gives no warranties."]}},{"id":"Q0902-02","l":"L09-2","o":2,"d":2,"t":"mcq","q":"Which is required for a deed to be valid in Florida?","c":["The grantee's signature on the deed at closing","Recording in the county's official public records","Delivery and acceptance during the grantor's lifetime","A notary's acknowledgment of the grantor's signature"],"a":2,"ex":"A valid deed needs a competent grantor, an identifiable grantee, consideration, words of conveyance, a legal description, the grantor's signature with two witnesses, and delivery and acceptance. Recording and acknowledgment protect against third parties; the grantee does not sign.","w":{"0":["RULE","The grantee does not sign the deed."],"1":["CONFUSED","Recording gives constructive notice; it is not needed for validity."],"3":["CONFUSED","Acknowledgment is needed to record, not for validity."]}},{"id":"Q0902-03","l":"L09-2","o":0,"d":1,"t":"mcq","q":"To remove an ex-spouse's possible claim from a title, the ex-spouse would most likely sign a:","c":["general warranty deed","quitclaim deed","special warranty deed","deed of trust"],"a":1,"ex":"A quitclaim conveys whatever interest the grantor may have, without warranties — the standard tool to cure a cloud on title.","w":{"0":["RULE","The ex-spouse would not warrant the entire title."],"2":["RULE","Warranties are unnecessary to release a claim."],"3":["CONFUSED","A deed of trust is a security instrument."]}},{"id":"Q0902-04","l":"L09-2","o":1,"d":2,"t":"mcq","num":["N-092"],"v":"V-05","q":"How many witnesses must sign a Florida deed with the grantor?","c":["None","One","Two","Three"],"a":2,"ex":"The grantor signs in the presence of two subscribing witnesses (s. 689.01). Leases no longer require witnesses.","w":{"0":["CONFUSED","No witnesses is the current rule for leases, not deeds."],"1":["NUMBER","Two witnesses."],"3":["NUMBER","Two witnesses."]}},{"id":"Q0903-01","l":"L09-3","o":0,"d":2,"t":"mcq","q":"A buyer fails to check the public records and later claims she did not know of a recorded easement. Which is correct?","c":["She is not bound because she had no actual notice","She is bound because recording gives constructive notice","She is bound only if the seller told her","She can void the sale"],"a":1,"ex":"Recorded documents give constructive notice to everyone, whether or not they read them.","w":{"0":["CONFUSED","Constructive notice applies regardless of actual knowledge."],"2":["RULE","Actual notice is not required."],"3":["RULE","A recorded easement does not void the sale."]}},{"id":"Q0903-02","l":"L09-3","o":1,"d":2,"t":"mcq","q":"An owner's title insurance policy protects the owner against:","c":["liens and judgments the owner allows to attach after closing","undiscovered defects that existed before the policy date","zoning changes that reduce the property's value after closing","physical damage to the home from hurricanes and flooding"],"a":1,"ex":"Title insurance covers defects existing before the policy date. It does not cover problems the owner creates later or physical damage.","w":{"0":["RULE","Future liens are not covered."],"2":["RULE","Zoning changes are not title defects."],"3":["CONFUSED","That is property (hazard) insurance."]}},{"id":"Q0904-01","l":"L09-4","o":0,"d":2,"t":"scn","q":"A property is foreclosed. It has a first mortgage recorded in 2010, a judgment lien recorded in 2018, and unpaid property taxes for last year. Which is paid first from the sale?","c":["The 2010 mortgage","The judgment lien","The property taxes","All are paid pro rata"],"a":2,"ex":"Property tax and special assessment liens have priority over other liens regardless of recording date. Others follow recording order.","w":{"0":["RULE","Taxes come before even an older first mortgage."],"1":["RULE","A judgment lien is behind taxes and earlier-recorded liens."],"3":["RULE","Liens are paid in priority order."]}},{"id":"Q0904-02","l":"L09-4","o":1,"d":2,"t":"mcq","q":"A power company's right to run lines across a property is an easement:","c":["appurtenant","in gross","by necessity","by prescription"],"a":1,"ex":"An easement in gross benefits a person or company, not an adjoining parcel; there is no dominant estate.","w":{"0":["CONFUSED","Appurtenant easements benefit a neighbouring parcel."],"2":["CONFUSED","Easements by necessity arise for landlocked parcels."],"3":["CONFUSED","Prescription is acquired by long adverse use."]}},{"id":"Q0904-03","l":"L09-4","o":1,"d":2,"t":"mcq","num":["N-091"],"q":"In Florida an easement by prescription requires continuous, open, adverse use for:","c":["7 years","10 years","15 years","20 years"],"a":3,"ex":"20 years for a prescriptive easement; 7 years (with color of title or taxes) for adverse possession of title.","w":{"0":["CONFUSED","7 years is adverse possession."],"1":["NUMBER","It is 20 years."],"2":["NUMBER","It is 20 years."]}},{"id":"Q0904-04","l":"L09-4","o":2,"d":1,"t":"mcq","q":"A neighbour's fence extends 2 feet onto your client's lot. This is an:","c":["easement","encroachment","license","appurtenance"],"a":1,"ex":"An encroachment is a physical intrusion onto another's land, typically revealed by a survey.","w":{"0":["CONFUSED","An easement is a right to use land."],"2":["CONFUSED","A license is revocable permission."],"3":["CONFUSED","An appurtenance is a right attached to land."]}},{"id":"Q0904-05","l":"L09-4","o":0,"d":2,"t":"mcq","q":"Which is a general lien?","c":["A mortgage","A property tax lien","A judgment lien","A construction lien"],"a":2,"ex":"A judgment lien attaches to all the debtor's property in the county where recorded — a general lien. The others are specific liens on one property.","w":{"0":["CONFUSED","A mortgage is a specific lien."],"1":["CONFUSED","A property tax lien is specific to that parcel."],"3":["CONFUSED","A construction lien is specific to the improved property."]}},{"id":"Q0905-01","l":"L09-5","o":0,"d":2,"t":"scn","q":"A restaurant tenant bolted its pizza ovens to the floor. The lease ends and the building is sold. Who owns the ovens?","c":["The landlord, because the ovens are bolted to the floor","The building buyer, because fixtures pass with the deed","The tenant, as trade fixtures removed by the end of the lease","The county, as unclaimed property after the lease ends"],"a":2,"ex":"Trade fixtures installed by a business tenant remain the tenant's personal property and must be removed by the end of the lease.","w":{"0":["QUALIFIER","Attachment alone does not decide; trade fixtures stay with the tenant."],"1":["RULE","The buyer acquires the landlord's interest, not the tenant's trade fixtures."],"3":["RULE","The county has no claim."]}},{"id":"Q0905-02","l":"L09-5","o":1,"d":2,"t":"mcq","q":"A hurricane suddenly moves a river channel. The boundary:","c":["moves with the new channel (accretion)","does not move (avulsion)","moves only if the owner records a new survey","becomes state land"],"a":1,"ex":"A sudden change is avulsion; boundaries do not move. Gradual changes (accretion/erosion) do move them.","w":{"0":["CONFUSED","Accretion is gradual."],"2":["RULE","A survey does not change the legal rule."],"3":["RULE","The land does not become state land."]}},{"id":"Q0905-03","l":"L09-5","o":1,"d":1,"t":"mcq","q":"Rights of an owner whose land borders the Atlantic Ocean are:","c":["riparian rights","littoral rights","prior appropriation","air rights"],"a":1,"ex":"Littoral rights apply to oceans, seas and large lakes; riparian rights to rivers and streams.","w":{"0":["CONFUSED","Riparian refers to rivers and streams."],"2":["RULE","Prior appropriation is a western-states doctrine."],"3":["CONFUSED","Air rights concern the space above land."]}},{"id":"Q1001-01","l":"L10-1","o":0,"d":1,"t":"mcq","q":"Which legal description must begin and end at the same point?","c":["Lot and block","Government survey","Metes and bounds","Street address"],"a":2,"ex":"A metes-and-bounds description starts at the point of beginning and returns to it.","w":{"0":["CONFUSED","Lot and block refers to a recorded plat."],"1":["CONFUSED","Government survey uses townships and sections."],"3":["RULE","A street address is not a legal description."]}},{"id":"Q1001-02","l":"L10-1","o":1,"d":1,"t":"mcq","num":["N-105"],"q":"Florida's principal meridian and base line intersect in:","c":["Miami","Orlando","Tallahassee","Jacksonville"],"a":2,"ex":"They intersect in Tallahassee.","w":{"0":["RULE","Tallahassee."],"1":["RULE","Tallahassee."],"3":["RULE","Tallahassee."]}},{"id":"Q1001-03","l":"L10-1","o":0,"d":1,"t":"mcq","q":"Most homes in platted urban subdivisions are described by:","c":["metes and bounds","lot and block (recorded plat)","government survey","street address and folio number"],"a":1,"ex":"Lot and block numbers on a recorded plat describe most subdivided urban property.","w":{"0":["CONFUSED","Metes and bounds is common for irregular parcels."],"2":["CONFUSED","Government survey is used for larger rural tracts."],"3":["RULE","Addresses and folio numbers are not legal descriptions."]}},{"id":"Q1002-01","l":"L10-2","o":1,"d":1,"t":"num","num":["N-101"],"q":"How many acres are in the NW 1/4 of the SE 1/4 of a section?","ans":40,"tol":0,"unit":"acres","steps":["A section has 640 acres.","640 ÷ 4 (SE 1/4) = 160.","160 ÷ 4 (NW 1/4 of that) = 40 acres."],"ex":"Multiply the denominators (4 × 4 = 16) and divide 640 by 16 = 40.","w":{}},{"id":"Q1002-02","l":"L10-2","o":1,"d":2,"t":"num","q":"How many acres are in 'the N 1/2 of the NW 1/4 AND the SW 1/4' of a section?","ans":240,"tol":0,"unit":"acres","steps":["N 1/2 of the NW 1/4: 640 ÷ 4 ÷ 2 = 80 acres.","SW 1/4: 640 ÷ 4 = 160 acres.","'AND' joins two parcels: 80 + 160 = 240 acres."],"ex":"Compute each parcel separately and add when the description uses AND.","w":{}},{"id":"Q1002-03","l":"L10-2","o":0,"d":1,"t":"mcq","num":["N-100","N-101"],"q":"Section 1 of a township is located in which corner?","c":["Northwest","Northeast","Southwest","Southeast"],"a":1,"ex":"Sections are numbered 1–36 starting in the northeast corner, moving west then back east in a serpentine pattern; section 36 is in the southeast.","w":{"0":["CONFUSED","Section 6 is in the northwest corner."],"2":["CONFUSED","Section 31 is in the southwest corner."],"3":["CONFUSED","Section 36 is in the southeast corner."]}},{"id":"Q1002-04","l":"L10-2","o":2,"d":2,"t":"num","num":["N-102"],"q":"A rectangular lot measures 330 feet by 660 feet. How many acres is it?","ans":5,"tol":0,"unit":"acres","steps":["Area = 330 × 660 = 217,800 sq ft.","217,800 ÷ 43,560 = 5 acres."],"ex":"Square feet ÷ 43,560 = acres.","w":{}},{"id":"Q1002-05","l":"L10-2","o":1,"d":3,"t":"num","q":"A buyer pays $3,000 per acre for the S 1/2 of the NE 1/4 of the SW 1/4 of a section. What is the price?","ans":60000,"tol":0,"unit":"$","steps":["640 ÷ 4 = 160 (SW 1/4).","160 ÷ 4 = 40 (NE 1/4 of that).","40 ÷ 2 = 20 acres (S 1/2).","20 × $3,000 = $60,000."],"ex":"Find the acreage first, then multiply by the price per acre.","w":{}},{"id":"Q1101-01","l":"L11-1","o":0,"d":1,"t":"mcq","q":"Which is NOT an essential element of a valid contract?","c":["Competent parties","Offer and acceptance","Earnest money deposit","Legal purpose"],"a":2,"ex":"Essentials: competent parties, offer and acceptance, legal purpose, consideration. Earnest money is customary but not legally required; mutual promises are sufficient consideration.","w":{"0":["MISREAD","Competent parties are essential."],"1":["MISREAD","Offer and acceptance are essential."],"3":["MISREAD","Legal purpose is essential."]}},{"id":"Q1101-02","l":"L11-1","o":1,"d":2,"t":"mcq","q":"A contract signed by a 16-year-old to buy land is:","c":["void","voidable by the minor","unenforceable by both parties","valid and binding"],"a":1,"ex":"A minor's contract is voidable at the minor's option.","w":{"0":["CONFUSED","Void means no contract at all (e.g., illegal purpose)."],"2":["CONFUSED","Unenforceable describes, for example, a contract lacking a required writing."],"3":["RULE","The minor may cancel it."]}},{"id":"Q1101-03","l":"L11-1","o":2,"d":1,"t":"mcq","num":["N-110"],"q":"In Florida, an action on a written contract must be brought within:","c":["2 years","4 years","5 years","7 years"],"a":2,"ex":"Written contracts: 5 years. Oral contracts: 4 years.","w":{"0":["NUMBER","It is 5 years."],"1":["CONFUSED","4 years applies to oral contracts."],"3":["CONFUSED","7 years is adverse possession."]}},{"id":"Q1101-04","l":"L11-1","o":2,"d":2,"t":"scn","q":"Buyer and seller agree orally on the sale of a house and shake hands. The buyer gives a $5,000 check. Is the agreement enforceable?","c":["Yes, because the buyer's check is a signed writing that satisfies the law","Yes, because consideration of $5,000 was paid and accepted by the seller","No, a sale of real property requires a writing signed by the party to be charged","Yes, as long as two witnesses saw the parties agree and shake hands"],"a":2,"ex":"The statute of frauds requires contracts for the sale of real property to be in writing and signed by the party against whom enforcement is sought.","w":{"0":["MISREAD","The buyer's check is not the seller's signed agreement."],"1":["QUALIFIER","Consideration does not replace the writing requirement."],"3":["RULE","Witnesses do not satisfy the statute of frauds."]}},{"id":"Q1101-05","l":"L11-1","o":1,"d":2,"t":"mcq","q":"A signed sale contract where closing has not yet occurred is:","c":["executed and unilateral","executory and bilateral","executed and bilateral","void"],"a":1,"ex":"Promises on both sides (bilateral) with obligations still to perform (executory).","w":{"0":["CONFUSED","It is not yet performed, and both parties made promises."],"2":["CONFUSED","It is not yet fully performed."],"3":["RULE","Nothing makes it void."]}},{"id":"Q1102-01","l":"L11-2","o":0,"d":2,"t":"scn","q":"Buyer offers $400,000. Seller counteroffers at $420,000. Buyer rejects the counteroffer. Seller then signs the buyer's original $400,000 offer. Is there a contract?","c":["Yes, at $400,000, the price the seller accepted","Yes, at $420,000, the seller's counteroffer price","No, the counteroffer terminated the original offer","Yes, if the seller signed within 24 hours of the offer"],"a":2,"ex":"A counteroffer rejects and terminates the original offer. After the buyer rejected the counteroffer, nothing remained to accept.","w":{"0":["RULE","The original offer died with the counteroffer."],"1":["MISREAD","The buyer rejected the $420,000 counteroffer."],"3":["RULE","There is no such rule."]}},{"id":"Q1102-02","l":"L11-2","o":1,"d":2,"t":"mcq","q":"In an option contract, which party is bound to perform if the option is exercised?","c":["The optionee","The optionor","Both, from the moment the option is signed","Neither"],"a":1,"ex":"The optionor (owner) is bound to sell on the stated terms; the optionee may choose whether to exercise.","w":{"0":["CONFUSED","The optionee has the choice, not the obligation."],"2":["RULE","The option is unilateral until exercised."],"3":["RULE","The optionor is bound."]}},{"id":"Q1102-03","l":"L11-2","o":1,"d":1,"t":"mcq","q":"Between signing the sale contract and closing, the buyer holds:","c":["legal title","equitable title","a life estate","a leasehold"],"a":1,"ex":"The buyer has equitable title; legal title passes by delivery of the deed at closing.","w":{"0":["CONFUSED","Legal title passes at closing."],"2":["RULE","No life estate exists."],"3":["RULE","No lease exists."]}},{"id":"Q1102-04","l":"L11-2","o":2,"d":2,"t":"mcq","q":"A seller refuses to close. The buyer asks the court to order the seller to convey the property. This remedy is:","c":["rescission","liquidated damages","specific performance","novation"],"a":2,"ex":"Specific performance orders the breaching party to perform; it is available because each parcel of land is unique.","w":{"0":["CONFUSED","Rescission undoes the contract."],"1":["CONFUSED","Liquidated damages are pre-agreed money damages."],"3":["CONFUSED","Novation substitutes a party or obligation."]}},{"id":"Q1103-01","l":"L11-3","o":0,"d":1,"t":"scn","q":"Under an exclusive-agency listing, the seller finds a buyer herself with no help from the broker. Is a commission owed?","c":["Yes, full commission","Yes, half commission","No","Only if the buyer saw the broker's sign"],"a":2,"ex":"An exclusive-agency listing lets the owner sell personally without paying a commission. Under exclusive right of sale, the commission would be owed.","w":{"0":["CONFUSED","That is the exclusive-right-of-sale result."],"1":["RULE","There is no half-commission rule."],"3":["RULE","Only procuring-cause analysis matters if a broker was involved."]}},{"id":"Q1103-02","l":"L11-3","o":1,"d":1,"t":"mcq","num":["N-112"],"q":"Which clause is NOT allowed in a Florida written listing agreement?","c":["A definite expiration date","An automatic renewal provision","The commission rate","The listing price"],"a":1,"ex":"Written listings must have a definite expiration date and may not contain automatic renewal; a copy goes to the seller within 24 hours.","w":{"0":["MISREAD","A definite expiration date is required."],"2":["MISREAD","The commission is an ordinary term."],"3":["MISREAD","The price is an ordinary term."]}},{"id":"Q1103-03","l":"L11-3","o":1,"d":1,"t":"mcq","num":["N-112"],"q":"After a seller signs a written listing agreement, a copy must be given to the seller within:","c":["24 hours","3 business days","5 days","10 days"],"a":0,"ex":"Within 24 hours.","w":{"1":["CONFUSED","3 business days is the broker's escrow deposit deadline."],"2":["NUMBER","It is 24 hours."],"3":["CONFUSED","10 days is the address-change deadline."]}},{"id":"Q1103-04","l":"L11-3","o":0,"d":2,"t":"mcq","q":"A listing in which the broker keeps any amount received above a set price for the seller is a(n):","c":["open listing","net listing","exclusive-agency listing","option listing"],"a":1,"ex":"A net listing pays the broker the excess over the seller's net. It is legal in Florida per the manual but creates conflicts of interest.","w":{"0":["CONFUSED","An open listing is given to several brokers."],"2":["CONFUSED","Exclusive agency is about who may sell."],"3":["CONFUSED","An option listing gives the broker an option to buy."]}},{"id":"Q1104-01","l":"L11-4","o":1,"d":2,"t":"mcq","num":["N-113"],"q":"The federal lead-based paint disclosure applies to housing built befor
