e:","c":["1968","1978","1988","1998"],"a":1,"ex":"Pre-1978 housing. 1968 is the Fair Housing Act; 1988 the amendments adding familial status and handicap.","w":{"0":["CONFUSED","1968 is the Fair Housing Act."],"2":["CONFUSED","1988 is the Fair Housing Amendments Act."],"3":["NUMBER","It is 1978."]}},{"id":"Q1104-02","l":"L11-4","o":0,"d":2,"t":"mcq","q":"In a Florida sale contract, the 'effective date' is generally the date:","c":["the buyer signs and delivers the first written offer to the seller","the last party signs or initials the final offer or counteroffer","of closing, when the deed is delivered and the funds are disbursed","the buyer's escrow deposit clears the bank and is confirmed in writing"],"a":1,"ex":"Contract deadlines run from the effective date: when the last party signs/initials the final offer or counteroffer.","w":{"0":["MISREAD","The first offer is not yet a contract."],"2":["RULE","Closing is the end, not the start."],"3":["RULE","Deposit timing is a separate deadline."]}},{"id":"Q1104-03","l":"L11-4","o":1,"d":2,"t":"mcq","v":"V-06","q":"Under s. 689.302, the seller of residential property must give the buyer a flood disclosure:","c":["only if the home lies in a FEMA special flood hazard area","at or before the time the sales contract is executed","within 10 days after closing, with the recorded deed","only if the buyer requests it in writing before closing"],"a":1,"ex":"The statute requires the flood disclosure form at or before contract execution, covering flood insurance, claims, federal assistance and known flooding. (Added by a 2024 law; not in older textbooks.)","w":{"0":["QUALIFIER","The disclosure is not limited to flood zones."],"2":["NUMBER","It is at or before contract."],"3":["RULE","It is mandatory."]}},{"id":"Q1104-04","l":"L11-4","o":1,"d":1,"t":"mcq","q":"Florida's radon gas disclosure must appear:","c":["only in contracts for homes built before 1978","in contracts for the sale or rental of any building","only in condominium contracts","only when radon has been detected"],"a":1,"ex":"Florida requires a radon notice at or before contract for the sale or rental of any building.","w":{"0":["CONFUSED","1978 is the lead-paint rule."],"2":["QUALIFIER","It applies to all buildings."],"3":["RULE","It is a general notice, not triggered by testing."]}},{"id":"Q1201-01","l":"L12-1","o":0,"d":1,"t":"mcq","q":"In a mortgage loan, the mortgagor is the:","c":["lender","borrower","title company","appraiser"],"a":1,"ex":"The mortgagor gives the mortgage (the borrower); the mortgagee receives it (the lender). '-or gives, -ee receives'.","w":{"0":["CONFUSED","The lender is the mortgagee."],"2":["RULE","The title company is not a party to the mortgage."],"3":["RULE","The appraiser is not a party."]}},{"id":"Q1201-02","l":"L12-1","o":1,"d":1,"t":"mcq","q":"Florida is a lien-theory state. This means:","c":["the lender holds legal title until the loan is paid","the borrower holds title and the lender holds a lien","a trustee holds title","the state holds title"],"a":1,"ex":"In a lien-theory state the borrower keeps legal title; the mortgage creates a lien for the lender.","w":{"0":["CONFUSED","That describes title theory."],"2":["CONFUSED","That describes a deed-of-trust arrangement."],"3":["RULE","The state holds no title."]}},{"id":"Q1201-03","l":"L12-1","o":2,"d":2,"t":"mcq","q":"Which clause lets the lender demand the entire loan balance when the borrower defaults?","c":["Defeasance clause","Acceleration clause","Subordination clause","Release clause"],"a":1,"ex":"The acceleration clause makes the whole balance due on default.","w":{"0":["CONFUSED","Defeasance defeats the mortgage when the debt is paid."],"2":["CONFUSED","Subordination changes lien priority."],"3":["CONFUSED","Release frees parcels from a blanket mortgage."]}},{"id":"Q1201-04","l":"L12-1","o":1,"d":1,"t":"mcq","num":["N-120"],"q":"After a mortgage is paid in full, the lender must record a satisfaction of mortgage within:","c":["10 days","30 days","60 days","90 days"],"a":2,"ex":"Within 60 days of full payment.","w":{"0":["NUMBER","It is 60 days."],"1":["NUMBER","It is 60 days."],"3":["CONFUSED","90 days is the mediation limit for escrow disputes."]}},{"id":"Q1202-01","l":"L12-2","o":0,"d":2,"t":"scn","q":"A buyer takes title 'subject to' the seller's existing mortgage and later stops paying. The lender forecloses and the sale leaves a deficiency. Who is personally liable for the deficiency?","c":["The buyer, who took title","The original borrower (seller)","Buyer and seller equally","Neither, since the loan was foreclosed"],"a":1,"ex":"Taking 'subject to' a mortgage creates no personal liability for the buyer; the original borrower remains liable.","w":{"0":["CONFUSED","That would be true of an assumption."],"2":["CONFUSED","Only the original borrower signed the note."],"3":["RULE","The original borrower remains liable."]}},{"id":"Q1202-02","l":"L12-2","o":1,"d":2,"t":"mcq","q":"In Florida, a borrower's right to redeem the property by paying the debt in full ends:","c":["at the foreclosure sale","10 days after the sale","1 year after the sale","when the lender files the lawsuit"],"a":0,"ex":"Equity of redemption lasts until the sale. Florida has no statutory right of redemption after the sale.","w":{"1":["RULE","There is no post-sale redemption in Florida."],"2":["RULE","Statutory redemption periods exist in some other states, not Florida."],"3":["RULE","The right continues after the suit is filed."]}},{"id":"Q1202-03","l":"L12-2","o":2,"d":2,"t":"mcq","q":"Compared with foreclosure, a deed in lieu of foreclosure:","c":["wipes out all junior liens","transfers title to the lender subject to junior liens","requires a court order","gives the borrower a 1-year redemption period"],"a":1,"ex":"With a deed in lieu, the lender takes title subject to junior liens; foreclosure is what can eliminate them.","w":{"0":["CONFUSED","Only foreclosure can wipe out junior liens."],"2":["RULE","It is a voluntary transfer."],"3":["RULE","No such redemption right."]}},{"id":"Q1202-04","l":"L12-2","o":0,"d":2,"t":"mcq","q":"A buyer assumes the seller's loan and the lender agrees to release the seller from all liability. This release is a:","c":["subordination","novation","satisfaction","defeasance"],"a":1,"ex":"A novation substitutes a new obligor and releases the original borrower.","w":{"0":["CONFUSED","Subordination changes priority."],"2":["CONFUSED","Satisfaction shows the loan was paid."],"3":["CONFUSED","Defeasance cancels the mortgage at payoff."]}},{"id":"Q1203-01","l":"L12-3","o":0,"d":1,"t":"num","num":["N-122"],"q":"A borrower's gross monthly income is $6,500 and the proposed PITI is $1,950. What is the housing expense ratio, in percent?","ans":30,"tol":0.05,"unit":"%","steps":["Housing ratio = PITI ÷ gross monthly income.","$1,950 ÷ $6,500 = 0.30 = 30%.","30% exceeds the 28% conventional benchmark."],"ex":"Always divide by GROSS monthly income.","w":{}},{"id":"Q1203-02","l":"L12-3","o":0,"d":2,"t":"num","num":["N-122"],"q":"Using a 28% housing ratio, what is the maximum monthly PITI for a borrower earning $96,000 a year (gross)?","ans":2240,"tol":0.5,"unit":"$","steps":["Monthly gross = $96,000 ÷ 12 = $8,000.","$8,000 × 0.28 = $2,240."],"ex":"Convert annual income to monthly first.","w":{}},{"id":"Q1203-03","l":"L12-3","o":0,"d":2,"t":"num","num":["N-122"],"q":"Gross monthly income $7,200; PITI $1,900; car payment $450; minimum credit-card payments $200. What is the total obligations ratio, in percent (one decimal place)?","ans":35.4,"tol":0.06,"unit":"%","steps":["Total obligations = $1,900 + $450 + $200 = $2,550.","$2,550 ÷ $7,200 = 0.3542 = 35.4%.","Under the 36% conventional benchmark."],"ex":"Include PITI plus recurring debts.","w":{}},{"id":"Q1203-04","l":"L12-3","o":2,"d":2,"t":"mcq","num":["N-121"],"q":"Under Florida law, the maximum interest rate on a loan of $400,000 (without triggering civil usury) is:","c":["10% per year simple interest","18% per year simple interest","25% per year simple interest","No limit for loans of this size"],"a":1,"ex":"18% per year simple interest for loans of $500,000 or less; 25% for larger loans; above 25% is criminal usury.","w":{"0":["NUMBER","It is 18%."],"2":["CONFUSED","25% applies to loans over $500,000."],"3":["RULE","Florida has usury limits."]}},{"id":"Q1301-01","l":"L13-1","o":0,"d":1,"t":"mcq","q":"The FHA's role in an FHA loan is to:","c":["lend the money","insure the loan made by an approved lender","guarantee the loan for veterans","buy the loan on the secondary market"],"a":1,"ex":"FHA insures loans; approved private lenders make them. VA guarantees veterans' loans.","w":{"0":["RULE","FHA does not lend."],"2":["CONFUSED","That is VA."],"3":["CONFUSED","That is the secondary market (e.g., Fannie Mae)."]}},{"id":"Q1301-02","l":"L13-1","o":1,"d":1,"t":"mcq","num":["N-123"],"q":"A conventional lender usually requires private mortgage insurance when the loan-to-value ratio is:","c":["above 70%","above 80%","above 90% only","any LTV"],"a":1,"ex":"PMI is generally required above 80% LTV.","w":{"0":["NUMBER","The usual trigger is above 80%."],"2":["NUMBER","It starts above 80%."],"3":["RULE","At 80% or less it is generally not required."]}},{"id":"Q1301-03","l":"L13-1","o":1,"d":2,"t":"mcq","q":"Which pair is correct?","c":["FHA — funding fee; VA — MIP","FHA — MIP; VA — funding fee","FHA — PMI; VA — MIP","FHA — no insurance; VA — PMI"],"a":1,"ex":"FHA borrowers pay mortgage insurance premium (MIP); VA borrowers pay a funding fee; conventional borrowers above 80% LTV pay PMI.","w":{"0":["CONFUSED","Reversed."],"2":["CONFUSED","PMI is conventional."],"3":["CONFUSED","FHA has MIP; VA has a funding fee."]}},{"id":"Q1302-01","l":"L13-2","o":1,"d":1,"t":"mcq","q":"A developer finances several lots under one mortgage with a clause freeing each lot when it is sold and paid down. This is a:","c":["package mortgage with a release clause","blanket mortgage with a release clause","wraparound mortgage with a release clause","purchase-money mortgage"],"a":1,"ex":"A blanket mortgage covers several parcels; the partial release clause frees lots as they are paid off.","w":{"0":["CONFUSED","A package mortgage covers real and personal property."],"2":["CONFUSED","A wraparound includes an existing loan."],"3":["CONFUSED","A purchase-money mortgage is seller financing."]}},{"id":"Q1302-02","l":"L13-2","o":1,"d":1,"t":"mcq","q":"A furnished condo is financed with one mortgage covering the unit and its furniture. This is a:","c":["package mortgage","blanket mortgage","purchase-money mortgage","construction loan"],"a":0,"ex":"A package mortgage covers both real and personal property.","w":{"1":["CONFUSED","A blanket covers several parcels."],"2":["CONFUSED","Purchase-money means seller financing."],"3":["CONFUSED","A construction loan funds building work."]}},{"id":"Q1302-03","l":"L13-2","o":0,"d":2,"t":"mcq","q":"In an adjustable-rate mortgage, the interest rate equals:","c":["margin minus index","index plus margin","the original rate plus 1% each year","the Fed's discount rate"],"a":1,"ex":"ARM rate = index (moves with the market) + margin (fixed), limited by caps.","w":{"0":["FORMULA","The margin is added to the index."],"2":["RULE","Adjustments follow the index, within caps."],"3":["RULE","The discount rate is not the formula."]}},{"id":"Q1302-04","l":"L13-2","o":1,"d":2,"t":"mcq","num":["N-126"],"q":"Which loan pays money to an owner aged 62 or older, to be repaid when the owner sells, moves out or dies?","c":["Wraparound","Reverse mortgage","Balloon mortgage","Blanket mortgage"],"a":1,"ex":"A reverse mortgage lets owners 62+ convert equity into payments.","w":{"0":["CONFUSED","A wraparound is junior financing that includes an existing loan."],"2":["CONFUSED","A balloon has a large final payment."],"3":["CONFUSED","A blanket covers several parcels."]}},{"id":"Q1303-01","l":"L13-3","o":0,"d":1,"t":"mcq","q":"A first-time buyer wants to apply for a mortgage. Which entity would NOT take her application?","c":["A commercial bank","A credit union","Freddie Mac","A mortgage banker"],"a":2,"ex":"Freddie Mac is a secondary-market entity that buys loans from lenders; consumers do not borrow from it.","w":{"0":["MISREAD","Banks are primary lenders."],"1":["MISREAD","Credit unions lend directly."],"3":["MISREAD","Mortgage bankers originate loans."]}},{"id":"Q1303-02","l":"L13-3","o":1,"d":2,"t":"mcq","q":"The Federal Reserve's most frequently used tool for influencing the money supply is:","c":["changing reserve requirements","open-market operations","setting mortgage rates directly","approving FHA loans"],"a":1,"ex":"Open-market operations (buying and selling government securities) are the day-to-day tool.","w":{"0":["QUALIFIER","Reserve requirements are the bluntest, least used tool."],"2":["RULE","The Fed does not set mortgage rates."],"3":["RULE","That is FHA/HUD."]}},{"id":"Q1303-03","l":"L13-3","o":2,"d":2,"t":"mcq","num":["N-125"],"q":"A lender wants to raise its yield from 6.25% to 6.75% using discount points. Using the course rule of thumb, how many points?","c":["2","3","4","5"],"a":2,"ex":"Each point raises yield about 1/8% (0.125%). 0.50% ÷ 0.125% = 4 points.","w":{"0":["ARITH","0.50 ÷ 0.125 = 4, not 2."],"1":["ARITH","0.50 ÷ 0.125 = 4."],"3":["ARITH","0.50 ÷ 0.125 = 4."]}},{"id":"Q1401-01","l":"L14-1","o":0,"d":1,"t":"num","q":"Express 3/8 as a percentage.","ans":37.5,"tol":0.01,"unit":"%","steps":["3 ÷ 8 = 0.375.","Move the decimal two places right: 37.5%."],"ex":"Fraction → decimal (divide) → percent (×100).","w":{}},{"id":"Q1401-02","l":"L14-1","o":1,"d":2,"t":"num","q":"A broker earned a $9,450 commission at a 6% rate. What was the sale price?","ans":157500,"tol":0.5,"unit":"$","steps":["Part = Total × Rate, so Total = Part ÷ Rate.","$9,450 ÷ 0.06 = $157,500."],"ex":"When the rate is applied to the unknown, divide.","w":{}},{"id":"Q1401-03","l":"L14-1","o":2,"d":2,"t":"num","q":"A lot bought for $80,000 sells for $92,000. What is the percentage gain?","ans":15,"tol":0.01,"unit":"%","steps":["Change = $92,000 − $80,000 = $12,000.","Divide by the ORIGINAL value: $12,000 ÷ $80,000 = 0.15 = 15%."],"ex":"Percentage change always uses the starting value as the base.","w":{}},{"id":"Q1401-04","l":"L14-1","o":2,"d":2,"t":"mcq","q":"A home's value falls from $250,000 to $230,000. What is the percentage decrease?","c":["7.4%","8%","8.7%","20%"],"a":1,"ex":"($250,000 − $230,000) ÷ $250,000 = $20,000 ÷ $250,000 = 8%.","w":{"0":["ARITH","This rounds incorrectly or uses the wrong subtraction."],"2":["FORMULA","8.7% divides by the new value ($230,000) instead of the original."],"3":["UNITS","20 is the dollar change in thousands, not a percentage."]}},{"id":"Q1402-01","l":"L14-2","o":0,"d":1,"t":"num","q":"A lot is 120 feet by 85 feet. At $12.50 per square foot, what is the price?","ans":127500,"tol":0.5,"unit":"$","steps":["Area = 120 × 85 = 10,200 sq ft.","10,200 × $12.50 = $127,500."],"ex":"","w":{}},{"id":"Q1402-02","l":"L14-2","o":0,"d":1,"t":"num","q":"A triangular parcel has a base of 200 feet and a height of 150 feet. What is its area in square feet?","ans":15000,"tol":0,"unit":"sq ft","steps":["Area of a triangle = 1/2 × base × height.","0.5 × 200 × 150 = 15,000 sq ft."],"ex":"","w":{}},{"id":"Q1402-03","l":"L14-2","o":1,"d":2,"t":"num","num":["N-104"],"q":"A driveway is 60 feet long and 12 feet wide. Concrete costs $54 per square yard. What is the cost?","ans":4320,"tol":0.5,"unit":"$","steps":["Area = 60 × 12 = 720 sq ft.","Square yards = 720 ÷ 9 = 80.","80 × $54 = $4,320."],"ex":"Convert square feet to square yards by dividing by 9 (not 3).","w":{}},{"id":"Q1402-04","l":"L14-2","o":1,"d":2,"t":"num","q":"A 75-foot by 150-foot lot sells for $93,750. What is the price per front foot?","ans":1250,"tol":0.5,"unit":"$","steps":["Frontage is the first dimension: 75 ft.","$93,750 ÷ 75 = $1,250 per front foot."],"ex":"Front feet = the street/water frontage, normally listed first.","w":{}},{"id":"Q1402-05","l":"L14-2","o":0,"d":2,"t":"num","q":"An L-shaped house consists of a 40 ft × 30 ft section and a 20 ft × 15 ft wing. What is its total area in square feet?","ans":1500,"tol":0,"unit":"sq ft","steps":["Split into rectangles: 40 × 30 = 1,200.","20 × 15 = 300.","Total = 1,500 sq ft."],"ex":"","w":{}},{"id":"Q1403-01","l":"L14-3","o":0,"d":2,"t":"num","q":"A home sells for $385,000 with a 6% total commission. The listing brokerage receives half, and the listing associate receives 60% of the listing brokerage's share. How much does the associate receive?","ans":6930,"tol":0.5,"unit":"$","steps":["Total = $385,000 × 0.06 = $23,100.","Listing brokerage = $23,100 × 0.5 = $11,550.","Associate = $11,550 × 0.6 = $6,930."],"ex":"Multiply through the chain of splits.","w":{}},{"id":"Q1403-02","l":"L14-3","o":1,"d":3,"t":"num","q":"A seller wants to net $300,000 after paying a 6% commission and $4,500 of other closing costs. What is the minimum sale price (to the nearest dollar)?","ans":323936,"tol":1,"unit":"$","steps":["Add costs that are NOT a percentage of the price to the net: $300,000 + $4,500 = $304,500.","Divide by (1 − commission rate): $304,500 ÷ 0.94 = $323,936.17.","Check: $323,936 × 0.06 = $19,436; $323,936 − $19,436 − $4,500 = $300,000."],"ex":"Price = (Net + fixed costs) ÷ (1 − rate). Never multiply the net by 1.06.","w":{}},{"id":"Q1403-03","l":"L14-3","o":0,"d":3,"t":"num","q":"An associate received $5,670, which was 70% of her brokerage's share. The brokerage's share was half of the total commission on a $270,000 sale. What was the total commission rate, in percent?","ans":6,"tol":0.01,"unit":"%","steps":["Brokerage share = $5,670 ÷ 0.70 = $8,100.","Total commission = $8,100 × 2 = $16,200.","Rate = $16,200 ÷ $270,000 = 0.06 = 6%."],"ex":"Work backwards through the chain by dividing.","w":{}},{"id":"Q1403-04","l":"L14-3","o":1,"d":2,"t":"mcq","q":"A seller wants to net $188,000 after a 6% commission (no other costs). What is the minimum sale price?","c":["$176,720","$199,280","$200,000","$194,000"],"a":2,"ex":"Price = $188,000 ÷ (1 − 0.06) = $188,000 ÷ 0.94 = $200,000. Check: $200,000 − $12,000 = $188,000.","w":{"0":["FORMULA","This subtracts 6% of the net instead of grossing up."],"1":["FORMULA","Multiplying the net by 1.06 takes 6% of the wrong base; the commission is 6% of the price."],"3":["FORMULA","This adds a flat $6,000 instead of computing the commission on the price."]}},{"id":"Q1404-01","l":"L14-4","o":1,"d":2,"t":"num","q":"An investor sold a property for $276,000, a 15% profit on what she paid. What did she pay?","ans":240000,"tol":0.5,"unit":"$","steps":["Sale = Cost × (1 + profit %).","Cost = $276,000 ÷ 1.15 = $240,000.","Check: $240,000 × 1.15 = $276,000."],"ex":"Divide by 1.15. Multiplying $276,000 by 0.85 gives the wrong base.","w":{}},{"id":"Q1404-02","l":"L14-4","o":0,"d":1,"t":"num","q":"A property bought for $180,000 sells for $153,000. What is the percentage loss?","ans":15,"tol":0.01,"unit":"%","steps":["Loss = $27,000.","$27,000 ÷ $180,000 = 0.15 = 15%."],"ex":"","w":{}},{"id":"Q1404-03","l":"L14-4","o":1,"d":2,"t":"mcq","q":"A home sold for $342,000 after appreciating 20% since purchase. What was the purchase price?","c":["$273,600","$285,000","$410,400","$322,000"],"a":1,"ex":"Purchase × 1.20 = $342,000, so purchase = $342,000 ÷ 1.20 = $285,000.","w":{"0":["FORMULA","Multiplying $342,000 by 0.80 takes 20% of the sale price instead of the purchase price."],"2":["FORMULA","This adds 20% again."],"3":["ARITH","This subtracts $20,000, treating 20% as a dollar amount."]}},{"id":"Q1405-01","l":"L14-5","o":0,"d":1,"t":"num","q":"What is the simple interest on $45,000 at 7% per year for 18 months?","ans":4725,"tol":0.5,"unit":"$","steps":["I = P × R × T, with T in years: 18 months = 1.5 years.","$45,000 × 0.07 × 1.5 = $4,725."],"ex":"Convert months to years.","w":{}},{"id":"Q1405-02","l":"L14-5","o":0,"d":2,"t":"num","q":"A $250,000 loan at 6% annual interest has a monthly principal-and-interest payment of $1,498.88. How much of the FIRST payment goes to principal?","ans":248.88,"tol":0.01,"unit":"$","steps":["First month's interest = $250,000 × 0.06 ÷ 12 = $1,250.","Principal = $1,498.88 − $1,250 = $248.88."],"ex":"","w":{}},{"id":"Q1405-03","l":"L14-5","o":1,"d":2,"t":"num","q":"Price $320,000; appraised value $310,000. The lender makes an 80% LTV loan. How much is the buyer's down payment?","ans":72000,"tol":0.5,"unit":"$","steps":["LTV uses the LESSER of price and appraisal: $310,000.","Loan = $310,000 × 0.80 = $248,000.","Down payment = $320,000 − $248,000 = $72,000."],"ex":"","w":{}},{"id":"Q1405-04","l":"L14-5","o":2,"d":1,"t":"num","num":["N-125"],"q":"How much do 2.5 discount points cost on a $280,000 loan?","ans":7000,"tol":0.5,"unit":"$","steps":["1 point = 1% of the LOAN.","2.5% × $280,000 = $7,000."],"ex":"Points are based on the loan amount, not the price.","w":{}},{"id":"Q1406-01","l":"L14-6","o":0,"d":2,"t":"num","num":["N-130"],"v":"V-18","q":"A home in Hillsborough County sells for $287,450. What are the documentary stamps on the deed?","ans":2012.5,"tol":0.01,"unit":"$","steps":["Round UP to the next $100: $287,500.","$287,500 ÷ 100 = 2,875 units.","2,875 × $0.70 = $2,012.50."],"ex":"Stamps are charged per $100 or portion thereof.","w":{}},{"id":"Q1406-02","l":"L14-6","o":1,"d":2,"t":"num","num":["N-131","N-132"],"v":"V-19","q":"A buyer finances with a new $236,000 mortgage. What is the total of note stamps plus intangible tax?","ans":1298,"tol":0.01,"unit":"$","steps":["Note stamps: $236,000 ÷ 100 = 2,360 × $0.35 = $826.","Intangible tax: $236,000 × 0.002 = $472.","Total = $1,298."],"ex":"","w":{}},{"id":"Q1406-03","l":"L14-6","o":0,"d":2,"t":"num","num":["N-130"],"q":"A single-family home in Miami-Dade County sells for $500,000. What are the deed stamps?","ans":3000,"tol":0.01,"unit":"$","steps":["Miami-Dade single-family rate: $0.60 per $100.","5,000 × $0.60 = $3,000."],"ex":"","w":{}},{"id":"Q1406-04","l":"L14-6","o":2,"d":2,"t":"mcq","num":["N-132"],"q":"A buyer assumes the seller's $150,000 mortgage. How much intangible tax is due on the assumed mortgage?","c":["$0","$300","$525","$150"],"a":0,"ex":"Intangible tax applies only to NEW mortgages. (Under the course convention, note stamps would still apply to the assumed note.)","w":{"1":["QUALIFIER","$300 = 2 mills × $150,000, but the tax applies only to new money."],"2":["CONFUSED","$525 is the note-stamp amount."],"3":["ARITH","Not a valid computation."]}},{"id":"Q1406-05","l":"L14-6","o":0,"d":2,"t":"num","num":["N-130"],"q":"A Polk County home sells for $199,950. What are the documentary stamps on the deed?","ans":1400,"tol":0.01,"unit":"$","steps":["$199,950 rounds UP to $200,000.","2,000 × $0.70 = $1,400."],"ex":"Rounding down to 1,999 units gives $1,399.30 — the classic wrong answer.","w":{}},{"id":"Q1406-06","l":"L14-6","o":1,"d":2,"t":"num","num":["N-131"],"q":"What are the documentary stamps on a new note for $123,456?","ans":432.25,"tol":0.01,"unit":"$","steps":["Round up to $123,500 → 1,235 units.","1,235 × $0.35 = $432.25."],"ex":"","w":{}},{"id":"Q1406-07","l":"L14-6","o":3,"d":1,"t":"mcq","q":"Who customarily pays the documentary stamp tax on the deed in a Florida sale?","c":["The buyer","The seller","The lender","The title company"],"a":1,"ex":"Customarily the seller pays deed stamps; the buyer pays note stamps and intangible tax on new financing. Contracts can allocate differently.","w":{"0":["PT","In Portugal the buyer pays IMT; Florida custom puts deed stamps on the seller."],"2":["RULE","The lender does not pay deed stamps."],"3":["RULE","The title company collects, but does not bear, the tax."]}},{"id":"Q1407-01","l":"L14-7","o":0,"d":2,"t":"num","num":["N-133"],"q":"Closing is June 15 (non-leap year). Annual property taxes of $4,380 are unpaid. Using the 365-day method with the buyer owning the day of closing, how much is the seller's share?","ans":1980,"tol":0.5,"unit":"$","steps":["Daily rate = $4,380 ÷ 365 = $12.00.","Seller's days Jan 1 – June 14: 31 + 28 + 31 + 30 + 31 + 14 = 165.","165 × $12 = $1,980 → debit seller, credit buyer."],"ex":"Taxes are paid in arrears, so the seller owes the buyer for the days the seller owned the property.","w":{}},{"id":"Q1407-02","l":"L14-7","o":2,"d":3,"t":"num","q":"The seller collected March rent of $2,400 in advance. Closing is March 20; the buyer owns the day of closing. How much is credited to the buyer? (March has 31 days; round to the cent.)","ans":929.03,"tol":0.01,"unit":"$","steps":["Buyer's days: March 20–31 = 12 days.","Daily rent = $2,400 ÷ 31 = $77.419…","12 × $77.419 = $929.03 → credit buyer, debit seller."],"ex":"Rent is paid in advance, so the seller holds money that belongs to the buyer.","w":{}},{"id":"Q1407-03","l":"L14-7","o":1,"d":2,"t":"num","q":"The seller prepaid the calendar-year HOA dues of $1,825. Closing is October 1 and the buyer owns the day of closing. How much does the buyer owe the seller?","ans":460,"tol":0.5,"unit":"$","steps":["Daily = $1,825 ÷ 365 = $5.00.","Buyer's days Oct 1 – Dec 31 = 31 + 30 + 31 = 92.","92 × $5 = $460 → debit buyer, credit seller."],"ex":"","w":{}},{"id":"Q1407-04","l":"L14-7","o":1,"d":1,"t":"mcq","q":"How does the proration of UNPAID property taxes appear on the closing statement?","c":["Debit buyer, credit seller","Debit seller, credit buyer","Credit seller only","Debit buyer only"],"a":1,"ex":"Taxes are paid in arrears; the seller owes for the days owned, and the buyer will pay the full bill later. Debit seller, credit buyer.","w":{"0":["CONFUSED","That is the direction for prepaid items."],"2":["CONFUSED","Prorations between the parties are double entries."],"3":["CONFUSED","Prorations between the parties are double entries."]}},{"id":"Q1407-05","l":"L14-7","o":2,"d":3,"t":"num","q":"A buyer assumes a $180,000 loan at 6%; interest is paid in arrears. Closing is April 16 and the buyer owns the day of closing. Using April's 30 days to find the daily interest, how much accrued interest is charged to the seller?","ans":450,"tol":0.5,"unit":"$","steps":["April interest = $180,000 × 0.06 ÷ 12 = $900.","Daily = $900 ÷ 30 = $30.","Seller's days April 1–15 = 15 → $450 → debit seller, credit buyer."],"ex":"","w":{}},{"id":"Q1408-01","l":"L14-8","o":0,"d":1,"t":"mcq","q":"On the closing statement, the buyer's earnest money deposit appears as a:","c":["debit to the buyer","credit to the buyer only","credit to the seller","debit to the seller and credit to the buyer"],"a":1,"ex":"The deposit is already paid toward the price, so it is a credit to the buyer — a single entry.","w":{"0":["CONFUSED","The buyer already paid it, so it reduces what the buyer owes."],"2":["CONFUSED","The seller is credited the full price instead."],"3":["CONFUSED","It is a single entry."]}},{"id":"Q1408-02","l":"L14-8","o":0,"d":2,"t":"mcq","v":"V-24","q":"A buyer assumes the seller's existing mortgage. How does the assumed balance appear?","c":["Credit buyer only","Debit seller only","Debit seller and credit buyer","Debit buyer and credit seller"],"a":2,"ex":"An assumed mortgage is a double entry: it pays part of the price for the buyer (credit) and reduces what the seller receives (debit). (The study manual's table shows only the buyer credit — corrected here.)","w":{"0":["CONFUSED","That is a NEW mortgage, which is a buyer credit only."],"1":["CONFUSED","That is a seller's payoff of an existing loan."],"3":["CONFUSED","Reversed."]}},{"id":"Q1408-03","l":"L14-8","o":0,"d":1,"t":"mcq","q":"The brokerage commission is customarily entered as a:","c":["debit to the seller","credit to the seller","debit to the buyer","debit to both"],"a":0,"ex":"The seller customarily pays the listing brokerage's commission: seller debit.","w":{"1":["CONFUSED","The seller pays it."],"2":["RULE","Customarily the seller's cost."],"3":["RULE","A single entry for the seller."]}},{"id":"Q1408-04","l":"L14-8","o":1,"d":3,"t":"num","q":"Buyer's side: price $300,000; deposit $15,000; new loan $240,000; buyer's closing costs $6,200; credit for unpaid taxes $1,800. How much cash must the buyer bring to closing?","ans":49400,"tol":0.5,"unit":"$","steps":["Debits: $300,000 + $6,200 = $306,200.","Credits: $15,000 + $240,000 + $1,800 = $256,800.","Cash due = $306,200 − $256,800 = $49,400."],"ex":"","w":{}},{"id":"Q1408-05","l":"L14-8","o":1,"d":3,"t":"num","q":"Seller's side: price $300,000; mortgage payoff $150,000; commission 6%; deed stamps $2,100; other seller costs $1,500; tax proration debit $1,800. How much does the seller receive?","ans":126600,"tol":0.5,"unit":"$","steps":["Credit: $300,000.","Debits: $150,000 + $18,000 + $2,100 + $1,500 + $1,800 = $173,400.","Net = $300,000 − $173,400 = $126,600."],"ex":"","w":{}},{"id":"Q1501-01","l":"L15-1","o":0,"d":1,"t":"mcq","q":"Why do real estate markets respond slowly to increases in demand?","c":["Prices are set by the government","New supply takes a long time to build","Real estate is perfectly mobile","Buyers have complete information"],"a":1,"ex":"Supply is slow to respond because construction takes time; the product is immobile and markets are local.","w":{"0":["RULE","Prices are set by the market."],"2":["RULE","Real estate is immobile."],"3":["RULE","Real estate markets have imperfect information."]}},{"id":"Q1501-02","l":"L15-1","o":1,"d":2,"t":"mcq","q":"A sales associate prepares a comparative market analysis for a seller and charges a fee. Which is correct?","c":["Illegal; only appraisers may charge for value opinions","Lawful, as long as it is not called an appraisal","Lawful only for federally related transactions","Lawful only if the associate is a broker"],"a":1,"ex":"A licensee may prepare and charge for a CMA or BPO but must not call it an appraisal.","w":{"0":["RULE","Licensees may charge for CMAs and BPOs."],"2":["CONFUSED","Federally related transactions require a licensed or certified appraiser."],"3":["RULE","Sales associates may prepare CMAs."]}},{"id":"Q1501-03","l":"L15-1","o":0,"d":1,"t":"mcq","q":"Rising vacancy rates in an area usually signal:","c":["excess demand and rising prices","oversupply and softening prices","stable prices","higher construction activity"],"a":1,"ex":"Rising vacancy indicates more supply than demand; prices and rents tend to soften.","w":{"0":["CONFUSED","Excess demand lowers vacancy."],"2":["RULE","Vacancy changes signal imbalance."],"3":["RULE","Oversupply discourages construction."]}},{"id":"Q1601-01","l":"L16-1","o":0,"d":1,"t":"mcq","q":"The four elements of value are:","c":["demand, utility, scarcity, transferability","demand, usage, supply, taxability","design, utility, scarcity, title insurance","demand, utility, supply, time on market"],"a":0,"ex":"DUST: Demand, Utility, Scarcity, Transferability.","w":{"1":["RULE","Not the four elements."],"2":["RULE","Not the four elements."],"3":["RULE","Scarcity and transferability, not supply and time."]}},{"id":"Q1601-02","l":"L16-1","o":1,"d":2,"t":"mcq","q":"A buyer will not pay more for a home than the cost of an equally desirable substitute. This is the principle of:","c":["contribution","substitution","anticipation","conformity"],"a":1,"ex":"Substitution underlies all three appraisal approaches.","w":{"0":["CONFUSED","Contribution is the value a feature adds."],"2":["CONFUSED","Anticipation is value from expected future benefits."],"3":["CONFUSED","Conformity is about similar properties holding value."]}},{"id":"Q1601-03","l":"L16-1","o":1,"d":2,"t":"mcq","q":"A modest house in a neighbourhood of much larger, more expensive homes tends to gain value. This is:","c":["regression","progression","plottage","assemblage"],"a":1,"ex":"Progression: a lesser property gains from better neighbours. Regression: a superior property loses value from lesser neighbours.","w":{"0":["CONFUSED","Regression is the opposite."],"2":["CONFUSED","Plottage is the value increase from combining parcels."],"3":["CONFUSED","Assemblage is the act of combining parcels."]}},{"id":"Q1602-01","l":"L16-2","o":0,"d":1,"t":"mcq","q":"In the sales comparison approach, if a comparable has a feature the subject lacks, the appraiser:","c":["adds the feature's value to the comparable's price","subtracts the feature's value from the comparable's price","adds the value to the subject","ignores the feature"],"a":1,"ex":"Adjust the comparable, never the subject. Comparable better → subtract; comparable inferior → add.","w":{"0":["FORMULA","Reversed direction."],"2":["FORMULA","Never adjust the subject."],"3":["RULE","Significant differences must be adjusted."]}},{"id":"Q1602-02","l":"L16-2","o":0,"d":2,"t":"num","q":"A comparable sold for $410,000. It has a pool worth $25,000 that the subject lacks. The subject has an extra half-bath worth $8,000 that the comparable lacks. What is the comparable's adjusted price?","ans":393000,"tol":0.5,"unit":"$","steps":["Comparable better (pool): subtract $25,000.","Comparable inferior (no half-bath): add $8,000.","$410,000 − $25,000 + $8,000 = $393,000."],"ex":"","w":{}},{"id":"Q1602-03","l":"L16-2","o":1,"d":2,"t":"mcq","q":"After adjustments, which comparable usually deserves the most weight?","c":["The one with the highest adjusted sale price","The one with the fewest and smallest adjustments","The oldest sale, because its price is final","The one farthest from the subject's neighbourhood"],"a":1,"ex":"The comparable most similar to the subject (fewest, smallest adjustments) is the most reliable.","w":{"0":["RULE","Price level is not the test."],"2":["RULE","Recent sales are preferred."],"3":["RULE","Proximity is preferred."]}},{"id":"Q1603-01","l":"L16-3","o":1,"d":1,"t":"mcq","q":"An airport is built next to a residential neighbourhood, reducing home values. This is:","c":["physical deterioration","functional obsolescence","external obsolescence","curable depreciation"],"a":2,"ex":"External (economic) obsolescence comes from outside the property and is always incurable.","w":{"0":["CONFUSED","Physical deterioration is wear and tear."],"1":["CONFUSED","Functional obsolescence is outdated design within the property."],"3":["RULE","External obsolescence is always incurable."]}},{"id":"Q1603-02","l":"L16-3","o":0,"d":2,"t":"num","q":"Land value $90,000; reproduction cost new of the building $360,000; accrued depreciation 15%. What is the value by the cost approach?","ans":396000,"tol":0.5,"unit":"$","steps":["Depreciation = $360,000 × 0.15 = $54,000.","Depreciated building = $306,000.","Value = $90,000 + $306,000 = $396,000."],"ex":"Land is not depreciated.","w":{}},{"id":"Q1603-03","l":"L16-3","o":1,"d":2,"t":"mcq","q":"The cost to build a structure with the same utility using modern materials and design is:","c":["reproduction cost","replacement cost","historical cost","assessed cost"],"a":1,"ex":"Replacement cost = equal utility with current methods. Reproduction cost = exact replica.","w":{"0":["CONFUSED","Reproduction is an exact replica."],"2":["RULE","Historical cost is original cost."],"3":["RULE","Not an appraisal term."]}},{"id":"Q1604-01","l":"L16-4","o":0,"d":3,"t":"num","q":"Potential gross income $180,000; vacancy and collection loss 5%; operating expenses $61,000. Using an 8% capitalization rate, what is the value?","ans":1375000,"tol":0.5,"unit":"$","steps":["Effective gross income = $180,000 × 0.95 = $171,000.","NOI = $171,000 − $61,000 = $110,000.","Value = NOI ÷ cap rate = $110,000 ÷ 0.08 = $1,375,000."],"ex":"IRV: Income ÷ Rate = Value.","w":{}},{"id":"Q1604-02","l":"L16-4","o":1,"d":2,"t":"num","q":"A single-family rental rents for $2,100 per month. Similar homes sell at a gross rent multiplier of 150. What is the indicated value?","ans":315000,"tol":0.5,"unit":"$","steps":["GRM uses MONTHLY rent: Value = rent × GRM.","$2,100 × 150 = $315,000."],"ex":"","w":{}},{"id":"Q1604-03","l":"L16-4","o":0,"d":2,"t":"mcq","q":"Which item is NOT deducted as an operating expense when computing NOI?","c":["Property taxes and special assessments","Hazard and liability insurance premiums","Mortgage principal and interest (debt service)","Repairs, maintenance and reserves for replacement"],"a":2,"ex":"Debt service and depreciation are not operating expenses.","w":{"0":["MISREAD","Property taxes are operating expenses."],"1":["MISREAD","Insurance is an operating expense."],"3":["MISREAD","Maintenance is an operating expense."]}},{"id":"Q1604-04","l":"L16-4","o":2,"d":2,"t":"mcq","q":"In reconciliation, the appraiser:","c":["averages the three approaches to find the final value","weighs each approach by its reliability for the property","always uses the highest of the three indicated values","always uses the sales comparison value for any property"],"a":1,"ex":"Reconciliation weighs the approaches; it is never a simple average.","w":{"0":["FORMULA","Averaging ignores reliability."],"2":["RULE","No such rule."],"3":["RULE","The best approach depends on property type."]}},{"id":"Q1604-05","l":"L16-4","o":2,"d":2,"t":"mcq","q":"For a federally related transaction requiring an appraisal, the appraisal must be performed by:","c":["any licensed broker following USPAP","a state-licensed or certified appraiser","the listing sales associate","the lender's loan officer"],"a":1,"ex":"Federally related transactions require a state-licensed or certified appraiser.","w":{"0":["QUALIFIER","Following USPAP does not make a broker eligible."],"2":["RULE","Not eligible."],"3":["RULE","Not eligible."]}},{"id":"Q1701-01","l":"L17-1","o":0,"d":1,"t":"mcq","q":"Using borrowed money to increase the return on the investor's own cash is called:","c":["liquidity","leverage","depreciation","equity buildup"],"a":1,"ex":"Leverage uses borrowed funds to magnify returns (and risks).","w":{"0":["CONFUSED","Liquidity is how quickly an asset converts to cash."],"2":["CONFUSED","Depreciation is cost recovery."],"3":["CONFUSED","Equity buildup comes from principal payments and appreciation."]}},{"id":"Q1701-02","l":"L17-1","o":1,"d":1,"t":"num","q":"A property has NOI of $48,000 and annual debt service of $36,500. What is the before-tax cash flow?","ans":11500,"tol":0.5,"unit":"$","steps":["Cash flow = NOI − debt service.","$48,000 − $36,500 = $11,500."],"ex":"","w":{}},{"id":"Q1701-03","l":"L17-1","o":1,"d":2,"t":"num","q":"An investor pays $750,000 for a property with NOI of $52,500. What is the capitalization rate, in percent?","ans":7,"tol":0.01,"unit":"%","steps":["Cap rate = NOI ÷ price.","$52,500 ÷ $750,000 = 0.07 = 7%."],"ex":"","w":{}},{"id":"Q1702-01","l":"L17-2","o":0,"d":2,"t":"mcq","q":"The value of a business's reputation and customer relationships is:","c":["plottage","goodwill","boot","equity"],"a":1,"ex":"Goodwill is the intangible value of a business's reputation and customer base.","w":{"0":["CONFUSED","Plottage is about combining land parcels."],"2":["CONFUSED","Boot is non-like-kind value in an exchange."],"3":["CONFUSED","Equity is value minus debt."]}},{"id":"Q1702-02","l":"L17-2","o":0,"d":2,"t":"mcq","q":"A person sells a restaurant business, including the building, for another for a commission. Which is correct?","c":["No license needed because a business is personal property","A real estate license is required","Only a securities license is required","Only an attorney may do this"],"a":1,"ex":"Business opportunity brokerage for compensation, especially including real property, requires a real estate license.","w":{"0":["RULE","Real property is included, and business brokerage is covered by Chapter 475."],"2":["RULE","Not the governing license here."],"3":["RULE","Not limited to attorneys."]}},{"id":"Q1801-01","l":"L18-1","o":0,"d":1,"t":"mcq","num":["N-143"],"q":"Florida property is assessed according to its status and value as of:","c":["January 1","April 1","August 1","November 1"],"a":0,"ex":"January 1 is the assessment date. Tax bills mail around November 1; taxes become delinquent April 1.","w":{"1":["CONFUSED","April 1 is the delinquency date."],"2":["CONFUSED","TRIM notices go out in August."],"3":["CONFUSED","Bills are mailed around November 1."]}},{"id":"Q1801-02","l":"L18-1","o":0,"d":2,"t":"mcq","num":["N-143"],"q":"A homeowner pays the annual property tax bill in December. What discount does she receive?","c":["4%","3%","2%","1%"],"a":1,"ex":"4% November, 3% December, 2% January, 1% February.","w":{"0":["NUMBER","4% is for November."],"2":["NUMBER","2% is for January."],"3":["NUMBER","1% is for February."]}},{"id":"Q1801-03","l":"L18-1","o":1,"d":2,"t":"mcq","q":"A one-time charge to properties that benefit from a new sewer line, often based on front footage, is a:","c":["special assessment","ad valorem tax","documentary stamp tax","TRIM fee"],"a":0,"ex":"Special assessments charge specially benefited properties; they are not based on value.","w":{"1":["CONFUSED","Ad valorem taxes are based on value."],"2":["CONFUSED","Doc stamps are transfer taxes."],"3":["RULE","No such fee."]}},{"id":"Q1802-01","l":"L18-2","o":0,"d":2,"t":"mcq","num":["N-140"],"v":"V-09","q":"The second (additional) homestead exemption applies to:","c":["all taxes, including school taxes, on the first $25,000 of assessed value","non-school taxes on assessed value over $50,000 (up to $25,000, CPI-indexed)","school taxes only, on assessed value between $50,000 and $75,000","only owners aged 65 or older with limited household income"],"a":1,"ex":"First exemption: $25,000 off all taxes. Second: up to $25,000 (indexed to CPI since 2025) off non-school taxes on value above $50,000.","w":{"0":["CONFUSED","That describes the first exemption."],"2":["QUALIFIER","The second exemption excludes school taxes."],"3":["RULE","Age is not a requirement for these exemptions."]}},{"id":"Q1802-02","l":"L18-2","o":0,"d":1,"t":"mcq","num":["N-141"],"v":"V-10","q":"The property tax exemption for a widow, widower, blind person, or totally and permanently disabled person is currently:","c":["$500","$1,000","$5,000","$25,000"],"a":2,"ex":"$5,000 (raised from $500 by the 2022 Legislature, effective for the 2023 tax roll).","w":{"0":["NUMBER","$500 is the old amount in older books."],"1":["NUMBER","It is $5,000."],"3":["CONFUSED","$25,000 is the homestead exemption."]}},{"id":"Q1802-03","l":"L18-2","o":2,"d":3,"t":"num","num":["N-144","N-140"],"q":"A homestead is assessed at $280,000. School millage is 5.5 mills and non-school millage is 8.2 mills. Using $25,000 for each homestead exemption, what is the total tax?","ans":3288.5,"tol":0.01,"unit":"$","steps":["School taxable = $280,000 − $25,000 = $255,000 → × 0.0055 = $1,402.50.","Non-school taxable = $280,000 − $50,000 = $230,000 → × 0.0082 = $1,886.00.","Total = $3,288.50."],"ex":"1 mill = 0.001. The second exemption does not reduce school taxes.","w":{}},{"id":"Q1802-04","l":"L18-2","o":1,"d":2,"t":"num","num":["N-142"],"q":"A homestead's assessed value last year was $200,000. Market value rose 9% and the CPI rose 4.1%. Under Save Our Homes, what is the maximum assessed value this year?","ans":206000,"tol":0.5,"unit":"$","steps":["Cap = lesser of 3% or CPI (4.1%) = 3%.","$200,000 × 1.03 = $206,000."],"ex":"","w":{}},{"id":"Q1803-01","l":"L18-3","o":0,"d":1,"t":"mcq","num":["N-145"],"q":"Residential rental buildings are depreciated for income tax purposes over:","c":["15 years","27.5 years","39 years","They cannot be depreciated"],"a":1,"ex":"27.5 years for residential rental; 39 years for nonresidential. Land is never depreciated.","w":{"0":["NUMBER","It is 27.5 years."],"2":["CONFUSED","39 years is nonresidential."],"3":["RULE","Rental buildings can be depreciated."]}},{"id":"Q1803-02","l":"L18-3","o":2,"d":2,"t":"num","q":"An investor bought a rental for $250,000, added $40,000 of improvements, and took $60,000 of depreciation. She sells for a net $400,000. What is her taxable gain?","ans":170000,"tol":0.5,"unit":"$","steps":["Adjusted basis = $250,000 + $40,000 − $60,000 = $230,000.","Gain = $400,000 − $230,000 = $170,000."],"ex":"Depreciation lowers basis and raises the gain.","w":{}},{"id":"Q1803-03","l":"L18-3","o":1,"d":2,"t":"scn","q":"In a 1031 exchange of investment property, the investor also receives $20,000 in cash. What is the effect?","c":["The whole exchange becomes taxable, because cash is not like-kind property","The $20,000 is taxable boot; the rest of the exchange stays tax-deferred","Nothing is taxable, because the properties exchanged were like-kind","The exchange is void, and the investor must reverse both transfers"],"a":1,"ex":"Boot (cash, debt relief, non-like-kind property) is taxable, but it does not disqualify the exchange.","w":{"0":["RULE","Boot does not disqualify the exchange."],"2":["RULE","Boot is taxable to the extent of gain."],"3":["RULE","Boot does not void it."]}},{"id":"Q1803-04","l":"L18-3","o":1,"d":2,"t":"mcq","num":["N-146"],"q":"A married couple filing jointly sells the home they lived in for the last 4 years. How much gain can they generally exclude?","c":["$125,000","$250,000","$500,000","All of it"],"a":2,"ex":"$500,000 married filing jointly ($250,000 single) if owned and used as the main home 2 of the last 5 years.","w":{"0":["NUMBER","Not a current figure."],"1":["CONFUSED","$250,000 is for single filers."],"3":["RULE","The exclusion is capped."]}},{"id":"Q1901-01","l":"L19-1","o":1,"d":2,"t":"scn","q":"An owner's lot is unusually narrow, so a house cannot meet the side setback. She asks to build 3 feet closer to the line. She is requesting a:","c":["special exception","variance","rezoning","nonconforming use"],"a":1,"ex":"A variance permits deviation from a dimensional requirement because of a hardship unique to the parcel.","w":{"0":["CONFUSED","A special exception is a use permitted with approval."],"2":["CONFUSED","Rezoning changes the zoning district."],"3":["CONFUSED","A nonconforming use predates the zoning rule."]}},{"id":"Q1901-02","l":"L19-1","o":0,"d":2,"t":"mcq","q":"A county adopts zoning that limits building height. Owners receive no compensation. The county is using:","c":["eminent domain","police power","escheat","taxation"],"a":1,"ex":"Zoning and building codes are police power — regulation for health, safety and welfare without compensation. Eminent domain is a taking with just compensation.","w":{"0":["CONFUSED","Eminent domain requires just compensation."],"2":["CONFUSED","Escheat concerns owners with no heirs."],"3":["CONFUSED","Taxation raises revenue."]}},{"id":"Q1901-03","l":"L19-1","o":1,"d":2,"t":"mcq","q":"A store operating legally before the area was rezoned residential may continue to operate. This is a:","c":["variance","nonconforming use","special exception","PUD"],"a":1,"ex":"A nonconforming ('grandfathered') use may continue but typically cannot expand, and may be lost if destroyed or abandoned.","w":{"0":["CONFUSED","A variance is relief from a dimensional rule."],"2":["CONFUSED","A special exception is a permitted use with approval."],"3":["CONFUSED","A PUD is a planned development."]}},{"id":"Q1901-04","l":"L19-1","o":2,"d":1,"t":"mcq","q":"Before a new building may be occupied, the owner must obtain a:","c":["building permit","certificate of occupancy","zoning variance","comprehensive plan amendment"],"a":1,"ex":"A certificate of occupancy is issued after final inspection; the building permit is needed before construction.","w":{"0":["CONFUSED","The permit comes before construction."],"2":["RULE","A variance is not required for occupancy."],"3":["RULE","A plan amendment is not required to occupy a building."]}},{"id":"Q1902-01","l":"L19-2","o":0,"d":1,"t":"mcq","num":["N-113"],"q":"Under federal lead-based paint rules, a buyer of pre-1978 housing generally has how many days to conduct a lead inspection (unless waived)?","c":["3","7","10","15"],"a":2,"ex":"10 days, which the buyer may waive. Sellers must also disclose known hazards and provide the EPA pamphlet.","w":{"0":["NUMBER","It is 10 days."],"1":["NUMBER","It is 10 days."],"3":["CONFUSED","15 days is the developer condo cancellation period."]}},{"id":"Q1902-02","l":"L19-2","o":1,"d":2,"t":"mcq","q":"A new owner discovers buried industrial waste left by a prior owner. Under CERCLA, the new owner:","c":["cannot be liable, because she did not cause the contamination herself","can be liable unless she qualifies for a defense, such as innocent landowner","is liable only if she knew about the buried waste before she bought","can sue the state for compensation, because the waste predates her"],"a":1,"ex":"CERCLA liability is strict, joint and several; current owners can be liable. The innocent-landowner defense requires appropriate due diligence (e.g., a Phase I environmental audit) before purchase.","w":{"0":["RULE","Liability does not depend on causing the contamination."],"2":["RULE","Liability is strict."],"3":["RULE","No such right."]}},{"id":"Q1902-03","l":"L19-2","o":1,"d":1,"t":"mcq","q":"Asbestos insulation that is intact and not crumbling is often best handled by:","c":["immediate removal by the owner","encapsulation","burning","painting over with lead-based paint"],"a":1,"ex":"Asbestos is dangerous when friable (crumbling); encapsulation is often safer than removal.","w":{"0":["RULE","Removal can release fibers and requires licensed abatement."],"2":["RULE","Never."],"3":["RULE","Never."]}},{"id":"Q0304-04","l":"L03-4","o":2,"d":1,"t":"mcq","q":"A sales associate wants to work for two unrelated brokerages at the same time to earn more. Which is correct?","c":["Allowed, if both brokers sign a written consent","Not allowed: a sales associate may work for only one employer at a time","Allowed, if she holds a separate license for each brokerage","Allowed for up to 90 days while she chooses one brokerage"],"a":1,"ex":"A sales associate may hold only one license and be registered with only one employing broker (or owner-developer) at a time. Only brokers may hold multiple licenses.","w":{"0":["RULE","Consent cannot create a second employer."],"2":["CONFUSED","Multiple licenses are available only to brokers."],"3":["RULE","There is no grace period."]}},{"id":"Q0403-06","l":"L04-3","o":2,"d":2,"t":"mcq","num":["N-033"],"v":"V-20","q":"Which sale is a 'residential sale' for brokerage disclosure purposes?","c":["An office condominium unit","A 5-unit apartment building","An 8-acre agricultural property","A 15-acre agricultural property"],"a":2,"ex":"Residential sale: improved residential property of ≤4 units, unimproved residential land for ≤4 units, or agricultural property of ≤10 acres.","w":{"0":["RULE","An office condo is nonresidential."],"1":["NUMBER","5 units exceeds the 4-unit limit."],"3":["NUMBER","Agricultural property counts only up to 10 acres."]}},{"id":"Q0702-04","l":"L07-2","o":2,"d":1,"t":"mcq","num":["N-065"],"q":"Under CAN-SPAM, a brokerage must honor an email recipient's opt-out request within:","c":["24 hours","3 business days","10 business days","30 days"],"a":2,"ex":"Opt-out requests must be honored within 10 business days; commercial emails also need truthful headers and a physical postal address.","w":{"0":["NUMBER","It is 10 business days."],"1":["CONFUSED","3 business days is a TRID/TILA number."],"3":["NUMBER","It is 10 business days."]}},{"id":"Q0704-04","l":"L07-4","o":0,"d":2,"t":"mcq","num":["N-068"],"q":"A Florida landlord receives a tenant's security deposit. Within how many days must the landlord notify the tenant in writing how the deposit is being held?","c":["7 days","15 days","30 days","60 days"],"a":2,"ex":"Within 30 days of receipt, the landlord gives written notice of the manner in which the deposit is held (separate account, interest-bearing account, or surety bond).","w":{"0":["NUMBER","It is 30 days."],"1":["CONFUSED","15 days is the return deadline at move-out when no claim is made."],"3":["CONFUSED","60 days is the year-to-year termination notice."]}},{"id":"Q0805-05","l":"L08-5","o":2,"d":2,"t":"mcq","q":"When must a buyer in a community with a mandatory homeowners' association receive the HOA disclosure summary?","c":["Before the buyer signs the sale contract","At closing, with the other HOA documents","Within 30 days after the closing date","Only if the buyer asks for it in writing"],"a":0,"ex":"The HOA disclosure summary must be provided before the contract is executed (manual: if not, the buyer may void the contract).","w":{"1":["NUMBER","Closing is too late; the disclosure comes before contract."],"2":["NUMBER","It comes before contract."],"3":["RULE","It is mandatory."]}},{"id":"Q1103-05","l":"L11-3","o":2,"d":2,"t":"scn","q":"Which event does NOT terminate a listing agreement?","c":["The seller dies before a buyer is found","The listed house is destroyed by a fire","The listing period expires with no sale","The listing associate moves to another firm"],"a":3,"ex":"The listing is a contract between the seller and the brokerage, not the individual associate, so it stays with the brokerage. Death, destruction and expiration all end it.","w":{"0":["RULE","Death of a party ends a personal-service contract."],"1":["RULE","Destruction of the property ends the listing."],"2":["RULE","Expiration ends the listing."]}},{"id":"Q1104-05","l":"L11-4","o":2,"d":3,"t":"scn","q":"A seller signs an AS IS contract. He knows the pool leaks underground but says nothing; the leak is not visible. After closing the buyer discovers it. Which is correct?","c":["The buyer has no claim, because AS IS means the buyer accepted the leak","The seller may be liable for failing to disclose a known latent material defect","The buyer has no claim, because the inspection period has ended","Only the listing broker can be liable, never the seller"],"a":1,"ex":"Under Johnson v. Davis, a seller must disclose known facts materially affecting value that are not readily observable. AS IS limits repair obligations; it does not excuse concealment.","w":{"0":["QUALIFIER","AS IS does not cover concealed defects the seller knew about."],"2":["RULE","The duty to disclose is separate from the inspection period."],"3":["RULE","The seller's own duty exists; licensees may also be liable."]}},{"id":"Q1203-05","l":"L12-3","o":1,"d":1,"t":"mcq","num":["N-122"],"q":"Under the course's benchmarks, an FHA borrower's housing and total obligations ratios should not exceed:","c":["28% and 36%","29% and 41%","31% and 43%","33% and 45%"],"a":2,"ex":"Course convention: FHA 31% / 43%; conventional 28% / 36%. These are teaching benchmarks, not statutes.","w":{"0":["CONFUSED","28/36 are the conventional benchmarks."],"1":["NUMBER","Not the course figures."],"3":["NUMBER","Not the course figures."]}},{"id":"Q0303-07","l":"L03-3","o":1,"d":2,"t":"mcq","num":["N-009"],"v":"V-28","q":"A sales associate's 14 hours of continuing education each renewal period must consist of:","c":["3 hours Core Law, 3 hours Ethics and Business Practices, 8 hours specialty","14 hours of any FREC-approved courses, chosen freely by the licensee","3 hours Core Law and 11 hours of specialty education of any kind","7 hours Core Law and 7 hours Ethics and Business Practices courses"],"a":0,"ex":"The 14 hours are split 3 Core Law + 3 Ethics and Business Practices + 8 specialty (mandatory for licenses expiring on or after March 31, 2025).","w":{"1":["RULE","The hours are split into required categories."],"2":["RULE","3 of the hours must be Ethics and Business Practices."],"3":["NUMBER","Core Law and Ethics are 3 hours each."]}},{"id":"Q0702-05","l":"L07-2","o":1,"d":2,"t":"mcq","num":["N-064"],"v":"V-58","q":"Under the FTC Telemarketing Sales Rule as amended in 2024, an established business relationship based on a consumer's inquiry lasts:","c":["30 days","90 days","540 days","18 months"],"a":1,"ex":"FTC rule (since May 16, 2024): 540 days after a transaction, 90 days after an inquiry. The FCC rule still states 18 months and 3 months.","w":{"0":["NUMBER","It is 90 days."],"2":["CONFUSED","540 days is the window after a purchase or transaction."],"3":["CONFUSED","18 months is the FCC transaction window."]}},{"id":"Q0704-05","l":"L07-4","o":3,"d":1,"t":"mcq","num":["N-071"],"v":"V-07","q":"A Tampa landlord is about to sign a 12-month residential lease. Under Florida law since October 2025, the landlord must:","c":["give the statutory flood disclosure at or before signing the lease","give a flood disclosure only if the unit is in a FEMA flood zone","deliver a flood disclosure within 30 days after the tenant moves in","do nothing, because flood disclosures apply only to sales of homes"],"a":0,"ex":"s. 83.512: for a residential lease of 1 year or longer, the landlord gives the flood disclosure (a separate statutory form) at or before signing.","w":{"1":["QUALIFIER","The duty does not depend on the flood zone."],"2":["RULE","It is due at or before signing."],"3":["RULE","Since October 2025 it also applies to leases of 1 year or more."]}},{"id":"Q0704-06","l":"L07-4","o":3,"d":2,"t":"mcq","num":["N-071"],"v":"V-07","q":"Which of these residential rentals requires the landlord's flood disclosure under s. 83.512?","c":["A 6-month lease","A 12-month lease","A month-to-month tenancy","A 9-month seasonal lease"],"a":1,"ex":"The disclosure applies to rental agreements for a term of 1 year or longer. Shorter terms are not covered.","w":{"0":["NUMBER","The threshold is a term of 1 year or longer."],"2":["NUMBER","A month-to-month tenancy is not a 1-year term."],"3":["NUMBER","9 months is less than 1 year."]}},{"id":"Q0805-06","l":"L08-5","o":1,"d":2,"t":"scn","num":["N-081"],"v":"V-08","q":"A buyer signs a contract for a resale condominium unit and receives the association documents the same day. The contract has the statutory cancellation clause. Under current Florida law, the buyer may cancel by written notice within:","c":["3 days, excluding Saturdays, Sundays and legal holidays","7 days, excluding Saturdays, Sundays and legal holidays","10 calendar days, including weekends and legal holidays","15 days, excluding Saturdays, Sundays and legal holidays"],"a":1,"ex":"Since July 1, 2025 (ch. 2025-175), the resale period is 7 days excluding weekends and legal holidays, after signing and receiving the documents. Older books say 3 business days. Developer sales: 15 days. Timeshares: 10 days.","w":{"0":["CONFUSED","3 days is the pre-2025 resale rule found in older books."],"2":["CONFUSED","10 calendar days is the timeshare rule."],"3":["CONFUSED","15 days is the developer sale rule."]}},{"id":"Q0805-07","l":"L08-5","o":2,"d":3,"t":"scn","num":["N-083"],"v":"V-65","q":"A buyer of a home in a mandatory HOA community did not receive the HOA disclosure summary before signing. The summary arrives 10 days before closing. The buyer may void the contract:","c":["within 3 days after receiving the summary, but not after closing","at any time before closing, because the summary arrived late","within 15 days after receiving the summary, as in a developer sale","only if the seller agrees in writing to release the buyer from it"],"a":0,"ex":"s. 720.401: within 3 days after receiving the summary or before closing, whichever occurs first. Here the 3-day window ends first.","w":{"1":["QUALIFIER","The right ends 3 days after receipt or at closing, whichever comes first."],"2":["CONFUSED","15 days is the developer condominium rule."],"3":["RULE","The statutory right does not need the seller's consent."]}}],"flashcards":[{"id":"F-001","l":"L01-1","t":"distinction","f":"Statute vs administrative rule: what is the difference, with one Florida real estate example of each?","b":"A statute is passed by the Legislature (Chapter 475 F.S., the license law). A rule is adopted by an agency under a statute's authority (Rule 61J2 F.A.C., e.g., escrow deposit deadlines adopted by FREC)."},{"id":"F-002","l":"L01-1","t":"distinction","f":"DBPR vs FREC — who investigates, who disciplines, who issues licenses?","b":"DBPR issues licenses and investigates complaints. FREC adopts rules and disciplines (final orders). Courts handle crimes and civil damages.","chk":["dbpr","frec"]},{"id":"F-003","l":"L02-1","t":"rule-app","f":"The three elements that require a real estate license.","b":"A real estate service, for another, for compensation (paid, promised or expected).","chk":["another","compensation"]},{"id":"F-004","l":"L02-2","t":"scenario","f":"A builder's salaried employee sells the builder's homes. Then she's paid per closing. License needed?","b":"Salaried only: exempt. Paid per closing: license required — the exemption depends on no commission/transaction-based pay."},{"id":"F-005","l":"L02-3","t":"distinction","f":"Mutual recognition: who can use it, and what exam do they take?","b":"Only applicants who are NOT Florida residents when they apply, licensed in a state with an agreement. They take a 40-question Florida law exam and need 30 correct."},{"id":"F-006","l":"L03-3","t":"distinction","f":"Missed post-license education vs missed continuing education: consequences?","b":"Post-license (45 hrs) missed before first renewal → license null and void. CE (14 hrs) missed at a later renewal → involuntary inactive (recoverable for 2 years).","chk":["void","inactive"]},{"id":"F-007","l":"L03-3","t":"trigger","f":"Involuntary inactive for 18 months. What does reactivation require?","b":"The 28-hour commission-prescribed reactivation course (more than 12 but less than 24 months). ≤12 months: 14 hours. >24 months: license expired.","chk":["28"]},{"id":"F-008","l":"L03-4","t":"trigger","f":"What event starts a 10-day clock and what event starts a 30-day clock for a licensee's duty to notify DBPR?","b":"10 days: change of mailing or e-mail address (also a change of employing broker). 30 days: conviction, finding of guilt, or guilty or nolo contendere plea to any crime."},{"id":"F-009","l":"L03-2","t":"distinction","f":"Group license vs multiple licenses.","b":"Group license: a sales associate (or broker associate) works for several CONNECTED entities of one owner-developer. Multiple licenses: a BROKER holds separate licenses for unconnected brokerages."},{"id":"F-010","l":"L04-1","t":"rule-app","f":"Presumed brokerage relationship in Florida?","b":"Transaction broker (unless single agent or no brokerage relationship is established in writing).","chk":["transaction"]},{"id":"F-011","l":"L04-2","t":"distinction","f":"Name the four duties owed ONLY by a single agent.","b":"Loyalty, obedience, (full) confidentiality, full disclosure.","chk":["loyalty","obedience"]},{"id":"F-012","l":"L04-2","t":"def-term","f":"Transaction-broker duty not to reveal that the seller will take less, the buyer will pay more, a party's motivation, or facts a party asks to keep confidential.","b":"Limited confidentiality.","chk":["limited","confidentiality"]},{"id":"F-013","l":"L04-3","t":"trigger","f":"When must the No Brokerage Relationship Notice be given?","b":"Before showing the property."},{"id":"F-014","l":"L04-3","t":"trigger","f":"When must the Single Agent Notice be given?","b":"Before or at the time of entering into a listing or representation agreement, or before showing property — whichever comes first."},{"id":"F-015","l":"L04-3","t":"rule-app","f":"List four situations where brokerage disclosure is NOT required.","b":"Any four of: party already represented; bona fide open house/model showing; unanticipated casual encounter; general factual questions about advertised property; general info about qualifications/firm; auctions; appraisals; leases without an option to buy ≤4 units; nonresidential/commercial; business enterprises (except ≤4 residential units)."},{"id":"F-016","l":"L04-4","t":"distinction","f":"Latent defect vs stigma: which must be disclosed in Florida?","b":"Known latent material defects (hidden roof leak, flooding) must be disclosed. Death on the property and HIV/AIDS status are declared not material."},{"id":"F-017","l":"L04-4","t":"rule-app","f":"Which duties survive termination of a brokerage relationship?","b":"Confidentiality and accounting for funds.","chk":["confidential","account"]},{"id":"F-018","l":"L05-1","t":"trigger","f":"Deposit received Wednesday (no holidays). Associate's deadline? Broker's deadline?","b":"Associate → broker: end of Thursday (next business day). Broker deposits: end of Monday (Thu 1, Fri 2, Mon 3).","chk":["thursday","monday"]},{"id":"F-019","l":"L05-1","t":"distinction","f":"Commingling vs conversion.","b":"Commingling: mixing personal and escrow funds. Conversion: using escrow funds for personal or unauthorized purposes (more serious)."},{"id":"F-020","l":"L05-2","t":"rule-app","f":"Four escrow dispute settlement procedures (M.A.L.E.).","b":"Mediation (all consent, 90 days), Arbitration (all consent, binding), Litigation (interpleader), Escrow disbursement order from FREC (only if the broker holds the funds)."},{"id":"F-021","l":"L05-2","t":"rule-app","f":"Two statutory situations where a broker may return a deposit to the buyer without notifying FREC.","b":"A residential condo buyer cancels under s. 718.503; the buyer in good faith fails to satisfy the contract's financing clause."},{"id":"F-022","l":"L05-3","t":"def-term","f":"An ad by a licensee that omits the registered brokerage name.","b":"Blind ad.","chk":["blind"]},{"id":"F-023","l":"L05-4","t":"rule-app","f":"Who may pay a sales associate for real estate services?","b":"Only the sales associate's employing broker (or owner-developer employer)."},{"id":"F-024","l":"L06-1","t":"rule-app","f":"Put in order: final order, probable cause, investigation, formal complaint, hearing, complaint, appeal.","b":"Complaint → investigation → probable cause → formal complaint → hearing → final order → appeal (30 days)."},{"id":"F-025","l":"L06-2","t":"distinction","f":"Misrepresentation vs culpable negligence.","b":"Misrepresentation: a false statement (or concealment) of material fact. Culpable negligence: reckless indifference to others' rights — beyond simple carelessness, without intent to deceive."},{"id":"F-026","l":"L06-3","t":"rule-app","f":"Who cannot recover from the Real Estate Recovery Fund?","b":"A licensee who acted as a licensee in the transaction (e.g., commission disputes); also excluded: amounts above caps, treble damages, court costs, attorney's fees, interest."},{"id":"F-027","l":"L07-1","t":"distinction","f":"Steering vs blockbusting vs redlining.","b":"Steering: guiding buyers toward/away from areas by protected class. Blockbusting: scaring owners into selling because a protected class is moving in. Redlining: lender refusing or varying loans by area."},{"id":"F-028","l":"L07-1","t":"distinction","f":"Reasonable modification vs reasonable accommodation.","b":"Modification: physical change to the unit (usually tenant pays). Accommodation: change in rules/policies (e.g., service animal despite no-pets rule)."},{"id":"F-029","l":"L07-3","t":"trigger","f":"TILA's 3-business-day right of rescission applies to which loans?","b":"Refinances and home-equity loans on the borrower's principal residence — not purchase loans, not investment property."},{"id":"F-030","l":"L07-2","t":"distinction","f":"Match: housing / credit / public accommodations / lending data.","b":"Fair Housing Act / ECOA / ADA / HMDA."},{"id":"F-031","l":"L07-4","t":"trigger","f":"Security deposit timeline after the tenant moves out.","b":"15 days to return if no claim; certified-mail notice of claim within 30 days; tenant has 15 days to object. Missing the 30-day notice forfeits the claim.","chk":["15","30"]},{"id":"F-032","l":"L08-1","t":"distinction","f":"Remainder vs reversion.","b":"Remainder: future interest goes to a third party (remainderman). Reversion: it returns to the grantor or heirs."},{"id":"F-033","l":"L08-2","t":"distinction","f":"Assignment vs sublease.","b":"Assignment: the ENTIRE remaining term; assignee pays landlord; original tenant secondarily liable unless released. Sublease: part of the term or space; subtenant pays tenant; tenant stays primarily liable."},{"id":"F-034","l":"L08-3","t":"scenario","f":"Married couple, deed silent. Unmarried pair, deed silent. How is title held in each case?","b":"Married: tenancy by the entireties. Unmarried: tenancy in common."},{"id":"F-035","l":"L08-4","t":"distinction","f":"Florida homestead: name the three separate legal effects.","b":"(1) Protection from forced sale by most creditors; (2) restrictions on transfer and devise when there is a spouse/minor child (spouse joins deeds and mortgages); (3) property-tax exemption."},{"id":"F-036","l":"L08-5","t":"distinction","f":"Condominium vs cooperative ownership.","b":"Condo: deed to a unit (real property) + undivided share of common elements. Co-op: shares in the corporation + proprietary lease (personal property)."},{"id":"F-037","l":"L09-2","t":"distinction","f":"General warranty vs special warranty deed.","b":"General: grantor warrants against defects from any time. Special: only defects arising during the grantor's ownership."},{"id":"F-038","l":"L09-2","t":"rule-app","f":"What makes a Florida deed valid, and what is needed only for recording?","b":"Valid: writing, competent grantor, identifiable grantee, consideration, words of conveyance, legal description, grantor's signature + 2 witnesses, delivery and acceptance. Recording: notary acknowledgment."},{"id":"F-039","l":"L09-4","t":"distinction","f":"Easement appurtenant vs easement in gross.","b":"Appurtenant: benefits an adjacent parcel (dominant/servient), runs with the land. In gross: benefits a person or company (utility), no dominant estate."},{"id":"F-040","l":"L09-4","t":"distinction","f":"Adverse possession vs easement by prescription (Florida periods).","b":"Adverse possession (title): 7 years + color of title or payment of taxes. Prescription (easement): 20 years of adverse use.","chk":["7","20"]},{"id":"F-041","l":"L09-5","t":"distinction","f":"Accretion vs avulsion.","b":"Accretion: gradual deposit of soil — owner gains land, boundary moves. Avulsion: sudden change — boundary does not move."},{"id":"F-042","l":"L09-5","t":"rule-app","f":"Four tests for whether an item is a fixture.","b":"Intent (most important), method of annexation, adaptation to the property, relationship of the parties. Trade fixtures stay the tenant's."},{"id":"F-043","l":"L10-2","t":"formula","f":"Acreage of an aliquot description.","b":"640 ÷ (product of the denominators). Use AND to add separate parcels."},{"id":"F-044","l":"L10-2","t":"rule-app","f":"Where is section 1, section 6, section 31, section 36?","b":"1 = NE corner; 6 = NW; 31 = SW; 36 = SE (serpentine numbering from the NE)."},{"id":"F-045","l":"L14-1","t":"formula","f":"The percent triangle.","b":"Part = Total × Rate; Total = Part ÷ Rate; Rate = Part ÷ Total."},{"id":"F-046","l":"L14-1","t":"formula","f":"Percentage change.","b":"(New − Old) ÷ Old. The base is always the starting value."},{"id":"F-047","l":"L14-3","t":"formula","f":"Sale price needed to net the seller a given amount.","b":"Price = (Net + fixed costs) ÷ (1 − commission rate). Never multiply the net by (1 + rate)."},{"id":"F-048","l":"L14-4","t":"formula","f":"Recover the original cost from a sale price and profit %.","b":"Cost = Sale ÷ (1 + profit%). For a loss: Cost = Sale ÷ (1 − loss%)."},{"id":"F-049","l":"L14-5","t":"formula","f":"Loan-to-value ratio.","b":"LTV = loan ÷ lesser of sale price or appraised value."},{"id":"F-050","l":"L14-5","t":"formula","f":"First month's interest on an amortized loan.","b":"Balance × annual rate ÷ 12. Principal = payment − interest."},{"id":"F-051","l":"L14-6","t":"formula","f":"Deed stamps, note stamps, intangible tax — formulas and who customarily pays.","b":"Deed: round price UP to $100 → ÷100 × $0.70 (seller). Note: round loan UP → ÷100 × $0.35 (buyer; new and assumed). Intangible: new loan × 0.002 (buyer)."},{"id":"F-052","l":"L14-7","t":"rule-app","f":"Proration of unpaid property taxes: which party is debited?","b":"Debit seller, credit buyer (taxes paid in arrears)."},{"id":"F-053","l":"L14-7","t":"rule-app","f":"Proration of rent collected in advance by the seller: which party is credited?","b":"Credit buyer, debit seller, for the buyer's days (including the closing day)."},{"id":"F-054","l":"L14-8","t":"rule-app","f":"Single or double entry? Binder deposit; new mortgage; assumed mortgage; seller's payoff.","b":"Deposit: credit buyer (single). New mortgage: credit buyer (single). Assumed mortgage: debit seller + credit buyer (double). Payoff: debit seller (single)."},{"id":"F-055","l":"L12-3","t":"formula","f":"Housing ratio and total obligations ratio.","b":"Housing = PITI ÷ gross monthly income. Total = (PITI + recurring debts) ÷ gross monthly income. Course benchmarks: 28/36 conventional; 31/43 FHA."},{"id":"F-056","l":"L16-4","t":"formula","f":"IRV and how to build NOI.","b":"Value = NOI ÷ cap rate. NOI = PGI − vacancy & collection loss − operating expenses (NOT debt service or depreciation)."},{"id":"F-057","l":"L16-4","t":"formula","f":"GRM vs GIM.","b":"GRM = price ÷ MONTHLY gross rent (1–4 units). GIM = price ÷ ANNUAL gross income."},{"id":"F-058","l":"L16-3","t":"formula","f":"Cost approach.","b":"Value = land value + (cost new − accrued depreciation)."},{"id":"F-059","l":"L16-2","t":"rule-app","f":"Sales comparison adjustment direction.","b":"Adjust the comparable, never the subject. Comparable better → subtract; comparable inferior → add (CBS / CIA)."},{"id":"F-060","l":"L18-2","t":"formula","f":"Property tax with homestead exemptions.","b":"School tax = (assessed − 25,000) × school mills ÷ 1,000. Non-school = (assessed − 50,000*) × other mills ÷ 1,000. (*second exemption is up to $25,000, CPI-indexed since 2025.)"},{"id":"F-061","l":"L17-1","t":"formula","f":"Cash flow and cap rate.","b":"Cash flow = NOI − debt service. Cap rate = NOI ÷ price."},{"id":"F-062","l":"L12-2","t":"distinction","f":"Assumption vs 'subject to'.","b":"Assumption: buyer becomes personally liable (seller stays secondarily liable unless novation). Subject to: buyer pays but has no personal liability."},{"id":"F-063","l":"L13-1","t":"distinction","f":"FHA vs VA: role and borrower charge.","b":"FHA insures (borrower pays MIP). VA guarantees (borrower pays funding fee). Neither lends."},{"id":"F-064","l":"L13-3","t":"distinction","f":"Primary vs secondary mortgage market.","b":"Primary: originates loans (banks, credit unions, mortgage bankers/brokers). Secondary: buys existing loans (Fannie Mae, Freddie Mac; Ginnie Mae guarantees FHA/VA securities)."},{"id":"F-065","l":"L11-1","t":"distinction","f":"Void vs voidable vs unenforceable.","b":"Void: no contract at all. Voidable: one party may cancel (minor, fraud, duress). Unenforceable: valid but a court won't enforce (no required writing, time-barred)."},{"id":"F-066","l":"L11-3","t":"distinction","f":"Exclusive right of sale vs exclusive agency: owner sells to her neighbour herself.","b":"Exclusive right of sale: commission owed. Exclusive agency: no commission."},{"id":"F-067","l":"L11-2","t":"rule-app","f":"Effect of a counteroffer on the original offer.","b":"It rejects and terminates the original offer permanently."},{"id":"F-068","l":"L19-1","t":"distinction","f":"Variance vs special exception.","b":"Variance: deviation from a dimensional rule due to hardship unique to the parcel. Special exception: a use the code allows with case-by-case approval."},{"id":"F-069","l":"L19-1","t":"distinction","f":"Police power vs eminent domain.","b":"Police power: regulation (zoning, codes), no compensation. Eminent domain: taking for public use, just compensation required."},{"id":"F-070","l":"L18-3","t":"distinction","f":"1031 exchange vs principal-residence exclusion.","b":"1031: investment/business real property exchanged for like-kind; gain deferred; boot taxable. Residence: exclude $250k/$500k gain if owned and used 2 of last 5 years."},{"id":"F-N-001","l":"L02-3","t":"number","src":"N-001","f":"Pre-license course (sales associate) — state the exact rule.","b":"63 hours (50-minute hours), including the end-of-course exam\nConditions: The course completion becomes invalid if the state exam is not PASSED within 2 years after completing the course (V-31).\nQualifications: Mutual-recognition nonresidents skip the course (see N-007)."},{"id":"F-N-002","l":"L02-3","t":"number","src":"N-002","f":"Applicant minimum age / education — state the exact rule.","b":"18 years old; high school diploma or equivalent; U.S. Social Security number\nQualifications: U.S. citizenship and Florida residency are NOT required. Florida Bar members are exempt from the pre-license course (V-31)."},{"id":"F-N-003","l":"L02-3","t":"number","src":"N-003","f":"State exam passing score — state the exact rule.","b":"75 correct out of 100 (75%)\nQualifications: Mutual recognition law exam: 30 of 40 (N-007)."},{"id":"F-N-004","l":"L02-3","t":"number","src":"N-004","f":"Exam time limit — state the exact rule.","b":"3.5 hours"},{"id":"F-N-005","l":"L02-3","t":"number","src":"N-005","f":"Application validity — state the exact rule.","b":"Expires 2 years after DBPR receives it if the applicant has not passed the exam"},{"id":"F-N-006","l":"L02-3","t":"number","src":"N-006","f":"Reapplying after denial for dishonesty — state the exact rule.","b":"May reapply after 2 years (manual statement)"},{"id":"F-N-007","l":"L02-3","t":"number","src":"N-007","f":"Mutual recognition law exam — state the exact rule.","b":"40 questions; 30 correct to pass (75%)\nConditions: Must hold an active license in good standing in that state.\nQualifications: Florida residents cannot use mutual recognition. The other state's license must have been earned by its own course and exam. Current states (9): AL, AR, CT, GA, KY, MS, NE, RI, WV; Illinois ended Dec 31, 2025 (V-22)."},{"id":"F-N-008","l":"L03-3","t":"number","src":"N-008","f":"Post-license education (sales associate) — state the exact rule.","b":"45 hours, completed before the FIRST renewal\nQualifications: Missing it makes the license NULL AND VOID; must requalify (63-hour course and state exam). Exempt: 4-year degree in real estate. Attorneys are NOT exempt. FREC may allow 6 more months for physical hardship."},{"id":"F-N-009","l":"L03-3","t":"number","src":"N-009","f":"Continuing education — state the exact rule.","b":"14 hours per 2-year renewal period (after the first renewal): 3 hours Core Law + 3 hours Ethics and Business Practices + 8 hours specialty\nConditions: Applies to active and voluntary-inactive licensees.\nQualifications: Missing renewal → involuntary inactive (not void). Florida Bar members are exempt from CE."},{"id":"F-N-010","l":"L03-3","t":"number","src":"N-010","f":"First renewal timing — state the exact rule.","b":"18–24 months after initial licensure\nConditions: Later renewal periods are 24 months."},{"id":"F-N-011","l":"L03-3","t":"number","src":"N-011","f":"Reactivation from involuntary inactive — state the exact rule.","b":"≤12 months: 14 hours CE. More than 12 but less than 24 months: 28-hour reactivation course. More than 24 months: license expires (null and void).\nQualifications: Voluntary inactive can be renewed indefinitely with 14 hours CE per cycle."},{"id":"F-N-012","l":"L03-4","t":"number","src":"N-012","f":"Change of mailing or e-mail address — state the exact rule.","b":"Notify DBPR in writing within 10 days"},{"id":"F-N-013","l":"L03-4","t":"number","src":"N-013","f":"Reporting a crime (conviction, finding of guilt or plea) — state the exact rule.","b":"Within 30 days, in writing, including pleas of guilty or nolo contendere, to any crime in any jurisdiction\nConditions: Applies whether or not adjudication is withheld."},{"id":"F-N-014","l":"L03-2","t":"number","src":"N-014","f":"Broker license prerequisites — state the exact rule.","b":"24 months active sales associate license during the preceding 5 years; 72-hour broker course; broker exam\nConditions: Alternatives to the 24 months as a sales associate: salaried government employee holding a sales associate license, or broker licensed in another jurisdiction (same 24 months in 5 years). Sales associate post-licensing must be complete."},{"id":"F-N-015","l":"L03-2","t":"number","src":"N-015","f":"Broker post-license educati
