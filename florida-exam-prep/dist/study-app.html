"],"aid":"3 after applying, 3 before closing."},{"id":"N-067","s":"TILA right of rescission","val":"3 business days","u":"business days","ctx":"Credit secured by the borrower's principal residence, such as a home-equity loan or a refinance with a new lender. Saturdays count as business days.","cond":"","exc":"Not for purchase-money loans or investment property.","l":"L07-3","v":"V-51","conf":["N-066"],"aid":"Rescind the REFI, never the purchase."},{"id":"N-068","s":"Security deposit: notice of how held","val":"In the lease or within 30 days of receipt","u":"days","ctx":"Florida Residential Landlord and Tenant Act, s. 83.49(2). Where the deposit is held (or surety bond) and whether interest is paid.","cond":"","exc":"Not required for landlords who rent fewer than 5 units.","l":"L07-4","v":"V-62","conf":["N-069"],"aid":""},{"id":"N-069","s":"Security deposit after move-out","val":"Return within 15 days if no claim; otherwise notice of claim within 30 days by certified mail (or by e-mail if both signed the e-mail addendum, since July 1, 2025); tenant has 15 days to object","u":"days","ctx":"","cond":"","exc":"Missing the 30-day notice forfeits the right to impose a claim.","l":"L07-4","v":"V-63","conf":["N-068"],"aid":"15 · 30 · 15"},{"id":"N-070","s":"Notice to end a tenancy without a specific term","val":"Year-to-year 60 days; quarter-to-quarter 30 days; month-to-month 30 days; week-to-week 7 days","u":"days","ctx":"s. 83.57","cond":"Written notice before the end of the period.","exc":"Manual and older books: month 15 days, quarter 45 days — outdated/incorrect (V-04).","l":"L07-4","v":"V-04","conf":[],"aid":"60 / 30 / 30 / 7"},{"id":"N-071","s":"Flood disclosure for residential leases","val":"At or before signing a residential lease of 1 year or longer","u":"","ctx":"s. 83.512 (since Oct 1, 2025). Separate document on the statutory form.","cond":"","exc":"Leases shorter than 1 year are not covered. If the landlord fails to disclose and the tenant's belongings suffer a substantial flood loss, the tenant may terminate within 30 days after the damage.","l":"L07-4","v":"V-07","conf":[],"aid":"Lease of a year or more → flood form at signing."},{"id":"N-080","s":"Homestead size (creditor protection)","val":"1/2 acre of contiguous land within a municipality; 160 contiguous acres outside a municipality","u":"acres","ctx":"Florida Constitution Art. X.","cond":"","exc":"No protection against property taxes and assessments, debts for purchase, improvement or repair, or labor on the property.","l":"L08-4","v":"V-66","conf":[],"aid":"Half acre in town, 160 in the country."},{"id":"N-081","s":"Condominium cancellation rights","val":"Developer sale: 15 days. Resale: 7 days, excluding Saturdays, Sundays and legal holidays, after signing and receiving the documents (since July 1, 2025; older books: 3 business days).","u":"days","ctx":"s. 718.503","cond":"Both rights end at closing.","exc":"","l":"L08-5","v":"V-08","conf":["N-082"],"aid":"15 developer · 7 resale · 10 timeshare · 3 HOA"},{"id":"N-082","s":"Timeshare cancellation","val":"Until midnight of the 10th calendar day after the later of signing or receiving the last required document; cannot be waived","u":"days","ctx":"","cond":"","exc":"","l":"L08-5","v":"V-64","conf":["N-081"],"aid":""},{"id":"N-083","s":"HOA disclosure summary","val":"Buyer may void the contract within 3 days after receiving the summary or before closing, whichever occurs first","u":"days","ctx":"s. 720.401. Applies when the summary was not given before the contract was signed.","cond":"","exc":"Not waivable; ends at closing. Not for condominiums, co-ops or timeshares.","l":"L08-5","v":"V-65","conf":["N-081"],"aid":""},{"id":"N-090","s":"Adverse possession (Florida)","val":"7 years of continuous possession, either under color of title (recorded written instrument) or without color of title if the possessor pays the taxes within 1 year of entering and files a return with the property appraiser within 30 days after paying","u":"years","ctx":"Possession must also be open, notorious, continuous and hostile.","cond":"","exc":"","l":"L09-1","v":"V-68","conf":["N-091"],"aid":"7 to own it."},{"id":"N-091","s":"Easement by prescription (Florida)","val":"20 years of open, continuous, adverse use","u":"years","ctx":"Florida case law; no statute sets this period.","cond":"","exc":"","l":"L09-4","v":"V-69","conf":["N-090"],"aid":"20 to use it."},{"id":"N-092","s":"Deed witnesses","val":"Grantor signs in the presence of 2 witnesses","u":"witnesses","ctx":"s. 689.01","cond":"Notary acknowledgment needed for recording, not validity.","exc":"Leases: no witnesses required (V-05).","l":"L09-2","v":"V-05","conf":[],"aid":""},{"id":"N-100","s":"Township","val":"6 miles × 6 miles = 36 square miles = 36 sections","u":"miles","ctx":"Government survey.","cond":"","exc":"","l":"L10-2","v":"V-26","conf":["N-101"],"aid":""},{"id":"N-101","s":"Section","val":"1 mile × 1 mile = 1 square mile = 640 acres","u":"acres","ctx":"Numbered 1–36 starting in the northeast corner, serpentine.","cond":"","exc":"","l":"L10-2","v":"V-26","conf":["N-100"],"aid":"640 in a section."},{"id":"N-102","s":"Acre","val":"43,560 square feet","u":"sq ft","ctx":"","cond":"","exc":"","l":"L14-2","v":"V-26","conf":[],"aid":"≈ 4,047 m² — a bit smaller than a football pitch."},{"id":"N-103","s":"Mile","val":"5,280 feet","u":"ft","ctx":"","cond":"","exc":"","l":"L14-2","v":"V-26","conf":[],"aid":"≈ 1.609 km."},{"id":"N-104","s":"Square yard","val":"9 square feet (3 ft × 3 ft)","u":"sq ft","ctx":"Used for carpet, concrete.","cond":"","exc":"","l":"L14-2","v":"V-26","conf":[],"aid":""},{"id":"N-105","s":"Florida principal meridian and base line","val":"Intersect in Tallahassee","u":"","ctx":"","cond":"","exc":"","l":"L10-1","v":"V-26","conf":[],"aid":""},{"id":"N-110","s":"Statute of limitations (Florida)","val":"Written contract: 5 years. Oral contract: 4 years.","u":"years","ctx":"","cond":"","exc":"","l":"L11-1","v":"V-70","conf":[],"aid":"Written lasts longer: 5 > 4."},{"id":"N-111","s":"Statute of frauds","val":"Contracts for the sale of real property, and contracts not performable within 1 year, must be in writing and signed by the party to be charged","u":"","ctx":"","cond":"","exc":"Leases of 1 year or less may be oral.","l":"L11-1","v":"V-26","conf":[],"aid":""},{"id":"N-112","s":"Written listing agreement rules","val":"Definite expiration date; property description, price and terms, fee, principal's signature; no clause requiring the seller to give notice to cancel after expiration (no automatic renewal); copy to the person signing within 24 hours","u":"hours","ctx":"","cond":"","exc":"","l":"L11-3","v":"V-49","conf":[],"aid":""},{"id":"N-113","s":"Lead-based paint","val":"Housing built before 1978: disclose known lead paint and hazards, give the EPA pamphlet; buyers get a 10-day inspection opportunity (may be waived or changed in writing)","u":"","ctx":"Federal law; disclosure applies to sales and leases.","cond":"","exc":"Tenants get the disclosure but not the 10-day period.","l":"L19-2","v":"V-60","conf":["N-060"],"aid":""},{"id":"N-120","s":"Satisfaction of mortgage","val":"Lender records within 60 days of full payment","u":"days","ctx":"","cond":"","exc":"","l":"L12-1","v":"V-71","conf":[],"aid":""},{"id":"N-121","s":"Florida usury","val":"18% per year simple interest on loans of $500,000 or less; 25% on larger loans. Criminal usury: over 25% up to 45% = misdemeanor; over 45% = felony.","u":"%","ctx":"","cond":"","exc":"","l":"L12-3","v":"V-72","conf":[],"aid":""},{"id":"N-122","s":"Qualifying ratios (course convention)","val":"Conventional 28% housing / 36% total; FHA 31% / 43%","u":"%","ctx":"Gross monthly income; PITI.","cond":"Teaching benchmarks, not statutes.","exc":"","l":"L12-3","v":"V-26","conf":[],"aid":""},{"id":"N-123","s":"PMI trigger (conventional)","val":"Required when LTV is above 80%","u":"%","ctx":"","cond":"","exc":"","l":"L13-1","v":"V-26","conf":[],"aid":""},{"id":"N-124","s":"FHA minimum down payment","val":"3.5% (with qualifying credit)","u":"%","ctx":"","cond":"","exc":"","l":"L13-1","v":"V-26","conf":[],"aid":""},{"id":"N-125","s":"Discount point","val":"1 point = 1% of the loan amount; each point raises the lender's yield by about 1/8%","u":"%","ctx":"","cond":"1/8% is a rule of thumb used in the course.","exc":"","l":"L13-3","v":"V-26","conf":[],"aid":""},{"id":"N-126","s":"Reverse mortgage age","val":"62 or older","u":"years","ctx":"","cond":"","exc":"","l":"L13-2","v":"V-26","conf":[],"aid":""},{"id":"N-130","s":"Documentary stamp tax on deeds","val":"$0.70 per $100 or portion thereof of total consideration (round UP to the next $100); Miami-Dade: $0.60 per $100 for single-family residences, other property $0.60 + $0.45 surtax","u":"$ per $100","ctx":"Customarily paid by the seller; based on full price including any mortgage assumed.","cond":"","exc":"","l":"L14-6","v":"V-18","conf":["N-131","N-132"],"aid":"Deed 70, note 35, intangible 2 mills."},{"id":"N-131","s":"Documentary stamp tax on notes","val":"$0.35 per $100 or portion thereof","u":"$ per $100","ctx":"Customarily paid by the buyer. Applies to new and assumed mortgages (Florida DOR, V-25).","cond":"","exc":"","l":"L14-6","v":"V-18","conf":["N-130","N-132"],"aid":""},{"id":"N-132","s":"Nonrecurring intangible tax","val":"2 mills (0.002) × the amount of the NEW mortgage; no rounding","u":"mills","ctx":"Customarily paid by the buyer.","cond":"","exc":"Not due again on an assumed mortgage when it was paid originally and the debt is unchanged (s. 199.145(3), V-25).","l":"L14-6","v":"V-19","conf":["N-131"],"aid":""},{"id":"N-133","s":"Proration conventions (Florida course)","val":"365-day year (actual days in each month); the buyer is responsible for the day of closing","u":"","ctx":"","cond":"Follow the question if it states another method. No statute or rule sets these; they come from the contract and the course.","exc":"","l":"L14-7","v":"V-79","conf":[],"aid":""},{"id":"N-140","s":"Homestead tax exemptions","val":"First $25,000 of assessed value: all taxes. Additional up to $25,000 (CPI-indexed since 2025: $25,722 for 2025) on assessed value above $50,000: non-school taxes only.","u":"$","ctx":"","cond":"Must own and occupy as permanent residence on January 1.","exc":"","l":"L18-2","v":"V-09","conf":["N-141"],"aid":""},{"id":"N-141","s":"Widow/widower, blind, totally and permanently disabled exemption","val":"$5,000","u":"$","ctx":"s. 196.202","cond":"Florida resident.","exc":"Older books: $500.","l":"L18-2","v":"V-10","conf":["N-140"],"aid":""},{"id":"N-142","s":"Save Our Homes cap","val":"Assessed value of a homestead rises no more than 3% per year or the CPI change, whichever is less; portability: up to $500,000 of the benefit moves to a new Florida homestead established within 3 years","u":"%","ctx":"","cond":"","exc":"Resets to just value on change of ownership. November 2026 ballot measure may change it from 2027 (V-23).","l":"L18-2","v":"V-67","conf":[],"aid":""},{"id":"N-143","s":"Property tax calendar","val":"Assessment date January 1; TRIM notice within 55 days after certification (usually August); due November 1 with discounts of 4% (Nov), 3% (Dec), 2% (Jan), 1% (Feb); delinquent April 1 (or 60 days after the bill was mailed, if later)","u":"","ctx":"","cond":"","exc":"","l":"L18-1","v":"V-76","conf":[],"aid":""},{"id":"N-144","s":"Mill","val":"1 mill = $1 per $1,000 of taxable value = 0.001","u":"","ctx":"","cond":"","exc":"","l":"L18-2","v":"V-26","conf":["N-132"],"aid":""},{"id":"N-145","s":"Depreciation (cost recovery)","val":"Residential rental: 27.5 years. Nonresidential: 39 years. Land never depreciates.","u":"years","ctx":"Straight-line.","cond":"","exc":"","l":"L18-3","v":"V-77","conf":[],"aid":""},{"id":"N-146","s":"Principal residence gain exclusion","val":"$250,000 single; $500,000 married filing jointly; owned and used as main home 2 of the last 5 years","u":"$","ctx":"","cond":"Generally not available if the exclusion was used on another home sold within the previous 2 years.","exc":"","l":"L18-3","v":"V-78","conf":[],"aid":""}],"comparisons":[{"id":"PT-01","concept":"Who must hold the license","l":["L01-1","L02-1"],"pt":"Under Lei n.º 15/2013, carrying on real estate mediation as a business requires a license from IMPIC, I.P. The license is held by the mediation business (a company or an individual entrepreneur). Consultants who work inside a licensed agency usually operate under the agency's license.","fl":"Every individual who performs a real estate service for another for compensation must personally hold a Florida license (sales associate or broker), unless an exemption in s. 475.011 applies. A sales associate's license is only usable while registered under one employing broker.","diff":"Florida licenses the person, not only the firm. A consultant who would work under an agency's license in Portugal needs their own license in Florida, and it is inactive until a broker employs them.","ex":"Ana moves from a Lisbon agency to Miami. In Lisbon she showed homes under her agency's AMI license. In Miami she may not show a listing for a commission until she has passed the exam, been issued a license and been registered with a broker.","exam":"Any answer that lets an unlicensed employee earn per-deal pay for showing, negotiating or listing is wrong. Unlicensed practice is a third-degree felony.","aid":"Portugal licenses the agency; Florida licenses each person.","pq":"A licensed Florida brokerage hires an unlicensed assistant and pays $150 for every buyer she shows a home to. Lawful?","pa":"No. Showing property for compensation per transaction is a real estate service for another for compensation; she needs a license. A salary for clerical work only would be lawful.","ptv":"Partly verified: IMPIC licensing requirement for individual or corporate providers (impic.pt; Lei 15/2013). How consultants inside agencies operate: requires verification."},{"id":"PT-02","concept":"The regulator","l":["L01-1","L03-1"],"pt":"IMPIC, I.P. (Instituto dos Mercados Públicos, do Imobiliário e da Construção) licenses and supervises mediation businesses and approves standard mediation contract models.","fl":"Two bodies share the work. The Florida Real Estate Commission (FREC, 7 members) makes rules (Chapter 61J2, F.A.C.) and disciplines licensees. The Department of Business and Professional Regulation (DBPR) processes applications, issues licenses and investigates complaints. Courts handle crimes and civil damages.","diff":"Florida splits rulemaking/discipline (FREC) from administration/investigation (DBPR). Exam questions test which body does what.","ex":"A buyer complains that a sales associate kept part of a deposit. DBPR investigates; a FREC probable-cause panel decides whether to proceed; FREC issues the final order; only a court can order jail or damages.","exam":"'Which body investigates?' → DBPR. 'Which body suspends or revokes?' → FREC. 'Which body imprisons?' → a court.","aid":"DBPR digs, FREC decides, courts jail.","pq":"Who issues a Florida real estate license, and who may revoke it?","pa":"The DBPR issues it; the FREC may revoke it (after due process).","ptv":"verified: impic.pt (licensing, model contracts)"},{"id":"PT-03","concept":"Entry requirements: education and exam","l":["L02-3","L03-3"],"pt":"IMPIC's listed requirements for a mediation license are commercial good standing (idoneidade comercial) and civil liability insurance (or equivalent guarantee), plus fees. No state exam or minimum course hours appear in the requirements.","fl":"Sales associate: 63-hour course, state exam (75/100), fingerprints and background check, then 45 hours of post-license education before the first renewal and 14 hours of CE every 2 years after.","diff":"Florida has a full education-and-exam pathway with deadlines that can void the license. Portugal's entry test is good standing and insurance.","ex":"A Portuguese agency owner with 15 years' experience still has to complete the 63-hour Florida course and pass the exam; experience abroad does not replace it (mutual recognition covers only certain US states).","exam":"Know 63 / 45 / 14 and which deadline voids (post-license) versus which inactivates (CE).","aid":"63 to enter, 45 to stay, 14 to keep.","pq":"A licensee misses the 45-hour post-license course before the first renewal. Result?","pa":"The license becomes null and void; to practice again they must requalify from the 63-hour course and exam.","ptv":"verified: impic.pt licensing requirements page"},{"id":"PT-04","concept":"Representing both sides","l":["L04-1","L04-2"],"pt":"In Portuguese practice an agency often deals with both seller and buyer in the same sale while the mediation contract is signed with one client. The exact statutory duties toward the non-client party require verification.","fl":"Florida allows three relationships: single agent, transaction broker (presumed by default), or no brokerage relationship. A brokerage may NOT be a single agent for both buyer and seller in the same transaction (dual agency is illegal). The lawful way to work both sides is as a transaction broker to both.","diff":"Florida names and defines the relationship and its duties by statute (3/7/9 duties). 'Representing both sides' as a fiduciary is unlawful.","ex":"Your brokerage lists a condo as single agent for the seller. Your own buyer client wants it. Before continuing, the seller must sign a Consent to Transition to Transaction Broker; you then act as transaction broker for both.","exam":"Any answer choice with 'dual agent' is wrong. 'Unless otherwise established in writing, a licensee is presumed to be a transaction broker.'","aid":"Florida: no dual agency — transition to transaction broker.","pq":"A Florida broker acts as single agent for a seller and wants to work with a buyer on the same property. What is required?","pa":"The seller's written consent to transition to transaction broker before the change; the broker then acts as transaction broker for both parties.","ptv":"requires verification"},{"id":"PT-05","concept":"Listing / mediation contract form","l":["L11-3"],"pt":"The contrato de mediação imobiliária must be in writing; missing mandatory content makes it null, and the mediation company cannot invoke that nullity. Mediation contract models with general clauses need IMPIC approval or must follow the official model (Portaria n.º 228/2018).","fl":"A listing agreement is an employment contract between seller and BROKERAGE. Florida written listings must have a definite expiration date, may not renew automatically, and a copy must be given to the person signing within 24 hours. Listing types: open, exclusive agency, exclusive right of sale (and net).","diff":"Florida's rules focus on expiration, no auto-renewal, the 24-hour copy, and the commission consequences of the listing type.","ex":"A seller signs an exclusive-agency listing with your brokerage and then sells to her neighbour without help. No commission is due. Under an exclusive-right-of-sale listing it would be.","exam":"Know which listing type pays when the owner finds the buyer: exclusive right of sale → yes; exclusive agency → no; open → only the procuring broker.","aid":"RIGHT of sale = paid regardless. AGENCY = owner keeps the right to sell free.","pq":"Which three requirements apply to every written listing in Florida?","pa":"A definite expiration date; no automatic renewal clause; a copy delivered to the person signing within 24 hours.","ptv":"verified: Lei 15/2013 art. 16 (written form, nullity, model approval) via diariodarepublica.pt / impic.pt"},{"id":"PT-06","concept":"When the commission is earned","l":["L11-3","L05-4"],"pt":"Remuneration is due on the conclusion and perfection of the deal the mediation aimed at; under exclusivity it remains due if the deal fails for reasons attributable to the client (Lei 15/2013, art. 19). Courts require a causal link between the mediator's activity and the deal.","fl":"Commission terms come from the listing contract. Under exclusive right of sale the brokerage earns the fee whoever sells; under an open listing only the procuring cause earns it. A sales associate may be paid only by their employing broker.","diff":"In Florida the payment path is fixed by law: seller → brokerage → associate. An associate can never accept payment directly from a customer.","ex":"A grateful seller hands the sales associate a $500 gift card at closing. That is a violation unless it goes through the broker.","exam":"'Associate accepted payment from the seller/another broker' → violation. Commission rates are negotiable; a 'standard rate' suggests price fixing.","aid":"Money flows through the broker.","pq":"May a Florida sales associate sue the buyer directly for an unpaid commission?","pa":"No. The associate's claim is against the employing broker; only the broker can sue the party who owes the brokerage fee.","ptv":"verified: Lei 15/2013 art. 19; STJ 2019 decision on causal link (diariodarepublica.pt)"},{"id":"PT-07","concept":"Deposits and earnest money","l":["L05-1","L05-2","L11-2"],"pt":"A deposit paid on a contrato-promessa is presumed to be 'sinal'. Under Código Civil art. 442: if the payer defaults, the other party keeps it; if the recipient defaults, the payer can demand double. Who holds the money in practice requires verification.","fl":"Earnest money (binder) is normally held in ESCROW by the broker, a title company or an attorney. Strict clocks apply: associate to broker by end of next business day; broker deposits by end of the third business day. On a dispute the broker follows the conflicting-demand procedures. Contracts often treat the deposit as liquidated damages if the buyer defaults.","diff":"There is no automatic 'return double' rule in Florida exam content. The focus is on escrow handling and deadlines.","ex":"Buyer gives your associate a $20,000 check on Friday. Associate must deliver it to the broker by end of Monday; broker must deposit it by end of Wednesday (no holidays).","exam":"Count BUSINESS days. Do not apply the double-deposit rule.","aid":"Sinal doubles in Portugal; escrow clocks run in Florida.","pq":"The buyer defaults on a Florida contract. Does the seller receive double the deposit?","pa":"No. The seller's remedy depends on the contract (often the deposit as liquidated damages). The broker releases escrowed funds only per the contract, written agreement, or a settlement procedure.","ptv":"verified: Código Civil art. 442 (diariodarepublica.pt)"},{"id":"PT-08","concept":"Two-step (CPCV + escritura) vs one contract and a closing","l":["L11-2","L11-4"],"pt":"Typically a contrato-promessa de compra e venda (CPCV) is signed, then the final sale is formalized by escritura pública or documento particular autenticado and registered. Details require verification.","fl":"Buyer and seller sign one contract for sale and purchase (usually the FR/BAR form). The buyer gets equitable title. At closing the seller delivers a deed, which is then recorded.","diff":"The Florida sale contract is itself the binding purchase agreement. No second 'promise' document exists, and a notary is not what makes the deed valid.","ex":"After both parties initial the final counteroffer, the effective date starts the inspection and financing deadlines. 'Time is of the essence' makes each deadline strict.","exam":"Buyer under contract holds equitable title; legal title passes at closing by delivery and acceptance of the deed.","aid":"Contract → equitable title. Deed delivered → legal title.","pq":"What does a buyer hold between contract and closing?","pa":"Equitable title.","ptv":"requires verification"},{"id":"PT-09","concept":"Transfer taxes","l":["L14-6"],"pt":"The buyer pays IMT (progressive, on the higher of price and taxable property value) and Imposto do Selo at 0.8%. Young buyers up to 35 have exemptions up to set limits (330,539 € in 2026 tables for full exemption). Decreto-Lei n.º 97/2026 sets a 7.5% IMT rate for non-residents buying housing, with exceptions.","fl":"Documentary stamp tax on the DEED: $0.70 per $100 (Miami-Dade single-family $0.60), customarily the SELLER's cost. Note stamps ($0.35 per $100) and intangible tax (2 mills on new mortgages) are the buyer's costs when financing.","diff":"Florida's main transfer tax on the deed is customarily the seller's. Florida's rates are flat per $100 and rounded UP to the next $100, with no progressive brackets.","ex":"$350,050 sale in Orange County: round up to $350,100 → 3,501 × $0.70 = $2,450.70 deed stamps, normally charged to the seller.","exam":"Round up to the next $100 for stamps. Intangible tax only on NEW money.","aid":"Seller pays 70 on the deed; buyer pays 35 + 2 mills on the loan.","pq":"Who customarily pays deed stamps in Florida, and on what amount?","pa":"The seller, on the full purchase price (including any mortgage assumed), at $0.70 per $100 or portion.","ptv":"verified: Portal das Finanças (IMT tables 2026, IS 0.8%); Decreto-Lei 97/2026"},{"id":"PT-10","concept":"Annual property tax","l":["L18-1","L18-2"],"pt":"IMI is an annual municipal tax on the registered taxable value (VPT). Rates and exemptions require verification.","fl":"Ad valorem tax: the county property appraiser sets just value as of January 1; taxing authorities set millage. Homestead owners get exemptions ($25,000 + up to $25,000 non-school) and the Save Our Homes cap (3% or CPI). Bills mail November 1 with discounts; delinquent April 1.","diff":"Florida taxes are computed in mills on taxable value after exemptions, and school vs non-school values can differ.","ex":"Assessed $300,000, homestead: school taxable $275,000; non-school taxable $250,000 (using round $25,000 figures).","exam":"1 mill = $1 per $1,000. Run school and non-school separately when exemptions differ.","aid":"Mills × taxable ÷ 1,000.","pq":"Why can a homestead's school taxable value be higher than its non-school taxable value?","pa":"The additional homestead exemption applies only to non-school levies.","ptv":"requires verification"},{"id":"PT-11","concept":"Proving ownership: registry vs title insurance","l":["L09-3"],"pt":"Ownership and charges are recorded in the land registry (registo predial). The degree of protection the registry gives a buyer requires verification.","fl":"Documents are recorded in county public records, which give constructive notice. Buyers prove marketable title with an abstract plus attorney's opinion or, usually, title insurance (owner's policy for the price; lender's policy for the loan).","diff":"Title insurance is a central product in Florida; the exam tests owner's vs lender's policy and what is covered (past defects, not future ones).","ex":"A forged deed from 2015 surfaces after closing. The owner's title policy covers the loss; a lien the new owner creates in 2027 is not covered.","exam":"Recording protects against third parties; it is not required for a deed to be valid.","aid":"Record to warn the world; insure against the past.","pq":"Is recording required for a Florida deed to be valid between grantor and grantee?","pa":"No. Delivery and acceptance make it valid; recording gives constructive notice to the world.","ptv":"requires verification"},{"id":"PT-12","concept":"Deeds and warranties","l":["L09-2"],"pt":"The sale is formalized in a public deed or authenticated private document. Portuguese practice does not use graded 'warranty deed' types (requires verification).","fl":"Deed types are ranked by the warranties the grantor gives: general warranty (all time), special warranty (grantor's ownership period), bargain and sale (implied ownership, no warranties), quitclaim (no warranties). A valid Florida deed needs the grantor's signature before two witnesses and delivery/acceptance.","diff":"Florida deeds carry warranty levels; two witnesses are a validity requirement for deeds.","ex":"To clear an ex-spouse's possible interest from title, the ex-spouse signs a quitclaim deed.","exam":"Grantee does not sign. Notary acknowledgment is for recording.","aid":"General > special > bargain & sale > quitclaim.","pq":"Which deed best cures a cloud on title?","pa":"A quitclaim deed.","ptv":"requires verification"},{"id":"PT-13","concept":"Co-ownership and married couples","l":["L08-3"],"pt":"Co-ownership (compropriedade) and the spouses' property regime (e.g., comunhão de adquiridos) govern shared ownership. Details require verification.","fl":"Florida is NOT a community-property state. Co-owners hold as tenants in common (default for unmarried co-owners), joint tenants with right of survivorship (needs express language), or tenants by the entireties (married couples; presumed for a deed to spouses).","diff":"Survivorship and creditor protection depend on the deed form and marital status, not on a marital property regime.","ex":"Two unmarried friends buy a duplex with a deed that says nothing about survivorship. One dies; her share goes to her heirs, not to the friend.","exam":"Married + silent deed → entireties. Unmarried + silent → tenancy in common.","aid":"Married = entireties; strangers = in common.","pq":"A married couple takes title 'John and Mary Smith, husband and wife'. John dies. Who owns the property?","pa":"Mary, automatically, by survivorship under tenancy by the entireties.","ptv":"requires verification"},{"id":"PT-14","concept":"Condominium vs propriedade horizontal; cooperatives","l":["L08-5"],"pt":"Apartment buildings are commonly divided under propriedade horizontal (fractions with common parts). Requires verification.","fl":"A condominium is created by recording a declaration; the owner holds the unit in fee simple plus an undivided share of common elements (real property). A cooperative is different: a corporation owns the building and the buyer holds shares plus a proprietary lease, which is personal property.","diff":"The cooperative form, where the buyer owns shares and not real estate, is unfamiliar to a Portuguese professional and is tested.","ex":"A buyer of a Miami Beach co-op unit gets a stock certificate and a proprietary lease, and the board must approve the sale.","exam":"Co-op = personal property. Condo developer sale: 15-day cancellation.","aid":"Condo = deed; co-op = shares + lease.","pq":"Which buyer owns real property: the condo buyer or the co-op buyer?","pa":"The condo buyer.","ptv":"requires verification"},{"id":"PT-15","concept":"Life estate vs usufruto","l":["L08-1"],"pt":"Usufruto gives the right to use and enjoy property belonging to another for a period, often for life. Requires verification.","fl":"A life estate is an ownership estate measured by a life. The life tenant may use, lease or sell the life interest, must pay taxes and avoid waste; at death the property passes by remainder (to a third party) or reversion (back to the grantor or heirs).","diff":"Florida vocabulary: life tenant, remainderman, reversion, waste, 'pur autre vie' (measured by another person's life).","ex":"Mother deeds her home to her son but keeps a life estate. She may live there or lease it; when she dies the son (remainderman) owns it outright.","exam":"If the property returns to the grantor it is a reversion; to someone else, a remainder.","aid":"Remainder goes forward; reversion comes back.","pq":"A life tenant leases the property for 10 years and dies after 2. What happens to the lease?","pa":"It ends at the life tenant's death; the life tenant could only convey what she had.","ptv":"requires verification"},{"id":"PT-16","concept":"Family home protection","l":["L08-4"],"pt":"Disposing of the family home (casa de morada de família) generally needs both spouses' consent. Requires verification.","fl":"Florida homestead has three separate meanings: (1) protection from forced sale by most creditors (1/2 acre in a city, 160 acres outside); (2) restrictions on devise when a spouse or minor child survives, and the spouse must join in deeds and mortgages; (3) a property-tax exemption.","diff":"Creditor protection is unusually strong in Florida but does not stop property taxes, the home's own mortgage, or construction liens for work on the home.","ex":"A judgment creditor of a Tampa homeowner cannot force the sale of the 0.3-acre homestead; the bank holding the mortgage on that same home can foreclose.","exam":"Keep creditor protection separate from the tax exemption.","aid":"Homestead: shield, family lock, tax break — three different rules.","pq":"Which creditor can force the sale of a Florida homestead: a credit-card judgment creditor or the county for unpaid property taxes?","pa":"The county for unpaid property taxes.","ptv":"requires verification"},{"id":"PT-17","concept":"Units of measurement","l":["L14-2","L10-2"],"pt":"Metric system: m², hectares (1 ha = 10,000 m²).","fl":"US customary units: feet, square feet, acres (43,560 sq ft), miles (5,280 ft), square yards (9 sq ft). Exam math never uses metric.","diff":"Convert your intuition: 1 acre ≈ 4,047 m² ≈ 0.405 ha; 1 sq ft ≈ 0.0929 m²; 1,000 sq ft ≈ 93 m²; 1 mile ≈ 1.61 km.","ex":"A 2,000 sq ft Florida house is about 186 m² — a large T4 in Portuguese terms.","exam":"Work in feet and acres. Front feet = the frontage dimension (the first number given).","aid":"Acre = 43,560 (think 43-5-60). Mile = 5,280 ('five tomatoes': 5-2-80).","pq":"How many acres is a 435,600 sq ft parcel?","pa":"10 acres (435,600 ÷ 43,560).","ptv":"verified: arithmetic (1 ft = 0.3048 m exactly)"},{"id":"PT-18","concept":"Mortgage affordability","l":["L12-3"],"pt":"Banks apply a debt-service-to-income limit (taxa de esforço) on NET income under Banco de Portugal macroprudential measures. Your own Drive guide states the limit was lowered from 50% to 45% in May 2026; that figure requires verification.","fl":"Exam convention: ratios use GROSS monthly income. Housing ratio = PITI ÷ gross income (conventional 28%); total ratio = (PITI + recurring debt) ÷ gross income (36%); FHA 31/43.","diff":"Gross vs net income is the trap. PITI includes taxes and insurance.","ex":"Gross $8,000/month, PITI $2,200, car $500: housing 27.5%, total 33.75% — qualifies conventionally.","exam":"Use gross income; include taxes and insurance in PITI.","aid":"Florida divides by GROSS.","pq":"Which income figure do qualifying ratios use?","pa":"Gross monthly income.","ptv":"requires verification (user's guide_casa_portugal, June 2026)"},{"id":"PT-19","concept":"Foreclosure","l":["L12-2"],"pt":"A lender enforces a mortgage (hipoteca) through court enforcement proceedings (execução). Requires verification.","fl":"Florida foreclosure is judicial. The borrower may redeem by paying in full until the foreclosure sale (equity of redemption); there is no statutory right of redemption after the sale. Deficiency judgments are possible against personally liable parties.","diff":"The exam tests the end point of redemption (the sale) and the deed-in-lieu trap (junior liens survive).","ex":"A borrower offers full payment one day after the courthouse auction. Too late in Florida.","exam":"No post-sale redemption in Florida.","aid":"Redeem before the gavel.","pq":"Does a deed in lieu of foreclosure wipe out a second mortgage?","pa":"No. The lender takes title subject to junior liens; only foreclosure can eliminate them.","ptv":"requires verification"},{"id":"PT-20","concept":"Anti-discrimination in housing","l":["L07-1"],"pt":"Portuguese law prohibits discrimination generally (constitutional equality and specific anti-discrimination legislation). Details require verification.","fl":"The exam tests the US federal list: 1866 Civil Rights Act (race, no exceptions); Fair Housing Act (race, color, religion, national origin, sex, familial status, handicap); named practices (steering, blockbusting, redlining); exemptions and how they are lost. Florida's Fair Housing Act mirrors the federal one (details not verified in this session).","diff":"US law uses a precise list of protected classes and named practices. Exam answers depend on exact categories and exemption conditions.","ex":"Showing a buyer from Brazil only homes in 'neighbourhoods with Brazilian families' is steering on national origin, even if the buyer seems pleased.","exam":"No exemption ever for race.","aid":"Steer = guide buyers; block = scare sellers; red = lenders' map.","pq":"A landlord with a 4-unit building who lives in one unit refuses to rent to a family with children and uses no broker or ads. Which exemption might apply?","pa":"The 'Mrs. Murphy' owner-occupied (≤4 units) exemption under the federal FHA — but never for race, and lost if a broker or discriminatory ad is used.","ptv":"requires verification"},{"id":"PT-21","concept":"Advertising","l":["L05-3"],"pt":"Mediation advertising is regulated (license identification in ads requires verification).","fl":"Every advertisement must include the brokerage's registered name. An ad without it is a blind ad, in any medium, including social media. A sales associate's name must be as registered with DBPR; teams may not appear to be a separate brokerage.","diff":"The required element is the BROKERAGE NAME (not a license number). Personal social-media ads by associates are included.","ex":"An associate posts 'Just listed — DM me!' on Instagram with her own name only. Blind ad.","exam":"Owners advertising their own property need no brokerage name.","aid":"No firm name = blind ad.","pq":"Does a sales associate's personal Facebook ad for a listing need the brokerage name?","pa":"Yes.","ptv":"requires verification"},{"id":"PT-22","concept":"Residential leases","l":["L07-4","L08-2"],"pt":"Urban leases are governed by the Civil Code and the NRAU; written form and registration requirements require verification.","fl":"A lease of 1 year or less may be oral; longer leases must be written (statute of frauds) but no longer need witnesses (s. 689.01, V-05). Notices to end tenancies without a specific term: 60/30/30/7 days. Deposit rules: 30-day notice of how held; 15/30/15 at move-out.","diff":"Specific Florida day-counts are tested; Portuguese notice periods must not be transferred.","ex":"A month-to-month tenant in Orlando must receive written notice at least 30 days before the end of a monthly period.","exam":"Use current s. 83.57 periods.","aid":"60 / 30 / 30 / 7.","pq":"How much notice ends a quarter-to-quarter tenancy without a specific term?","pa":"At least 30 days before the end of the quarter.","ptv":"requires verification"},{"id":"PT-23","concept":"Energy disclosures","l":["L11-4"],"pt":"An energy certificate (certificado energético) is required to sell or rent; requires verification.","fl":"Florida requires that buyers of a building receive information about the option of an energy-efficiency rating at or before contract — information, not a property rating (s. 553.996; older books call it a 'brochure').","diff":"Florida's requirement is information about an optional rating, not a rating of the specific property.","ex":"The FR/BAR contract includes a clause acknowledging receipt of the energy-efficiency information.","exam":"Required for sales of buildings for occupancy.","aid":"Florida: information, not certificate.","pq":"Is a Florida seller required to obtain an energy rating of the home before listing?","pa":"No. The requirement is to give the buyer the energy-efficiency rating information at or before contract.","ptv":"requires verification"}],"glossary":[{"term":"Florida Statutes (F.S.)","def":"Laws passed by the Florida Legislature, organized by chapter and section (e.g., s. 475.25).","l":"L01-1","note":""},{"term":"Chapter 475, F.S.","def":"Florida's real estate license law: brokers, sales associates, schools, appraisers (Part II).","l":"L01-1","note":""},{"term":"Chapter 455, F.S.","def":"General law for all professions regulated by the DBPR (applications, investigations, discipline procedures).","l":"L01-1","note":""},{"term":"Florida Administrative Code (F.A.C.)","def":"Rules adopted by state agencies under authority given by a statute. FREC's rules are Chapter 61J2.","l":"L01-1","note":"A rule has the force of law but must stay within its statute."},{"term":"Rule 61J2","def":"The FREC's rule chapter in the Florida Administrative Code (escrow, advertising, education, offices).","l":"L01-1","note":""},{"term":"Case law","def":"Law made by court decisions that interpret statutes or develop common law; e.g., Johnson v. Davis (seller must disclose known latent defects).","l":"L01-1","note":"Florida (like most of the US) is a common-law system; Portugal is a civil-law system."},{"term":"Common law","def":"Legal rules developed by courts over time, rather than written in a code.","l":"L01-1","note":""},{"term":"FREC","def":"Florida Real Estate Commission: 7 members appointed by the Governor; makes rules and disciplines licensees.","l":"L01-1","note":""},{"term":"DBPR","def":"Florida Department of Business and Professional Regulation; its Division of Real Estate provides FREC's administrative services, issues licenses and investigates complaints.","l":"L01-1","note":""},{"term":"Real estate","def":"Land plus everything permanently attached to it (improvements), and the rights that go with ownership.","l":"L01-2","note":""},{"term":"Real property","def":"Real estate together with the bundle of legal rights of ownership.","l":"L01-2","note":""},{"term":"Personal property","def":"Movable items not attached to land (chattels); co-op shares are personal property.","l":"L01-2","note":""},{"term":"REALTOR®","def":"A registered trademark identifying members of the National Association of REALTORS® (NAR), who agree to its Code of Ethics.","l":"L01-2","note":"Not a license. A licensee need not be a REALTOR®."},{"term":"NAR","def":"National Association of REALTORS®, the largest US trade association for real estate professionals.","l":"L01-2","note":""},{"term":"Realtist","def":"Member of the National Association of Real Estate Brokers (NAREB).","l":"L01-2","note":""},{"term":"Property management","def":"Specialty of managing property for owners: leasing, rent collection, maintenance.","l":"L01-2","note":""},{"term":"Special-purpose property","def":"Property with a unique use, such as churches, schools, hospitals.","l":"L01-2","note":""},{"term":"Sales associate","def":"Person licensed to perform real estate services for compensation, but only under the direction of an employing broker or owner-developer.","l":"L02-1","note":"Florida term for what other states call a salesperson."},{"term":"Broker","def":"Person licensed to perform real estate services for others for compensation in their own name; may open an office and hold escrow.","l":"L02-1","note":""},{"term":"Broker associate","def":"A person with a broker license who chooses to work under another broker.","l":"L03-2","note":""},{"term":"Compensation","def":"Anything of value — money, gifts, property — paid or promised, or even expected, for a real estate service.","l":"L02-1","note":""},{"term":"Attorney in fact","def":"Person authorized by a power of attorney to sign for another; exempt only for executing contracts or conveyances.","l":"L02-2","note":"Not the same as an attorney at law (lawyer)."},{"term":"Nolo contendere","def":"Plea of 'no contest': the defendant does not admit guilt but accepts the penalty. Must be reported within 30 days like a guilty plea.","l":"L03-4","note":""},{"term":"Mutual recognition","def":"Agreement letting nonresident licensees of certain states obtain a Florida license by passing a 40-question Florida law exam.","l":"L02-3","note":"Not 'reciprocity' — the exam uses the precise term."},{"term":"Quasi-legislative","def":"Rule-making power exercised by an agency (FREC adopting 61J2 rules).","l":"L03-1","note":""},{"term":"Quasi-judicial","def":"Power of an agency to decide disputes and impose discipline (FREC final orders).","l":"L03-1","note":""},{"term":"Registration","def":"Recording a licensee's name, address, employer and status in DBPR records.","l":"L03-2","note":""},{"term":"Licensure","def":"DBPR's certification that a person has met the qualifications to hold a license.","l":"L03-2","note":""},{"term":"Group license","def":"Registration allowing a sales associate to work for several connected entities of one owner-developer.","l":"L03-2","note":""},{"term":"Multiple licenses","def":"Separate licenses a BROKER may hold for separate, unconnected brokerages.","l":"L03-2","note":"Sales associates cannot hold multiple licenses."},{"term":"Active license","def":"License whose holder is registered with an employing broker (or, for a broker, an office) and may practice.","l":"L03-3","note":""},{"term":"Voluntary inactive","def":"Status chosen by the licensee; may be renewed indefinitely with CE.","l":"L03-3","note":""},{"term":"Involuntary inactive","def":"Status caused by failure to renew; expires (void) after 2 years.","l":"L03-3","note":""},{"term":"Null and void","def":"The license has ceased to exist; the person must requalify.","l":"L03-3","note":""},{"term":"Ineffective license","def":"A license that exists but cannot be used, e.g., a sales associate with no employing broker.","l":"L03-4","note":""},{"term":"Post-licensing education","def":"45-hour course a sales associate must complete before the first renewal.","l":"L03-3","note":""},{"term":"Continuing education (CE)","def":"14 hours every 2-year renewal period after the first: 3 Core Law + 3 Ethics and Business Practices + 8 specialty.","l":"L03-3","note":""},{"term":"Transaction broker","def":"A licensee providing limited representation to a buyer, seller or both; not a fiduciary. Presumed in Florida.","l":"L04-1","note":""},{"term":"Single agent","def":"A broker who represents one party (the principal) as a fiduciary.","l":"L04-1","note":""},{"term":"No brokerage relationship","def":"A licensee works with a party without representing them; owes 3 duties.","l":"L04-1","note":""},{"term":"Dual agency","def":"Acting as fiduciary agent for both buyer and seller in one transaction; prohibited in Florida.","l":"L04-1","note":""},{"term":"Fiduciary","def":"A person in a relationship of trust who must put the principal's interests first.","l":"L04-1","note":""},{"term":"Principal","def":"The person a single agent represents.","l":"L04-1","note":""},{"term":"Customer","def":"A party a licensee works with but does not represent as a fiduciary.","l":"L04-1","note":""},{"term":"Limited confidentiality","def":"Transaction-broker duty not to reveal that the seller will accept less, the buyer will pay more, a party's motivation, or other information a party asks to keep confidential.","l":"L04-2","note":""},{"term":"Consent to Transition","def":"Signed consent of a principal allowing the single agent to become a transaction broker.","l":"L04-3","note":""},{"term":"Residential sale","def":"Sale of ≤4 residential units, unimproved land for ≤4 units, or agricultural property ≤10 acres.","l":"L04-3","note":""},{"term":"Material fact","def":"A fact that would affect a reasonable person's decision or the property's value.","l":"L04-4","note":""},{"term":"Latent defect","def":"A hidden defect not discoverable by ordinary inspection.","l":"L04-4","note":""},{"term":"Designated sales associate","def":"Associate appointed as single agent for one party in a nonresidential deal where each party has $1M+ in assets.","l":"L04-4","note":""},{"term":"Escrow (trust) account","def":"Account holding money belonging to others (deposits, rents).","l":"L05-1","note":""},{"term":"Earnest money / binder deposit","def":"Deposit a buyer gives to show good faith, usually held in escrow.","l":"L05-1","note":"Not the Portuguese 'sinal' — no automatic double-return rule."},{"term":"Commingling","def":"Mixing personal or business funds with escrow funds.","l":"L05-1","note":""},{"term":"Conversion","def":"Using escrow funds for personal or unauthorized purposes.","l":"L05-1","note":""},{"term":"Escrow Disbursement Order (EDO)","def":"Order from FREC deciding who receives disputed escrow funds held by a broker.","l":"L05-2","note":""},{"term":"Interpleader","def":"Lawsuit in which the broker deposits disputed funds with the court and asks it to decide who is entitled.","l":"L05-2","note":""},{"term":"Mediation","def":"Non-binding process with a neutral third party; requires all parties' written consent.","l":"L05-2","note":""},{"term":"Arbitration","def":"Binding decision by a neutral arbitrator; requires all parties' consent.","l":"L05-2","note":""},{"term":"Blind ad","def":"Advertisement that fails to include the brokerage's registered name.","l":"L05-3","note":""},{"term":"Kickback","def":"Payment for referring business; restricted by Chapter 475 and prohibited by RESPA in most residential financed deals.","l":"L05-4","note":""},{"term":"Price fixing","def":"Competitors agreeing on commission rates; illegal under antitrust law.","l":"L05-4","note":""},{"term":"Branch office","def":"Additional location where the broker conducts business; must be registered.","l":"L05-4","note":""},{"term":"Legally sufficient complaint","def":"A complaint alleging facts that, if true, would violate a statute or rule.","l":"L06-1","note":""},{"term":"Probable cause panel","def":"Panel that decides whether the investigation supports filing a formal complaint.","l":"L06-1","note":""},{"term":"Administrative law judge (ALJ)","def":"Judge from the Division of Administrative Hearings who conducts formal hearings and recommends an order.","l":"L06-1","note":""},{"term":"Final order","def":"FREC's decision on discipline.","l":"L06-1","note":""},{"term":"Citation","def":"Fixed fine for a listed minor violation, offered instead of formal proceedings.","l":"L06-2","note":""},{"term":"Notice of noncompliance","def":"Written notice for a first minor violation, letting the licensee correct it.","l":"L06-2","note":""},{"term":"Culpable negligence","def":"Reckless indifference to others' rights — more than simple carelessness.","l":"L06-2","note":""},{"term":"Misrepresentation","def":"False statement or concealment of a material fact.","l":"L06-2","note":""},{"term":"Real Estate Recovery Fund","def":"State fund that pays consumers who cannot collect a judgment against a licensee arising from a brokerage transaction.","l":"L06-3","note":""},{"term":"Steering","def":"Directing buyers or renters toward or away from areas based on a protected class.","l":"L07-1","note":""},{"term":"Blockbusting (panic peddling)","def":"Inducing owners to sell by suggesting a protected class is moving in.","l":"L07-1","note":""},{"term":"Redlining","def":"A lender refusing loans or changing terms in certain areas for discriminatory reasons.","l":"L07-1","note":""},{"term":"Familial status","def":"Households with children under 18, pregnant women, or people obtaining custody.","l":"L07-1","note":""},{"term":"Reasonable modification","def":"Physical change to a unit for a person with a disability, generally at the tenant's expense.","l":"L07-1","note":""},{"term":"Reasonable accommodation","def":"Change in rules or policies for a person with a disability (e.g., assistance animal despite a no-pets rule).","l":"L07-1","note":""},{"term":"RESPA","def":"Real Estate Settlement Procedures Act: closing disclosures and anti-kickback rules for federally related residential loans.","l":"L07-3","note":""},{"term":"TILA / Regulation Z","def":"Truth in Lending Act: disclosure of credit costs, APR, advertising trigger terms, right of rescission.","l":"L07-3","note":""},{"term":"APR","def":"Annual percentage rate: the yearly cost of credit including interest and certain fees.","l":"L07-3","note":""},{"term":"Trigger term","def":"Specific credit term in an ad (down payment amount, payment amount, number of payments, finance charge) that requires full disclosure.","l":"L07-3","note":""},{"term":"TRID","def":"TILA-RESPA Integrated Disclosure rule: Loan Estimate and Closing Disclosure.","l":"L07-3","note":""},{"term":"ECOA","def":"Equal Credit Opportunity Act: no credit discrimination by race, color, religion, national origin, sex, marital status, age (if able to contract), public assistance income, or good-faith exercise of consumer credit rights.","l":"L07-2","note":""},{"term":"ADA","def":"Americans with Disabilities Act: accessibility of public accommodations and commercial facilities.","l":"L07-2","note":""},{"term":"HMDA","def":"Home Mortgage Disclosure Act: lenders report lending data that reveals patterns like redlining.","l":"L07-2","note":""},{"term":"Bundle of rights","def":"Ownership rights: possession, control, enjoyment, exclusion, disposition.","l":"L08-1","note":""},{"term":"Freehold estate","def":"Ownership of indeterminate duration (fee simple, life estate).","l":"L08-1","note":""},{"term":"Fee simple absolute","def":"The most complete ownership, inheritable and unconditional.","l":"L08-1","note":""},{"term":"Fee simple defeasible","def":"Ownership that can be lost if a stated condition occurs or is breached.","l":"L08-1","note":""},{"term":"Life estate","def":"Ownership limited to the life of a person.","l":"L08-1","note":"Similar in purpose to usufruto, but a distinct legal form."},{"term":"Pur autre vie","def":"Life estate measured by the life of someone other than the life tenant.","l":"L08-1","note":""},{"term":"Remainder / remainderman","def":"Future interest passing to a third party when a life estate ends.","l":"L08-1","note":""},{"term":"Reversion","def":"Future interest returning to the grantor (or heirs) when a life estate ends.","l":"L08-1","note":""},{"term":"Waste","def":"Damage or neglect by a life tenant that harms the future interest.","l":"L08-1","note":""},{"term":"Leasehold (nonfreehold) estate","def":"Right of possession under a lease, without ownership.","l":"L08-2","note":""},{"term":"Estate for years","def":"Lease for a fixed term (any length); ends without notice.","l":"L08-2","note":""},{"term":"Periodic tenancy","def":"Lease renewing period to period (week, month, quarter, year) until notice.","l":"L08-2","note":""},{"term":"Tenancy at will","def":"Tenancy of indefinite duration terminable by proper notice.","l":"L08-2","note":""},{"term":"Tenancy at sufferance","def":"Holdover tenant who stays without the landlord's consent.","l":"L08-2","note":""},{"term":"Gross lease","def":"Tenant pays fixed rent; landlord pays operating expenses.","l":"L08-2","note":""},{"term":"Net lease","def":"Tenant pays rent plus some or all property expenses (triple net: taxes, insurance, maintenance).","l":"L08-2","note":""},{"term":"Percentage lease","def":"Rent includes a percentage of the tenant's gross sales, usually above a base rent.","l":"L08-2","note":""},{"term":"Ground lease","def":"Long-term lease of land on which the tenant builds.","l":"L08-2","note":""},{"term":"Assignment","def":"Transfer of the ENTIRE remaining lease term.","l":"L08-2","note":""},{"term":"Sublease","def":"Transfer of part of the remaining term or part of the space.","l":"L08-2","note":""},{"term":"Tenancy in common","def":"Co-ownership with undivided, possibly unequal shares and no survivorship.","l":"L08-3","note":""},{"term":"Joint tenancy with right of survivorship","def":"Co-ownership with the four unities; deceased owner's share passes to survivors.","l":"L08-3","note":""},{"term":"Tenancy by the entireties","def":"Ownership by a married couple as one unit; survivorship; protected from one spouse's creditors.","l":"L08-3","note":""},{"term":"PITT (four unities)","def":"Possession, Interest, Time, Title.","l":"L08-3","note":""},{"term":"Partition","def":"Court action to divide co-owned property or force its sale.","l":"L08-3","note":""},{"term":"Homestead","def":"A Florida owner's primary residence, with creditor protection, transfer restrictions, and tax exemption.","l":"L08-4","note":""},{"term":"Condominium","def":"Ownership of a unit in fee simple plus an undivided share of common elements, created by a recorded declaration.","l":"L08-5","note":""},{"term":"Common elements","def":"Parts of a condominium owned in common (lobby, pool, roof).","l":"L08-5","note":""},{"term":"Cooperative","def":"A corporation owns the building; residents own shares and hold proprietary leases (personal property).","l":"L08-5","note":""},{"term":"Proprietary lease","def":"Lease giving a co-op shareholder the right to occupy a unit.","l":"L08-5","note":""},{"term":"Timeshare","def":"Right to use a unit for a set period each year.","l":"L08-5","note":""},{"term":"HOA","def":"Homeowners' association: mandatory-membership community governed by recorded covenants.","l":"L08-5","note":""},{"term":"CDD","def":"Community Development District: special-purpose local government that finances community infrastructure through assessments.","l":"L08-5","note":""},{"term":"Title","def":"Ownership and the evidence of it.","l":"L09-1","note":""},{"term":"Escheat","def":"Property passing to the state when an owner dies without a will or heirs.","l":"L09-1","note":""},{"term":"Eminent domain","def":"Government's power to take private property for public use with just compensation (condemnation).","l":"L09-1","note":""},{"term":"Adverse possession","def":"Acquiring title by open, notorious, hostile, continuous possession for 7 years in Florida plus color of title or payment of taxes.","l":"L09-1","note":""},{"term":"Color of title","def":"A document that appears to give title but is defective.","l":"L09-1","note":""},{"term":"Testate / intestate","def":"Dying with / without a valid will.","l":"L09-1","note":""},{"term":"Devise / devisee","def":"Gift of real property by will / its recipient.","l":"L09-1","note":""},{"term":"Descent","def":"Transfer of an intestate's property to heirs under statute.","l":"L09-1","note":""},{"term":"Grantor / grantee","def":"The person conveying / receiving title by deed.","l":"L09-2","note":""},{"term":"General warranty deed","def":"Grantor warrants title against defects from any time.","l":"L09-2","note":""},{"term":"Special warranty deed","def":"Grantor warrants only against defects arising during their ownership.","l":"L09-2","note":""},{"term":"Bargain and sale deed","def":"Implies the grantor owns the property but gives no warranties.","l":"L09-2","note":""},{"term":"Quitclaim deed","def":"Conveys whatever interest the grantor has, with no warranties.","l":"L09-2","note":""},{"term":"Cloud on title","def":"A claim or defect that impairs title.","l":"L09-2","note":""},{"term":"Acknowledgment","def":"Formal declaration before a notary that the signer signed voluntarily; needed to record.","l":"L09-2","note":""},{"term":"Seisin","def":"Covenant that the grantor owns the property and has the right to convey it.","l":"L09-2","note":""},{"term":"Constructive notice","def":"Notice the law presumes from public records or visible possession.","l":"L09-3","note":""},{"term":"Actual notice","def":"What a person actually knows.","l":"L09-3","note":""},{"term":"Abstract of title","def":"Summary of all recorded documents affecting a property's title.","l":"L09-3","note":""},{"term":"Title insurance","def":"Policy protecting against losses from title defects existing before the policy date.","l":"L09-3","note":""},{"term":"Encumbrance","def":"Any claim or limitation on title (lien, easement, restriction, encroachment).","l":"L09-4","note":""},{"term":"Lien","def":"A claim against property as security for a debt.","l":"L09-4","note":""},{"term":"Specific lien","def":"Lien on one property (mortgage, property tax, construction lien).","l":"L09-4","note":""},{"term":"General lien","def":"Lien on all the debtor's property (judgment, IRS lien).","l":"L09-4","note":""},{"term":"Subordination","def":"A lienholder agreeing to a lower priority.","l":"L09-4","note":""},{"term":"Easement appurtenant","def":"Easement benefiting an adjoining parcel (dominant) over a burdened parcel (servient); runs with the land.","l":"L09-4","note":""},{"term":"Easement in gross","def":"Easement benefiting a person or company (e.g., utility), not a parcel.","l":"L09-4","note":""},{"term":"Easement by prescription","def":"Easement acquired by 20 years of open, continuous, adverse use in Florida.","l":"L09-4","note":""},{"term":"License (land use)","def":"Revocable personal permission to use land; not an interest in land.","l":"L09-4","note":"Different meaning from a real estate license."},{"term":"Encroachment","def":"A structure or improvement extending onto another's land.","l":"L09-4","note":""},{"term":"Deed restriction (restrictive covenant)","def":"Private limitation on use recorded in a deed or plat.","l":"L09-4","note":""},{"term":"Fixture","def":"Personal property attached to real property so that it becomes part of it.","l":"L09-5","note":""},{"term":"Trade fixture","def":"Item a business tenant installs for its trade; remains the tenant's personal property.","l":"L09-5","note":""},{"term":"Emblements","def":"Annual crops produced by labor; personal property.","l":"L09-5","note":""},{"term":"Riparian rights","def":"Rights of owners along rivers and streams.","l":"L09-5","note":""},{"term":"Littoral rights","def":"Rights of owners along oceans, seas and large lakes.","l":"L09-5","note":""},{"term":"Accretion / avulsion","def":"Gradual addition of land by water deposits (owner gains) / sudden loss or change (boundary does not move).","l":"L09-5","note":""},{"term":"Metes and bounds","def":"Description using a point of beginning, directions (courses) and distances, returning to the POB.","l":"L10-1","note":""},{"term":"Point of beginning (POB)","def":"Starting and ending point of a metes-and-bounds description.","l":"L10-1","note":""},{"term":"Lot and block","def":"Description by lot and block numbers on a recorded plat.","l":"L10-1","note":""},{"term":"Plat","def":"Recorded map of a subdivision.","l":"L10-1","note":""},{"term":"Government (rectangular) survey","def":"System of townships and sections measured from principal meridians and base lines.","l":"L10-1","note":""},{"term":"Township","def":"6 × 6 mile square, 36 sections.","l":"L10-2","note":""},{"term":"Section","def":"1 square mile, 640 acres.","l":"L10-2","note":""},{"term":"Front foot","def":"A foot of frontage along a street or water; the first dimension given.","l":"L14-2","note":""},{"term":"Bilateral contract","def":"Promise for a promise (e.g., sale contract).","l":"L11-1","note":""},{"term":"Unilateral contract","def":"Promise for an act (e.g., option, reward).","l":"L11-1","note":""},{"term":"Executory / executed","def":"Obligations still to perform / fully performed.","l":"L11-1","note":""},{"term":"Void / voidable / unenforceable","def":"No contract at all / one party may cancel / valid but courts won't enforce.","l":"L11-1","note":""},{"term":"Statute of frauds","def":"Law requiring certain contracts (sale of real estate, >1 year) to be written and signed.","l":"L11-1","note":""},{"term":"Consideration","def":"Something of value exchanged; mutual promises suffice.","l":"L11-1","note":""},{"term":"Counteroffer","def":"A response that changes the terms; it rejects and terminates the original offer.","l":"L11-2","note":""},{"term":"Option","def":"Contract giving the optionee the right to buy at set terms during a period; optionor is bound.","l":"L11-2","note":""},{"term":"Equitable title","def":"Buyer's interest under a signed sale contract before closing.","l":"L11-2","note":""},{"term":"Specific performance","def":"Court order to perform the contract as agreed.","l":"L11-2","note":""},{"term":"Liquidated damages","def":"Damages agreed in advance (often the deposit).","l":"L11-2","note":""},{"term":"Procuring cause","def":"The broker whose efforts started an uninterrupted chain of events leading to the sale.","l":"L11-3","note":""},{"term":"Open listing","def":"Listing given to several brokers; only the procuring broker is paid; owner may sell free.","l":"L11-3","note":""},{"term":"Exclusive agency listing","def":"One brokerage; owner keeps the right to sell without commission.","l":"L11-3","note":""},{"term":"Exclusive right of sale","def":"One brokerage earns the commission no matter who sells.","l":"L11-3","note":""},{"term":"Net listing","def":"Broker keeps any amount above the seller's net price.","l":"L11-3","note":""},{"term":"Effective date","def":"Date the last party signs or initials the final offer/counteroffer and it is communicated; contract deadlines run from it.","l":"L11-4","note":""},{"term":"Time is of the essence","def":"Clause making contract deadlines strict.","l":"L11-4","note":""},{"term":"AS IS contract","def":"Seller makes no repairs; buyer may inspect and cancel within the inspection period.","l":"L11-4","note":""},{"term":"Promissory note","def":"The borrower's written promise to repay the debt.","l":"L12-1","note":""},{"term":"Mortgage","def":"Security instrument pledging property for a debt.","l":"L12-1","note":"In US usage 'mortgage' is the document, not the loan."},{"term":"Mortgagor / mortgagee","def":"Borrower (gives the mortgage) / lender (receives it).","l":"L12-1","note":""},{"term":"Lien theory","def":"The borrower keeps title; the lender holds a lien (Florida).","l":"L12-1","note":""},{"term":"Acceleration clause","def":"Lets the lender demand the entire balance on default.","l":"L12-1","note":""},{"term":"Due-on-sale (alienation) clause","def":"Balance becomes due if the property is transferred.","l":"L12-1","note":""},{"term":"Defeasance clause","def":"The mortgage is defeated (cancelled) when the debt is paid.","l":"L12-1","note":""},{"term":"Exculpatory clause","def":"Borrower not personally liable; lender looks only to the property.","l":"L12-1","note":""},{"term":"Assumption","def":"Buyer takes over the loan and becomes personally liable.","l":"L12-2","note":""},{"term":"Novation","def":"Substitution of a new party that releases the original borrower.","l":"L12-2","note":""},{"term":"Subject to","def":"Buyer takes title and pays the loan without personal liability.","l":"L12-2","note":""},{"term":"Equity of redemption","def":"Borrower's right to pay off the debt and stop foreclosure until the sale.","l":"L12-2","note":""},{"term":"Deficiency judgment","def":"Judgment for the unpaid balance after a foreclosure sale.","l":"L12-2","note":""},{"term":"Short sale","def":"Sale where the lender accepts less than the amount owed.","l":"L12-2","note":""},{"term":"Deed in lieu of foreclosure","def":"Borrower deeds the property to the lender to avoid foreclosure; junior liens survive.","l":"L12-2","note":""},{"term":"PITI","def":"Principal, interest, taxes, insurance — the monthly housing payment.","l":"L12-3","note":""},{"term":"Usury","def":"Charging interest above the legal maximum.","l":"L12-3","note":""},{"term":"LTV","def":"Loan-to-value ratio: loan ÷ lesser of price or appraised value.","l":"L14-5","note":""},{"term":"FHA","def":"Federal Housing Administration (HUD): insures loans; borrower pays MIP.","l":"L13-1","note":""},{"term":"VA","def":"Department of Veterans Affairs: guarantees loans to eligible veterans.","l":"L13-1","note":""},{"term":"PMI","def":"Private mortgage insurance on conventional loans above 80% LTV.","l":"L13-1","note":""},{"term":"Amortized loan","def":"Level payments covering interest and principal until fully repaid.","l":"L13-2","note":""},{"term":"Balloon payment","def":"Large final payment on a partially amortized loan.","l":"L13-2","note":""},{"term":"ARM","def":"Adjustable-rate mortgage: rate = index + margin, limited by caps.","l":"L13-2","note":""},{"term":"Package mortgage","def":"Covers real and personal property.","l":"L13-2","note":""},{"term":"Blanket mortgage","def":"Covers several parcels; release clause frees parcels as paid.","l":"L13-2","note":""},{"term":"Wraparound mortgage","def":"New junior loan that includes an existing loan.","l":"L13-2","note":""},{"term":"Purchase-money mortgage","def":"Seller finances part of the price.","l":"L13-2","note":""},{"term":"Reverse mortgage","def":"Lender pays an owner aged 62+; repaid on sale, move-out or death.","l":"L13-2","note":""},{"term":"Primary market","def":"Lenders who originate loans.","l":"L13-3","note":""},{"term":"Secondary market","def":"Buyers of existing loans (Fannie Mae, Freddie Mac, Ginnie Mae guarantees).","l":"L13-3","note":""},{"term":"Disintermediation","def":"Depositors withdrawing funds for higher yields elsewhere, reducing mortgage money.","l":"L13-3","note":""},{"term":"Discount points","def":"Prepaid interest: 1 point = 1% of the loan.","l":"L13-3","note":""},{"term":"Proration","def":"Dividing an expense or income between buyer and seller as of closing.","l":"L14-7","note":""},{"term":"In arrears","def":"Paid at the end of the period (Florida property taxes, mortgage interest).","l":"L14-7","note":""},{"term":"In advance","def":"Paid at the start of the period (rent, insurance premiums).","l":"L14-7","note":""},{"term":"Debit","def":"An amount a party owes at closing.","l":"L14-8","note":""},{"term":"Credit","def":"An amount a party receives at closing.","l":"L14-8","note":""},{"term":"Documentary stamp tax","def":"Florida excise tax on deeds ($0.70/$100) and notes ($0.35/$100).","l":"L14-6","note":""},{"term":"Intangible tax","def":"Florida one-time tax of 2 mills on new mortgages.","l":"L14-6","note":""},{"term":"CMA","def":"Comparative market analysis by a licensee to suggest a price range.","l":"L15-1","note":""},{"term":"BPO","def":"Broker price opinion, often for lenders; chargeable but not an appraisal.","l":"L15-1","note":""},{"term":"Market value","def":"Most probable price in an arm's-length sale between informed parties under no unusual pressure.","l":"L16-1","note":""},{"term":"Highest and best use","def":"Legally permissible, physically possible, financially feasible, maximally productive use.","l":"L16-1","note":""},{"term":"Substitution","def":"A buyer won't pay more than the cost of an equally desirable substitute.","l":"L16-1","note":""},{"term":"Plottage / assemblage","def":"Value increase from combining parcels / the act of combining them.","l":"L16-1","note":""},{"term":"Reconciliation","def":"Weighing the approaches to reach a final value estimate (not averaging).","l":"L16-4","note":""},{"term":"Reproduction cost","def":"Cost of an exact replica.","l":"L16-3","note":""},{"term":"Replacement cost","def":"Cost of a building with equal utility using current materials.","l":"L16-3","note":""},{"term":"Functional obsolescence","def":"Loss from outdated design or features.","l":"L16-3","note":""},{"term":"External (economic) obsolescence","def":"Loss from factors outside the property; always incurable.","l":"L16-3","note":""},{"term":"NOI","def":"Net operating income: effective gross income minus operating expenses.","l":"L16-4","note":""},{"term":"Capitalization rate","def":"NOI ÷ value.","l":"L16-4","note":""},{"term":"GRM / GIM","def":"Gross rent multiplier (price ÷ monthly rent) / gross income multiplier (price ÷ annual income).","l":"L16-4","note":""},{"term":"USPAP","def":"Uniform Standards of Professional Appraisal Practice.","l":"L16-4","note":""},{"term":"Leverage","def":"Using borrowed money to increase return on equity.","l":"L17-1","note":""},{"term":"Cash flow","def":"NOI minus debt service.","l":"L17-1","note":""},{"term":"Business opportunity brokerage","def":"Selling a business (goodwill, inventory, fixtures, possibly real estate).","l":"L17-2","note":""},{"term":"Goodwill","def":"Intangible value of a business's reputation and customer base.","l":"L17-2","note":""},{"term":"Ad valorem","def":"According to value.","l":"L18-1","note":""},{"term":"Just value","def":"Florida's term for market value used by the property appraiser.","l":"L18-1","note":""},{"term":"TRIM notice","def":"Truth in Millage notice showing proposed assessments and rates (August).","l":"L18-1","note":""},{"term":"Value Adjustment Board (VAB)","def":"County board that hears property assessment appeals.","l":"L18-1","note":""},{"term":"Tax certificate","def":"Lien sold to an investor to collect delinquent property taxes.","l":"L18-1","note":""},{"term":"Special assessment","def":"Charge on properties specially benefited by a public improvement.","l":"L18-1","note":""},{"term":"Millage","def":"Tax rate in mills (1 mill = $1 per $1,000 of taxable value).","l":"L18-2","note":""},{"term":"Save Our Homes","def":"Cap on annual homestead assessment increases (3% or CPI, whichever is less).","l":"L18-2","note":""},{"term":"Basis / adjusted basis","def":"Cost of property / cost plus improvements minus depreciation.","l":"L18-3","note":""},{"term":"1031 exchange","def":"Tax-deferred exchange of like-kind investment or business real property.","l":"L18-3","note":""},{"term":"Boot","def":"Non-like-kind value received in an exchange; taxable to the extent of gain.","l":"L18-3","note":""},{"term":"Installment sale","def":"Seller receives payments over time and reports gain as received.","l":"L18-3","note":""},{"term":"Police power","def":"Government power to regulate for health, safety and welfare; no compensation owed.","l":"L19-1","note":""},{"term":"Inverse condemnation","def":"Owner's lawsuit claiming a regulation amounts to a taking.","l":"L19-1","note":""},{"term":"Comprehensive plan","def":"Local government's long-range land-use plan; zoning implements it.","l":"L19-1","note":""},{"term":"Variance","def":"Permission to deviate from a dimensional rule because of hardship unique to the parcel.","l":"L19-1","note":""},{"term":"Special exception (conditional use)","def":"Use allowed in a zone with case-by-case approval.","l":"L19-1","note":""},{"term":"Nonconforming use","def":"Lawful use that predates current zoning ('grandfathered').","l":"L19-1","note":""},{"term":"PUD","def":"Planned unit development mixing uses with clustered density and open space.","l":"L19-1","note":""},{"term":"Certificate of occupancy","def":"Document allowing a building to be occupied after final inspection.","l":"L19-1","note":""},{"term":"CERCLA (Superfund)","def":"Federal law imposing strict, joint and several liability for cleaning up contaminated sites.","l":"L19-2","note":""},{"term":"Brownfield","def":"Abandoned or underused contaminated site being redeveloped.","l":"L19-2","note":""},{"term":"Radon","def":"Naturally occurring radioactive gas; Florida requires a disclosure in sale and lease contracts.","l":"L19-2","note":""}],"verification":[{"id":"V-01","topic":"Exam format","manual":"100 questions, 3.5 hours, 75 to pass.","finding":"Candidate Information Booklet (Sales Associate, effective January 2025): 100 multiple-choice questions, 3.5 hours, 75 or higher passes, 19 content areas.","citation":"DBPR Candidate Information Booklet, Real Estate Sales Associate Examination (Jan 2025)","url":"https://www2.myfloridalicense.com/servop/testing/documents/RE_sales_cibs.pdf","method":"official-excerpt","status":"confirmed","teach":"100 questions · 3.5 hours · 75 correct to pass."},{"id":"V-02","topic":"Exam content weighting","manual":"About 45 law, 45 principles and practices, 10 math.","finding":"Candidate Information Booklet, Sales Associate (eff. January 2025), Examination Content Outline: I The Real Estate Business 1%; II License Law and Qualifications for Licensure 6%; III License Law and Commission Rules 2%; IV Authorized Relationships, Duties and Disclosure 7%; V Brokerage Activities and Procedures 12%; VI Violations of License Law, Penalties and Procedures 3%; VII Federal and State Laws 3%; VIII Property Rights 8%; IX Title, Deeds and Ownership Restrictions 7%; X Legal Descriptions 5%; XI Contracts 12%; XII Residential Mortgages 9%; XIII Types of Mortgages and Sources of Financing 4%; XIV Computations and Closing 6%; XV Markets and Analysis 1%; XVI Appraisal 8%; XVII Investments and Business Opportunity Brokerage 2%; XVIII Taxes 3%; XIX Planning and Zoning 1% (total 100%). 18 of the 19 figures appeared in official-domain excerpts of the booklet; Section I (1%) is derived from the 100% total. The Broker booklet uses different weights. A 2020 FREC rule document describes a 45/45/10 split (law / principles and practices / math).","citation":"DBPR Candidate Information Booklet, Real Estate Sales Associate Examination (eff. Jan 2025), Examination Content Outline","url":"https://www2.myfloridalicense.com/servop/testing/documents/RE_sales_cibs.pdf","method":"official-excerpt","checks":"double-checked","status":"confirmed","teach":"Weights per FREC section as listed. The biggest: Brokerage Activities 12%, Contracts 12%, Residential Mortgages 9%, Property Rights 8%, Appraisal 8%. The app's mock exam follows these weights."},{"id":"V-03","topic":"Official course outline (FREC Course I)","manual":"Manual compresses the 19 Gold Coast chapters into 12.","finding":"FREC Sales Associate Course Syllabus (FREC Course I), effective 1/1/2023, has 19 sections: 1 Course Overview: The Real Estate Business; 2 Real Estate License Law and Qualifications for Licensure; 3 Real Estate License Law and Commission Rules; 4 Authorized Relationships, Duties and Disclosure; 5 Real Estate Brokerage Activities and Procedures; 6 Violations of License Law, Penalties and Procedures; 7 Federal and State Laws Pertaining to Real Estate; 8 Property Rights: Estates, Tenancies, Condominiums, Cooperatives, HOAs and Time-Sharing; 9 Title, Deeds and Ownership Restrictions; 10 Legal Descriptions; 11 Real Estate Contracts; 12 Residential Mortgages; 13 Types of Mortgages and Sources of Financing; 14 Real Estate Related Computations and Closing of Transactions; 15 The Real Estate Markets and Analysis; 16 Real Estate Appraisal; 17 Real Estate Investments and Business Opportunity Brokerage; 18 Taxes Affecting Real Estate; 19 Planning and Zoning. Rule 61J2-3.008: 63 hours of 50 minutes each, inclusive of the course exam.","citation":"FREC Course I syllabus (eff. 1/1/2023); Rule 61J2-3.008, F.A.C.","url":"https://www2.myfloridalicense.com/re/documents/FREC1SyllabusCleanFinal01012023.pdf","method":"official-excerpt","status":"confirmed","teach":"The curriculum uses these 19 sections as its chapter structure."},{"id":"V-04","topic":"Termination notice for tenancies without a specific term (s. 83.57)","manual":"Week 7 days, month 15 days, quarter 45 days, year 60 days.","finding":"Current s. 83.57 (2025 text): year-to-year not less than 60 days; quarter-to-quarter not less than 30 days; month-to-month not less than 30 days; week-to-week not less than 7 days. The 2014 text had 15 days for month-to-month. No version found with 45 days for quarter-to-quarter.","citation":"s. 83.57, F.S. (2025)","url":"https://www.flsenate.gov/Laws/Statutes/2025/83.57","method":"official-excerpt","status":"corrected","teach":"60 / 30 / 30 / 7 days. If a practice question uses 15 days for month-to-month it reflects the pre-change law; answer with current law unless the question says otherwise, and note the edition of the question source."},{"id":"V-05","topic":"Witnesses on leases (s. 689.01)","manual":"Florida requires two witnesses for leases over one year.","finding":"Current s. 689.01 still requires two subscribing witnesses for conveyances of freehold estates and terms over one year, but now provides that no subscribing witnesses are required for a lease of real property. The proviso is in the 2024 text and absent in 2010-2019 texts. Witnesses may sign electronically through audio-video technology (s. 117.201).","citation":"s. 689.01, F.S. (2024-2026)","url":"https://www.flsenate.gov/Laws/Statutes/2026/689.01","method":"official-excerpt","status":"corrected","teach":"Deeds: two witnesses. Leases: no witnesses required (a lease over one year must still be in writing under the statute of frauds)."},{"id":"V-06","topic":"Flood disclosure in residential sales (s. 689.302)","manual":"Lists 'flood-zone awareness (via forms)'.","finding":"s. 689.302 (created by CS/CS/HB 1049, 2024) requires the seller of residential real property to give the buyer a flood disclosure, on a prescribed form, at or before the time the sales contract is executed. The form covers flood insur
